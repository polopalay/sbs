 sbs_orgy.0002.t: "Una casa vacía"
 sbs_orgy.0002.desc: "Las salas están preparadas, pero la compañía esperada no llega. Las lámparas arden para nadie."
 sbs_orgy.0002.a: "Apagad las lámparas."

 sbs_orgy.1100.t: "Un acuerdo privado"
 sbs_orgy.1100.desc: "[sbs_orgy_guest.GetFirstName] está lo bastante cerca para que el calor de su piel me alcance."
 # Female root + Male guest
 sbs_orgy.1100.fm.1.desc: "Su mano reposa en mi cintura y luego sigue la línea de la cadera. Cuando me inclino, su boca encuentra la mía. Lo siento ya duro contra la palma a través de la tela fina."
 sbs_orgy.1100.fm.2.desc: "Me acerco hasta que no queda espacio. Su aliento es cálido en la garganta. Una mano en su pecho; la otra halla su calor sin ir más lejos aún."
 sbs_orgy.1100.fm.3.desc: "Me atrae contra la pared. Su boca está caliente en el cuello, luego en los labios. La mano cubre el pecho a través de la tela y se queda, esperando."
 sbs_orgy.1100.fm.4.desc: "Guío su mano a la cadera, luego más abajo, lo justo para que sienta mi calor. Traga saliva. Ninguno ha decidido aún lo que sigue."
 sbs_orgy.1100.fm.5.desc: "Me aprieta contra la pared. Una mano cubre el pecho. La otra reposa alta en el muslo, lo bastante cerca para sentir cada leve movimiento."
 sbs_orgy.1100.fm.6.desc: "Me inclino y lo beso despacio. Al apartarme, la mano sigue en su cinturón. Sus dedos permanecen en mi cabello, sin empujar ni tirar."
 sbs_orgy.1100.fm.7.desc: "Su pulgar recorre el interior del muslo. Bajo la mano y lo cierro a través de la tela, sintiendo el pulso en la palma. Así nos quedamos un momento."
 sbs_orgy.1100.fm.8.desc: "Acabamos en el diván bajo, bocas abiertas, manos errantes. Su cuerpo está caliente contra el mío. El siguiente paso sigue siendo una elección."
 # Male root + Female guest
 sbs_orgy.1100.mf.1.desc: "Mi mano halla su cadera, luego el calor del muslo. Ya respira más deprisa. Cuando me cierra la mano a través de la tela, nadie finge que esto es solo charla."
 sbs_orgy.1100.mf.2.desc: "Bajo la cabeza a su garganta, luego a la boca. El olor de su piel es agudo y limpio. La mano permanece alta en el muslo."
 sbs_orgy.1100.mf.3.desc: "Besa pecho abajo y se detiene justo antes de ir más lejos. Una mano en el muslo; la otra sigue la línea del cinturón."
 sbs_orgy.1100.mf.4.desc: "Mis dedos reposan entre sus muslos y sienten lo lista que ya está. Su mano libre me recorre a través de la tela al mismo ritmo sin prisa."
 sbs_orgy.1100.mf.5.desc: "Me empuja al diván y se acomoda sobre el regazo. Su boca encuentra la mía. Estamos lo bastante cerca para que la siguiente elección sea obvia."
 sbs_orgy.1100.mf.6.desc: "La atraigo hasta que las caderas se encuentran. Está cálida y dispuesta. Espero el momento de decidir hasta dónde llegará esto."
 sbs_orgy.1100.mf.7.desc: "Su mano me envuelve mientras la mía permanece entre sus muslos. Así nos quedamos largo rato, aprendiendo el ritmo del otro sin ir más lejos aún."
 sbs_orgy.1100.mf.8.desc: "Se arrodilla frente a mí y alza la vista. Las manos reposan en mis muslos. La invitación es clara. La decisión sigue siendo mía."
 # Male + Male
 sbs_orgy.1100.mm.1.desc: "Su mano halla mi cadera, luego mi calor a través de la tela. Devuelvo el gesto. Las bocas se encuentran, abiertas y sin prisa."
 sbs_orgy.1100.mm.2.desc: "Avanzo hasta que los pechos se tocan. Se le corta el aliento cuando mi mano reposa sobre él. Ninguno ha ido más lejos."
 sbs_orgy.1100.mm.3.desc: "Se inclina y me besa con fuerza. La mano permanece en el cinturón. Mis dedos se quedan en su cabello, sin empujar ni tirar."
 sbs_orgy.1100.mm.4.desc: "Estamos cerca. Ambas manos trabajan a través de la tela a la vez. El estrecho espacio entre nosotros ya está demasiado caliente."
 sbs_orgy.1100.mm.5.desc: "Lo giro y me aprieto contra su espalda. Una mano lo rodea. Así nos quedamos, respirando, antes de decidir más."
 sbs_orgy.1100.mm.6.desc: "Baja la boca a la garganta, luego más abajo, y se detiene. Apoyo una mano en su nuca. El siguiente paso sigue siendo una elección."
 sbs_orgy.1100.mm.7.desc: "Las manos se mueven juntas sobre tela y piel. Se recuesta en mí. Ninguno ha terminado nada aún."
 sbs_orgy.1100.mm.8.desc: "Apoya la frente contra la mía. Las manos se quedan donde están. La noche sigue abierta."
 # Female + Female
 sbs_orgy.1100.ff.1.desc: "Mi mano reposa en su cadera, luego en la piel cálida del muslo. Ella devuelve el gesto. Así nos quedamos, aprendiendo el ritmo de la otra."
 sbs_orgy.1100.ff.2.desc: "Bajo la boca a su garganta, luego a los labios. Su mano reposa en la nuca, guiando sin forzar."
 sbs_orgy.1100.ff.3.desc: "Me empuja al diván y se acomoda sobre el regazo. Las bocas se encuentran. Sus muslos se cierran alrededor al inclinarse."
 sbs_orgy.1100.ff.4.desc: "Mis dedos reposan entre sus muslos y la hallan ya cálida. Ella hace lo mismo. La sala se llena de respiración callada."
 sbs_orgy.1100.ff.5.desc: "Acabamos de lado, apretadas, bocas en las gargantas. El ritmo es lento. Nadie se apresura."
 sbs_orgy.1100.ff.6.desc: "Tiembla cuando la beso otra vez. Un momento nos quedamos así, abiertas y a la espera, antes de elegir más."
 sbs_orgy.1100.ff.7.desc: "Su mano reposa entre mis piernas mientras la boca permanece en su garganta. Las dos ya estamos cálidas. Lo demás sigue siendo una elección."
 sbs_orgy.1100.ff.8.desc: "Nos besamos hasta temblar las dos. Las manos se quedan en caderas y muslos. Nada más se ha decidido aún."
 # Options - more detailed
 sbs_orgy.1100.a: "Nada entre nosotros."
 sbs_orgy.1100.a.tt: "Te atraigo contra mí y te tomo por completo. Piel contra piel, sin reservarme nada, hasta que ninguno pueda fingir que esto fue solo un roce."
 sbs_orgy.1100.b: "No sin cuidado."
 sbs_orgy.1100.b.tt: "Primero una precaución. Luego me tomo el tiempo con cada lugar que te hace temblar."
 sbs_orgy.1100.c: "Quédate conmigo después de esta noche."
 sbs_orgy.1100.c.tt: "Te tomo con cuidado y hablo luego de otra noche. Quiero volver a conocer tu cuerpo."
 sbs_orgy.1100.e: "¿Qué pediría el amor?"
 sbs_orgy.1100.e.tt: "Dejamos las manos quietas el tiempo suficiente para hablar de amor, aunque la respuesta sea peligrosa."

 # Dirty talk (khẩu dâm) - gender variants
 sbs_orgy.1100.d_fm: "Dime cómo."
 sbs_orgy.1100.d_fm.tt: "Dime exactamente cómo quieres usarme. Descríbelo mientras tu mano sigue entre mis piernas."
 sbs_orgy.1100.d_mf: "Dime qué quieres."
 sbs_orgy.1100.d_mf.tt: "Dime qué quieres que te haga. Quiero oír cada detalle mientras mis dedos siguen dentro de ti."
 sbs_orgy.1100.d_mm: "Dime cuán fuerte."
 sbs_orgy.1100.d_mm.tt: "Dime cuán fuerte lo quieres. Describe lo que deben hacer mi boca y mis manos mientras te acaricio."
 sbs_orgy.1100.d_ff: "Dime dónde."
 sbs_orgy.1100.d_ff.tt: "Dime exactamente dónde quieres mi boca y mis dedos. Quiero oírtelo decir mientras te toco."

 # Mutual fondling / mutual masturbation
 sbs_orgy.1100.f_fm: "Solo nuestras manos."
 sbs_orgy.1100.f_fm.tt: "Te acaricio mientras tus dedos trabajan entre mis muslos, hasta que ambos terminemos."
 sbs_orgy.1100.f_mf: "Solo nuestras manos."
 sbs_orgy.1100.f_mf.tt: "Mantengo los dedos dentro de ti mientras me acaricias, despacio, hasta que ninguno pueda contenerse."
 sbs_orgy.1100.f_mm: "Solo nuestras manos."
 sbs_orgy.1100.f_mm.tt: "Nos acariciamos al mismo ritmo, observando cada reacción, hasta que ambos nos derramemos."
 sbs_orgy.1100.f_ff: "Solo manos y bocas."
 sbs_orgy.1100.f_ff.tt: "Nos tocamos hasta estar ambas húmedas y temblando, sin ir más lejos."





 sbs_orgy.1200.t: "Un tercer lugar"
 sbs_orgy.1200.desc: "[sbs_orgy_guest_a.GetFirstName] y [sbs_orgy_guest_b.GetFirstName] se unen a mí en un rincón más quieto. El aire entre los tres ya está caliente."
 sbs_orgy.1200.male.desc: "Dos cuerpos se aprietan a ambos lados. Manos roza brazos, cintura, el borde de la ropa. Bocas hallan garganta y boca. Nos quedamos así, cálidos e inacabados, a ver a quién se elige."
 sbs_orgy.1200.female.desc: "Dos cuerpos se aprietan a ambos lados. Manos rozan brazos, cintura, el borde de la ropa. Bocas hallan garganta y boca. Nos quedamos así, cálidos e inacabados, a ver a quién se elige."
 sbs_orgy.1200.a: "Solo [sbs_orgy_guest_a.GetFirstName]."
 sbs_orgy.1200.a.tt: "Atraigo a [sbs_orgy_guest_a.GetFirstName]. Esta noche quiero un solo cuerpo contra el mío."
 sbs_orgy.1200.b: "Solo [sbs_orgy_guest_b.GetFirstName]."
 sbs_orgy.1200.b.tt: "Atraigo a [sbs_orgy_guest_b.GetFirstName]. Esta noche quiero un solo cuerpo contra el mío."
 sbs_orgy.1200.c: "Los tres."
 sbs_orgy.1200.c.tt: "Nadie queda fuera. Manos y bocas se mueven hasta que nadie sepa de quién es el placer."
 sbs_orgy.1200.d: "Hablemos del deseo."
 sbs_orgy.1200.d.tt: "Decimos con franqueza lo que cada uno quiere, mientras las manos siguen errando."
 sbs_orgy.1200.e: "Empújalos el uno hacia el otro."
 sbs_orgy.1200.e.tt: "Los dirijo el uno hacia el otro y me quedo lo bastante cerca para mirar. Sus cuerpos se encuentran; el mío no tiene que hacerlo."

 sbs_orgy.4100.t: "La corona desnuda"
 sbs_orgy.4100.desc: "[sbs_orgy_nudity_guest.GetFirstName] plantea la pregunta con cortesía cuidadosa: si un soberano se ve tan a menudo sin ropas, ¿puede el pueblo mirarlo con el mismo respeto?"
 sbs_orgy.4100.male.desc: "Estoy del todo desnudo bajo las lámparas. Hombros atrás, el miembro primero blando y luego engrosándose bajo tantos ojos. No hago ademán de cubrirme. Que miren cada línea de músculo y el peso entre las piernas."
 sbs_orgy.4100.female.desc: "Estoy del todo desnuda bajo las lámparas. Hombros atrás, pechos y el triángulo suave entre los muslos abiertos a todas las miradas. No hago ademán de cubrirme. Que miren cada curva y la humedad que ya se junta."
 sbs_orgy.4100.a: "Que miren."
 sbs_orgy.4100.a.tt: "Una forma digna no necesita cortina. Giro despacio para que se vea cada ángulo."
 sbs_orgy.4100.b: "Honrar esa inocencia."
 sbs_orgy.4100.b.tt: "Adán y Eva no conocían la vergüenza en el Edén. Honro esa inocencia con las manos abiertas y el cuerpo abierto."
 sbs_orgy.4100.c: "Que decida la luz."
 sbs_orgy.4100.c.tt: "Las ropas deben realzar la belleza, no solo ocultarla."
 sbs_orgy.4100.d: "Dejad la pregunta."
 sbs_orgy.4100.d.tt: "No respondo al enigma. Simplemente permanezco como estoy hasta que la sala se acostumbre a la vista."

 sbs_orgy.4200.t: "La forma más bella"
 sbs_orgy.4200.desc: "Un cumplido descuidado se vuelve certamen. Al menos cinco nos plantamos bajo las lámparas mientras la compañía decide qué porte merece el elogio más alto."
 sbs_orgy.4200.male.desc: "Estoy entre los demás, del todo desnudo. Los músculos juegan bajo la luz, el miembro a la vista. Cuando me toca, giro despacio y dejo que cada ojo mida las líneas del cuerpo y el peso entre las piernas."
 sbs_orgy.4200.female.desc: "Estoy entre las demás, del todo desnuda. Pechos, caderas y los pliegues suaves entre los muslos quedan abiertos al juicio. Cuando me toca, giro despacio y dejo que cada ojo mida las curvas y la humedad ya visible."
 sbs_orgy.4200.a: "Mostrar fuerza."
 sbs_orgy.4200.a.tt: "Mantengo la pose hasta que la sala se calla."
 sbs_orgy.4200.b: "Ganarlos con encanto."
 sbs_orgy.4200.b.tt: "Sonrío, giro y dejo que la sala decida que soy yo a quien conviene mirar."
 sbs_orgy.4200.c: "Una pose sagaz."
 sbs_orgy.4200.c.tt: "Me desplazo lo justo para atraer todas las miradas."
 sbs_orgy.4200.d: "Dar uso al certamen."
 sbs_orgy.4200.d.tt: "Atraigo los cuerpos más cercanos y doy al certamen un uso mejor."

 sbs_orgy.2100.t: "Un desasosiego familiar"
 sbs_orgy.2100.desc: "Pese a toda la libertad de la sala, [sbs_orgy_guest.GetFirstName] y yo vacilamos. La sangre hace algunos silencios más pesados que otros."
 sbs_orgy.2100.fm.desc: "Mi hijo adulto está ante mí, crecido y desnudo. La misma sangre que hacía esto impensable solo agudiza el calor. Su mano halla mi cadera; la mía halla la dura longitud de él."
 sbs_orgy.2100.mf.desc: "Mi hija adulta está ante mí, crecida y desnuda. La misma sangre solo agudiza el calor. Mi mano halla los pliegues suaves entre sus piernas; ya está húmeda."
 sbs_orgy.2100.mm.desc: "Mi hijo adulto está ante mí, crecido y desnudo. La misma sangre solo agudiza el calor. Las manos se cierran la una sobre la otra a la vez."
 sbs_orgy.2100.ff.desc: "Mi hija adulta está ante mí, crecida y desnuda. La misma sangre solo agudiza el calor. Las manos se deslizan entre los muslos de la otra y hallan la misma disposición húmeda."
 sbs_orgy.2100.a: "Nada entre nosotros."
 sbs_orgy.2100.a.tt: "Te tomo por completo. Piel contra piel, sangre contra sangre, hasta que ninguno pueda fingir que esto es solo cercanía."
 sbs_orgy.2100.b: "No sin cuidado."
 sbs_orgy.2100.b.tt: "Primero una precaución. La noche sigue íntima, pero no temeraria."
 sbs_orgy.2100.c: "Que dure más allá del alba."
 sbs_orgy.2100.c.tt: "Lo que nos ata es sagrado, no vergonzoso. Dejo que la noche se vuelva algo que pueda durar más allá del alba."
 sbs_orgy.2100.d: "Solo manos y bocas."
 sbs_orgy.2100.d.tt: "Nos quedamos en manos y bocas. Lo bastante cerca para saborear, no tanto como para olvidar el límite."
 sbs_orgy.2100.e: "Hasta aquí, no más."
 sbs_orgy.2100.e.tt: "Retrocedo antes de que el calor decida por nosotros. La sangre entre nosotros sigue siendo un límite esta noche."

 sbs_orgy.2200.t: "Por matrimonio"
 sbs_orgy.2200.desc: "[sbs_orgy_guest.GetFirstName] entró en mi casa por [sbs_orgy_child.GetFirstName]. Esta noche ese lazo familiar parece menos simple que a la luz del día."
 sbs_orgy.2200.fm.desc: "El cónyuge de mi hijo está cerca. El matrimonio que lo ata a mi casa se siente delgado esta noche. Su mano en la cintura; siento lo listo que ya está."
 sbs_orgy.2200.mf.desc: "El cónyuge de mi hijo está cerca. El matrimonio se siente delgado. Mis dedos hallan el calor suave entre sus piernas; no se retira."
 sbs_orgy.2200.mm.desc: "El marido de mi hijo está cerca. El matrimonio se siente delgado. Las manos se cierran la una sobre la otra sin una palabra más."
 sbs_orgy.2200.ff.desc: "La mujer de mi hijo está cerca. El matrimonio se siente delgado. Las manos se deslizan entre los muslos y hallan el mismo calor húmedo."
 sbs_orgy.2200.a: "Nada entre nosotros."
 sbs_orgy.2200.a.tt: "Tomo lo que la luz del día llamaría suyo. Nada entre nosotros salvo el calor del instante."
 sbs_orgy.2200.b: "No sin cuidado."
 sbs_orgy.2200.b.tt: "Una precaución. Esto sigue siendo una sola noche, no un lazo duradero."
 sbs_orgy.2200.c: "Quédate cerca. Nada más."
 sbs_orgy.2200.c.tt: "Nos quedamos en el calor y las manos que erran. El matrimonio no se nombra ni se traspasa."
 sbs_orgy.2200.d: "Hablemos del matrimonio."
 sbs_orgy.2200.d.tt: "Nombro el lazo en voz alta. Hablamos de [sbs_orgy_child.GetFirstName] hasta que el calor tenga otro sitio adonde ir."

 sbs_orgy.2300.t: "Prueba de amistad"
 sbs_orgy.2300.desc: "Un amigo, o el más cercano de los amigos, está cerca. La vieja confianza se sienta entre nosotros como otro cuerpo. Esta noche podría volverse otra cosa."
 sbs_orgy.2300.fm.desc: "Mi amigo está lo bastante cerca para sentir el calor de su piel. Años de confianza hacen fácil el primer gesto. Endurece contra la palma mientras lo recorro; sus dedos me hallan ya húmeda."
 sbs_orgy.2300.mf.desc: "Mi amiga está lo bastante cerca para sentir el calor de su piel. Años de confianza hacen fácil el primer gesto. Mis dedos se deslizan entre sus muslos y la hallan húmeda; ella me cierra la mano en respuesta."
 sbs_orgy.2300.mm.desc: "Mi amigo está lo bastante cerca para sentir el calor de su piel. Años de confianza hacen fácil el primer gesto. Nos recorremos al mismo ritmo lento, mirando cada reacción."
 sbs_orgy.2300.ff.desc: "Mi amiga está lo bastante cerca para sentir el calor de su piel. Años de confianza hacen fácil el primer gesto. Manos y bocas circulan entre los muslos hasta que ambas temblamos."
 sbs_orgy.2300.a: "Demuéstralo así."
 sbs_orgy.2300.a.tt: "Te tomo sin obstáculo y dejo que los años de confianza se vuelvan más ardientes."
 sbs_orgy.2300.b: "No sin cuidado."
 sbs_orgy.2300.b.tt: "Una precaución. Los años de confianza se vuelven calor, no una pretensión duradera."
 sbs_orgy.2300.c: "Más que amigos."
 sbs_orgy.2300.c.tt: "Te tomo con cuidado y dejo que la vieja confianza se vuelva un lazo de amantes."
 sbs_orgy.2300.d: "Recuerda cómo empezamos."
 sbs_orgy.2300.d.tt: "Hablamos de noches más viejas y días más sencillos. Las manos se quedan quietas. La amistad basta."

 sbs_orgy.2400.t: "Una tregua en privado"
 sbs_orgy.2400.desc: "Mi rival está al otro lado del espacio estrecho. El odio siempre fue una clase de intimidad. Esta noche el aire entre nosotros está cargado de otra cosa."
 sbs_orgy.2400.fm.desc: "Las manos de mi rival son ásperas cuando por fin me tocan. La misma ira que quiso quebrarme ahora me quiere abierta. Lo siento duro contra el muslo mientras el viejo odio se ablanda en calor."
 sbs_orgy.2400.mf.desc: "El cuerpo de mi rival está tenso cuando por fin la toco. La misma ira que quiso quebrarme se abre bajo los dedos. Está húmeda antes siquiera de besarla."
 sbs_orgy.2400.mm.desc: "El agarre de mi rival es duro cuando las manos por fin se encuentran. La misma ira se espesa contra la palma. Nos recorremos con la intensidad de la pelea vieja."
 sbs_orgy.2400.ff.desc: "El aliento de mi rival es agudo cuando las manos por fin se encuentran. La misma ira se vuelve húmeda bajo los dedos. Nos tocamos con la intensidad de la pelea vieja."
 sbs_orgy.2400.a: "Acabadlo así."
 sbs_orgy.2400.a.tt: "Tomo la rivalidad en mi cuerpo. Cuando acabe, el odio quizá no sobreviva."
 sbs_orgy.2400.b: "Ceder."
 sbs_orgy.2400.b.tt: "Cedo. Que la rendición acabe lo que la pelea nunca pudo."
 sbs_orgy.2400.c: "No contigo."
 sbs_orgy.2400.c.tt: "Dejo el viejo odio donde está. Algunas treguas no valen la piel que costarían."

 sbs_orgy.2500.t: "Sin títulos esta noche"
 sbs_orgy.2500.desc: "Hay un vasallo. El rango aún existe, pero la ropa se ha ido y la noche es larga. El poder puede dejarse o usarse de otro modo."
 sbs_orgy.2500.fm.desc: "Mi vasallo se arrodilla o se queda en pie según yo elija. La misma boca que juró lealtad se abre ahora para mí. Siento el calor de su miembro contra la palma mientras decido hasta dónde irá el servicio."
 sbs_orgy.2500.mf.desc: "Mi vasalla espera con la quietud de quien conoce su sitio. Mis dedos hallan el calor suave entre sus piernas; no aparta la vista. El rango se vuelve algo húmedo e inmediato."
 sbs_orgy.2500.mm.desc: "Mi vasallo espera con la quietud de quien conoce su sitio. Cierro la mano en torno a él y siento que la lealtad se vuelve calor. Me recorre a su vez con un gesto cuidadoso y ejercitado."
 sbs_orgy.2500.ff.desc: "Mi vasalla espera con la quietud de quien conoce su sitio. Mis dedos se deslizan entre sus muslos y la hallan lista. Devuelve el gesto; el rango se disuelve en un calor húmedo compartido."
 sbs_orgy.2500.a: "No sin cuidado."
 sbs_orgy.2500.a.tt: "El rango puede esperar. Una precaución, y tomo lo que un vasallo puede ofrecer."
 sbs_orgy.2500.b: "De rodillas."
 sbs_orgy.2500.b.tt: "Los pongo de rodillas y uso boca y manos hasta que el peso del gobierno se alivia."
 sbs_orgy.2500.c: "Nombra tu precio."
 sbs_orgy.2500.c.tt: "Ofrezco moneda por lo que el rango no debería mandar. La noche sigue en términos comprados."
 sbs_orgy.2500.d: "Hablar mientras nos tocamos."
 sbs_orgy.2500.d.tt: "Oficio y cercanía en el mismo aliento. Las manos erran. Nada más se requiere."

 sbs_orgy.2600.t: "Una promesa familiar"
 sbs_orgy.2600.desc: "Mi cónyuge está aquí. El cuerpo familiar, el toque conocido. Consuelo y deseo a partes iguales."
 sbs_orgy.2600.fm.desc: "El cuerpo de mi marido me es tan conocido como el mío. Encaja en la mano como siempre. Esta noche la familiaridad solo ahonda el calor."
 sbs_orgy.2600.mf.desc: "El cuerpo de mi mujer me es tan conocido como el mío. Los pliegues suaves entre sus piernas se abren a los dedos como siempre. Esta noche la familiaridad solo ahonda el calor."
 sbs_orgy.2600.mm.desc: "El cuerpo de mi marido me es tan conocido como el mío. Nos recorremos con la facilidad de una larga práctica, el calor aún agudo tras tantos años."
 sbs_orgy.2600.ff.desc: "El cuerpo de mi mujer me es tan conocido como el mío. Manos y bocas circulan entre los muslos con la facilidad de una larga práctica, el calor aún agudo tras tantos años."
 sbs_orgy.2600.a: "Como siempre."
 sbs_orgy.2600.a.tt: "Tomo a mi cónyuge por completo y dejo que el placer familiar siga su curso."
 sbs_orgy.2600.b: "Busca a otro."
 sbs_orgy.2600.b.tt: "Me aparto del cuerpo conocido y busco el calor de un extraño."

 sbs_orgy.2700.t: "Los asuntos antes del placer"
 sbs_orgy.2700.desc: "[sbs_orgy_guest.GetFirstName] me encuentra mientras el festín sigue a nuestro alrededor. De algún modo empieza un consejo sin que ninguno lo haya convocado."
 sbs_orgy.2700.a: "El reino primero."
 sbs_orgy.2700.a.tt: "Hablamos de oficios y de trabajo inacabado mientras el jolgorio sigue a nuestro alrededor."
 sbs_orgy.2700.b: "¿Qué pediría el amor?"
 sbs_orgy.2700.b.tt: "El consejo puede esperar. Pregunto qué haría el amor de dos que suelen hablar del reino."
 sbs_orgy.2700.c: "Hablemos del deseo."
 sbs_orgy.2700.c.tt: "Nombramos lo que queremos con palabras llanas. Las manos se quedan quietas. El habla basta para aliviar la noche."

 sbs_orgy.2800.t: "La casa de un vasallo"
 sbs_orgy.2800.desc: "[sbs_orgy_guest.GetFirstName] pertenece a la casa de [sbs_orgy_vassal_spouse_owner.GetFirstName], uno de mis propios vasallos. El hecho es difícil de olvidar, aunque nadie se va."
 sbs_orgy.2800.fm.desc: "El cónyuge de mi vasallo está cerca. El lazo del hogar que debería protegerlo se siente delgado. Endurece en mi mano mientras el nombre de su esposo queda sin decir entre nosotros."
 sbs_orgy.2800.mf.desc: "El cónyuge de mi vasallo está cerca. El lazo del hogar se siente delgado. Mis dedos la hallan ya húmeda mientras el nombre de su esposo queda sin decir."
 sbs_orgy.2800.mm.desc: "El marido de mi vasallo está cerca. El lazo del hogar se siente delgado. Nos recorremos mientras el nombre de su esposa queda sin decir."
 sbs_orgy.2800.ff.desc: "La mujer de mi vasallo está cerca. El lazo del hogar se siente delgado. Las manos circulan entre los muslos mientras el nombre de su esposo queda sin decir."
 sbs_orgy.2800.a: "Un secreto cuidadoso."
 sbs_orgy.2800.a.tt: "Una precaución, luego tomo al cónyuge de mi vasallo y guardo la noche en secreto."
 sbs_orgy.2800.b: "Nada entre nosotros."
 sbs_orgy.2800.b.tt: "Los tomo por completo. El lazo del hogar se queda fuera de la puerta."
 sbs_orgy.2800.c: "Dejad la puerta abierta."
 sbs_orgy.2800.c.tt: "Los tomo con cuidado y dejo la puerta abierta. Esto no tiene que acabar cuando se apaguen las lámparas."
 sbs_orgy.2800.d: "Llamad a [sbs_orgy_vassal_spouse_owner.GetFirstName]."
 sbs_orgy.2800.d.tt: "Hago venir a [sbs_orgy_vassal_spouse_owner.GetFirstName] y los junto. Actúan para mí. Ambos se van complacidos con cómo lo dispuse. Mirar y disponer me cuesta más que a ellos."
 sbs_orgy.2800.e: "Bastará con hablar."
 sbs_orgy.2800.e.tt: "Por ahora, hablar ya es escándalo bastante. Las manos se quedan quietas."

 sbs_orgy.2900.t: "Por encima del rango"
 sbs_orgy.2900.desc: "Lejos de la sala formal, [sbs_orgy_guest.GetFirstName] sigue siendo mi señor, aunque el rango se siente menos cierto en un cuarto como este."
 sbs_orgy.2900.fm.desc: "Mi señor está lo bastante cerca para que el rango aún debiera importar. Ya no. Su mano halla el calor suave entre mis piernas; cierro los dedos en torno a la dura longitud de él."
 sbs_orgy.2900.mf.desc: "Mi señora está lo bastante cerca para que el rango aún debiera importar. Ya no. Mis dedos hallan el calor suave entre sus piernas; ella me cierra la mano en respuesta."
 sbs_orgy.2900.mm.desc: "Mi señor está lo bastante cerca para que el rango aún debiera importar. Ya no. Cerramos las manos el uno sobre el otro a la vez; la jerarquía se disuelve en calor simple."
 sbs_orgy.2900.ff.desc: "Mi señora está lo bastante cerca para que el rango aún debiera importar. Ya no. Las manos se deslizan entre los muslos y hallan la misma disposición húmeda."
 sbs_orgy.2900.a: "Dejad el rango a un lado."
 sbs_orgy.2900.a.tt: "Tomo a mi señor con una precaución y dejo que la noche sea solo cuerpos."
 sbs_orgy.2900.b: "Mi compañía tiene un precio."
 sbs_orgy.2900.b.tt: "Me ofrezco con palabras y arte, y pido un precio por el privilegio."
 sbs_orgy.2900.b.success: "Mis términos son aceptados. La noche sigue en mis condiciones."
 sbs_orgy.2900.b.failure: "Mi señor no se deja persuadir. El rango se reafirma."
 sbs_orgy.2900.c: "Solo palabras, mi señor."
 sbs_orgy.2900.c.tt: "Por una vez simplemente hablamos. Las manos se quedan quietas. La jerarquía permanece intacta."

 sbs_orgy.2920.t: "Un invitado atado"
 sbs_orgy.2920.desc: "[sbs_orgy_guest.GetFirstName] espera con la quietud ejercitada de quien está acostumbrado a que le manden. Esta noche ofrece varias maneras de responder a esa obediencia."
 sbs_orgy.2920.fm.desc: "El esclavo espera. A la palabra, se arrodilla. Su boca se abre para mí; mi mano se cierra en torno a la dura longitud de él. El collar, o la marca, o el simple hecho de la posesión hace más pesado cada gesto."
 sbs_orgy.2920.mf.desc: "La esclava espera. A la palabra, se arrodilla o se abre. Mis dedos hallan el calor suave entre sus piernas; no aparta la vista. El collar, o la marca, o el simple hecho de la posesión hace más pesado cada gesto."
 sbs_orgy.2920.mm.desc: "El esclavo espera. A la palabra, se arrodilla. Nos recorremos con la claridad de la orden y la obediencia. El collar, o la marca, o el simple hecho de la posesión hace más pesado cada gesto."
 sbs_orgy.2920.ff.desc: "La esclava espera. A la palabra, se arrodilla o se abre. Las manos circulan entre los muslos con la claridad de la orden y la obediencia. El collar, o la marca, o el simple hecho de la posesión hace más pesado cada gesto."
 sbs_orgy.2920.a: "Sirve con la boca."
 sbs_orgy.2920.a.tt: "Los pongo de rodillas. Boca y manos trabajan hasta que el peso del mando se alivia."
 sbs_orgy.2920.b: "Una orden extraña."
 sbs_orgy.2920.b.tt: "Doy una orden que no tiene que ver con el servicio ordinario y los miro obedecer."
 sbs_orgy.2920.c: "Ven aquí."
 sbs_orgy.2920.c.tt: "Sin más ceremonia. Una precaución, y los tomo como a cualquiera esta noche."
 sbs_orgy.2920.d: "No esta noche."
 sbs_orgy.2920.d.tt: "Les digo que se sienten y respiren. Compasión en vez de mando. El collar puede esperar."


# Contest localization

# 3100 - Contest of Mouths
 sbs_orgy.3100.t: "Un certamen de bocas"
 sbs_orgy.3100.desc: "Alguien pide un certamen de habilidad. Uno a uno los dispuestos se adelantan a tomar un miembro en la boca. Quien lo tome más hondo y lo sostenga más tiempo sin apartarse se llevará la bolsa."
 sbs_orgy.3100.male.desc: "Cuando me toca, me arrodillo y tomo el miembro ofrecido. Primero despacio, luego más hondo, hasta que la sala ve desaparecer cada pulgada, la garganta llena y los ojos húmedos."
 sbs_orgy.3100.female.desc: "Cuando me toca, me arrodillo y tomo el miembro ofrecido. Primero despacio, luego más hondo, con lengua y garganta, hasta que la sala vea hasta dónde quiero llegar."
 sbs_orgy.3100.a: "Aceptar el desafío."
 sbs_orgy.3100.a.tt: "Les mostraré lo que puede hacer mi boca."
 sbs_orgy.3100.a.success: "Lo tomo más hondo y aguanto más que nadie. La bolsa se pone en mis manos entre un aplauso callado."
 sbs_orgy.3100.a.failure: "Otro demuestra más maña. Retrocedo con menos dignidad de la que esperaba."
 sbs_orgy.3100.b: "Solo mirar."
 sbs_orgy.3100.b.tt: "Me quedo entre los que miran y dejo que otra boca reclame la bolsa."

# 3200 - Who Lasts the Longest
 sbs_orgy.3200.t: "Quién dura más"
 sbs_orgy.3200.desc: "Se llama un nuevo certamen. Se forman parejas y el reto es simple: seguir lo más posible sin terminar. La sala mira y cuenta los minutos."
 sbs_orgy.3200.male.desc: "Tomo a una pareja dispuesta debajo de mí. La regla es clara: guardar el ritmo, seguir empujando y no gastarme hasta que todas las demás parejas hayan quebrado. La sala cuenta cada minuto en voz alta."
 sbs_orgy.3200.female.desc: "Tomo a una pareja dispuesta dentro de mí. La regla es clara: seguir moviendo, guardar el ritmo y no terminar hasta que todas las demás parejas hayan quebrado. La sala cuenta cada minuto en voz alta."
 sbs_orgy.3200.a: "Aceptar el desafío."
 sbs_orgy.3200.a.tt: "Tomo a mi compañero. Que la sala vea cuánto puedo durar."
 sbs_orgy.3200.a.success: "Duro más que cualquier otra pareja. La bolsa y la envidia callada de la sala son mías."
 sbs_orgy.3200.a.failure: "Cedo antes que los otros. La sala lo nota al instante."
 sbs_orgy.3200.b: "Solo mirar."
 sbs_orgy.3200.b.tt: "Me quedo entre los que miran y dejo que otras parejas compitan con los minutos."

# 3300 - The Most Rounds
 sbs_orgy.3300.t: "El mayor número de tandas"
 sbs_orgy.3300.desc: "Alguien sube la apuesta. El reto es ahora la resistencia: quién puede tomar más parejas antes de tener que parar. Se cuenta en voz alta para que nadie haga trampa."
 sbs_orgy.3300.male.desc: "Paso de una pareja dispuesta a la siguiente. Cada vez que termino, me recupero solo lo bastante para empezar otra vez. La sala grita el número después de cada tanda."
 sbs_orgy.3300.female.desc: "Tomo una pareja dispuesta tras otra. Cada vez que uno termina dentro de mí o sobre mí, el siguiente ya espera. La sala grita el número después de cada tanda."
 sbs_orgy.3300.a: "Aceptar el desafío."
 sbs_orgy.3300.a.tt: "Que cuenten cuántos puedo tomar."
 sbs_orgy.3300.a.success: "Tomo más compañeros que nadie antes de parar. La bolsa es mía."
 sbs_orgy.3300.a.failure: "Otro se muestra más implacable. No soy yo quien tiene la cuenta más alta."
 sbs_orgy.3300.b: "Solo mirar."
 sbs_orgy.3300.b.tt: "Cuento con la sala y dejo las rondas a alguien más hambriento."

# 3400 - Who Breaks First
 sbs_orgy.3400.t: "Quién quiebra primero"
 sbs_orgy.3400.desc: "Se sugiere un certamen más callado. Los dispuestos se recuestan mientras manos y bocas diestras trabajan en ellos. La regla es simple: no terminar. El primero que quiebre pierde."
 sbs_orgy.3400.male.desc: "Me recuesto y dejo que manos y bocas diestras trabajen en mí. Cada aliento y sacudida se vigila. El primero que se gaste pierde la bolsa."
 sbs_orgy.3400.female.desc: "Me recuesto y dejo que manos y bocas diestras trabajen entre mis piernas. Cada aliento y temblor se vigila. La primera que termine pierde la bolsa."
 sbs_orgy.3400.a: "Aceptar el desafío."
 sbs_orgy.3400.a.tt: "Que intenten quebrarme."
 sbs_orgy.3400.a.success: "Aguanto más que nadie. La bolsa y el respeto callado de la sala son míos."
 sbs_orgy.3400.a.failure: "Cedo el primero. La sala lo ve con claridad."
 sbs_orgy.3400.b: "Tocaré yo en su lugar."
 sbs_orgy.3400.b.tt: "Trabajo con manos y boca en otro y les dejo el certamen de aguante."

# 3500 - Contest of Tongues
 sbs_orgy.3500.t: "Un certamen de lenguas"
 sbs_orgy.3500.desc: "Alguien pide otro reto. Uno a uno los dispuestos bajan la boca entre muslos ofrecidos. Quien se quede más y saque más de su pareja se llevará la bolsa."
 sbs_orgy.3500.male.desc: "Cuando me toca, bajo la boca entre los muslos ofrecidos y trabajo con atención constante. Lengua y labios se mueven hasta que la sala oye lo bien que lo hago y cuánto quiero quedarme."
 sbs_orgy.3500.female.desc: "Cuando me toca, bajo la boca entre los muslos ofrecidos y trabajo con atención constante. Lengua y labios se mueven hasta que la sala oye lo bien que lo hago y cuánto quiero quedarme."
 sbs_orgy.3500.a: "Aceptar el desafío."
 sbs_orgy.3500.a.tt: "Les mostraré lo que puede hacer mi boca."
 sbs_orgy.3500.a.success: "Duro más y saco más sonidos de mi compañero que nadie. La bolsa se pone en mis manos."
 sbs_orgy.3500.a.failure: "Otro demuestra más maña. Retrocedo con menos dignidad de la que esperaba."
 sbs_orgy.3500.b: "Solo mirar."
 sbs_orgy.3500.b.tt: "Me quedo entre los que miran y dejo que otra lengua reclame la bolsa."

# Heavy / extreme localization

# 6100 - Female alone with animal
 sbs_orgy.6100.t: "Un invitado distinto"
 sbs_orgy.6100.desc: "Las puertas se abren más de lo usual. Algo grande y caliente es llevado a la sala con una soga gruesa. Los demás invitados callan y retroceden."
 sbs_orgy.6100.horse.desc: "Se adelanta un caballo fuerte, ya duro y pesado entre las patas. Me guían a cuatro patas debajo. Cuando el animal monta, el solo tamaño arranca un gemido largo y quebrado. Cada embestida honda me abre hasta que solo puedo aferrarme al suelo y gritar."
 sbs_orgy.6100.dog.desc: "Se adelanta un sabueso grande, jadeante y ya goteando. Me monta por detrás sin dudar, caderas en embestidas rápidas y agudas. El sonido húmedo y los gruñidos llenan la sala mientras gimo bajo el peso."
 sbs_orgy.6100.pig.desc: "Se introduce un jabalí pesado, gruñendo y ya resbaladizo. Cuando monta, la forma gruesa y roma se abre paso con presión constante. Cada embestida honda arranca de la garganta un sonido crudo y animal que se mezcla con sus gruñidos hasta que la sala resuena con ambos."
 sbs_orgy.6100.a: "Tomarlo por completo."
 sbs_orgy.6100.a.tt: "No puedo contener los sonidos. El estirón y el calor son demasiado: gimo y me empujo contra ello hasta que el animal termina hondo en mí."
 sbs_orgy.6100.b: "Empújalo lejos."
 sbs_orgy.6100.b.tt: "Es simplemente demasiado grande. Empujo al animal antes de que vaya más hondo, jadeando y temblando en el suelo."

# 6200 - Guest leads female root like an animal
 sbs_orgy.6200.t: "Llevado como una bestia"
 sbs_orgy.6200.desc: "[sbs_orgy_guest.GetFirstName] toma una correa de cuero de la mesa y la engrapa al collar traído. La sala mira en silencio cómo me ordenan a cuatro patas y a gatear."
 sbs_orgy.6200.horse.desc: "Tras forzarme a ladrar a la orden y mojar el suelo como un perro, [sbs_orgy_guest.GetFirstName] adelanta el caballo. Me colocan debajo. El peso enorme se asienta en la espalda y la longitud gruesa entra, la correa corta."
 sbs_orgy.6200.dog.desc: "Tras forzarme a ladrar y mojar el suelo, [sbs_orgy_guest.GetFirstName] trae un sabueso grande. La bestia me monta al instante, empujando duro y rápido. El invitado mantiene la correa tensa mientras los sonidos húmedos y los gruñidos llenan el aire."
 sbs_orgy.6200.pig.desc: "Tras forzarme a ladrar y mojar el suelo, [sbs_orgy_guest.GetFirstName] trae un jabalí pesado. La forma roma y gruesa se abre paso con presión constante mientras el invitado sostiene la correa corta y mira desaparecer cada pulgada."
 sbs_orgy.6200.a: "Obedece y tómalo."
 sbs_orgy.6200.a.tt: "Me quedo a cuatro patas y tomo al animal exactamente como se ordena, gimiendo con el estirón hasta que termina dentro de mí."
 sbs_orgy.6200.b: "Suplicar al invitado en su lugar."
 sbs_orgy.6200.b.tt: "Me vuelvo y me arrodillo ante [sbs_orgy_guest.GetFirstName], rogando servirles a ellos y no a la bestia."
 sbs_orgy.6200.c: "Rehusar."
 sbs_orgy.6200.c.tt: "Arranco la correa y me pongo en pie. Esto ha ido mucho más allá de cualquier juego que esté dispuesto a jugar."

# 6300 - Female root leads a female guest like an animal
 sbs_orgy.6300.t: "Mi propia mascota"
 sbs_orgy.6300.desc: "Tomo la correa de cuero y la engrapo a [sbs_orgy_guest.GetFirstName]. La sala mira cómo la hago gatear, ladrar a la orden y mojar el suelo como un animal amaestrado."
 sbs_orgy.6300.horse.desc: "Cuando ha cumplido bastante, adelanto el caballo y la pongo debajo. El animal pesado la monta mientras sostengo la correa corta y miro cómo cada embestida honda arranca de su garganta un sonido quebrado."
 sbs_orgy.6300.dog.desc: "Cuando ha cumplido bastante, traigo un sabueso grande. La monta con ansia, caderas en embestidas rápidas, mientras sostengo la correa corta y la obligo a quedarse quieta para él."
 sbs_orgy.6300.pig.desc: "Cuando ha cumplido bastante, traigo un jabalí pesado. La forma gruesa y roma se abre paso en ella mientras sostengo la correa y oigo los sonidos crudos que no puede contener."
 sbs_orgy.6300.a: "Oblígala a tomarlo."
 sbs_orgy.6300.a.tt: "La mantengo en su sitio hasta que el animal termina hondo en ella, y luego le hago darme las gracias por el privilegio."
 sbs_orgy.6300.b: "Recompensar con mis manos."
 sbs_orgy.6300.b.tt: "Detengo al animal y uso mis propias manos y boca para premiar la obediencia."

# 3600 - Vaginal beer contest
 sbs_orgy.3600.t: "Otro tipo de brindis"
 sbs_orgy.3600.desc: "Se llama adelante a las mujeres presentes. Copas de cerveza fuerte se ponen en el suelo. El reto se dice con claridad: sostener la copa sin usar manos ni boca. Quien dure más gana la bolsa. El resto de la sala espera a ver quién quiebra primero."
 sbs_orgy.3600.a: "Aceptar el desafío."
 sbs_orgy.3600.a.tt: "Me acomodo sobre la copa, resuelta a durar más que cualquier otra mujer."
 sbs_orgy.3600.a.success: "Aguanto más que nadie. La bolsa se pone en mis manos mientras la sala aplaude la victoria."
 sbs_orgy.3600.a.failure: "No puedo aguantar. La cerveza se derrama y la sala decide la pena sin merced: cada hombre presente se turna con nosotras dos antes de que se permita acabar la noche."
 sbs_orgy.3600.b: "Rehusar."
 sbs_orgy.3600.b.tt: "Algunos juegos no valen el precio de perder."

# 1300-1400 indoor / 5100-5400 outdoor
 sbs_orgy.1300.t: "El alto asiento"
 sbs_orgy.1300.desc: "El trono del anfitrión ya no está vacío. Dos cuerpos lo han tomado, y la sala ve exactamente para qué sirve el asiento."
 sbs_orgy.1300.fm.desc: "Me siento a horcajadas sobre él en el asiento tallado, los brazos del trono duros contra mis muslos. Cada vez que me hundo, cruje la madera. Sus manos sujetan mis caderas; la sala de abajo se ha quedado muy callada."
 sbs_orgy.1300.mf.desc: "La tengo en el regazo en el alto asiento, una mano bajo su muslo, la otra en el brazo tallado. Se mueve contra mí a la vista de toda la sala. El trono no se hizo para esto, y ese es el punto."
 sbs_orgy.1300.mm.desc: "Está en mi regazo en el trono del anfitrión, la espalda contra mi pecho, la madera tallada mordiéndonos a ambos. No ocultamos el movimiento. Quien posea este asiento lo olerá después."
 sbs_orgy.1300.ff.desc: "La tengo conmigo en el trono, un muslo sobre el brazo, mi boca en su garganta mientras la mano trabaja entre sus piernas. El asiento era para juzgar. Esta noche sostiene algo más húmedo."
 sbs_orgy.1300.a: "Tomar el asiento con cuidado."
 sbs_orgy.1300.a.tt: "Guardo una precaución y termino en el trono. La sala recordará la cortesía tanto como el calor."
 sbs_orgy.1300.b: "Buscad otro sitio."
 sbs_orgy.1300.b.tt: "El alto asiento no es una cama. Los bajo del trono a buscar un rincón más callado."
 sbs_orgy.1400.t: "Una estancia más blanda"
 sbs_orgy.1400.desc: "El asunto ya ha empezado. [sbs_orgy_guest.GetFirstName] sigue contra mí cuando llega la sugerencia: dejar las salas públicas y terminar esto en una cama de verdad."
 sbs_orgy.1400.fm.desc: "Sigue en el ritmo lento que empezamos en el pasillo. Su boca está en mi oído. La cámara, dice, sería más amable con mi espalda que la piedra. No deja de moverse mientras pregunta."
 sbs_orgy.1400.mf.desc: "Tiene una rodilla en el banco y el aliento contra mi garganta. La cama está solo una puerta más allá. Quiere las sábanas, el cerrojo, el tiempo. Su mano no me deja mientras espera la respuesta."
 sbs_orgy.1400.mm.desc: "Ya estamos a medio acabar contra el muro. Señala la cámara y no quita la mano. Una cama nos dejaría durar. La sala no tendría que oírlo."
 sbs_orgy.1400.ff.desc: "Su muslo sigue enganchado al mío. Quiere la cama: la puerta cerrada, las almohadas, un sitio hasta el alba. Sus dedos se quedan donde están hasta que yo elija."
 sbs_orgy.1400.a: "Tomad la cama."
 sbs_orgy.1400.a.tt: "Dejo que me lleven y terminamos sin prisa. La puerta cerrada gana más calor del que la sala daría jamás."
 sbs_orgy.1400.b: "¿Por qué no el trono?"
 sbs_orgy.1400.b.tt: "Los llevo hacia el alto asiento. La sala puede mirar. El descaro me alivia; están lo bastante divertidos para perdonar el rodeo."
 sbs_orgy.1400.c: "Quedémonos como estamos."
 sbs_orgy.1400.c.tt: "Ninguna otra estancia. Mantengo el ritmo que ya tenemos y termino aquí."
 sbs_orgy.5100.t: "Una procesión de aldea"
 sbs_orgy.5100.desc: "La orgía no se queda en el campo. A media mañana se ha derramado en una aldea pobre, una columna de piel desnuda entre las casas, el sol aún alto.\n\nUn hombre orina contra un quicio sin romper el paso. Otro se agacha en la cuneta y no alza la vista. Alguien tiene a la mujer del panadero contra el pozo, las faldas ya idas, la protesta ya más flaca que el calor. Meten a los niños. Los perros ladran. El cura, si lo hay, ha hallado una contraventana que cerrar.\n\nNadie guía. La columna toma la calle, riendo, manchada, parándose donde un muro o un carro sostenga un cuerpo. El mando de este lugar se adelgaza con cada puerta que permanece cerrada."
 sbs_orgy.5100.a: "Que siga la columna."
 sbs_orgy.5100.a.tt: "La procesión guarda la calle hasta que la aldea haya visto bastante. La autoridad que quede aquí tardará más en responder."
 sbs_orgy.5200.t: "Entre las losas"
 sbs_orgy.5200.desc: "[sbs_orgy_guest_a.GetFirstName] y [sbs_orgy_guest_b.GetFirstName] ya han elegido una losa. Los nombres grabados son más viejos que nosotros. La hierba entre las tumbas está aplastada donde otras parejas han pasado."
 sbs_orgy.5200.female.desc: "Estoy de espaldas sobre una inscripción gastada, uno entre mis rodillas, el otro de hinojos donde puedo tomarlo en la boca. La piedra está fría bajo los hombros. Cada embestida suelta polvo de las letras. Si vuelvo la cabeza, leo una fecha. No se detienen por ello."
 sbs_orgy.5200.male.desc: "Tengo a uno doblado sobre una losa torcida, al otro sentado en la tumba a mi cadera para alcanzar a ambos. Las marcas del cincel enganchan la piel. Una corona de un funeral más viejo queda aplastada bajo una rodilla. El sitio huele a tierra y a sexo en el mismo aliento."
 sbs_orgy.5200.a: "Esto es una profanación."
 sbs_orgy.5200.a.tt: "Nos aparto de la losa antes de que vaya más lejos. A los muertos se les debe eso, aunque la noche no."
 sbs_orgy.5200.b: "A los muertos no les importará."
 sbs_orgy.5200.b.tt: "Los mantengo a ambos en la tumba y termino allí. Lo indebido es el calor."
 sbs_orgy.5300.t: "Tras el largo día"
 sbs_orgy.5300.desc: "El campamento no ha sido más que un solo abrazo largo desde el alba. Nadie ha vuelto a vestirse. Los fuegos están bajos. Lo que queda de comida está un poco aparte, más allá de los lechos aún húmedos de la última pareja."
 sbs_orgy.5300.body.desc: "Intento alzarme para ir y mis muslos no quieren cerrarse. Los músculos han estado abiertos demasiado; hasta el intento tira un dolor crudo por la ingle. Lo vertido sigue saliendo de mí despacio —del fondo, de entre las piernas— y se enfría en el muslo antes de llegar a la rodilla.\n\n[sbs_orgy_guest.GetFirstName] mira el paso que no puedo dar. La oferta es simple. Él traerá la comida. Yo iré a cuatro patas, y ladraré cuando lo diga."
 sbs_orgy.5300.a: "Comer lo que ya tengo."
 sbs_orgy.5300.a.tt: "Recojo en dos dedos lo que aún sale de mí y me lo llevo a la boca. Es sal y calor. No es una comida. Basta para no tener que arrastrarme."
 sbs_orgy.5300.b: "Arrodíllate y ladra."
 sbs_orgy.5300.b.tt: "Me bajo donde estoy y le doy el sonido que pidió. La comida llega. La dignidad no."
 sbs_orgy.5300.c: "Arrástrate hasta la comida."
 sbs_orgy.5300.c.tt: "Salgo a cuatro patas hacia el puchero, los muslos aún abiertos, la marca detrás de mí hasta la comida."
 sbs_orgy.5400.t: "El siguiente fuego"
 sbs_orgy.5400.desc: "La luz del día no ha vaciado el campamento. Los lechos siguen donde los empujaron. Las mujeres van de fuego en fuego sin volver a vestirse; la labor de la mañana se les lee aún —un brillo en el muslo, una marca en la garganta, un andar que aún no recuerda cómo ser ordinario."
 sbs_orgy.5400.body.desc: "[sbs_orgy_guest.GetFirstName] no se ha alzado. Yace sobre un manto tendido, las rodillas caídas a ambos lados, demasiado gastada para juntarlas; lo último vertido sigue hallando el paño bajo ella. Cuando me acerco, no se cubre. Solo pregunta si traeré lo que queda en el puchero."
 sbs_orgy.5400.a: "Trae el puchero."
 sbs_orgy.5400.a.tt: "Voy a por lo que queda y lo dejo donde pueda alcanzarlo. Recuerda la cortesía."
 sbs_orgy.5400.b: "No hasta tenerte otra vez."
 sbs_orgy.5400.b.tt: "El puchero puede esperar. La tomo donde yace. Me deja. No me da las gracias."
 sbs_orgy.5400.c: "Aliméntala con lo que ya guarda."
 sbs_orgy.5400.c.tt: "Meto dos dedos en ella, recojo lo que otros hombres dejaron y se lo pongo en la lengua. Traga porque poco más puede hacer. No olvidará quién la obligó."

# 6400 extreme paddock
 sbs_orgy.6400.t: "El cercado"
 sbs_orgy.6400.desc: "El cercado está a pleno sol. Ni tienda ni noche. Han traído los caballos al mismo suelo pisoteado que el campamento, y han puesto a las mujeres con ellos."
 sbs_orgy.6400.body.desc: "[sbs_orgy_horse_girl.GetFirstName] no esperó a que se lo dijeran dos veces. Está de rodillas en el polvo, con un semental ya hondo hasta la raíz. El fuste es lo bastante grueso para que el vientre se le alce y baje con él: una cresta dura viaja bajo la piel cada vez que el animal da una zancada dentro.\n\nA las demás las empujan por el mismo camino. Los hombres se quedan en la valla y miran. Alguien ríe. El caballo no."
 sbs_orgy.6400.a: "Tomar uno."
 sbs_orgy.6400.a.tt: "Me arrodillo al sol a su lado y dejo que el siguiente semental me tome. El tamaño permanece en el cuerpo mucho después de que el cercado calle."
 sbs_orgy.6400.b: "Servir a los hombres en su lugar."
 sbs_orgy.6400.b.tt: "Dejo los caballos a quien los quiera y tomo a cada hombre de la valla, uno tras otro, con cuidado. [sbs_orgy_horse_girl.GetFirstName] sigue bajo el semental cuando termino."

