l_japanese:
trait_sbs_demon: "悪魔"
sbs_demon_desc: "天に呪われ、地獄に祝福された者たち。その奥底には死と破滅が宿っている。"
sbs_demon_character_desc: "悪魔の子として、地獄の王子たちに祝福された[ROOT.GetCharacter.GetNamePossessive]の使命は、世界中に混沌と破滅をもたらすことだ。"

trait_sbs_succubus_neutral: "サキュバス"
trait_sbs_succubus_female: "サキュバス"
trait_sbs_succubus_male: "インキュバス"
sbs_succubus_desc: "見た者もいれば、聞いた者もいる。誰もが[ROOT.GetCharacter.GetNamePossessive]の奇妙な行動について噂している。"
sbs_succubus_character_desc: "中身がどうであろうと、[ROOT.GetCharacter.GetName]に何か奇妙な点があるとは誰も思わない。"
trait_track_corruption: "逸脱者"
trait_track_corruption_desc: "彼女は集めた魂から、怪物を召喚する力を得る"
trait_track_power: "力"
trait_track_power_desc: "彼女は安っぽい娼婦として、男たちの精液を得るために仕えている"
trait_track_loyalty: "兵士たちの忠誠心"
trait_track_loyalty_desc: "男の忠誠心を確実にする方法は一つではない"
trait_track_daring: "大胆な"
trait_track_daring_desc: "人生には多くのことに勇気が必要だ"

trait_lesser_succubus_neutral: "下級サキュバス"
trait_lesser_succubus_female: "下級サキュバス"
trait_lesser_succubus_male: "下級インキュバス"
lesser_sbs_succubus_desc: "内面がどうであろうと、誰も[ROOT.GetCharacter.GetName]に何か奇妙な点があるとは思わない。"
lesser_sbs_succubus_character_desc: "ほとんどの人がそれを見、誰もがそれを聞いたことがある。[ROOT.GetCharacter.GetName所有格]の行動は道徳的に堕落している。彼女は、ありふれた街娼婦について語るのと同じような軽蔑の眼差しで語られる。"
trait_track_sbs_lesser_succubus: "力"
trait_track_sbs_lesser_succubus_desc: "彼女は安っぽい娼婦として、男たちの精液を得るために仕えている。"

trait_sbs_lesser_demon: "下級悪魔"
sbs_lesser_demon_desc: "[ROOT.GetCharacter.GetName]は悪魔から力を与えられ、破壊と混沌の象徴である。"
sbs_lesser_demon_character_desc: "世界に破壊と混沌をもたらす、暴力のしもべたち。"
trait_track_sbs_lesser_demon: "腐敗"
trait_track_sbs_lesser_demon_desc: "破壊の種が発芽するには時間が必要だ。"
