 sbs_orgy.0002.t: "Пустой дом"
 sbs_orgy.0002.desc: "Покои готовы, но ожидаемая компания не приходит. Лампы горят ни для кого."
 sbs_orgy.0002.a: "Погасите светильники."

 sbs_orgy.1100.t: "Частное согласие"
 sbs_orgy.1100.desc: "[sbs_orgy_guest.GetFirstName] стоит так близко, что жар кожи достигает меня."
 # Female root + Male guest
 sbs_orgy.1100.fm.1.desc: "Его рука ложится на талию, затем ведёт по линии бедра. Когда я наклоняюсь, его рот находит мой. Я чувствую, как он уже твёрд у ладони сквозь тонкую ткань."
 sbs_orgy.1100.fm.2.desc: "Подхожу, пока не остаётся пространства. Его дыхание тепло у горла. Одна рука на груди; другая находит его жар, ещё не идя дальше."
 sbs_orgy.1100.fm.3.desc: "Он притягивает меня к стене. Рот тёплый у шеи, затем у губ. Рука охватывает грудь сквозь ткань и остаётся, ожидая."
 sbs_orgy.1100.fm.4.desc: "Веду его руку к бедру, затем ниже, достаточно, чтобы он почувствовал мой жар. Он сглатывает. Никто ещё не решил, что дальше."
 sbs_orgy.1100.fm.5.desc: "Прижимает меня к стене. Одна рука охватывает грудь. Другая лежит высоко на бедре, достаточно близко, чтобы я чувствовала каждое малое движение."
 sbs_orgy.1100.fm.6.desc: "Наклоняюсь и целую его медленно. Когда отстраняюсь, рука ещё у пояса. Его пальцы остаются в волосах, не толкая и не тяня."
 sbs_orgy.1100.fm.7.desc: "Большой палец ведёт по внутренней стороне бедра. Опускаю руку и сжимаю его сквозь ткань, чувствуя пульс у ладони. Так остаёмся на миг."
 sbs_orgy.1100.fm.8.desc: "Оказываемся на низком ложе, рты открыты, руки бродят. Его тело тепло у моего. Следующий шаг всё ещё выбор."
 # Male root + Female guest
 sbs_orgy.1100.mf.1.desc: "Моя рука находит её бедро, затем тепло бедра. Она уже дышит чаще. Когда она сжимает меня сквозь ткань, никто не притворяется, что это только разговор."
 sbs_orgy.1100.mf.2.desc: "Опускаю голову к её горлу, затем ко рту. Запах кожи острый и чистый. Рука остаётся высоко на бедре."
 sbs_orgy.1100.mf.3.desc: "Целует вниз по груди и останавливается, не идя дальше. Одна рука на бедре; другая ведёт по линии пояса."
 sbs_orgy.1100.mf.4.desc: "Пальцы лежат между бёдер и чувствуют, как она уже готова. Свободная рука гладит меня сквозь ткань тем же неспешным темпом."
 sbs_orgy.1100.mf.5.desc: "Толкает меня на ложе и садится на колени. Её рот находит мой. Мы достаточно близко, чтобы следующий выбор был очевиден."
 sbs_orgy.1100.mf.6.desc: "Притягиваю её, пока бёдра не встретятся. Она тёплая и согласная. Жду мгновения решить, как далеко это зайдёт."
 sbs_orgy.1100.mf.7.desc: "Её рука обвивает меня, моя остаётся между бёдер. Так остаёмся долго, уча ритм друг друга, ещё не идя дальше."
 sbs_orgy.1100.mf.8.desc: "Она встаёт на колени передо мной и поднимает взгляд. Руки на моих бёдрах. Приглашение ясно. Решение всё ещё моё."
 # Male + Male
 sbs_orgy.1100.mm.1.desc: "Его рука находит бедро, затем мой жар сквозь ткань. Отвечаю касанием. Рты встречаются, открытые и неспешные."
 sbs_orgy.1100.mm.2.desc: "Шаг вперёд, пока груди не встретятся. Дыхание сбивается, когда рука ложится на него. Никто не пошёл дальше."
 sbs_orgy.1100.mm.3.desc: "Наклоняется и целует жёстко. Рука остаётся у пояса. Пальцы остаются в его волосах, не толкая и не тяня."
 sbs_orgy.1100.mm.4.desc: "Стоим близко. Обе руки работают сквозь ткань сразу. Узкое пространство между нами уже слишком теплое."
 sbs_orgy.1100.mm.5.desc: "Поворачиваю его и прижимаюсь к спине. Одна рука обходит его. Так остаёмся, дыша, пока не решено большее."
 sbs_orgy.1100.mm.6.desc: "Опускает рот к горлу, затем ниже, и останавливается. Кладу руку на затылок. Следующий шаг всё ещё выбор."
 sbs_orgy.1100.mm.7.desc: "Руки движутся вместе по ткани и коже. Он склоняется ко мне. Никто ещё ничего не завершил."
 sbs_orgy.1100.mm.8.desc: "Прислоняет лоб к моему. Руки остаются там, где есть. Ночь ещё открыта."
 # Female + Female
 sbs_orgy.1100.ff.1.desc: "Рука ложится на бедро, затем на тёплую кожу бедра. Она зеркалит движение. Так остаёмся, уча ритм друг друга."
 sbs_orgy.1100.ff.2.desc: "Опускаю рот к горлу, затем к губам. Рука лежит на затылке и ведёт без силы."
 sbs_orgy.1100.ff.3.desc: "Толкает меня на ложе и садится на колени. Рты встречаются. Бёдра сжимаются вокруг меня, когда она наклоняется."
 sbs_orgy.1100.ff.4.desc: "Пальцы ложатся между бёдер и находят её уже тёплой. Она отвечает тем же. Комната наполняется тихим дыханием."
 sbs_orgy.1100.ff.5.desc: "Оказываемся на боку, прижатые, рты у горла. Ритм медленный. Никто не торопится."
 sbs_orgy.1100.ff.6.desc: "Дрожит, когда целую снова. Миг остаёмся так, открытые и ждущие, пока не выбрано большее."
 sbs_orgy.1100.ff.7.desc: "Рука лежит между ног, рот остаётся у горла. Мы обе уже тёплые. Остальное всё ещё выбор."
 sbs_orgy.1100.ff.8.desc: "Целуемся, пока обе не дрожим. Руки остаются на бёдрах и бёдрах. Большего ещё не решено."
 # Options - more detailed
 sbs_orgy.1100.a: "Ничего между нами."
 sbs_orgy.1100.a.tt: "Я притягиваю тебя и беру целиком. Кожа к коже, без удержу, пока никто из нас не сможет притвориться, будто это был лишь жест."
 sbs_orgy.1100.b: "Не без осторожности."
 sbs_orgy.1100.b.tt: "Сначала осторожность. Потом я не спешу ни с одним местом, от которого тебя трясёт."
 sbs_orgy.1100.c: "Оставь меня после этой ночи."
 sbs_orgy.1100.c.tt: "Я беру тебя осторожно и говорю о другой ночи. Хочу снова узнать твоё тело."
 sbs_orgy.1100.e: "Чего потребовала бы любовь?"
 sbs_orgy.1100.e.tt: "Мы держим руки неподвижными достаточно долго, чтобы говорить о любви, даже если ответ опасен."

 # Dirty talk (khẩu dâm) - gender variants
 sbs_orgy.1100.d_fm: "Скажи, как."
 sbs_orgy.1100.d_fm.tt: "Скажи точно, как ты хочешь меня взять. Опиши это, пока твоя рука ещё между моих бёдер."
 sbs_orgy.1100.d_mf: "Скажи, чего ты хочешь."
 sbs_orgy.1100.d_mf.tt: "Скажи, что я должен с тобой сделать. Хочу слышать каждую подробность, пока мои пальцы ещё в тебе."
 sbs_orgy.1100.d_mm: "Скажи, как сильно."
 sbs_orgy.1100.d_mm.tt: "Скажи, как сильно ты этого хочешь. Опиши, что должны делать рот и руки, пока я глажу тебя."
 sbs_orgy.1100.d_ff: "Скажи, куда."
 sbs_orgy.1100.d_ff.tt: "Скажи точно, куда ты хочешь мой рот и пальцы. Хочу услышать это, пока я тебя касаюсь."

 # Mutual fondling / mutual masturbation
 sbs_orgy.1100.f_fm: "Только наши руки."
 sbs_orgy.1100.f_fm.tt: "Я глажу тебя, пока твои пальцы работают между моих бёдер, пока мы оба не кончим."
 sbs_orgy.1100.f_mf: "Только наши руки."
 sbs_orgy.1100.f_mf.tt: "Я держу пальцы в тебе, пока ты медленно гладишь меня, пока никто не сможет сдержаться."
 sbs_orgy.1100.f_mm: "Только наши руки."
 sbs_orgy.1100.f_mm.tt: "Мы гладим друг друга в одном ритме, следя за каждой реакцией, пока оба не изойдём."
 sbs_orgy.1100.f_ff: "Только руки и рты."
 sbs_orgy.1100.f_ff.tt: "Мы касаемся друг друга, пока обе не станем влажными и дрожащими, не идя дальше."





 sbs_orgy.1200.t: "Третье место"
 sbs_orgy.1200.desc: "[sbs_orgy_guest_a.GetFirstName] и [sbs_orgy_guest_b.GetFirstName] присоединяются в более тихом углу. Воздух между нами троими уже тёплый."
 sbs_orgy.1200.male.desc: "Два тела жмутся с обеих сторон. Руки касаются рук, талии, края одежды. Рты находят горло и рот. Остаёмся так, тёплые и незаконченные, ожидая, кого выберут."
 sbs_orgy.1200.female.desc: "Два тела жмутся с обеих сторон. Руки касаются рук, талии, края одежды. Рты находят горло и рот. Остаёмся так, тёплые и незаконченные, ожидая, кого выберут."
 sbs_orgy.1200.a: "Только [sbs_orgy_guest_a.GetFirstName]."
 sbs_orgy.1200.a.tt: "Я притягиваю [sbs_orgy_guest_a.GetFirstName]. Этой ночью мне нужно только одно тело."
 sbs_orgy.1200.b: "Только [sbs_orgy_guest_b.GetFirstName]."
 sbs_orgy.1200.b.tt: "Я притягиваю [sbs_orgy_guest_b.GetFirstName]. Этой ночью мне нужно только одно тело."
 sbs_orgy.1200.c: "Все трое."
 sbs_orgy.1200.c.tt: "Никого не оставляют в стороне. Руки и рты ходят свободно, пока никто не различит, чьё это наслаждение."
 sbs_orgy.1200.d: "Поговорим о желании."
 sbs_orgy.1200.d.tt: "Мы прямо говорим, чего хочет каждый, пока руки всё ещё бродят."
 sbs_orgy.1200.e: "Подтолкни их друг к другу."
 sbs_orgy.1200.e.tt: "Я направляю их друг к другу и остаюсь достаточно близко, чтобы смотреть. Их тела встречаются; моему незачем."

 sbs_orgy.4100.t: "Голая корона"
 sbs_orgy.4100.desc: "[sbs_orgy_nudity_guest.GetFirstName] задаёт вопрос с осторожной учтивостью: если государя так часто видят без одежд, может ли народ смотреть с тем же почтением?"
 sbs_orgy.4100.male.desc: "Стою совсем голый под лампами. Плечи назад, член сначала мягкий, потом толстеет под столькими глазами. Не делаю движения прикрыться. Пусть смотрят каждую линию мышцы и вес между ног."
 sbs_orgy.4100.female.desc: "Стою совсем голая под лампами. Плечи назад, груди и мягкий треугольник между бёдер открыты каждому взгляду. Не делаю движения прикрыться. Пусть смотрят каждый изгиб и влагу, что уже собирается."
 sbs_orgy.4100.a: "Пусть смотрят."
 sbs_orgy.4100.a.tt: "Достойному телу не нужна завеса. Я медленно поворачиваюсь, чтобы виден был каждый ракурс."
 sbs_orgy.4100.b: "Почтить ту невинность."
 sbs_orgy.4100.b.tt: "Адам и Ева не знали стыда в Эдеме. Я чту ту невинность открытыми руками и открытым телом."
 sbs_orgy.4100.c: "Пусть решит свет."
 sbs_orgy.4100.c.tt: "Одежды должны возвышать красоту, а не лишь скрывать её."
 sbs_orgy.4100.d: "Оставим вопрос."
 sbs_orgy.4100.d.tt: "Я не отвечаю на загадку. Просто стою, как есть, пока зал не привыкнет к виду."

 sbs_orgy.4200.t: "Прекраснейший стан"
 sbs_orgy.4200.desc: "Неосторожный комплимент становится состязанием. По крайней мере пятеро стоят под лампами, пока компания решает, чья осанка достойна самой громкой хвалы."
 sbs_orgy.4200.male.desc: "Стоюсь среди других, совсем голый. Мышцы играют на свету, член напоказ. Когда очередь моя, медленно поворачиваюсь и даю каждому глазу мерить линии тела и вес между ног."
 sbs_orgy.4200.female.desc: "Стоюсь среди других, совсем голая. Груди, бёдра и мягкие складки между бёдер открыты суду. Когда очередь моя, медленно поворачиваюсь и даю каждому глазу мерить изгибы и уже видную влагу."
 sbs_orgy.4200.a: "Показать силу."
 sbs_orgy.4200.a.tt: "Я держу позу, пока зал не затихнет."
 sbs_orgy.4200.b: "Покорить обаянием."
 sbs_orgy.4200.b.tt: "Я улыбаюсь, поворачиваюсь и оставляю залу решить, что смотреть стоит на меня."
 sbs_orgy.4200.c: "Ловкая поза."
 sbs_orgy.4200.c.tt: "Я смещаюсь ровно настолько, чтобы собрать все взгляды."
 sbs_orgy.4200.d: "Пустить состязание в дело."
 sbs_orgy.4200.d.tt: "Я притягиваю ближайшие тела и даю состязанию лучшее применение."

 sbs_orgy.2100.t: "Знакомая неловкость"
 sbs_orgy.2100.desc: "При всей свободе зала [sbs_orgy_guest.GetFirstName] и я медлим. Кровь делает иные молчания тяжелее прочих."
 sbs_orgy.2100.fm.desc: "Мой взрослый ребёнок стоит передо мной, выросший и голый. Та же кровь, что делала это немыслимым, лишь обостряет жар. Его рука находит бедро; моя находит твёрдую длину его."
 sbs_orgy.2100.mf.desc: "Мой взрослый ребёнок стоит передо мной, выросший и голый. Та же кровь лишь обостряет жар. Рука находит мягкие складки между ног; она уже мокрая."
 sbs_orgy.2100.mm.desc: "Мой взрослый сын стоит передо мной, выросший и голый. Та же кровь лишь обостряет жар. Руки смыкаются друг на друге сразу."
 sbs_orgy.2100.ff.desc: "Моя взрослая дочь стоит передо мной, выросшая и голая. Та же кровь лишь обостряет жар. Руки скользят между бёдер другой и находят ту же мокрую готовность."
 sbs_orgy.2100.a: "Ничего между нами."
 sbs_orgy.2100.a.tt: "Я беру тебя целиком. Кожа к коже, кровь к крови, пока никто не сможет притвориться, будто это лишь близость."
 sbs_orgy.2100.b: "Не без осторожности."
 sbs_orgy.2100.b.tt: "Сначала осторожность. Ночь остаётся близкой, но не безрассудной."
 sbs_orgy.2100.c: "Пусть это продлится за утро."
 sbs_orgy.2100.c.tt: "То, что нас связывает, священно, а не постыдно. Я даю ночи стать тем, что может пережить утро."
 sbs_orgy.2100.d: "Только руки и рты."
 sbs_orgy.2100.d.tt: "Мы остаёмся при руках и ртах. Достаточно близко, чтобы вкусить, недостаточно далеко, чтобы забыть границу."
 sbs_orgy.2100.e: "Досюда — и не дальше."
 sbs_orgy.2100.e.tt: "Я отступаю, пока жар не решил за нас. Кровь между нами этой ночью остаётся границей."

 sbs_orgy.2200.t: "Через брак"
 sbs_orgy.2200.desc: "[sbs_orgy_guest.GetFirstName] вошёл в мой дом через [sbs_orgy_child.GetFirstName]. Этой ночью эта знакомая связь кажется менее простой, чем при свете дня."
 sbs_orgy.2200.fm.desc: "Супруг моего ребёнка стоит близко. Брак, что вяжет его с домом, сегодня кажется тонким. Рука на талии; я чувствую, как он уже готов."
 sbs_orgy.2200.mf.desc: "Супруга моего ребёнка стоит близко. Брак кажется тонким. Пальцы находят мягкий жар между ног; она не отступает."
 sbs_orgy.2200.mm.desc: "Муж моего ребёнка стоит близко. Брак кажется тонким. Руки смыкаются друг на друге без лишнего слова."
 sbs_orgy.2200.ff.desc: "Жена моего ребёнка стоит близко. Брак кажется тонким. Руки скользят между бёдер и находят тот же мокрый жар."
 sbs_orgy.2200.a: "Ничего между нами."
 sbs_orgy.2200.a.tt: "Я беру то, что день назвал бы ихним. Между нами только жар мгновения."
 sbs_orgy.2200.b: "Не без осторожности."
 sbs_orgy.2200.b.tt: "Осторожность. Это остаётся одной ночью, а не прочной связью."
 sbs_orgy.2200.c: "Останься близко. Ничего больше."
 sbs_orgy.2200.c.tt: "Мы остаёмся при тепле и бродящих руках. Брак не назван и не нарушен."
 sbs_orgy.2200.d: "Поговорим о браке."
 sbs_orgy.2200.d.tt: "Я называю связь вслух. Мы говорим о [sbs_orgy_child.GetFirstName], пока жар не найдёт другой путь."

 sbs_orgy.2300.t: "Доказательство дружбы"
 sbs_orgy.2300.desc: "Друг, или ближайший из друзей, стоит близко. Старое доверие сидит между нами как ещё одно тело. Этой ночью оно может стать иным."
 sbs_orgy.2300.fm.desc: "Друг стоит достаточно близко, чтобы я чувствовала жар кожи. Годы доверия делают первое касание лёгким. Он твердеет у ладони, пока глажу; пальцы находят меня уже мокрой."
 sbs_orgy.2300.mf.desc: "Подруга стоит достаточно близко, чтобы я чувствовал жар кожи. Годы доверия делают первое касание лёгким. Пальцы скользят между бёдер и находят её мокрой; в ответ она сжимает меня."
 sbs_orgy.2300.mm.desc: "Друг стоит достаточно близко, чтобы я чувствовал жар кожи. Годы доверия делают первое касание лёгким. Гладим друг друга в одном медленном темпе, следя за каждой реакцией."
 sbs_orgy.2300.ff.desc: "Подруга стоит достаточно близко, чтобы я чувствовала жар кожи. Годы доверия делают первое касание лёгким. Руки и рты ходят между бёдер, пока обе не задрожим."
 sbs_orgy.2300.a: "Докажи так."
 sbs_orgy.2300.a.tt: "Я беру тебя без преграды и даю годам доверия стать жарче."
 sbs_orgy.2300.b: "Не без осторожности."
 sbs_orgy.2300.b.tt: "Осторожность. Годы доверия становятся жаром, но не прочной претензией."
 sbs_orgy.2300.c: "Больше, чем друзья."
 sbs_orgy.2300.c.tt: "Я беру тебя осторожно и даю старой доверенности стать связью любовников."
 sbs_orgy.2300.d: "Вспомни, как мы начинали."
 sbs_orgy.2300.d.tt: "Мы говорим о более старых ночах и более простых днях. Руки неподвижны. Дружбы довольно."

 sbs_orgy.2400.t: "Перемирие наедине"
 sbs_orgy.2400.desc: "Соперник стоит через узкое пространство. Ненависть всегда была родом близости. Этой ночью воздух между нами заряжен иным."
 sbs_orgy.2400.fm.desc: "Руки соперника грубы, когда наконец касаются. Тот же гнев, что хотел меня сломать, хочет меня открытой. Чувствую его твёрдым у бедра, пока старая ненависть тает в жар."
 sbs_orgy.2400.mf.desc: "Тело соперницы напряжено, когда наконец касаюсь. Тот же гнев открывается под пальцами. Она мокрая ещё до поцелуя."
 sbs_orgy.2400.mm.desc: "Хватка соперника жестка, когда руки наконец встречаются. Тот же гнев густеет у ладони. Гладим друг друга с силой старой драки."
 sbs_orgy.2400.ff.desc: "Дыхание соперницы остро, когда руки наконец встречаются. Тот же гнев становится мокрым под пальцами. Касаемся друг друга с силой старой драки."
 sbs_orgy.2400.a: "Кончим это так."
 sbs_orgy.2400.a.tt: "Я принимаю соперничество в своё тело. Когда кончится, ненависть может не выжить."
 sbs_orgy.2400.b: "Уступить."
 sbs_orgy.2400.b.tt: "Я уступаю. Пусть сдача закончит то, чего бой никогда не смог."
 sbs_orgy.2400.c: "Не с тобой."
 sbs_orgy.2400.c.tt: "Я оставляю старую ненависть на месте. Иные перемирия не стоят кожи, которой бы стоили."

 sbs_orgy.2500.t: "Без титулов этой ночью"
 sbs_orgy.2500.desc: "Присутствует вассал. Ранг ещё есть, но одежды сняты и ночь длинна. Власть можно отставить или употребить иначе."
 sbs_orgy.2500.fm.desc: "Мой вассал стоит на коленях или стоит, как я решу. Тот же рот, что клялся в верности, открывается теперь для меня. Чувствую жар его члена у ладони, пока решаю, как далеко зайдёт служба."
 sbs_orgy.2500.mf.desc: "Моя вассалка ждёт с неподвижностью того, кто знает своё место. Пальцы находят мягкий жар между ног; она не отводит глаз. Ранг становится чем-то мокрым и немедленным."
 sbs_orgy.2500.mm.desc: "Мой вассал ждёт с неподвижностью того, кто знает своё место. Сжимаю его и чувствую, как верность становится жаром. Он гладит меня в ответ осторожным, привычным движением."
 sbs_orgy.2500.ff.desc: "Моя вассалка ждёт с неподвижностью того, кто знает своё место. Пальцы скользят между бёдер и находят её готовой. Она отвечает касанием; ранг растворяется во взаимном мокром жаре."
 sbs_orgy.2500.a: "Не без осторожности."
 sbs_orgy.2500.a.tt: "Сан может подождать. Осторожность — и я беру то, что вассал может дать."
 sbs_orgy.2500.b: "На колени."
 sbs_orgy.2500.b.tt: "Я ставлю их на колени и пользуюсь ртом и руками, пока бремя правления не ослабнет."
 sbs_orgy.2500.c: "Назови свою цену."
 sbs_orgy.2500.c.tt: "Я предлагаю монету за то, чего сан не должен повелевать. Ночь продолжается на купленных условиях."
 sbs_orgy.2500.d: "Говорить, касаясь."
 sbs_orgy.2500.d.tt: "Дела и близость на одном дыхании. Руки бродят. Большего не требуется."

 sbs_orgy.2600.t: "Знакомое обещание"
 sbs_orgy.2600.desc: "Супруг здесь. Знакомое тело, знакомое касание. Утешение и желание поровну."
 sbs_orgy.2600.fm.desc: "Тело мужа мне знакомо как своё. Оно ложится в руку как всегда. Этой ночью привычность лишь углубляет жар."
 sbs_orgy.2600.mf.desc: "Тело жены мне знакомо как своё. Мягкие складки между ног открываются пальцам как всегда. Этой ночью привычность лишь углубляет жар."
 sbs_orgy.2600.mm.desc: "Тело мужа мне знакомо как своё. Гладим друг друга с лёгкостью долгой практики, жар ещё остр после стольких лет."
 sbs_orgy.2600.ff.desc: "Тело жены мне знакомо как своё. Руки и рты ходят между бёдер с лёгкостью долгой практики, жар ещё остр после стольких лет."
 sbs_orgy.2600.a: "Как всегда."
 sbs_orgy.2600.a.tt: "Я беру супруга целиком и даю знакомому наслаждению идти своим ходом."
 sbs_orgy.2600.b: "Найди кого-то другого."
 sbs_orgy.2600.b.tt: "Я отворачиваюсь от знакомого тела и ищу жар незнакомца."

 sbs_orgy.2700.t: "Дела прежде удовольствия"
 sbs_orgy.2700.desc: "[sbs_orgy_guest.GetFirstName] находит меня, пока пир продолжается вокруг. Как-то начинается совет, хотя никто из нас его не созывал."
 sbs_orgy.2700.a: "Сначала держава."
 sbs_orgy.2700.a.tt: "Мы говорим о должностях и незаконченной работе, пока пир идёт вокруг."
 sbs_orgy.2700.b: "Чего потребовала бы любовь?"
 sbs_orgy.2700.b.tt: "Совет может подождать. Я спрашиваю, что любовь сделала бы из двоих, что обычно говорят о державе."
 sbs_orgy.2700.c: "Поговорим о желании."
 sbs_orgy.2700.c.tt: "Мы прямо называем, чего хотим. Руки неподвижны. Разговора довольно, чтобы облегчить ночь."

 sbs_orgy.2800.t: "Дом вассала"
 sbs_orgy.2800.desc: "[sbs_orgy_guest.GetFirstName] принадлежит дому [sbs_orgy_vassal_spouse_owner.GetFirstName], одного из моих вассалов. Это трудно забыть, хотя никто не уходит."
 sbs_orgy.2800.fm.desc: "Супруг моего вассала стоит близко. Домашняя связь, что должна беречь, кажется тонкой. Он твердеет в руке, пока имя супруга висит несказанным между нами."
 sbs_orgy.2800.mf.desc: "Супруга моего вассала стоит близко. Домашняя связь кажется тонкой. Пальцы находят её уже мокрой, пока имя супруга висит несказанным."
 sbs_orgy.2800.mm.desc: "Муж моего вассала стоит близко. Домашняя связь кажется тонкой. Гладим друг друга, пока имя супруга висит несказанным."
 sbs_orgy.2800.ff.desc: "Жена моего вассала стоит близко. Домашняя связь кажется тонкой. Руки ходят между бёдер, пока имя супруга висит несказанным."
 sbs_orgy.2800.a: "Осторожная тайна."
 sbs_orgy.2800.a.tt: "Осторожность — и я беру супруга своего вассала и храню ночь в тайне."
 sbs_orgy.2800.b: "Ничего между нами."
 sbs_orgy.2800.b.tt: "Я беру их целиком. Узы дома остаются за дверью."
 sbs_orgy.2800.c: "Оставь дверь открытой."
 sbs_orgy.2800.c.tt: "Я беру их осторожно и оставляю дверь открытой. Этому незачем кончаться, когда погаснут светильники."
 sbs_orgy.2800.d: "Позовите [sbs_orgy_vassal_spouse_owner.GetFirstName]."
 sbs_orgy.2800.d.tt: "Я зову [sbs_orgy_vassal_spouse_owner.GetFirstName] и ставлю их вместе. Они исполняют это для меня. Оба уходят довольными тем, как я это устроил. Смотреть и распоряжаться стоит мне больше, чем им."
 sbs_orgy.2800.e: "Разговора будет довольно."
 sbs_orgy.2800.e.tt: "Пока и разговора довольно для скандала. Руки неподвижны."

 sbs_orgy.2900.t: "Выше ранга"
 sbs_orgy.2900.desc: "Вдали от парадного зала [sbs_orgy_guest.GetFirstName] всё ещё мой сюзерен, хотя ранг в такой комнате кажется менее верным."
 sbs_orgy.2900.fm.desc: "Сюзерен стоит достаточно близко, чтобы ранг ещё должен был значить. Не значит. Его рука находит мягкий жар между ног; я сжимаю твёрдую длину его."
 sbs_orgy.2900.mf.desc: "Сюзерен стоит достаточно близко, чтобы ранг ещё должен был значить. Не значит. Пальцы находят мягкий жар между ног; в ответ она сжимает меня."
 sbs_orgy.2900.mm.desc: "Сюзерен стоит достаточно близко, чтобы ранг ещё должен был значить. Не значит. Руки смыкаются друг на друге сразу; иерархия растворяется в простом жаре."
 sbs_orgy.2900.ff.desc: "Сюзерен стоит достаточно близко, чтобы ранг ещё должен был значить. Не значит. Руки скользят между бёдер и находят ту же мокрую готовность."
 sbs_orgy.2900.a: "Отложи сан."
 sbs_orgy.2900.a.tt: "Я беру своего сюзерена с осторожностью и оставляю ночи быть лишь телами."
 sbs_orgy.2900.b: "Моё общество имеет цену."
 sbs_orgy.2900.b.tt: "Я предлагаю себя словами и умением и прошу цену за эту привилегию."
 sbs_orgy.2900.b.success: "Мои условия приняты. Ночь продолжается на моих условиях."
 sbs_orgy.2900.b.failure: "Мой сюзерен не убеждён. Сан снова заявляет о себе."
 sbs_orgy.2900.c: "Только слова, мой сюзерен."
 sbs_orgy.2900.c.tt: "На этот раз мы просто говорим. Руки неподвижны. Иерархия остаётся нетронутой."

 sbs_orgy.2920.t: "Связанный гость"
 sbs_orgy.2920.desc: "[sbs_orgy_guest.GetFirstName] ждёт с привычной неподвижностью того, кого привыкли приказывать. Этой ночью есть несколько путей ответить на это послушание."
 sbs_orgy.2920.fm.desc: "Раб ждёт. По слову встаёт на колени. Рот открывается для меня; рука смыкается на твёрдой длине его. Ошейник, клеймо или сам факт владения утяжеляет каждое касание."
 sbs_orgy.2920.mf.desc: "Рабыня ждёт. По слову встаёт на колени или открывается. Пальцы находят мягкий жар между ног; она не отводит глаз. Ошейник, клеймо или сам факт владения утяжеляет каждое касание."
 sbs_orgy.2920.mm.desc: "Раб ждёт. По слову встаёт на колени. Гладим друг друга с ясностью приказа и послушания. Ошейник, клеймо или сам факт владения утяжеляет каждое касание."
 sbs_orgy.2920.ff.desc: "Рабыня ждёт. По слову встаёт на колени или открывается. Руки ходят между бёдер с ясностью приказа и послушания. Ошейник, клеймо или сам факт владения утяжеляет каждое касание."
 sbs_orgy.2920.a: "Служи ртом."
 sbs_orgy.2920.a.tt: "Я ставлю их на колени. Рот и руки работают, пока бремя повеления не ослабнет."
 sbs_orgy.2920.b: "Чужой приказ."
 sbs_orgy.2920.b.tt: "Я отдаю приказ, не имеющий отношения к обычной службе, и смотрю, как они повинуются."
 sbs_orgy.2920.c: "Иди сюда."
 sbs_orgy.2920.c.tt: "Довольно обряда. Осторожность — и я беру их, как любого другого этой ночью."
 sbs_orgy.2920.d: "Не этой ночью."
 sbs_orgy.2920.d.tt: "Я велю им сесть и дышать. Сострадание вместо приказа. Ошейник может подождать."


# Contest localization

# 3100 - Contest of Mouths
 sbs_orgy.3100.t: "Состязание ртов"
 sbs_orgy.3100.desc: "Кто-то зовёт к состязанию умения. Один за другим желающие выходят взять член в рот. Кто возьмёт глубже всех и удержит дольше, не отстраняясь, получит кошелёк."
 sbs_orgy.3100.male.desc: "Когда очередь моя, встаю на колени и беру предложенный член. Сначала медленно, потом глубже, пока зал не увидит, как исчезает каждый дюйм, горло полно, глаза влажны."
 sbs_orgy.3100.female.desc: "Когда очередь моя, встаю на колени и беру предложенный член. Сначала медленно, потом глубже языком и горлом, пока зал не увидит, как далеко я готова идти."
 sbs_orgy.3100.a: "Принять вызов."
 sbs_orgy.3100.a.tt: "Я покажу им, на что способен мой рот."
 sbs_orgy.3100.a.success: "Я беру глубже и держу дольше всех. Кошель кладут мне в руки под тихие рукоплескания."
 sbs_orgy.3100.a.failure: "Кто-то другой оказывается искуснее. Я отступаю с меньшим достоинством, чем надеялся."
 sbs_orgy.3100.b: "Только смотреть."
 sbs_orgy.3100.b.tt: "Я остаюсь среди зрителей и оставляю другому рту забрать кошель."

# 3200 - Who Lasts the Longest
 sbs_orgy.3200.t: "Кто продержится дольше всех"
 sbs_orgy.3200.desc: "Объявляют новое состязание. Сходятся пары, задача проста: продолжать как можно дольше, не кончая. Зал смотрит и считает минуты."
 sbs_orgy.3200.male.desc: "Беру согласного партнёра под собой. Правило ясно: держать ритм, продолжать толкать и не излиться, пока все другие пары уже не сломаются. Зал считает каждую минуту вслух."
 sbs_orgy.3200.female.desc: "Принимаю согласного партнёра в себя. Правило ясно: продолжать двигаться, держать ритм и не кончить, пока все другие пары уже не сломаются. Зал считает каждую минуту вслух."
 sbs_orgy.3200.a: "Принять вызов."
 sbs_orgy.3200.a.tt: "Я беру своего партнёра. Пусть зал видит, как долго я продержусь."
 sbs_orgy.3200.a.success: "Я держусь дольше любой другой пары. Кошель и тихая зависть зала — мои."
 sbs_orgy.3200.a.failure: "Я сдаюсь раньше других. Зал замечает это сразу."
 sbs_orgy.3200.b: "Только смотреть."
 sbs_orgy.3200.b.tt: "Я остаюсь среди зрителей и оставляю другим парам бежать против минут."

# 3300 - The Most Rounds
 sbs_orgy.3300.t: "Больше всех кругов"
 sbs_orgy.3300.desc: "Кто-то поднимает ставки. Вызов теперь в выносливости: кто возьмёт больше партнёров, прежде чем остановиться. Счёт ведут вслух, чтобы никто не мошенничал."
 sbs_orgy.3300.male.desc: "Перехожу от одного согласного партнёра к следующему. Каждый раз, кончив, восстанавливаюсь лишь настолько, чтобы начать снова. Зал выкрикивает число после каждого круга."
 sbs_orgy.3300.female.desc: "Принимаю одного согласного партнёра за другим. Каждый раз, когда один кончает во мне или на мне, следующий уже ждёт. Зал выкрикивает число после каждого круга."
 sbs_orgy.3300.a: "Принять вызов."
 sbs_orgy.3300.a.tt: "Пусть считают, скольких я смогу взять."
 sbs_orgy.3300.a.success: "Я беру больше партнёров, чем кто-либо, прежде чем остановиться. Кошель мой."
 sbs_orgy.3300.a.failure: "Кто-то другой оказывается неумолимее. Высокий счёт не мой."
 sbs_orgy.3300.b: "Только смотреть."
 sbs_orgy.3300.b.tt: "Я считаю вместе с залом и оставляю круги кому-то более голодному."

# 3400 - Who Breaks First
 sbs_orgy.3400.t: "Кто сломается первым"
 sbs_orgy.3400.desc: "Предлагают более тихое состязание. Желающие ложатся, пока умелые руки и рты работают над ними. Правило простое: не кончить. Первый, кто сорвётся, проигрывает."
 sbs_orgy.3400.male.desc: "Ложусь и даю умелым рукам и ртам работать надо мной. Каждый вздох и вздрагивание смотрят. Кто первый изольётся, теряет кошелёк."
 sbs_orgy.3400.female.desc: "Ложусь и даю умелым рукам и ртам работать между ног. Каждый вздох и дрожь смотрят. Кто первый кончит, теряет кошелёк."
 sbs_orgy.3400.a: "Принять вызов."
 sbs_orgy.3400.a.tt: "Пусть попробуют сломать меня."
 sbs_orgy.3400.a.success: "Я держусь дольше всех. Кошель и тихое уважение зала — мои."
 sbs_orgy.3400.a.failure: "Я сдаюсь первым. Зал видит это ясно."
 sbs_orgy.3400.b: "Лучше буду касаться я."
 sbs_orgy.3400.b.tt: "Я работаю руками и ртом над другим и оставляю им состязание в выдержке."

# 3500 - Contest of Tongues
 sbs_orgy.3500.t: "Состязание языков"
 sbs_orgy.3500.desc: "Кто-то зовёт к иному вызову. Один за другим желающие опускают рот между предложенных бёдер. Кто пробудет дольше и извлечёт больше из партнёра, получит кошелёк."
 sbs_orgy.3500.male.desc: "Когда очередь моя, опускаю рот между предложенных бёдер и работаю с ровным вниманием. Язык и губы движутся, пока зал не услышит, как хорошо я справляюсь и как долго готов остаться."
 sbs_orgy.3500.female.desc: "Когда очередь моя, опускаю рот между предложенных бёдер и работаю с ровным вниманием. Язык и губы движутся, пока зал не услышит, как хорошо я справляюсь и как долго готова остаться."
 sbs_orgy.3500.a: "Принять вызов."
 sbs_orgy.3500.a.tt: "Я покажу им, на что способен мой рот."
 sbs_orgy.3500.a.success: "Я держусь дольше и извлекаю больше звуков из партнёра, чем кто-либо. Кошель кладут мне в руки."
 sbs_orgy.3500.a.failure: "Кто-то другой оказывается искуснее. Я отступаю с меньшим достоинством, чем надеялся."
 sbs_orgy.3500.b: "Только смотреть."
 sbs_orgy.3500.b.tt: "Я остаюсь среди зрителей и оставляю другому языку забрать кошель."

# Heavy / extreme localization

# 6100 - Female alone with animal
 sbs_orgy.6100.t: "Иной гость"
 sbs_orgy.6100.desc: "Двери открываются шире обычного. Что-то большое и тёплое вводят в комнату на толстой верёвке. Прочие гости умолкают и отступают."
 sbs_orgy.6100.horse.desc: "Выводят сильного коня, уже твёрдого и тяжёлого между ног. Меня ставят на четвереньки под ним. Когда животное всходит, один размер вырывает из горла долгий, сорванный стон. Каждый глубокий толчок растягивает, пока я могу только цепляться за пол и кричать."
 sbs_orgy.6100.dog.desc: "Выводят крупную гончую, пыхтящую и уже капающую. Садится сзади без колебаний, бёдра в быстрых, резких толчках. Мокрый звук и низкое рычание наполняют комнату, пока я беспомощно стону под весом."
 sbs_orgy.6100.pig.desc: "Вводят тяжёлого кабана, хрюкающего и уже скользкого. Когда всходит, толстая тупая форма входит ровным давлением. Каждый глубокий толчок вырывает из горла сырой звериный звук, что смешивается с его хрюканьем, пока комната не гудит обоими."
 sbs_orgy.6100.a: "Принять целиком."
 sbs_orgy.6100.a.tt: "Я не могу сдержать звуки. Растяжение и жар слишком сильны — я стону и насаживаюсь, пока зверь не кончит глубоко во мне."
 sbs_orgy.6100.b: "Оттолкни."
 sbs_orgy.6100.b.tt: "Просто слишком велико. Я отталкиваю зверя, прежде чем он пойдёт глубже, задыхаясь и дрожа на полу."

# 6200 - Guest leads female root like an animal
 sbs_orgy.6200.t: "Ведомый как зверь"
 sbs_orgy.6200.desc: "[sbs_orgy_guest.GetFirstName] берёт кожаный поводок со стола и пристёгивает к принесённому ошейнику. Зал молча смотрит, как меня приказывают на четвереньки и заставляют ползти."
 sbs_orgy.6200.horse.desc: "Заставив меня лаять по команде и мочить пол как пёс, [sbs_orgy_guest.GetFirstName] выводит коня. Меня ставят под животное. Огромный вес ложится на спину, толстая длина входит, поводок держат коротко."
 sbs_orgy.6200.dog.desc: "Заставив меня лаять и мочить пол, [sbs_orgy_guest.GetFirstName] приводит крупную гончую. Зверь садится сразу, толкает жёстко и быстро. Гость держит поводок туго, пока мокрые звуки и рычание наполняют воздух."
 sbs_orgy.6200.pig.desc: "Заставив меня лаять и мочить пол, [sbs_orgy_guest.GetFirstName] приводит тяжёлого кабана. Тупая толстая форма входит ровным давлением, пока гость держит поводок коротко и смотрит, как исчезает каждый дюйм."
 sbs_orgy.6200.a: "Повинуйся и прими."
 sbs_orgy.6200.a.tt: "Я остаюсь на четвереньках и принимаю зверя точно как велено, стоная от растяжения, пока он не кончит во мне."
 sbs_orgy.6200.b: "Лучше умолять гостя."
 sbs_orgy.6200.b.tt: "Я оборачиваюсь и становлюсь на колени перед [sbs_orgy_guest.GetFirstName], умоляя служить им, а не зверю."
 sbs_orgy.6200.c: "Отказаться."
 sbs_orgy.6200.c.tt: "Я срываю поводок и встаю. Это зашло далеко за любую игру, в которую я готов играть."

# 6300 - Female root leads a female guest like an animal
 sbs_orgy.6300.t: "Мой собственный питомец"
 sbs_orgy.6300.desc: "Беру кожаный поводок и пристёгиваю к [sbs_orgy_guest.GetFirstName]. Зал смотрит, как я заставляю её ползти, лаять по команде и мочить пол, как дрессированное животное."
 sbs_orgy.6300.horse.desc: "Когда она достаточно исполнила, вывожу коня и ставлю её под ним. Тяжёлое животное всходит, пока я держу поводок коротко и смотрю, как каждый глубокий толчок вырывает из горла сорванный звук."
 sbs_orgy.6300.dog.desc: "Когда она достаточно исполнила, привожу крупную гончую. Садится жадно, бёдра в быстрых толчках, пока я держу поводок коротко и заставляю её стоять неподвижно для него."
 sbs_orgy.6300.pig.desc: "Когда она достаточно исполнила, привожу тяжёлого кабана. Толстая тупая форма входит в неё, пока я держу поводок и слушаю сырые звуки, которые она не может удержать."
 sbs_orgy.6300.a: "Заставь её принять."
 sbs_orgy.6300.a.tt: "Я держу её, пока зверь не кончит глубоко в ней, а затем велю благодарить меня за привилегию."
 sbs_orgy.6300.b: "Наградить своими руками."
 sbs_orgy.6300.b.tt: "Я останавливаю зверя и пользуюсь своими руками и ртом, награждая послушание."

# 3600 - Vaginal beer contest
 sbs_orgy.3600.t: "Иной род тоста"
 sbs_orgy.3600.desc: "Присутствующих женщин вызывают. Чаши крепкого пива ставят на пол. Вызов сказан ясно: держать чашу без рук и рта. Кто продержится дольше, выиграет кошелёк. Остальной зал ждёт, кто сломается первым."
 sbs_orgy.3600.a: "Принять вызов."
 sbs_orgy.3600.a.tt: "Я опускаюсь над чашей, решившись продержаться дольше любой другой женщины."
 sbs_orgy.3600.a.success: "Я держусь дольше всех. Кошель кладут мне в руки, пока зал рукоплещет победе."
 sbs_orgy.3600.a.failure: "Я не удерживаю. Пиво проливается, и зал без жалости назначает пеню: каждый присутствующий мужчина берёт нас обеих по очереди, прежде чем ночи позволят кончиться."
 sbs_orgy.3600.b: "Отказаться."
 sbs_orgy.3600.b.tt: "Иные игры не стоят цены проигрыша."


# 1300-1400 indoor / 5100-5400 outdoor
 sbs_orgy.1300.t: "Высокое сиденье"
 sbs_orgy.1300.desc: "Трон хозяина больше не пуст. Два тела заняли его, и зал видит, для чего теперь это сиденье."
 sbs_orgy.1300.fm.desc: "Я сижу на нём верхом на резном сиденье, локотники жмут бёдра. Каждый раз, когда я опускаюсь, дерево скрипит. Его руки держат мои бёдра; зал внизу затих."
 sbs_orgy.1300.mf.desc: "Я держу её на коленях на высоком сиденье, одна рука под бедром, другая на резном локотнике. Она движется против меня на виду у всего зала. Трон был не для этого — в том и смысл."
 sbs_orgy.1300.mm.desc: "Он у меня на коленях на хозяском троне, спиной к груди, резное дерево кусает нас обоих. Мы не прячем движение. Кто владеет этим сиденьем, почувствует это позже."
 sbs_orgy.1300.ff.desc: "Я держу её с собой на троне, одно бедро на локотнике, рот у её горла, пока рука работает между ног. Сиденье было для суда. Этой ночью оно держит нечто более влажное."
 sbs_orgy.1300.a: "Занять сиденье осторожно."
 sbs_orgy.1300.a.tt: "Я оставляю осторожность и кончаю на троне. Зал запомнит учтивость не меньше, чем жар."
 sbs_orgy.1300.b: "Найдите другое место."
 sbs_orgy.1300.b.tt: "Высокое сиденье — не ложе. Я снимаю их с трона искать более тихий угол."
 sbs_orgy.1400.t: "Более мягкая комната"
 sbs_orgy.1400.desc: "Дело уже начато. [sbs_orgy_guest.GetFirstName] всё ещё прижат ко мне, когда звучит предложение: уйти из общих залов и кончить это на настоящей постели."
 sbs_orgy.1400.fm.desc: "Он всё ещё в том медленном ритме, что мы начали в проходе. Рот у моего уха. Опочивальня, говорит он, будет добрее к спине, чем камень. Он не перестаёт двигаться, пока спрашивает."
 sbs_orgy.1400.mf.desc: "У неё колено на скамье и дыхание у моего горла. Постель — лишь дверь отсюда. Ей нужны простыни, засов, время. Рука не оставляет меня, пока она ждёт ответа."
 sbs_orgy.1400.mm.desc: "У стены мы уже на половине. Он кивает к опочивальне и не убирает руку. Постель дала бы нам продлиться. Залу незачем это слышать."
 sbs_orgy.1400.ff.desc: "Её бедро всё ещё зацеплено за моё. Ей нужна постель: дверь закрыта, подушки, место до утра. Пальцы остаются, где есть, пока я не выберу."
 sbs_orgy.1400.a: "Возьмём постель."
 sbs_orgy.1400.a.tt: "Я даю себя провести и мы кончаем не спеша. Закрытая дверь даёт больше тепла, чем зал когда-либо дал бы."
 sbs_orgy.1400.b: "Почему не трон?"
 sbs_orgy.1400.b.tt: "Я тяну их к высокому сиденью. Зал может смотреть. Дерзость меня облегчает; им довольно забавно, чтобы простить крюк."
 sbs_orgy.1400.c: "Останемся как есть."
 sbs_orgy.1400.c.tt: "Никакой другой комнаты. Я держу ритм, что уже есть, и кончаю здесь."
 sbs_orgy.5100.t: "Деревенское шествие"
 sbs_orgy.5100.desc: "Оргия не остаётся в поле. К полудню она выплеснулась в бедную деревню: голая колонна между домами, солнце ещё высоко.\n\nМужчина мочится на косяк, не сбивая шага. Другой садится на корточки в канаве и не поднимает глаз. Кто-то прижал пекаршу к колодцу, юбки уже прочь, протест уже тоньше жара. Детей уводят в избы. Псы лают. Священник, если он есть, нашёл ставень, который можно закрыть.\n\nНикто не ведёт. Колонна просто берёт улицу, смеясь, вымазанная, останавливаясь там, где стена или телега удержит тело. Власть над этим местом худеет с каждой дверью, что остаётся закрытой."
 sbs_orgy.5100.a: "Пусть колонна идёт."
 sbs_orgy.5100.a.tt: "Шествие держит улицу, пока деревня не увидит достаточно. Власть, что здесь останется, будет отвечать медленнее."
 sbs_orgy.5200.t: "Между камнями"
 sbs_orgy.5200.desc: "[sbs_orgy_guest_a.GetFirstName] и [sbs_orgy_guest_b.GetFirstName] уже выбрали плиту. Имена на камне старше нас. Трава между могилами примята там, где прошли другие пары."
 sbs_orgy.5200.female.desc: "Я на спине на стёртой надписи, один между колен, другой на коленях там, где я могу взять его в рот. Камень холоден под плечами. Каждый толчок стряхивает пыль с букв. Повернув голову, я читаю дату. Из-за этого они не останавливаются."
 sbs_orgy.5200.male.desc: "Одного я нагнул над наклонённым камнем, другого посадил на могилу у бедра, чтобы достать до обоих. Следы резца цепляют кожу. Венок со старых похорон смят под коленом. Место пахнет землёй и сексом на одном дыхании."
 sbs_orgy.5200.a: "Это осквернение."
 sbs_orgy.5200.a.tt: "Я снимаю нас с камня, пока не зашло дальше. Мёртвым это должно, даже если ночи — нет."
 sbs_orgy.5200.b: "Мёртвым всё равно."
 sbs_orgy.5200.b.tt: "Я держу обоих на могиле и кончаю там. Неправильность этого и есть жар."
 sbs_orgy.5300.t: "После долгого дня"
 sbs_orgy.5300.desc: "Стан с рассвета был одним долгим сплетением. Никто не надел одежду снова. Костры низки. Что осталось еды, лежит чуть в стороне, за подстилками, ещё мокрыми после последней пары."
 sbs_orgy.5300.body.desc: "Я пытаюсь встать — бёдра не хотят сомкнуться. Мышцы слишком долго держали раскрытыми; даже попытка тянет сырой болью в паху. Пролитое всё ещё медленно выходит из меня — сзади, из промежутка ног — и стынет на внутренней стороне бедра, не дойдя до колена.\n\n[sbs_orgy_guest.GetFirstName] смотрит на походку, которой у меня нет. Предложение простое. Он принесёт еду. Я подойду на четвереньках и залаю, когда он скажет."
 sbs_orgy.5300.a: "Съесть то, что уже есть."
 sbs_orgy.5300.a.tt: "Я собираю двумя пальцами то, что ещё выходит, и кладу в рот. Соль и жар. Это не еда. Этого довольно, чтобы не ползти."
 sbs_orgy.5300.b: "Встань на колени и лай."
 sbs_orgy.5300.b.tt: "Я опускаюсь на месте и даю ему звук, который он просил. Еда приходит. Достоинство — нет."
 sbs_orgy.5300.c: "Ползи к еде."
 sbs_orgy.5300.c.tt: "Я ползу к котлу на четвереньках, бёдра всё ещё раскрыты, след за мной до самой еды."
 sbs_orgy.5400.t: "Следующий костёр"
 sbs_orgy.5400.desc: "День не опустошил стан. Подстилки лежат, куда их спихнули. Женщины ходят между кострами, не одеваясь снова; утренняя работа на них ещё читается — блеск на внутренней стороне бедра, след на горле, походка, которая ещё не вспомнила, как быть обычной."
 sbs_orgy.5400.body.desc: "[sbs_orgy_guest.GetFirstName] не поднялась. Она лежит на расстеленном плаще, колени упали в стороны, слишком изведена, чтобы свести их; последнее пролитое всё ещё находит ткань под ней. Когда я подхожу, она не прикрывается. Спрашивает только, принесу ли я то, что осталось в котле."
 sbs_orgy.5400.a: "Принеси котёл."
 sbs_orgy.5400.a.tt: "Я приношу остаток и ставлю так, чтобы она достала. Она запомнит учтивость."
 sbs_orgy.5400.b: "Не раньше, чем возьму тебя снова."
 sbs_orgy.5400.b.tt: "Котёл может подождать. Я беру её, где лежит. Она позволяет. Она не благодарит."
 sbs_orgy.5400.c: "Накорми тем, что уже в ней."
 sbs_orgy.5400.c.tt: "Я ввожу два пальца, собираю то, что оставили другие мужчины, и кладу ей на язык. Она глотает, потому что иного почти нет. Она не забудет, кто её к этому принудил."

# 6400 extreme paddock
 sbs_orgy.6400.t: "Левада"
 sbs_orgy.6400.desc: "Левада под прямым солнцем. Ни шатра, ни ночи. Лошадей вывели на ту же вытоптанную землю, что и стан, и женщин поставили к ним."
 sbs_orgy.6400.body.desc: "[sbs_orgy_horse_girl.GetFirstName] не стала ждать второго приказа. Она на коленях в пыли, жеребец уже вогнан до корня. Ствол достаточно толст, чтобы живот поднимался и опускался вместе с ним — твёрдый гребень идёт под кожей при каждом шаге в неё.\n\nОстальных женщин гонят той же дорогой. Мужчины стоят у изгороди и смотрят. Кто-то смеётся. Конь — нет."
 sbs_orgy.6400.a: "Взять одного."
 sbs_orgy.6400.a.tt: "Я становлюсь на колени на солнце рядом с ней и даю следующему жеребцу взять меня. Этот размер остаётся в теле долго после того, как левада стихнет."
 sbs_orgy.6400.b: "Лучше услужить мужчинам."
 sbs_orgy.6400.b.tt: "Я оставляю лошадей тем, кто их хочет, и беру каждого мужчину у изгороди, одного за другим, с осторожностью. [sbs_orgy_horse_girl.GetFirstName] всё ещё под жеребцом, когда я кончаю."

