 asmodeus_adherent_plural: "incestyści"
 asmodeus_desc: "Incestyzm stawia rodzinę ponad wszystko, uświęcając nawet kazirodcze związki. Wierność rodowa waży więcej niż normy. Asmodeusz, demon żądzy i lojalności rodzinnej, prowadzi wyznawców do zacieśniania więzów poza granicami moralności."
 belial: "Scjentyzm"
 belial_adj: "scjentystyczny"
 belial_adherent: "scjentysta"
 belial_adherent_plural: "scjentyści"
 belial_desc: "Scjentyzm ściga wiedzę za wszelką cenę, nawet nieetycznymi metodami. Tylko nieograniczone odkrywanie daje prawdziwe oświecenie. Belial, przebiegły demon wiedzy i manipulacji, pcha wyznawców poza granice moralności."
