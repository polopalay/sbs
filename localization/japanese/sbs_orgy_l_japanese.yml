 sbs_private_orgy_guest: "客人"
 sbs_private_orgy_guest_an_a: "の"
 sbs_private_orgy_selection_tooltip: "選んだ相手を集め、酒と率直さと定かでない絆の私的な夜を過ごす。\\n\\n予想される報酬：\\n$BULLET_WITH_TAB$[stress_i] ストレス減少\\n$BULLET_WITH_TAB$新たな恋人\\n$BULLET_WITH_TAB$関係の改善"
 sbs_private_orgy_host_desc: "人目を忍ぶ客に扉を開き、夜に成り行きを任せる。"
 sbs_private_orgy_guest_desc: "気安い交わりと私語、そして夜が与えるものを求めて赴く。"
 sbs_orgy_conclusion_desc: "最後の灯が低く揺れる。ある者は心軽く、ある者はより近く、ある者は昼に隠すべき約束を抱いて去る。"
 sbs_private_orgy_phase: "乱交"
 sbs_private_orgy_cost_desc: "人目を忍ぶ私的な集まり"
 TRAVEL_NAME_FOR_sbs_private_orgy: "乱交への旅"
 sbs_private_orgy_province_desc: "好奇な目の届かぬ場所を選ぶ。"
 sbs_private_orgy_destination_selection: "乱交を開く場所を選ぶ。"
 sbs_private_orgy_guest_help_text: "$sbs_private_orgy_desc$"
 sbs_private_orgy_predicted_cost: "秘めごとと酒、そして進んで守られる沈黙には代価がある。"
 sbs_private_orgy_phase_desc: "扉が閉まる。堅苦しい作法もほどなく消える。"
 sbs_orgy_host_desc: "$BULLET_WITH_TAB$参加者は[stress_i]ストレスを失うことがある\\n$BULLET_WITH_TAB$参加者が恋人になることがある\\n$BULLET_WITH_TAB$関係が改善することがある"
 sbs_orgy_guest_desc: "$BULLET_WITH_TAB$[stress_i]ストレスを失うことがある\\n$BULLET_WITH_TAB$新たな恋人を見つけることがある"
 sbs_orgy_invite_rule_barony_rulers: "男爵領の統治者"
 sbs_orgy_option_focus: "乱交の規模"
 sbs_orgy_focus_small: "小規模な乱交"
 sbs_orgy_focus_small_desc: "$EFFECT_LIST_BULLET$ 最大 #V 20#! 人の客人\\n$EFFECT_LIST_BULLET$ 到着に #V 10日#!\\n$EFFECT_LIST_BULLET$ #V 3#! 回の逢瀬\\n\\n#weak 身近で親しい集まり。#!"
 sbs_orgy_focus_medium: "中規模な乱交"
 sbs_orgy_focus_medium_desc: "$EFFECT_LIST_BULLET$ 最大 #V 30#! 人の客人\\n$EFFECT_LIST_BULLET$ 到着に #V 20日#!\\n$EFFECT_LIST_BULLET$ #V 5#! 回の逢瀬\\n\\n#weak より広い輪と、活気ある夜。#!"
 sbs_orgy_focus_large: "大規模な乱交"
 sbs_orgy_focus_large_desc: "$EFFECT_LIST_BULLET$ 最大 #V 40#! 人の客人\\n$EFFECT_LIST_BULLET$ 到着に #V 30日#!\\n$EFFECT_LIST_BULLET$ #V 7#! 回の逢瀬\\n\\n#weak 家は満ち、自制の余地はほとんどない。#!"

 sbs_orgy.0002.t: "無人の館"
 sbs_orgy.0002.desc: "部屋は整っているのに、来るはずの客は現れない。灯は誰のためでもなく燃える。"
 sbs_orgy.0002.a: "灯を消せ。"

 sbs_orgy.1100.t: "密やかな合意"
 sbs_orgy.1100.desc: "[sbs_orgy_guest.GetFirstName]は肌の熱が届くほど近くに立つ。"
 # Female root + Male guest
 sbs_orgy.1100.fm.1.desc: "彼の手が腰に触れ、腰の線をなぞる。身を寄せると口が重なる。薄い布越しに、すでに硬い熱が掌に伝わる。"
 sbs_orgy.1100.fm.2.desc: "隙間がなくなるまで寄る。吐息が喉に温かい。片手は胸に、もう片手はその熱に触れるだけで、まだ先へは進まない。"
 sbs_orgy.1100.fm.3.desc: "壁に引き寄せられる。口が首に、それから唇に温かい。手が布越しに胸を包み、そこで待つ。"
 sbs_orgy.1100.fm.4.desc: "彼の手を腰へ、それから少し下へ導く。私の熱が伝わるところで止まる。彼が喉を鳴らす。次を決めた者はまだいない。"
 sbs_orgy.1100.fm.5.desc: "壁に押し付けられる。片手は胸を包み、もう片手は太ももの高い位置にあり、わずかな動きまで感じる。"
 sbs_orgy.1100.fm.6.desc: "身を寄せてゆっくり口づける。離れるとき、手はまだ帯にある。彼の指は髪に残り、押しも引きもしない。"
 sbs_orgy.1100.fm.7.desc: "親指が太ももの内側をなぞる。手を下ろし、布越しに握ると脈が掌に打つ。しばらくそのままいる。"
 sbs_orgy.1100.fm.8.desc: "低い寝椅子に倒れ、口を開き、手は迷い歩く。体が温かく重なる。次の一歩はまだ選択のままだ。"
 # Male root + Female guest
 sbs_orgy.1100.mf.1.desc: "手が腰を、それから太ももの熱を捉える。すでに息が速い。布越しに握られると、もう会話のふりはできない。"
 sbs_orgy.1100.mf.2.desc: "首筋へ、それから口へと顔を下げる。肌の匂いが鋭く澄んでいる。手は太ももの高い位置に留まる。"
 sbs_orgy.1100.mf.3.desc: "胸を下りて口づけ、それ以上に進む寸前で止まる。片手は太ももに、もう片手は帯の線をなぞる。"
 sbs_orgy.1100.mf.4.desc: "指が腿のあいだに触れ、すでに整っている熱を知る。空いた手が同じゆっくりした速さで布越しに撫でる。"
 sbs_orgy.1100.mf.5.desc: "ソファに押し倒され、膝の上に跨がれる。口が重なる。次の選択が自明なほど近い。"
 sbs_orgy.1100.mf.6.desc: "腰が触れるまで引き寄せる。熱く、拒まない。どこまで進むかを決める時を待つ。"
 sbs_orgy.1100.mf.7.desc: "手が私を包み、私の手は腿のあいだに残る。長いあいだそのままで、先へ進まず互いの拍を覚える。"
 sbs_orgy.1100.mf.8.desc: "目の前に跪き、見上げる。手が太ももに乗る。誘いは明白だ。決めるのはまだ私だ。"
 # Male + Male
 sbs_orgy.1100.mm.1.desc: "手が腰を、布越しの熱を捉える。同じ仕草を返す。口が開き、急がず重なる。"
 sbs_orgy.1100.mm.2.desc: "胸が触れるまで踏み込む。手が彼に触れると息が止まる。どちらもそれ以上には出ていない。"
 sbs_orgy.1100.mm.3.desc: "身を寄せて強く口づける。手は帯に残る。指は髪に残り、押しも引きもしない。"
 sbs_orgy.1100.mm.4.desc: "近く立つ。両手がいっせいに布の上を動く。あいだの狭い隙間はすでに熱すぎる。"
 sbs_orgy.1100.mm.5.desc: "向きを変え、背に身を寄せる。片手が回り込む。それ以上を決める前に、息を合わせて留まる。"
 sbs_orgy.1100.mm.6.desc: "口が喉へ、それからさらに下へ降りて止まる。手をその首筋に置く。次はまだ選択だ。"
 sbs_orgy.1100.mm.7.desc: "手が布と肌の上を揃って動く。彼が身を預ける。どちらもまだ何も終えていない。"
 sbs_orgy.1100.mm.8.desc: "額が触れる。手はその場に残る。夜はまだ開いている。"
 # Female + Female
 sbs_orgy.1100.ff.1.desc: "手が腰に、温かい太ももの肌に触れる。同じ動きが返る。互いの拍を覚えながら留まる。"
 sbs_orgy.1100.ff.2.desc: "口を喉へ、それから唇へ下げる。手が首筋に触れ、無理なく導く。"
 sbs_orgy.1100.ff.3.desc: "ソファに押し倒され、膝の上に跨がれる。口が重なる。身を寄せると腿が締まる。"
 sbs_orgy.1100.ff.4.desc: "指が腿のあいだに触れ、すでに熱い。同じ仕草が返る。部屋は静かな息で満ちる。"
 sbs_orgy.1100.ff.5.desc: "横になり密着し、口は互いの喉にある。拍は遅い。急ぐ者はいない。"
 sbs_orgy.1100.ff.6.desc: "再び口づけると震える。開いたまま待つ時間が少し続き、それから先を選ぶ。"
 sbs_orgy.1100.ff.7.desc: "手が腿のあいだに触れ、口は喉に残る。すでに双方が熱い。残りはまだ選択だ。"
 sbs_orgy.1100.ff.8.desc: "震えるまで口づける。手は腰と太ももに残る。それ以上はまだ決まっていない。"
 # Options - more detailed
 sbs_orgy.1100.a: "間に何も置くまい。"
 sbs_orgy.1100.a.tt: "引き寄せ、何も隔てず、肌と肌で受け入れる。もはや触れ合いだけだったとは、どちらも言えなくなるまで。"
 sbs_orgy.1100.b: "備えなくしてはいけない。"
 sbs_orgy.1100.b.tt: "まず備えを。それから、震える場所を一つずつ、急がずに辿る。"
 sbs_orgy.1100.c: "今夜だけで終わらせるな。"
 sbs_orgy.1100.c.tt: "備えをもって受け入れ、次の夜の話をする。またこの体を知りたい。"
 sbs_orgy.1100.e: "愛は何を求めるだろう。"
 sbs_orgy.1100.e.tt: "手を止めたまま、愛の話をする。答えが危うくても。"

 # Dirty talk (khẩu dâm) - gender variants
 sbs_orgy.1100.d_fm: "どうしてほしいか、言え。"
 sbs_orgy.1100.d_fm.tt: "どう使いたいか、はっきり言え。手がまだ腿の間にあるうちに。"
 sbs_orgy.1100.d_mf: "何が欲しいか、言え。"
 sbs_orgy.1100.d_mf.tt: "何をしてほしいか言え。指がまだ中にあるうちに、すべて聞かせてくれ。"
 sbs_orgy.1100.d_mm: "どれほど強く欲しいか、言え。"
 sbs_orgy.1100.d_mm.tt: "どれほど強く欲しいか言え。撫でている間に、口と手に何をさせたいか話せ。"
 sbs_orgy.1100.d_ff: "どこにしてほしいか、言え。"
 sbs_orgy.1100.d_ff.tt: "口と指をどこに欲しいか、はっきり言え。触れている間に、その言葉を聞きたい。"

 # Mutual fondling / mutual masturbation
 sbs_orgy.1100.f_fm: "手だけでいい。"
 sbs_orgy.1100.f_fm.tt: "腿の間で動く指に応え、手で相手を扱き、二人とも果てるまで。"
 sbs_orgy.1100.f_mf: "手だけでいい。"
 sbs_orgy.1100.f_mf.tt: "指を中に残したまま、ゆっくり扱かせ、どちらも耐えきれなくなるまで。"
 sbs_orgy.1100.f_mm: "手だけでいい。"
 sbs_orgy.1100.f_mm.tt: "同じ速さで互いを扱い、反応を見ながら、二人とも果てるまで。"
 sbs_orgy.1100.f_ff: "手と口だけでいい。"
 sbs_orgy.1100.f_ff.tt: "互いに触れ、濡れ、震えるまで。それ以上はしない。"





 sbs_orgy.1200.t: "三人の場"
 sbs_orgy.1200.desc: "[sbs_orgy_guest_a.GetFirstName]と[sbs_orgy_guest_b.GetFirstName]が静かな隅に来る。三人のあいだの空気はすでに熱い。"
 sbs_orgy.1200.male.desc: "両側から体が寄る。手が腕、腰、衣の端を掠める。口が喉と唇を探す。熱く未完のまま、誰が選ばれるかを待つ。"
 sbs_orgy.1200.female.desc: "両側から体が寄る。手が腕、腰、衣の端を掠める。口が喉と唇を探す。熱く未完のまま、誰が選ばれるかを待つ。"
 sbs_orgy.1200.a: "[sbs_orgy_guest_a.GetFirstName]だけだ。"
 sbs_orgy.1200.a.tt: "[sbs_orgy_guest_a.GetFirstName]を引き寄せる。今夜は一つの体だけでいい。"
 sbs_orgy.1200.b: "[sbs_orgy_guest_b.GetFirstName]だけだ。"
 sbs_orgy.1200.b.tt: "[sbs_orgy_guest_b.GetFirstName]を引き寄せる。今夜は一つの体だけでいい。"
 sbs_orgy.1200.c: "三人、ともに。"
 sbs_orgy.1200.c.tt: "誰も外に置かない。手と口が行き交い、快楽が誰のものか分からなくなるまで。"
 sbs_orgy.1200.d: "欲を口にしよう。"
 sbs_orgy.1200.d.tt: "手がまだ彷徨ううちに、それぞれが欲しいものをはっきり言う。"
 sbs_orgy.1200.e: "二人を互いに向かわせよ。"
 sbs_orgy.1200.e.tt: "二人を向かい合わせ、見える距離に残る。交わるのは彼らの体で、私のは入らずともよい。"

 sbs_orgy.4100.t: "裸の王冠"
 sbs_orgy.4100.desc: "[sbs_orgy_nudity_guest.GetFirstName]が丁寧に問う。統治者が衣なく現れることが多いなら、民は同じ敬意で見られるのか。"
 sbs_orgy.4100.male.desc: "灯の下に完全に裸で立つ。肩を開き、多くの視線の下で物が柔らかく、やがて太くなる。隠す仕草はしない。筋の線も股の重さも見させろ。"
 sbs_orgy.4100.female.desc: "灯の下に完全に裸で立つ。肩を開き、胸も腿のあいだの柔らかい三角もすべての目に開く。隠す仕草はしない。曲線も集まり始めた湿りも見させろ。"
 sbs_orgy.4100.a: "見たい者は見よ。"
 sbs_orgy.4100.a.tt: "ふさわしい体に幕は要らない。ゆっくり回り、どの角度も見せる。"
 sbs_orgy.4100.b: "その無垢を尊べ。"
 sbs_orgy.4100.b.tt: "エデンのアダムとイヴに恥はなかった。開いた手と開いた体で、その無垢を尊ぶ。"
 sbs_orgy.4100.c: "光に決めさせよ。"
 sbs_orgy.4100.c.tt: "衣は美を隠すためだけにあるべきではない。引き立てるためのものだ。"
 sbs_orgy.4100.d: "問いには答えぬ。"
 sbs_orgy.4100.d.tt: "謎には答えない。このままで立ち、部屋がその光景に慣れるまで待つ。"

 sbs_orgy.4200.t: "最も美しい姿"
 sbs_orgy.4200.desc: "不用意な賛辞が勝負になる。少なくとも五人が灯の下に立ち、誰の姿がいちばんの賛辞に値するかを座が決める。"
 sbs_orgy.4200.male.desc: "他者のあいだに完全に裸で立つ。光の下で筋が動き、物は晒される。番が来るとゆっくり回り、体の線と股の重さをすべての目に測らせる。"
 sbs_orgy.4200.female.desc: "他者のあいだに完全に裸で立つ。胸も腰も腿のあいだの柔らかい襞も裁きに開く。番が来るとゆっくり回り、曲線とすでに見える湿りをすべての目に測らせる。"
 sbs_orgy.4200.a: "力を見せよ。"
 sbs_orgy.4200.a.tt: "部屋が静まるまで、その構えを崩さない。"
 sbs_orgy.4200.b: "色香で勝つ。"
 sbs_orgy.4200.b.tt: "微笑み、身を翻し、見るに値するのは自分だと部屋に決めさせる。"
 sbs_orgy.4200.c: "巧みな構え。"
 sbs_orgy.4200.c.tt: "視線が集まる程度に、ほんの少し身をずらす。"
 sbs_orgy.4200.d: "勝負を役に立てよ。"
 sbs_orgy.4200.d.tt: "いちばん近い体を引き寄せ、勝負を別のことに使う。"

 sbs_orgy.2100.t: "馴染みの居心地の悪さ"
 sbs_orgy.2100.desc: "部屋の自由にもかかわらず、[sbs_orgy_guest.GetFirstName]と私はためらう。血は、ある沈黙を他より重くする。"
 sbs_orgy.2100.fm.desc: "成人した子が裸で前に立つ。かつては考えられなかった同じ血が、熱をより鋭くするだけだ。手が腰に触れ、私の手は硬い長さを捉える。"
 sbs_orgy.2100.mf.desc: "成人した娘が裸で前に立つ。同じ血が熱をより鋭くするだけだ。手が腿のあいだの柔らかい襞を探し、すでに濡れている。"
 sbs_orgy.2100.mm.desc: "成人した息子が裸で前に立つ。同じ血が熱をより鋭くするだけだ。手が同時に互いを握る。"
 sbs_orgy.2100.ff.desc: "成人した娘が裸で前に立つ。同じ血が熱をより鋭くするだけだ。手が互いの腿のあいだを滑り、同じ濡れた用意を見つける。"
 sbs_orgy.2100.a: "間に何も置くまい。"
 sbs_orgy.2100.a.tt: "何も隔てず受け入れる。肌と肌、血と血。もはや近しさだけだとは言えなくなるまで。"
 sbs_orgy.2100.b: "備えなくしてはいけない。"
 sbs_orgy.2100.b.tt: "まず備えを。夜は密かなままでよい。無謀にはしない。"
 sbs_orgy.2100.c: "朝を越えて残るように。"
 sbs_orgy.2100.c.tt: "結びは恥ではなく聖なるものだ。朝を越えて残るものに、この夜をする。"
 sbs_orgy.2100.d: "手と口だけだ。"
 sbs_orgy.2100.d.tt: "手と口にとどめる。味わうには近く、境界を忘れるほど遠くはない。"
 sbs_orgy.2100.e: "ここまでだ。先は行くまい。"
 sbs_orgy.2100.e.tt: "熱が先に決める前に退く。今夜、血は境界のままだ。"

 sbs_orgy.2200.t: "婚姻の縁で"
 sbs_orgy.2200.desc: "[sbs_orgy_guest.GetFirstName]は[sbs_orgy_child.GetFirstName]を通じて家に入った。今夜、その馴染みの縁は昼より単純ではない。"
 sbs_orgy.2200.fm.desc: "子の配偶者が近く立つ。家を結ぶ婚姻が今夜は薄い。手が腰に触れ、すでに整っている熱が分かる。"
 sbs_orgy.2200.mf.desc: "子の配偶者が近く立つ。婚姻が今夜は薄い。指が腿のあいだの柔らかい熱を探し、彼女は退かない。"
 sbs_orgy.2200.mm.desc: "子の夫が近く立つ。婚姻が薄い。言葉もなく手が互いを握る。"
 sbs_orgy.2200.ff.desc: "子の妻が近く立つ。婚姻が薄い。手が互いの腿のあいだを滑り、同じ濡れた熱を見つける。"
 sbs_orgy.2200.a: "間に何も置くまい。"
 sbs_orgy.2200.a.tt: "昼ならば彼らのものと呼ばれるものを取る。間にあるのは、この瞬間の熱だけだ。"
 sbs_orgy.2200.b: "備えなくしてはいけない。"
 sbs_orgy.2200.b.tt: "備えを一つ。続く契りではなく、一夜にとどめる。"
 sbs_orgy.2200.c: "傍にいろ。それ以上はするな。"
 sbs_orgy.2200.c.tt: "温もりと彷徨う手にとどめる。婚姻は口にもせず、越えもしない。"
 sbs_orgy.2200.d: "婚姻の話をしよう。"
 sbs_orgy.2200.d.tt: "契りを口に出す。[sbs_orgy_child.GetFirstName]の話をして、熱の行き場を変える。"

 sbs_orgy.2300.t: "友情の証"
 sbs_orgy.2300.desc: "友人、あるいは最も近い友が近く立つ。古い信頼がもう一つの体のようにあいだにある。今夜、別のものになりうる。"
 sbs_orgy.2300.fm.desc: "友の肌の熱が届くほど近い。長年の信頼が最初の触れを易しくする。撫でるうちに掌に硬くなり、指はすでに濡れた私を見つける。"
 sbs_orgy.2300.mf.desc: "友の肌の熱が届くほど近い。長年の信頼が最初の触れを易しくする。指が腿のあいだを滑り濡れているのを知り、答えに握られる。"
 sbs_orgy.2300.mm.desc: "友の肌の熱が届くほど近い。長年の信頼が最初の触れを易しくする。同じ遅い速さで撫で合い、反応を見る。"
 sbs_orgy.2300.ff.desc: "友の肌の熱が届くほど近い。長年の信頼が最初の触れを易しくする。手と口が互いの腿のあいだを動き、双方が震えるまで続く。"
 sbs_orgy.2300.a: "こうして示せ。"
 sbs_orgy.2300.a.tt: "隔てなく受け入れ、積み重ねた信頼を熱に変える。"
 sbs_orgy.2300.b: "備えなくしてはいけない。"
 sbs_orgy.2300.b.tt: "備えを一つ。信頼の歳月は熱になる。永い主張にはしない。"
 sbs_orgy.2300.c: "友以上だ。"
 sbs_orgy.2300.c.tt: "備えをもって受け入れ、古い信頼を恋人の契りにする。"
 sbs_orgy.2300.d: "始まりを思い出せ。"
 sbs_orgy.2300.d.tt: "昔の夜と、楽だった日々の話をする。手は動かさない。友情で足りる。"

 sbs_orgy.2400.t: "密室の休戦"
 sbs_orgy.2400.desc: "ライバルが狭い空間の向こうに立つ。憎しみはいつも親密さの一種だった。今夜、あいだの空気は別のものを帯びる。"
 sbs_orgy.2400.fm.desc: "ライバルの手はついに触れたとき粗い。かつて折ろうとした同じ怒りが、今は開かせたがる。腿に硬い熱が触れ、古い憎しみが熱に緩む。"
 sbs_orgy.2400.mf.desc: "ライバルの体はついに触れたとき張り詰めている。同じ怒りが指の下で開く。口づける前から濡れている。"
 sbs_orgy.2400.mm.desc: "ライバルの握りは手がついに会ったとき強い。同じ怒りが掌に厚くなる。古い争いの激しさで撫で合う。"
 sbs_orgy.2400.ff.desc: "ライバルの息は手がついに会ったとき鋭い。同じ怒りが指の下で濡れる。古い争いの激しさで触れ合う。"
 sbs_orgy.2400.a: "こうして終わらせよ。"
 sbs_orgy.2400.a.tt: "敵対をこの体に受け入れる。終われば、憎しみは残らないかもしれない。"
 sbs_orgy.2400.b: "折れてやれ。"
 sbs_orgy.2400.b.tt: "折れる。争いが果たせなかった終わりを、降伏に託す。"
 sbs_orgy.2400.c: "お前とはするまい。"
 sbs_orgy.2400.c.tt: "古い憎しみはそのまま置く。払う肌に見合う休戦など、そう多くはない。"

 sbs_orgy.2500.t: "今夜、称号はなし"
 sbs_orgy.2500.desc: "封臣がいる。位階は残るが、衣はなく夜は長い。権力は脇へ置くことも、別の使い方もできる。"
 sbs_orgy.2500.fm.desc: "封臣は私が選べば跪き、あるいは立つ。かつて忠誠を誓った同じ口が今は開く。奉仕の果てを決めるあいだ、掌にその熱を感じる。"
 sbs_orgy.2500.mf.desc: "封臣は己の分を知る者の静けさで待つ。指が腿のあいだの柔らかい熱を探し、目を逸らさない。位階は濡れて眼前のものになる。"
 sbs_orgy.2500.mm.desc: "封臣は己の分を知る者の静けさで待つ。手を閉じると忠誠が熱に変わる。慣れ、慎重な動きで撫で返す。"
 sbs_orgy.2500.ff.desc: "封臣は己の分を知る者の静けさで待つ。指が腿のあいだを滑り、用意を知る。同じ触れが返り、位階は共有の濡れた熱に溶ける。"
 sbs_orgy.2500.a: "備えなくしてはいけない。"
 sbs_orgy.2500.a.tt: "位階は待てる。備えののち、家臣が差し出せるものを取る。"
 sbs_orgy.2500.b: "跪け。"
 sbs_orgy.2500.b.tt: "跪かせ、口と手を使い、統治の重みが和らぐまで。"
 sbs_orgy.2500.c: "代を言え。"
 sbs_orgy.2500.c.tt: "位が命じるべきでないものに金を出す。夜は買った条件で続く。"
 sbs_orgy.2500.d: "触れながら話せ。"
 sbs_orgy.2500.d.tt: "政と近しさを同じ息で話す。手は彷徨う。それ以上は要らない。"

 sbs_orgy.2600.t: "馴染みの約束"
 sbs_orgy.2600.desc: "配偶者がいる。馴染みの体、知った触れ。慰めと欲望が同じ分量で。"
 sbs_orgy.2600.fm.desc: "夫の体は我が身と同じほど知っている。いつもどおり手に収まる。今夜、馴染みは熱を深めるだけだ。"
 sbs_orgy.2600.mf.desc: "妻の体は我が身と同じほど知っている。腿のあいだの柔らかい襞はいつもどおり指に開く。今夜、馴染みは熱を深めるだけだ。"
 sbs_orgy.2600.mm.desc: "夫の体は我が身と同じほど知っている。長い慣れの易しさで撫で合い、何年経ても熱は鋭い。"
 sbs_orgy.2600.ff.desc: "妻の体は我が身と同じほど知っている。手と口が長い慣れの易しさで腿のあいだを動き、何年経ても熱は鋭い。"
 sbs_orgy.2600.a: "いつものように。"
 sbs_orgy.2600.a.tt: "配偶者をいつものように受け入れ、見知った快楽に任せる。"
 sbs_orgy.2600.b: "別の者を探せ。"
 sbs_orgy.2600.b.tt: "見知った体から離れ、見知らぬ熱を探す。"

 sbs_orgy.2700.t: "快楽より政務"
 sbs_orgy.2700.desc: "宴が続くなか、[sbs_orgy_guest.GetFirstName]が私を見つける。どちらも呼ばぬまま、評定が始まる。"
 sbs_orgy.2700.a: "まず国を。"
 sbs_orgy.2700.a.tt: "祭りが続く傍らで、職と未完の仕事を話す。"
 sbs_orgy.2700.b: "愛は何を求めるだろう。"
 sbs_orgy.2700.b.tt: "政務は待てる。いつも国の話をする二人に、愛は何をするか問う。"
 sbs_orgy.2700.c: "欲を口にしよう。"
 sbs_orgy.2700.c.tt: "欲しいものをはっきり名指す。手は動かさない。話だけで夜は軽くなる。"

 sbs_orgy.2800.t: "封臣の家"
 sbs_orgy.2800.desc: "[sbs_orgy_guest.GetFirstName]は我が封臣[sbs_orgy_vassal_spouse_owner.GetFirstName]の家の者だ。忘れにくい事実だが、どちらも去らない。"
 sbs_orgy.2800.fm.desc: "封臣の配偶者が近く立つ。守るはずの家の縁が薄い。手が握るうちに硬くなり、配偶者の名は言われぬままあいだに残る。"
 sbs_orgy.2800.mf.desc: "封臣の配偶者が近く立つ。家の縁が薄い。指はすでに濡れを知り、配偶者の名は言われぬままあいだに残る。"
 sbs_orgy.2800.mm.desc: "封臣の夫が近く立つ。家の縁が薄い。配偶者の名は言われぬまま、撫で合う。"
 sbs_orgy.2800.ff.desc: "封臣の妻が近く立つ。家の縁が薄い。配偶者の名は言われぬまま、手が腿のあいだを動く。"
 sbs_orgy.2800.a: "慎重な秘め事。"
 sbs_orgy.2800.a.tt: "備えののち、家臣の配偶者を受け、この夜を秘め事にする。"
 sbs_orgy.2800.b: "間に何も置くまい。"
 sbs_orgy.2800.b.tt: "何も隔てず受け入れる。家の契りは扉の外に置く。"
 sbs_orgy.2800.c: "扉は開けておけ。"
 sbs_orgy.2800.c.tt: "備えをもって受け入れ、扉は開けておく。灯が消えても、ここで終わらせる必要はない。"
 sbs_orgy.2800.d: "[sbs_orgy_vassal_spouse_owner.GetFirstName]を呼べ。"
 sbs_orgy.2800.d.tt: "[sbs_orgy_vassal_spouse_owner.GetFirstName]を呼び、二人を合わせる。私のために演じ、どちらも収め方に満足して去る。見守り、整える負担は、彼らより私のほうが大きい。"
 sbs_orgy.2800.e: "話で足りる。"
 sbs_orgy.2800.e.tt: "今は話すだけでも十分に物議だ。手は動かさない。"

 sbs_orgy.2900.t: "位階の上で"
 sbs_orgy.2900.desc: "正式の広間を離れても[sbs_orgy_guest.GetFirstName]はなお主君だが、このような部屋では位階は確かさを失う。"
 sbs_orgy.2900.fm.desc: "主君は位階がなお重いはずなほど近い。もはや重くない。手が腿のあいだの熱を探し、私は硬い長さを握る。"
 sbs_orgy.2900.mf.desc: "主君は位階がなお重いはずなほど近い。もはや重くない。指が腿のあいだの熱を探し、答えに握られる。"
 sbs_orgy.2900.mm.desc: "主君は位階がなお重いはずなほど近い。もはや重くない。手が同時に互いを握り、序列はただの熱に溶ける。"
 sbs_orgy.2900.ff.desc: "主君は位階がなお重いはずなほど近い。もはや重くない。手が互いの腿のあいだを滑り、同じ濡れた用意を見つける。"
 sbs_orgy.2900.a: "位階は脇へ置け。"
 sbs_orgy.2900.a.tt: "備えをもって主君を受け、夜をただの体にする。"
 sbs_orgy.2900.b: "連れには代がある。"
 sbs_orgy.2900.b.tt: "言葉と技で身を差し出し、その特権に代を求める。"
 sbs_orgy.2900.b.success: "条件は通った。夜は私の定めどおり続く。"
 sbs_orgy.2900.b.failure: "主君は動かない。位階が再び立ちはだかる。"
 sbs_orgy.2900.c: "言葉だけにしましょう、主君。"
 sbs_orgy.2900.c.tt: "今回はただ話す。手は動かさない。上下は崩さない。"

 sbs_orgy.2920.t: "縛られた客人"
 sbs_orgy.2920.desc: "[sbs_orgy_guest.GetFirstName]は命じられることに慣れた者の静けさで待つ。今夜、その服従に答える道はいくつかある。"
 sbs_orgy.2920.fm.desc: "奴隷は待つ。言葉を出せば跪く。口が開き、手はその硬い長さを握る。首輪か印か、所有そのものが触れを重くする。"
 sbs_orgy.2920.mf.desc: "奴隷は待つ。言葉を出せば跪き、あるいは開く。指が腿のあいだの熱を探し、目を逸らさない。首輪か印か、所有そのものが触れを重くする。"
 sbs_orgy.2920.mm.desc: "奴隷は待つ。言葉を出せば跪く。命令と服従の明瞭さで撫で合う。首輪か印か、所有そのものが触れを重くする。"
 sbs_orgy.2920.ff.desc: "奴隷は待つ。言葉を出せば跪き、あるいは開く。命令と服従の明瞭さで手が腿のあいだを動く。首輪か印か、所有そのものが触れを重くする。"
 sbs_orgy.2920.a: "口で仕えよ。"
 sbs_orgy.2920.a.tt: "跪かせる。口と手が動き、命じる重みが和らぐまで。"
 sbs_orgy.2920.b: "見慣れぬ命令だ。"
 sbs_orgy.2920.b.tt: "いつもの勤めとは無縁の命令を出し、従うさまを見る。"
 sbs_orgy.2920.c: "こっちへ来い。"
 sbs_orgy.2920.c.tt: "これ以上の儀は要らない。備えののち、今夜の誰かと同じように受け入れる。"
 sbs_orgy.2920.d: "今夜はよそう。"
 sbs_orgy.2920.d.tt: "座れ、息を整えよと言う。命令ではなく憐れみだ。首輪は待てる。"


# Contest localization

# 3100 - Contest of Mouths
 sbs_orgy.3100.t: "口の勝負"
 sbs_orgy.3100.desc: "誰かが技の勝負を求める。志願者が順に進み、物を口に含む。最も深く、最も長く離さず保てる者が賭け金を得る。"
 sbs_orgy.3100.male.desc: "番が来ると跪き、差し出された物を口に含む。初めはゆっくり、それから深く。部屋が每一寸の消失を見、喉は満ち、目は潤む。"
 sbs_orgy.3100.female.desc: "番が来ると跪き、差し出された物を口に含む。初めはゆっくり、それから舌と喉で深く。どこまで行くかを部屋に見せる。"
 sbs_orgy.3100.a: "挑みを受けよ。"
 sbs_orgy.3100.a.tt: "この口が何をできるか、見せてやる。"
 sbs_orgy.3100.a.success: "誰より深く、誰より長く堪える。静かな拍手の中、賭け金が手に渡る。"
 sbs_orgy.3100.a.failure: "より巧みな者がいた。望んだ威厳もなく、一歩退く。"
 sbs_orgy.3100.b: "見るだけだ。"
 sbs_orgy.3100.b.tt: "見る側に残り、別の口に賭け金を譲る。"

# 3200 - Who Lasts the Longest
 sbs_orgy.3200.t: "最も長く持つ者"
 sbs_orgy.3200.desc: "新たな勝負が呼ばれる。組が作られ、課題は単純だ。果てずに可能な限り続ける。部屋が見守り、分を数える。"
 sbs_orgy.3200.male.desc: "意に沿う相手を下に取る。規則は明らかだ。拍を保ち、突き続け、他の組が折れるまで果てない。部屋が分ごとに声を上げて数える。"
 sbs_orgy.3200.female.desc: "意に沿う相手を中に取る。規則は明らかだ。動きを保ち、拍を守り、他の組が折れるまで果てない。部屋が分ごとに声を上げて数える。"
 sbs_orgy.3200.a: "挑みを受けよ。"
 sbs_orgy.3200.a.tt: "相手を取る。どれほど持つか、部屋に見せる。"
 sbs_orgy.3200.a.success: "どの組より長く持つ。賭け金と、部屋の静かな羨みがこちらへ来る。"
 sbs_orgy.3200.a.failure: "他より先に果てる。部屋はすぐに気づく。"
 sbs_orgy.3200.b: "見るだけだ。"
 sbs_orgy.3200.b.tt: "見る側に残り、他の組に時を競わせる。"

# 3300 - The Most Rounds
 sbs_orgy.3300.t: "最も多い回り"
 sbs_orgy.3300.desc: "誰かが賭けを上げる。今の課題は持久だ。止まる前に何人取れるか。欺けぬよう声に出して数える。"
 sbs_orgy.3300.male.desc: "意に沿う相手から次へ移る。果てるたび、再開できるほどだけ休み、また始める。部屋が回りごとに数を呼ぶ。"
 sbs_orgy.3300.female.desc: "意に沿う相手を次々に取る。中で、あるいは上で果てるたび、次がすでに待っている。部屋が回りごとに数を呼ぶ。"
 sbs_orgy.3300.a: "挑みを受けよ。"
 sbs_orgy.3300.a.tt: "何人まで受けられるか、数えさせよ。"
 sbs_orgy.3300.a.success: "誰より多くの相手を受けてから止まる。賭け金はこちらだ。"
 sbs_orgy.3300.a.failure: "より執拗な者がいた。最多の数は私ではない。"
 sbs_orgy.3300.b: "見るだけだ。"
 sbs_orgy.3300.b.tt: "部屋と一緒に数え、回りはより飢えた者に譲る。"

# 3400 - Who Breaks First
 sbs_orgy.3400.t: "先に折れる者"
 sbs_orgy.3400.desc: "より静かな勝負が提案される。志願者が横たわり、巧みな手と口が働く。規則は単純だ。果てるな。先に折れた者が負ける。"
 sbs_orgy.3400.male.desc: "横たわり、巧みな手と口に身を任せる。息も震えも見守られる。先に果てた者が賭け金を失う。"
 sbs_orgy.3400.female.desc: "横たわり、巧みな手と口に腿のあいだを任せる。息も震えも見守られる。先に果てた者が賭け金を失う。"
 sbs_orgy.3400.a: "挑みを受けよ。"
 sbs_orgy.3400.a.tt: "折れるかどうか、試させよ。"
 sbs_orgy.3400.a.success: "誰より長く持つ。賭け金と、部屋の静かな敬意がこちらへ来る。"
 sbs_orgy.3400.a.failure: "いちばん先に果てる。部屋にははっきり見える。"
 sbs_orgy.3400.b: "触れる側に回る。"
 sbs_orgy.3400.b.tt: "手と口で別の者を扱い、耐えの勝負は向こうに任せる。"

# 3500 - Contest of Tongues
 sbs_orgy.3500.t: "舌の勝負"
 sbs_orgy.3500.desc: "誰かが別の勝負を求める。志願者が順に差し出された腿のあいだへ口を下げる。最も長く留まり、相手から最も多く引き出せる者が賭け金を得る。"
 sbs_orgy.3500.male.desc: "番が来ると差し出された腿のあいだへ口を下げ、集中して働く。舌と唇が動き、巧さと滞在の長さを部屋が耳にする。"
 sbs_orgy.3500.female.desc: "番が来ると差し出された腿のあいだへ口を下げ、集中して働く。舌と唇が動き、巧さと滞在の長さを部屋が耳にする。"
 sbs_orgy.3500.a: "挑みを受けよ。"
 sbs_orgy.3500.a.tt: "この口が何をできるか、見せてやる。"
 sbs_orgy.3500.a.success: "誰より長く留め、相手からより多くの声を引き出す。賭け金が手に渡る。"
 sbs_orgy.3500.a.failure: "より巧みな者がいた。望んだ威厳もなく、一歩退く。"
 sbs_orgy.3500.b: "見るだけだ。"
 sbs_orgy.3500.b.tt: "見る側に残り、別の舌に賭け金を譲る。"

# Heavy / extreme localization

# 6100 - Female alone with animal
 sbs_orgy.6100.t: "別種の客人"
 sbs_orgy.6100.desc: "扉がいつもより大きく開く。大きく温かいものが太い縄で部屋に導かれる。他の客人は黙り、後ずさる。"
 sbs_orgy.6100.horse.desc: "強い馬が前に出され、すでに股のあいだで硬く重い。四つん這いでその下へ導かれる。獣が乗ると大きさだけで長く壊れた呻きが喉から出る。深い突きのたび開かれ、床にしがみつき叫ぶほかない。"
 sbs_orgy.6100.dog.desc: "大きな犬が前に出され、喘ぎ、すでに滴る。躊躇なく後ろから乗り、腰を速く鋭く打つ。濡れた音と低い唸りが部屋を満たし、重みの下で呻く。"
 sbs_orgy.6100.pig.desc: "重い猪が案内され、唸り、すでに滑る。乗ると太く鈍い形が一定の圧で入る。深い突きのたび生の獣声が喉から出て、その唸りと混ざり部屋に響く。"
 sbs_orgy.6100.a: "すべて受け入れよ。"
 sbs_orgy.6100.a.tt: "声を抑えられない。広がりと熱が過ぎる。呻きながら沈み、奥で果てるまで受け入れる。"
 sbs_orgy.6100.b: "押し返せ。"
 sbs_orgy.6100.b.tt: "大きすぎる。それ以上入る前に押し返し、床の上で喘ぎ、震える。"

# 6200 - Guest leads female root like an animal
 sbs_orgy.6200.t: "獣のように引かれて"
 sbs_orgy.6200.desc: "[sbs_orgy_guest.GetFirstName]が傍らの革紐を取り、持参の首輪につなぐ。四つん這いで這えと命じられるのを部屋は黙って見る。"
 sbs_orgy.6200.horse.desc: "命じられて吠え、犬のように床を濡らしたあと、[sbs_orgy_guest.GetFirstName]が馬を出す。四つん這いで下に置かれる。巨大な重みが背に乗り、太い長さが入り、紐は短く保たれる。"
 sbs_orgy.6200.dog.desc: "吠え、床を濡らしたあと、[sbs_orgy_guest.GetFirstName]が大きな犬を連れてくる。獣はすぐに乗り、強く速く突く。客は紐を張り、濡れた音と唸りが空気を満たす。"
 sbs_orgy.6200.pig.desc: "吠え、床を濡らしたあと、[sbs_orgy_guest.GetFirstName]が重い猪を連れてくる。鈍く太い形が一定の圧で入り、客は紐を短く保ち、每一寸が消えるのを見る。"
 sbs_orgy.6200.a: "従え、受け入れよ。"
 sbs_orgy.6200.a.tt: "四つん這いのまま命じられたとおり受け、広がりに呻き、中で果てるまで。"
 sbs_orgy.6200.b: "客人に乞え。"
 sbs_orgy.6200.b.tt: "[sbs_orgy_guest.GetFirstName]の前に向き直り跪き、獣ではなくその者に仕えさせてくれと乞う。"
 sbs_orgy.6200.c: "拒め。"
 sbs_orgy.6200.c.tt: "紐を引き千切り、立ち上がる。もはや付き合う気のある遊びではない。"

# 6300 - Female root leads a female guest like an animal
 sbs_orgy.6300.t: "私のペット"
 sbs_orgy.6300.desc: "革紐を取り、[sbs_orgy_guest.GetFirstName]につなぐ。這わせ、命じれば吠えさせ、調教された獣のように床を濡らすのを部屋が見る。"
 sbs_orgy.6300.horse.desc: "十分に務めさせると馬を出し、四つん這いで下に置く。重い獣が乗り、紐を短く保ち、深い突きのたび壊れた声が喉から出るのを見る。"
 sbs_orgy.6300.dog.desc: "十分に務めさせると大きな犬を連れてくる。熱を帯びて乗り、腰を速く打ち、紐を短く保ち動かぬよう強制する。"
 sbs_orgy.6300.pig.desc: "十分に務めさせると重い猪を連れてくる。太く鈍い形が入り、紐を握り、抑えきれぬ生の獣声を聞く。"
 sbs_orgy.6300.a: "押しつけて受けさせよ。"
 sbs_orgy.6300.a.tt: "奥で果てるまで動かさず、その特権に礼を言わせる。"
 sbs_orgy.6300.b: "手で報いてやれ。"
 sbs_orgy.6300.b.tt: "獣を止め、自分の手と口で報い、服従に報いる。"

# 3600 - Vaginal beer contest
 sbs_orgy.3600.t: "別種の祝杯"
 sbs_orgy.3600.desc: "居合わせた女が呼ばれる。強い酒の杯が床に置かれる。課題は明らかだ。手も口も使わず杯を保て。最も長く持った者が賭け金を得る。部屋の残りは誰が先に折れるかを待つ。"
 sbs_orgy.3600.a: "挑みを受けよ。"
 sbs_orgy.3600.a.tt: "杯の上に身を置き、他のどの女より長く持つと決める。"
 sbs_orgy.3600.a.success: "誰より長く持つ。勝ちを祝う拍手の中、賭け金が手に渡る。"
 sbs_orgy.3600.a.failure: "支えきれず、酒がこぼれる。部屋は容赦なく罰を決める。夜が終わる前に、居合わせた男が二人に順に及ぶ。"
 sbs_orgy.3600.b: "拒め。"
 sbs_orgy.3600.b.tt: "負ける代に見合う遊びなど、そう多くはない。"

# 1300-1400 indoor / 5100-5400 outdoor
 sbs_orgy.1300.t: "高き座"
 sbs_orgy.1300.desc: "主人の座はもう空いていない。二つの体がそれを占め、広間はその使い途をはっきり見ている。"
 sbs_orgy.1300.fm.desc: "彫りの座にまたがり、肘掛けが腿に当たる。沈むたびに木が鳴る。彼の手が腰を支え、下の広間は静まり返っている。"
 sbs_orgy.1300.mf.desc: "高き座の膝の上に彼女を置き、片手は腿の下、片手は彫りの肘掛けへ。広間の目の前で彼女は動く。この座はそのためにあるのではない。だからこそ、こうしている。"
 sbs_orgy.1300.mm.desc: "主人の座の膝の上、背を胸に預け、彫りの木が二人を噛む。動きは隠さない。この座の主は、あとで匂いを知るだろう。"
 sbs_orgy.1300.ff.desc: "玉座に彼女を置き、片腿を肘掛けにかけ、口は喉元へ、手は腿の間で動く。この座は裁きのためのものだった。今夜は、より濡れたものを載せている。"
 sbs_orgy.1300.a: "備えをもって座を取れ。"
 sbs_orgy.1300.a.tt: "備えを残したまま、座の上で果てる。広間は熱と同様、その礼儀も覚えるだろう。"
 sbs_orgy.1300.b: "别处を探せ。"
 sbs_orgy.1300.b.tt: "高き座は床ではない。玉座から下ろし、より静かな隅を探させる。"
 sbs_orgy.1400.t: "より柔かい部屋"
 sbs_orgy.1400.desc: "事はすでに始まっている。[sbs_orgy_guest.GetFirstName]がまだ身を寄せたまま、提案が来る。表向きの間を離れ、まっとうな床で終えよう、と。"
 sbs_orgy.1400.fm.desc: "通路で始めた遅い動きのまま、口が耳元にある。石より床のほうが背には優しい、と言う。尋ねながらも、動きは止めない。"
 sbs_orgy.1400.mf.desc: "片膝を台に、息を喉に受けている。床は扉一枚先だ。シーツと掛け金と、時間を欲しいと言う。答えを待つ間も、手は離れない。"
 sbs_orgy.1400.mm.desc: "壁に寄り、すでに半ばまで来ている。彼は寝室を示し、手は離さない。床なら長くいられる。広間に聞かせる必要もない。"
 sbs_orgy.1400.ff.desc: "彼女の腿がまだ私のに絡んでいる。欲しいのは床だ。閉ざした扉、枕、朝までいられる場所。選ぶまで、指はその場を動かない。"
 sbs_orgy.1400.a: "床へ行け。"
 sbs_orgy.1400.a.tt: "案内されるまま入り、急がずに終える。閉ざした扉は、広間より多くの温もりを買う。"
 sbs_orgy.1400.b: "玉座ではなぜいけない。"
 sbs_orgy.1400.b.tt: "高き座へ引き戻す。広間は見ていればよい。その図太さが肩を軽くし、相手も寄り道を許すほどには楽しんでいる。"
 sbs_orgy.1400.c: "このままでいい。"
 sbs_orgy.1400.c.tt: "别の部屋はいらない。今の速さを保ったまま、ここで終える。"
 sbs_orgy.5100.t: "村の行列"
 sbs_orgy.5100.desc: "乱交は野に留まらない。午前のうちに貧しい村へ溢れ、家々のあいだを素肌の列が、まだ高い日の下を進む。\n\n男が歩みを止めず戸口に放尿する。別の男は溝にしゃがみ、顔を上げない。誰かが井戸端でパン屋の女房を押さえ、裾はすでになく、抗いは熱より細い。子供は屋内へ引き込まれる。犬が吠える。神父がいれば、閉じる雨戸を見つけたはずだ。\n\n率いる者はいない。列はただ街路を取り、笑い、汚れ、壁や荷車が体を支えられる場所で止まる。閉じたままの扉の数だけ、この地の統御は薄くなる。"
 sbs_orgy.5100.a: "列を進めよ。"
 sbs_orgy.5100.a.tt: "村が見飽きるまで、行列は街路を占める。ここに残る統御は、しばらく鈍るだろう。"
 sbs_orgy.5200.t: "石のあいだで"
 sbs_orgy.5200.desc: "[sbs_orgy_guest_a.GetFirstName]と[sbs_orgy_guest_b.GetFirstName]はすでに一枚の石を選んでいる。刻まれた名は誰よりも古い。墓のあいだの草は、先に通った組に踏み倒されている。"
 sbs_orgy.5200.female.desc: "すり減った碑文の上に仰向けだ。一人は膝のあいだ、一人は口に含める位置に跪いている。石は肩の下で冷たい。突くたびに文字から埃が落ちる。顔を回せば年号が読める。それでも彼らは止まらない。"
 sbs_orgy.5200.male.desc: "傾いた石に一人を伏せ、もう一人を腰の横の墓に座らせ、両方へ手が届くようにする。鑿の跡が肌に引っかかる。古い葬送の花輪が膝の下で潰れている。土と交わりの匂いが、同じ息にある。"
 sbs_orgy.5200.a: "冒瀆だ。"
 sbs_orgy.5200.a.tt: "それ以上になる前に石から離す。夜が払わなくとも、死者にはそれだけの義理がある。"
 sbs_orgy.5200.b: "死者は気にすまい。"
 sbs_orgy.5200.b.tt: "二人を墓の上に残し、そこで終える。その正しからざること自体が熱だ。"
 sbs_orgy.5300.t: "長い一日のあと"
 sbs_orgy.5300.desc: "夜明けから営地は長い交わり一つだった。誰も衣を戻していない。火は弱い。残った食は少し離れたところ、直前の組でまだ濡れた寝所の向こうにある。"
 sbs_orgy.5300.body.desc: "立とうとしても腿が閉じない。長く開いたままの筋が、試みだけで鼠径を強く痛ませる。注がれたものがまだゆっくり出てくる。後ろから、腿のあいだから。膝に届く前に、内腿で冷える。\n\n[sbs_orgy_guest.GetFirstName]はその歩けぬさまを見ている。条件は短い。食は運ぶ。四つん這いで来い。命じたら吠えろ。"
 sbs_orgy.5300.a: "すでに持っているものを食え。"
 sbs_orgy.5300.a.tt: "まだ出ているものを二本の指に集め、口へ運ぶ。塩と熱だ。食事ではない。四つん這いにならずに済む程度には足りる。"
 sbs_orgy.5300.b: "跪いて吠えよ。"
 sbs_orgy.5300.b.tt: "その場に膝をつき、求められた声を出す。食は来る。尊厳は来ない。"
 sbs_orgy.5300.c: "食まで這え。"
 sbs_orgy.5300.c.tt: "四つん這いで鍋へ向かう。腿はまだ開き、跡が食まで続く。"
 sbs_orgy.5400.t: "次の火"
 sbs_orgy.5400.desc: "日は営地を空にしていない。寝所は蹴られた場所に残る。女たちは衣を戻さず火から火へ歩く。朝の仕事がまだ残っている。内腿の光、喉の痕、まだ普通の歩きを思い出していない足取り。"
 sbs_orgy.5400.body.desc: "[sbs_orgy_guest.GetFirstName]は起きていない。広げた外套の上に膝を左右へ倒し、閉じる力もなく、最後に残ったものが下の布へ染みている。近づいても隠さない。鍋に残ったものを取って来るか、とだけ聞く。"
 sbs_orgy.5400.a: "鍋を持って来い。"
 sbs_orgy.5400.a.tt: "残りを取り、手が届くところへ置く。その礼儀は覚えている。"
 sbs_orgy.5400.b: "もう一度取るまでだ。"
 sbs_orgy.5400.b.tt: "鍋は待てる。寝ているところで取る。拒みはしない。礼は言わない。"
 sbs_orgy.5400.c: "すでに持つもので養え。"
 sbs_orgy.5400.c.tt: "二本の指を入れ、他の男が残したものを集め、舌へ置く。ほかにすることが少ないから飲み込む。誰がそうさせたかは忘れない。"

# 6400 extreme paddock
 sbs_orgy.6400.t: "馬場"
 sbs_orgy.6400.desc: "馬場は真昼の陽の下だ。幕も夜もない。馬は営地と同じ踏み固められた土へ連れられ、女たちもそこに並ばされている。"
 sbs_orgy.6400.body.desc: "[sbs_orgy_horse_girl.GetFirstName]は二度言われる前に従った。塵の中に膝をつき、種馬はすでに根まで入っている。太さで腹が一緒に持ち上がり、沈む。一歩ずつ突き込むたびに、皮膚の下を硬い筋が走る。\n\n他の女も同じ方へ押しやられる。男たちは柵の外で見ている。誰かが笑う。馬は笑わない。"
 sbs_orgy.6400.a: "一頭を取れ。"
 sbs_orgy.6400.a.tt: "陽の下、彼女の隣に膝をつき、次の種馬に身を任せる。その大きさは、馬場が静まったあとも身体に残る。"
 sbs_orgy.6400.b: "男たちに仕えよ。"
 sbs_orgy.6400.b.tt: "馬は望む者に任せ、柵の男を一人ずつ、備えをもって取る。[sbs_orgy_horse_girl.GetFirstName]は、私が終える頃も種馬の下にいる。"

