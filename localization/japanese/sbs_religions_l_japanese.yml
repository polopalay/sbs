l_japanese:
 demonic_religion: "サタン主義"
 demonic_religion_adj: "悪魔的な"
 demonic_religion_adherent: "サタニスト"
 demonic_religion_adherent_plural: "サタニスト"
 demonic_religion_desc: "サタン主義とは、悪魔を崇拝する宗教です。サタン崇拝と関連付けられることが多いですが、すべての悪魔崇拝者がサタンを崇拝しているわけではありません。"
 satan: "サタニズム"

 nature: "ナチュリズム"
 nature_adj: "ナチュリスティック"
 nature_adherent: "ナチュリスト"
 nature_adherent_plural: "ナチュリスト"
 nature_desc: "ナチュリズムは、自然の純粋さを崇拝し、社会慣習を拒絶する宗教です。衣服を着ることは自然の秩序に反すると信じています。ナチュリズムの信奉者は、地球との真の調和は、肉体と精神を完全にさらけ出すことによってのみ達成できると信じています。この宗教の指導者はベルゼブブです。彼は強力な悪魔であり、すべてのナチュリストから尊敬を集め、自然の荒々しい力の究極の体現者と見なされています。"

 pleasure: "放縦主義"
 pleasure_adj: "放縦主義的"
 pleasure_adherent: "放縦主義者"
 pleasure_adherent_plural: "放縦主義者"
 pleasure_desc: "放縦主義とは、性的な関係を神聖なものとみなし、信者に献身の一形態として多くの愛人を持つことを推奨する信仰です。彼らの信仰の中心は、愛と肉体的な快楽こそが精神的な自由の最も真の表現であるという考えです。この宗教の指導者は、魅惑的で力強い悪魔であるリリスであり、信者たちに究極の親密さと個人的な解放を約束して導きます。"

 violence: "暴力主義"
 violence_adj: "暴力主義的"
 violence_adherent: "暴力主義者"
 violence_adherent_plural: "暴力主義者"
 violence_desc: "暴力主義は戦争、暴力、そして残虐行為を最高の美徳として賛美し、戦闘を通して強さと支配を推し進めます。信奉者は、個人と集団の偉大さへの道として、争いを受け入れるよう奨励されます。暴力主義の舵取りは、その名が恐怖を呼び起こす、鉄の拳で戦士たちを率いるアバドンです。彼は死と征服の道を擁護しています。"

 greedy: "貪欲主義"
 greedy_adj: "貪欲主義的"
 greedy_adherent: "貪欲主義者"
 greedy_adherent_plural: "貪欲主義者"
 greedy_desc: "貪欲主義は富、強欲、そして日和見主義を称揚し、金銭を究極の権力表現と見なします。信者は富は神から与えられた権利であると信じ、可能な限り多くの富を蓄積するよう奨励されます。貪欲と過剰の悪魔であるマモンがこの信仰の指導者であり、富とそれがもたらす物質的な快楽への果てしない追求を象徴しています。"

 asmodeus: "近親相姦主義"
 asmodeus_adj: "近親相姦的な"
 asmodeus_adherent: "近親相姦主義者"
 asmodeus_adherent_plural: "近親相姦主義者"
 asmodeus_desc: "近親相姦主義は家族を何よりも重視し、近親相姦関係さえも神聖な絆とみなします。この宗教は、社会規範よりも家族の忠誠心と結束を重視します。情欲と家族の忠誠心を司る悪魔アスモデウスは、この信仰の指導者であり、信者たちを道徳的制約を超えて家族の絆を強めるよう導いています。"

 belial: "科学主義"
 belial_adj: "科学的"
 belial_adherent: "科学者"
 belial_adherent_plural: "科学者たち"
 belial_desc: "科学主義とは、たとえ方法が不道徳または非倫理的であったとしても、いかなる犠牲を払ってでも知識を追求することです。科学主義の信奉者は、制限のない探求を通してのみ真の悟りを得ることができると信じています。知識と操作の狡猾な悪魔であるベリアルは、この信仰の指導者であり、信奉者たちに理解を求める中で道徳的な限界を打ち破るよう促しています。"

