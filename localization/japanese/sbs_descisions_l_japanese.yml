l_japanese:
become_demon: "悪魔になれ"
become_demon.desc: "サタンと地獄の王子たちから祝福を受けたサキュバスとして、あなたは真の悪魔となるための条件をすべて満たし、この神聖な儀式を行うために100人の人間の命を犠牲にしました。"
become_demon.c: "祝福を受けよ"
become_demon.t: "神聖な儀式を始めよ"

masturbate: "自慰行為をせよ"
masturbate.desc: "あなたの人生はすでにストレスでいっぱいで、あなたはそれを解消する何かを探しています。ディルドは最も安全な方法です。あなたが痴女で淫乱な痴女だという噂を気にすることなく、官能に耽ることができます。"
masturbate.t: "ストレス解消"
masturbate.c: "アソコに入れて"

seal_the_gates_of_hell: "地獄の門を封印せよ"
seal_the_gates_of_hell.desc: "地獄の門が開き、悪魔が人間界に侵入しようとしています。地獄の門を封印し、悪魔が人間界に侵入するのを防ぐ方法を見つけなければなりません。"
seal_the_gates_of_hell.t: "地獄の門を封印せよ"
seal_the_gates_of_hell.c: "地獄の門を封印せよ"

alienate_people: "人々を疎外せよ"
alienate_people.desc: "人々を堕落させ、真の神を崇拝させよ"
alienate_people.t: "人々を疎外せよ"
alienate_people.c: "人々を疎外せよ"
