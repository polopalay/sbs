l_russian:
 become_demon: "Стань демоном"
 become_demon.desc: "Как Суккуб, благословленный сатаной и принцами ада, ты выполнил все условия, чтобы стать истинным демоном, жертвуя 100 человеческими жизнями для проведения этого святого ритуала."
 become_demon.c: "Получить благословение"
 become_demon.t: "Начать святой ритуал"

 seal_the_gates_of_hell: "Запечатать врата ада"
 seal_the_gates_of_hell.desc: "Врата ада открыты, и демоны готовятся вторгнуть в мир людей. Вам нужно найти способ запечатать врата ада и предотвратить втор жение демонов в мир людей."
 seal_the_gates_of_hell.t: "Запечатать врата ада"
 seal_the_gates_of_hell.c: "Запечатать врата ада"
