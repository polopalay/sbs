l_korean:
 carnia_buy_from_slave_market: "노예 시장에서 산다"
 carnia_buy_from_slave_market_desc: "은밀한 시장을 찾아가 매물로 나온 사람들을 살펴본다."
 carnia_buy_from_slave_market_tooltip: "노예 시장에서 무작위 매물이 제시된다."
 carnia_buy_from_slave_market_effect: "무작위 매물이 제시된다. 구매하면 소액의 [gold|E] 금을 쓰고 [lowborn|E] 노예가 가문에 들어온다."
 carnia_buy_from_slave_market_confirm: "시장을 찾는다"

 carnia_slave_market.0002.t: "네 명의 매물"
 carnia_slave_market.0002.desc: "중개인이 한 줄에 네 명을 묶어 두었다. [carnia_slave_man.GetFirstName]와 [carnia_slave_woman.GetFirstName]은 젊다. [carnia_slave_child.GetFirstName]은 아직 어리다. [carnia_slave_old.GetFirstName]은 이미 오래 살았다."
 carnia_slave_market.0002.a: "[carnia_slave_man.GetFirstName]을 데려간다."
 carnia_slave_market.0002.b: "[carnia_slave_woman.GetFirstName]을 데려간다."
 carnia_slave_market.0002.c: "[carnia_slave_child.GetFirstName]을 데려간다."
 carnia_slave_market.0002.d: "[carnia_slave_old.GetFirstName]을 데려간다."
 carnia_slave_market.0002.e: "아무도 사지 않는다."
 carnia_slave_market.0003.t: "몰락한 가문"
 carnia_slave_market.0003.desc: "[carnia_slave_noble.GetFirstName]은 아직 이름을 지닌다. 신앙은 적대적이고, 주군도 없으며, 왕위에 오른 친척도 없다."
 carnia_slave_market.0003.a: "이름도 살 수 있다."
 carnia_slave_market.0003.b: "다른 산 이에게 맡겨라."
 carnia_slave_market.0004.t: "먼 순례자"
 carnia_slave_market.0004.desc: "[carnia_slave_pilgrim.GetFirstName]은 그대가 상대하는 궁정이 아니다. 길이 여기로 데려왔다."
 carnia_slave_market.0004.a: "그 길은 내 집에서 끝난다."
 carnia_slave_market.0004.b: "순례자는 내 일이 아니다."
 carnia_slave_market.0005.t: "두 계약"
 carnia_slave_market.0005.desc: "중개인이 계약 두 장을 함께 내민다. [carnia_slave_a.GetFirstName]와 [carnia_slave_b.GetFirstName]이 가까이 서 있다."
 carnia_slave_market.0005.a: "둘 다 데려간다."
 carnia_slave_market.0005.b: "[carnia_slave_a.GetFirstName]만."
 carnia_slave_market.0005.c: "[carnia_slave_b.GetFirstName]만."
 carnia_slave_market.0005.d: "다른 집을 찾아라."
 carnia_slave_market.0006.t: "묶인 가족"
 carnia_slave_market.0006.desc: "중개인이 [carnia_slave_mother.GetFirstName]을 아이 [carnia_slave_child.GetFirstName]과 데려온다. 헤어지지 말게 해 달라는 것뿐이다."
 carnia_slave_market.0006.a: "내 지붕 아래 함께 둔다."
 carnia_slave_market.0006.b: "어머니만."
 carnia_slave_market.0006.c: "아이만."
 carnia_slave_market.0006.d: "그들의 운명은 다른 곳에 있다."
 carnia_slave_market.0007.t: "두 마음, 한 값"
 carnia_slave_market.0007.desc: "[carnia_slave_lover_a.GetFirstName]와 [carnia_slave_lover_b.GetFirstName]은 어깨가 닿을 만큼 가깝다."
 carnia_slave_market.0007.a: "둘은 함께 남는다."
 carnia_slave_market.0007.b: "[carnia_slave_lover_a.GetFirstName]만."
 carnia_slave_market.0007.c: "[carnia_slave_lover_b.GetFirstName]만."
 carnia_slave_market.0007.d: "그 약속은 사지 않는다."
 carnia_slave_market.0008.t: "드문 매물"
 carnia_slave_market.0008.desc: "마지막 계약은 이례적인 확신과 함께 나온다. [carnia_slave_good.GetFirstName]은 건강하고 잘 생겼다."
 carnia_slave_market.0008.a: "드문 하인은 금값을 한다."
 carnia_slave_market.0008.b: "드묾이 나를 묶지 않는다."
