l_french:
 carnia_buy_from_slave_market: "Acheter au marché aux esclaves"
 carnia_buy_from_slave_market_desc: "Visiter un marché discret et inspecter les personnes mises en vente."
 carnia_buy_from_slave_market_tooltip: "Une offre aléatoire du marché aux esclaves sera présentée."
 carnia_buy_from_slave_market_effect: "Une offre tirée au sort vous est présentée. Acheter coûte une modeste somme d'[gold|E] or et ajoute des esclaves [lowborn|E] à votre maison."
 carnia_buy_from_slave_market_confirm: "Se rendre au marché"

 carnia_slave_market.0002.t: "Quatre lots"
 carnia_slave_market.0002.desc: "Le courtier a quatre lots sur la même corde. [carnia_slave_man.GetFirstName] et [carnia_slave_woman.GetFirstName] sont jeunes. [carnia_slave_child.GetFirstName] est encore petit. [carnia_slave_old.GetFirstName] a déjà vécu."
 carnia_slave_market.0002.a: "Je prends [carnia_slave_man.GetFirstName]."
 carnia_slave_market.0002.b: "Je prends [carnia_slave_woman.GetFirstName]."
 carnia_slave_market.0002.c: "Je prends [carnia_slave_child.GetFirstName]."
 carnia_slave_market.0002.d: "Je prends [carnia_slave_old.GetFirstName]."
 carnia_slave_market.0002.e: "Je n'en achète aucun."
 carnia_slave_market.0003.t: "Une maison déchue"
 carnia_slave_market.0003.desc: "[carnia_slave_noble.GetFirstName] porte encore un nom. Sa foi vous est hostile, nul suzerain ne répond pour lui, nul parent ne tient un trône."
 carnia_slave_market.0003.a: "Un nom s'achète encore."
 carnia_slave_market.0003.b: "Qu'un autre acheteur le trouve."
 carnia_slave_market.0004.t: "Un pèlerin lointain"
 carnia_slave_market.0004.desc: "[carnia_slave_pilgrim.GetFirstName] ne vient d'aucune cour avec laquelle vous traitez. La route l'a mené ici."
 carnia_slave_market.0004.a: "La route s'arrête sous mon toit."
 carnia_slave_market.0004.b: "Un pèlerin n'est pas mon affaire."
 carnia_slave_market.0005.t: "Deux contrats"
 carnia_slave_market.0005.desc: "Le courtier présente deux contrats ensemble. [carnia_slave_a.GetFirstName] et [carnia_slave_b.GetFirstName] se tiennent près."
 carnia_slave_market.0005.a: "Je les prends tous les deux."
 carnia_slave_market.0005.b: "Seulement [carnia_slave_a.GetFirstName]."
 carnia_slave_market.0005.c: "Seulement [carnia_slave_b.GetFirstName]."
 carnia_slave_market.0005.d: "Cherchez une autre maison."
 carnia_slave_market.0006.t: "Une famille liée"
 carnia_slave_market.0006.desc: "Le courtier amène [carnia_slave_mother.GetFirstName] avec son enfant, [carnia_slave_child.GetFirstName]. Ils demandent seulement de ne pas être séparés."
 carnia_slave_market.0006.a: "Gardez-les ensemble sous mon toit."
 carnia_slave_market.0006.b: "Seulement la mère."
 carnia_slave_market.0006.c: "Seulement l'enfant."
 carnia_slave_market.0006.d: "Leur sort est ailleurs."
 carnia_slave_market.0007.t: "Deux cœurs, un prix"
 carnia_slave_market.0007.desc: "[carnia_slave_lover_a.GetFirstName] et [carnia_slave_lover_b.GetFirstName] se tiennent si près que leurs épaules se touchent."
 carnia_slave_market.0007.a: "Ils resteront ensemble."
 carnia_slave_market.0007.b: "Seulement [carnia_slave_lover_a.GetFirstName]."
 carnia_slave_market.0007.c: "Seulement [carnia_slave_lover_b.GetFirstName]."
 carnia_slave_market.0007.d: "Je n'achèterai pas leur promesse."
 carnia_slave_market.0008.t: "Une offre rare"
 carnia_slave_market.0008.desc: "Un dernier contrat est offert avec une confiance inhabituelle. [carnia_slave_good.GetFirstName] est sain et bien fait."
 carnia_slave_market.0008.a: "Un serviteur rare vaut l'or."
 carnia_slave_market.0008.b: "La rareté ne m'oblige pas."
