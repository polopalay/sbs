l_simp_chinese:
 become_demon: "恶魔升华"
 become_demon.desc: "作为一个受到撒旦和地狱之子祝福的魅魔。你已经满足了成为真正恶魔的所有条件，牺牲了 100 条人命来完成该神圣仪式。"
 become_demon.c: "乞求赐福"
 become_demon.t: "开始神圣仪式"

 seal_the_gates_of_hell: "封印地狱之门"
 seal_the_gates_of_hell.desc: "地狱之门洞开，恶魔即将入侵人类世界。我们必须想办法封锁地狱之门，阻止恶魔入侵。"
 seal_the_gates_of_hell.t: "封印地狱之门"
 seal_the_gates_of_hell.c: "封印地狱之门"
