l_japanese:
 carnia_buy_from_slave_market: "奴隷市場で買う"
 carnia_buy_from_slave_market_desc: "人目を忍ぶ市場を訪れ、売りに出された者たちを検分する。"
 carnia_buy_from_slave_market_tooltip: "奴隷市場から無作為の品が提示される。"
 carnia_buy_from_slave_market_effect: "無作為の商品が提示される。買い取れば僅かな[gold|E]黄金を払い、[lowborn|E]の奴隷が屋敷に加わる。"
 carnia_buy_from_slave_market_confirm: "市場へ行く"

 carnia_slave_market.0002.t: "四つの品"
 carnia_slave_market.0002.desc: "仲買人は一本の縄に四つを連ねている。[carnia_slave_man.GetFirstName]と[carnia_slave_woman.GetFirstName]は若い。[carnia_slave_child.GetFirstName]はまだ小さい。[carnia_slave_old.GetFirstName]はすでに長く生きた。"
 carnia_slave_market.0002.a: "[carnia_slave_man.GetFirstName]を引き取る。"
 carnia_slave_market.0002.b: "[carnia_slave_woman.GetFirstName]を引き取る。"
 carnia_slave_market.0002.c: "[carnia_slave_child.GetFirstName]を引き取る。"
 carnia_slave_market.0002.d: "[carnia_slave_old.GetFirstName]を引き取る。"
 carnia_slave_market.0002.e: "誰も買わない。"
 carnia_slave_market.0003.t: "落ちた家名"
 carnia_slave_market.0003.desc: "[carnia_slave_noble.GetFirstName]はまだ名を持っている。信仰は貴殿に敵対し、主君もなく、親族に君主もいない。"
 carnia_slave_market.0003.a: "名も金で買える。"
 carnia_slave_market.0003.b: "別の買い手に任せろ。"
 carnia_slave_market.0004.t: "遠方の巡礼者"
 carnia_slave_market.0004.desc: "[carnia_slave_pilgrim.GetFirstName]は交際する宮廷の者ではない。道がここへ連れてきた。"
 carnia_slave_market.0004.a: "その道は我が屋敷で終わる。"
 carnia_slave_market.0004.b: "巡礼者は関わりない。"
 carnia_slave_market.0005.t: "二つの契約"
 carnia_slave_market.0005.desc: "仲買人は二つの契約を揃えて出す。[carnia_slave_a.GetFirstName]と[carnia_slave_b.GetFirstName]は近くに立っている。"
 carnia_slave_market.0005.a: "二人とも引き取る。"
 carnia_slave_market.0005.b: "[carnia_slave_a.GetFirstName]だけ。"
 carnia_slave_market.0005.c: "[carnia_slave_b.GetFirstName]だけ。"
 carnia_slave_market.0005.d: "別の家を探せ。"
 carnia_slave_market.0006.t: "縛られた家族"
 carnia_slave_market.0006.desc: "仲買人は[carnia_slave_mother.GetFirstName]を子の[carnia_slave_child.GetFirstName]と連れてくる。離さないでくれとだけ願う。"
 carnia_slave_market.0006.a: "屋根の下で一緒に置け。"
 carnia_slave_market.0006.b: "母だけ。"
 carnia_slave_market.0006.c: "子だけ。"
 carnia_slave_market.0006.d: "運命は他所にある。"
 carnia_slave_market.0007.t: "二つの心、一つの値"
 carnia_slave_market.0007.desc: "[carnia_slave_lover_a.GetFirstName]と[carnia_slave_lover_b.GetFirstName]は肩が触れるほど近い。"
 carnia_slave_market.0007.a: "二人は一緒のままだ。"
 carnia_slave_market.0007.b: "[carnia_slave_lover_a.GetFirstName]だけ。"
 carnia_slave_market.0007.c: "[carnia_slave_lover_b.GetFirstName]だけ。"
 carnia_slave_market.0007.d: "その約束は買わない。"
 carnia_slave_market.0008.t: "稀な品"
 carnia_slave_market.0008.desc: "最後の契約は並外れた自信とともに出される。[carnia_slave_good.GetFirstName]は健やかで整っている。"
 carnia_slave_market.0008.a: "稀な仕えは金に値する。"
 carnia_slave_market.0008.b: "稀少さに縛られはしない。"
