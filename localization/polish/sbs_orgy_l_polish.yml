 sbs_orgy.0002.t: "Pusty dom"
 sbs_orgy.0002.desc: "Komnaty gotowe, lecz oczekiwane towarzystwo nie przychodzi. Lampy płoną dla nikogo."
 sbs_orgy.0002.a: "Zgaście lampy."

 sbs_orgy.1100.t: "Prywatne porozumienie"
 sbs_orgy.1100.desc: "[sbs_orgy_guest.GetFirstName] stoi wystarczająco blisko, by ciepło skóry mnie dosięgło."
 # Female root + Male guest
 sbs_orgy.1100.fm.1.desc: "Jego dłoń spoczywa na mojej talii, potem śledzi linię biodra. Gdy się nachylam, jego usta znajdują moje. Czuję go już twardego o dłoń przez cienką tkaninę."
 sbs_orgy.1100.fm.2.desc: "Zbliżam się, aż nie zostaje przestrzeni. Jego oddech jest ciepły przy gardle. Jedna dłoń na piersi; druga znajduje jego żar, jeszcze nie idąc dalej."
 sbs_orgy.1100.fm.3.desc: "Przyciąga mnie do ściany. Jego usta są ciepłe przy szyi, potem przy wargach. Dłoń obejmuje pierś przez tkaninę i zostaje, czekając."
 sbs_orgy.1100.fm.4.desc: "Prowadzę jego dłoń na biodro, potem niżej, dość, by poczuł mój żar. Połyka ślinę. Nikt z nas nie zdecydował jeszcze, co dalej."
 sbs_orgy.1100.fm.5.desc: "Przyciska mnie do ściany. Jedna dłoń obejmuje pierś. Druga leży wysoko na udzie, dość blisko, bym czuła każdy drobny ruch."
 sbs_orgy.1100.fm.6.desc: "Nachylam się i całuję go powoli. Gdy się cofam, dłoń wciąż jest przy jego pasie. Palce zostają w mych włosach, nie pchając i nie ciągnąc."
 sbs_orgy.1100.fm.7.desc: "Kciuk śledzi wewnętrzną stronę uda. Sięgam w dół i zamykam dłoń wokół niego przez tkaninę, czując puls o dłoń. Zostajemy tak chwilę."
 sbs_orgy.1100.fm.8.desc: "Kończymy na niskiej kanapie, usta otwarte, dłonie błądzące. Jego ciało jest ciepłe przy moim. Następny krok wciąż jest wyborem."
 # Male root + Female guest
 sbs_orgy.1100.mf.1.desc: "Moja dłoń znajduje jej biodro, potem ciepło uda. Oddycha już szybciej. Gdy zamyka dłoń wokół mnie przez tkaninę, nikt nie udaje, że to tylko rozmowa."
 sbs_orgy.1100.mf.2.desc: "Opuszczam głowę ku jej gardłu, potem ku ustom. Zapach skóry jest ostry i czysty. Dłoń zostaje wysoko na udzie."
 sbs_orgy.1100.mf.3.desc: "Całuje w dół mojej piersi i staje tuż przed dalszym krokiem. Jedna dłoń na udzie; druga śledzi linię pasa."
 sbs_orgy.1100.mf.4.desc: "Palce spoczywają między jej udami i czują, jak gotowa już jest. Wolna dłoń pieści mnie przez tkaninę tym samym niespiesznym rytmem."
 sbs_orgy.1100.mf.5.desc: "Pcha mnie na kanapę i siada na moich kolanach. Jej usta znajdują moje. Jesteśmy dość blisko, by następny wybór był oczywisty."
 sbs_orgy.1100.mf.6.desc: "Przyciągam ją, aż biodra się stykają. Jest ciepła i chętna. Czekam na chwilę, by zdecydować, jak daleko to zajdzie."
 sbs_orgy.1100.mf.7.desc: "Jej dłoń owija mnie, moja zostaje między udami. Zostajemy tak długo, ucząc się rytmu, jeszcze nie idąc dalej."
 sbs_orgy.1100.mf.8.desc: "Klęka przede mną i unosi wzrok. Dłonie spoczywają na mych udach. Zaproszenie jest jasne. Decyzja wciąż należy do mnie."
 # Male + Male
 sbs_orgy.1100.mm.1.desc: "Jego dłoń znajduje biodro, potem mój żar przez tkaninę. Oddaję dotyk. Usta spotykają się, otwarte i niespieszne."
 sbs_orgy.1100.mm.2.desc: "Stępuję, aż piersi się stykają. Oddech mu się łamie, gdy dłoń spoczywa na nim. Nikt nie poszedł dalej."
 sbs_orgy.1100.mm.3.desc: "Nachyla się i całuje mnie mocno. Dłoń zostaje przy pasie. Palce zostają w jego włosach, nie pchając i nie ciągnąc."
 sbs_orgy.1100.mm.4.desc: "Stoimy blisko. Obie dłonie pracują przez tkaninę naraz. Wąska przestrzeń między nami jest już zbyt ciepła."
 sbs_orgy.1100.mm.5.desc: "Odwracam go i przyciskam się do pleców. Jedna dłoń sięga wokół niego. Zostajemy tak, oddychając, zanim zdecyduje się więcej."
 sbs_orgy.1100.mm.6.desc: "Opuszcza usta ku gardłu, potem niżej, i staje. Kładę dłoń na karku. Następny krok wciąż jest wyborem."
 sbs_orgy.1100.mm.7.desc: "Dłonie poruszają się razem po tkaninie i skórze. Przechyla się ku mnie. Nikt jeszcze niczego nie dokończył."
 sbs_orgy.1100.mm.8.desc: "Opiera czoło o moje. Dłonie zostają, gdzie są. Noc wciąż jest otwarta."
 # Female + Female
 sbs_orgy.1100.ff.1.desc: "Dłoń spoczywa na biodrze, potem na ciepłej skórze uda. Ona odwzajemnia ruch. Zostajemy tak, ucząc się tempa."
 sbs_orgy.1100.ff.2.desc: "Opuszczam usta ku gardłu, potem ku wargom. Dłoń spoczywa na karku i prowadzi bez siły."
 sbs_orgy.1100.ff.3.desc: "Pcha mnie na kanapę i siada na kolanach. Usta się spotykają. Uda zaciskają się wokół mnie, gdy się nachyla."
 sbs_orgy.1100.ff.4.desc: "Palce spoczywają między udami i znajdują ją już ciepłą. Oddaje ten sam gest. Komnata napełnia się cichym oddechem."
 sbs_orgy.1100.ff.5.desc: "Kończymy na boku, ściśnięte, usta przy gardłach. Rytm jest powolny. Nikt się nie śpieszy."
 sbs_orgy.1100.ff.6.desc: "Drży, gdy całuję ją znów. Chwilę zostajemy tak, otwarte i czekające, zanim wybierze się więcej."
 sbs_orgy.1100.ff.7.desc: "Dłoń spoczywa między mych nóg, usta zostają przy gardle. Obie jesteśmy już ciepłe. Reszta wciąż jest wyborem."
 sbs_orgy.1100.ff.8.desc: "Całujemy się, aż obie drżymy. Dłonie zostają na biodrach i udach. Nic więcej nie zostało jeszcze postanowione."
 # Options - more detailed
 sbs_orgy.1100.a: "Nic między nami."
 sbs_orgy.1100.a.tt: "Przyciągam cię i biorę w pełni. Skóra przy skórze, nic niepowstrzymane, aż żadne z nas nie uda, że to był tylko dotyk."
 sbs_orgy.1100.b: "Nie bez ostrożności."
 sbs_orgy.1100.b.tt: "Najpierw ostrożność. Potem nie spieszę się przy każdym miejscu, które cię wstrząsa."
 sbs_orgy.1100.c: "Zostaw mnie po tej nocy."
 sbs_orgy.1100.c.tt: "Biorę cię ostrożnie, a potem mówię o innej nocy. Chcę znów poznać twoje ciało."
 sbs_orgy.1100.e: "Czego żądałaby miłość?"
 sbs_orgy.1100.e.tt: "Trzymamy ręce w miejscu dość długo, by mówić o miłości, nawet jeśli odpowiedź jest niebezpieczna."

 # Dirty talk (khẩu dâm) - gender variants
 sbs_orgy.1100.d_fm: "Powiedz mi, jak."
 sbs_orgy.1100.d_fm.tt: "Powiedz dokładnie, jak chcesz mnie wziąć. Opisz to, póki twoja dłoń jest jeszcze między moimi udami."
 sbs_orgy.1100.d_mf: "Powiedz, czego chcesz."
 sbs_orgy.1100.d_mf.tt: "Powiedz, co mam ci zrobić. Chcę słyszeć każdy szczegół, póki moje palce są jeszcze w tobie."
 sbs_orgy.1100.d_mm: "Powiedz, jak mocno."
 sbs_orgy.1100.d_mm.tt: "Powiedz, jak mocno tego chcesz. Opisz, co mają robić moje usta i ręce, gdy cię głaszczę."
 sbs_orgy.1100.d_ff: "Powiedz, gdzie."
 sbs_orgy.1100.d_ff.tt: "Powiedz dokładnie, gdzie chcesz moje usta i palce. Chcę to usłyszeć, gdy cię dotykam."

 # Mutual fondling / mutual masturbation
 sbs_orgy.1100.f_fm: "Tylko nasze ręce."
 sbs_orgy.1100.f_fm.tt: "Głaszczę cię, podczas gdy twoje palce pracują między moimi udami, aż oboje skończymy."
 sbs_orgy.1100.f_mf: "Tylko nasze ręce."
 sbs_orgy.1100.f_mf.tt: "Trzymam palce w tobie, podczas gdy ty głaszczesz mnie powoli, aż nikt z nas nie zdoła się powstrzymać."
 sbs_orgy.1100.f_mm: "Tylko nasze ręce."
 sbs_orgy.1100.f_mm.tt: "Głaszczemy się w tym samym rytmie, obserwując każdą reakcję, aż obaj skończymy."
 sbs_orgy.1100.f_ff: "Tylko ręce i usta."
 sbs_orgy.1100.f_ff.tt: "Dotykamy się, aż obie jesteśmy mokre i drżące, nie idąc dalej."





 sbs_orgy.1200.t: "Trzecie miejsce"
 sbs_orgy.1200.desc: "[sbs_orgy_guest_a.GetFirstName] i [sbs_orgy_guest_b.GetFirstName] dołączają w cichszym kącie. Powietrze między nami trojgiem jest już ciepłe."
 sbs_orgy.1200.male.desc: "Dwa ciała cisną się z obu stron. Dłonie muskają ramiona, talię, brzeg szat. Usta znajdują gardło i usta. Zostajemy tak, ciepli i niedokończeni, czekając, kto zostanie wybrany."
 sbs_orgy.1200.female.desc: "Dwa ciała cisną się z obu stron. Dłonie muskają ramiona, talię, brzeg szat. Usta znajdują gardło i usta. Zostajemy tak, ciepli i niedokończeni, czekając, kto zostanie wybrany."
 sbs_orgy.1200.a: "Tylko [sbs_orgy_guest_a.GetFirstName]."
 sbs_orgy.1200.a.tt: "Przyciągam [sbs_orgy_guest_a.GetFirstName]. Tej nocy chcę tylko jednego ciała przy moim."
 sbs_orgy.1200.b: "Tylko [sbs_orgy_guest_b.GetFirstName]."
 sbs_orgy.1200.b.tt: "Przyciągam [sbs_orgy_guest_b.GetFirstName]. Tej nocy chcę tylko jednego ciała przy moim."
 sbs_orgy.1200.c: "Nasza trójka."
 sbs_orgy.1200.c.tt: "Nikt nie zostaje pominięty. Ręce i usta krążą, aż nikt nie wie, czyja to rozkosz."
 sbs_orgy.1200.d: "Mówmy o żądzy."
 sbs_orgy.1200.d.tt: "Mówimy wprost, czego każde z nas chce, podczas gdy ręce wciąż błądzą."
 sbs_orgy.1200.e: "Skłoń ich ku sobie."
 sbs_orgy.1200.e.tt: "Kieruję ich ku sobie i zostaję dość blisko, by patrzeć. Ich ciała się spotykają; moje nie musi."

 sbs_orgy.4100.t: "Naga korona"
 sbs_orgy.4100.desc: "[sbs_orgy_nudity_guest.GetFirstName] zadaje pytanie z ostrożną grzecznością: jeśli władcę tak często widać bez szat, czy lud może patrzeć z tym samym szacunkiem?"
 sbs_orgy.4100.male.desc: "Stoję całkiem nagi pod lampami. Ramiona w tył, członek najpierw miękki, potem gęstniejący pod tyloma oczyma. Nie ruszam się, by się okryć. Niech patrzą na każdą linię mięśnia i ciężar między nogami."
 sbs_orgy.4100.female.desc: "Stoję całkiem naga pod lampami. Ramiona w tył, piersi i miękki trójkąt między udami otwarte na każde spojrzenie. Nie ruszam się, by się okryć. Niech patrzą na każdą krzywiznę i wilgoć, która już się zbiera."
 sbs_orgy.4100.a: "Niech patrzą."
 sbs_orgy.4100.a.tt: "Godne ciało nie potrzebuje zasłony. Obracam się powoli, by każdy kąt był widoczny."
 sbs_orgy.4100.b: "Uczcić tę niewinność."
 sbs_orgy.4100.b.tt: "Adam i Ewa nie znali wstydu w Edenie. Czczę tę niewinność otwartymi dłońmi i otwartym ciałem."
 sbs_orgy.4100.c: "Niech zdecyduje światło."
 sbs_orgy.4100.c.tt: "Szaty mają wydobywać urodę, nie tylko ją skrywać."
 sbs_orgy.4100.d: "Zostawmy to pytanie."
 sbs_orgy.4100.d.tt: "Nie odpowiadam na zagadkę. Stoję po prostu tak, aż sala przyzwyczai się do widoku."

 sbs_orgy.4200.t: "Najpiękniejsza postać"
 sbs_orgy.4200.desc: "Nieostrożny komplement staje się konkursem. Co najmniej pięcioro stoi pod lampami, a towarzystwo decyduje, czyja postawa zasługuje na najgłośniejszą chwałę."
 sbs_orgy.4200.male.desc: "Stoję wśród innych, całkiem nagi. Mięśnie grają w świetle, członek na widoku. Gdy przychodzi moja kolej, obracam się powoli i pozwalam każdemu oku mierzyć linie ciała i ciężar między nogami."
 sbs_orgy.4200.female.desc: "Stoję wśród innych, całkiem naga. Piersi, biodra i miękkie fałdy między udami są otwarte na osąd. Gdy przychodzi moja kolej, obracam się powoli i pozwalam każdemu oku mierzyć krzywizny i już widoczną wilgoć."
 sbs_orgy.4200.a: "Pokaż siłę."
 sbs_orgy.4200.a.tt: "Trzymam pozę, aż sala umilknie."
 sbs_orgy.4200.b: "Zdobyć ich wdziękiem."
 sbs_orgy.4200.b.tt: "Uśmiecham się, obracam i pozwalam sali zdecydować, że to mnie warto oglądać."
 sbs_orgy.4200.c: "Zręczna poza."
 sbs_orgy.4200.c.tt: "Przesuwam się akurat tyle, by zebrać wszystkie spojrzenia."
 sbs_orgy.4200.d: "Użyć tego konkursu."
 sbs_orgy.4200.d.tt: "Przyciągam najbliższe ciała i daję konkursowi lepszy użytek."

 sbs_orgy.2100.t: "Znany niepokój"
 sbs_orgy.2100.desc: "Przy całej swobodzie sali [sbs_orgy_guest.GetFirstName] i ja wahamy się. Krew czyni pewne milczenia cięższymi od innych."
 sbs_orgy.2100.fm.desc: "Moje dorosłe dziecko stoi przede mną, wyrośnięte i nagie. Ta sama krew, która czyniła to nie do pomyślenia, ostrzy tylko żar. Jego dłoń znajduje biodro; moja znajduje twardą długość jego."
 sbs_orgy.2100.mf.desc: "Moje dorosłe dziecko stoi przede mną, wyrośnięte i nagie. Ta sama krew ostrzy tylko żar. Dłoń znajduje miękkie fałdy między jej nogami; jest już mokra."
 sbs_orgy.2100.mm.desc: "Mój dorosły syn stoi przede mną, wyrośnięty i nagi. Ta sama krew ostrzy tylko żar. Dłonie zamykają się na sobie w tym samym czasie."
 sbs_orgy.2100.ff.desc: "Moja dorosła córka stoi przede mną, wyrośnięta i naga. Ta sama krew ostrzy tylko żar. Dłonie wślizgują się między uda drugiej i znajdują tę samą mokrą gotowość."
 sbs_orgy.2100.a: "Nic między nami."
 sbs_orgy.2100.a.tt: "Biorę cię w pełni. Skóra przy skórze, krew przy krwi, aż żadne z nas nie uda, że to tylko bliskość."
 sbs_orgy.2100.b: "Nie bez ostrożności."
 sbs_orgy.2100.b.tt: "Najpierw ostrożność. Noc pozostaje bliska, ale nie lekkomyślna."
 sbs_orgy.2100.c: "Niech to trwa poza świt."
 sbs_orgy.2100.c.tt: "To, co nas wiąże, jest święte, nie wstydliwe. Pozwalam nocy stać się czymś, co może trwać poza świt."
 sbs_orgy.2100.d: "Tylko ręce i usta."
 sbs_orgy.2100.d.tt: "Zostajemy przy rękach i ustach. Dość blisko, by smakować, nie dość daleko, by zapomnieć granicę."
 sbs_orgy.2100.e: "Dotąd, nie dalej."
 sbs_orgy.2100.e.tt: "Cofam się, zanim żar zdecyduje za nas. Krew między nami pozostaje granicą tej nocy."

 sbs_orgy.2200.t: "Przez małżeństwo"
 sbs_orgy.2200.desc: "[sbs_orgy_guest.GetFirstName] wszedł do mego domu przez [sbs_orgy_child.GetFirstName]. Tej nocy ta znajoma więź wydaje się mniej prosta niż w świetle dnia."
 sbs_orgy.2200.fm.desc: "Małżonek mego dziecka stoi blisko. Małżeństwo wiążące go z domem wydaje się cienkie. Dłoń na talii; czuję, jak gotowy już jest."
 sbs_orgy.2200.mf.desc: "Małżonek mego dziecka stoi blisko. Małżeństwo wydaje się cienkie. Palce znajdują miękki żar między jej nogami; nie cofa się."
 sbs_orgy.2200.mm.desc: "Mąż mego dziecka stoi blisko. Małżeństwo wydaje się cienkie. Dłonie zamykają się na sobie bez kolejnego słowa."
 sbs_orgy.2200.ff.desc: "Żona mego dziecka stoi blisko. Małżeństwo wydaje się cienkie. Dłonie wślizgują się między uda i znajdują ten sam mokry żar."
 sbs_orgy.2200.a: "Nic między nami."
 sbs_orgy.2200.a.tt: "Biorę to, co dzień nazwałby ich. Nic między nami prócz żaru chwili."
 sbs_orgy.2200.b: "Nie bez ostrożności."
 sbs_orgy.2200.b.tt: "Ostrożność. To pozostaje jedną nocą, nie trwałym węzłem."
 sbs_orgy.2200.c: "Zostań blisko. Nic więcej."
 sbs_orgy.2200.c.tt: "Zostajemy przy cieple i błądzących rękach. Małżeństwo pozostaje niewypowiedziane i nietknięte."
 sbs_orgy.2200.d: "Mówmy o małżeństwie."
 sbs_orgy.2200.d.tt: "Nazywam węzeł na głos. Mówimy o [sbs_orgy_child.GetFirstName], aż żar znajdzie inne ujście."

 sbs_orgy.2300.t: "Dowód przyjaźni"
 sbs_orgy.2300.desc: "Przyjaciel, albo najbliższy z przyjaciół, stoi blisko. Stare zaufanie siada między nami jak inne ciało. Tej nocy może stać się czymś innym."
 sbs_orgy.2300.fm.desc: "Przyjaciel stoi dość blisko, bym czuła ciepło skóry. Lata zaufania czynią pierwszy dotyk łatwym. Twardnieje o dłoń, gdy go pieścię; palce znajdują mnie już mokrą."
 sbs_orgy.2300.mf.desc: "Przyjaciółka stoi dość blisko, bym czuł ciepło skóry. Lata zaufania czynią pierwszy dotyk łatwym. Palce wślizgują się między uda i znajdują ją mokrą; w odpowiedzi zamyka dłoń wokół mnie."
 sbs_orgy.2300.mm.desc: "Przyjaciel stoi dość blisko, bym czuł ciepło skóry. Lata zaufania czynią pierwszy dotyk łatwym. Pieścimy się w tym samym powolnym rytmie, patrząc na każdą reakcję."
 sbs_orgy.2300.ff.desc: "Przyjaciółka stoi dość blisko, bym czuła ciepło skóry. Lata zaufania czynią pierwszy dotyk łatwym. Dłonie i usta krążą między udami, aż obie drżymy."
 sbs_orgy.2300.a: "Udowodnij to tak."
 sbs_orgy.2300.a.tt: "Biorę cię bez przeszkody i pozwalam latom zaufania stać się gorętszymi."
 sbs_orgy.2300.b: "Nie bez ostrożności."
 sbs_orgy.2300.b.tt: "Ostrożność. Lata zaufania stają się żarem, nie trwałym roszczeniem."
 sbs_orgy.2300.c: "Więcej niż przyjaciele."
 sbs_orgy.2300.c.tt: "Biorę cię ostrożnie i pozwalam dawnemu zaufaniu stać się węzłem kochanków."
 sbs_orgy.2300.d: "Pamiętaj, jak zaczynaliśmy."
 sbs_orgy.2300.d.tt: "Mówimy o dawniejszych nocach i łatwiejszych dniach. Ręce pozostają w miejscu. Przyjaźń wystarczy."

 sbs_orgy.2400.t: "Rozejm na osobności"
 sbs_orgy.2400.desc: "Mój rywal stoi po drugiej stronie ciasnej przestrzeni. Nienawiść zawsze była rodzajem intymności. Tej nocy powietrze między nami jest naładowane czymś innym."
 sbs_orgy.2400.fm.desc: "Ręce rywala są szorstkie, gdy wreszcie mnie dotykają. Ten sam gniew, co chciał mnie złamać, chce mnie teraz otwartej. Czuję go twardego o udo, gdy stara nienawiść mięknie w żar."
 sbs_orgy.2400.mf.desc: "Ciało rywalki jest napięte, gdy wreszcie ją dotykam. Ten sam gniew otwiera się pod palcami. Jest mokra, zanim zdążę pocałować."
 sbs_orgy.2400.mm.desc: "Uścisk rywala jest twardy, gdy dłonie wreszcie się spotykają. Ten sam gniew gęstnieje o dłoń. Pieścimy się z intensywnością dawnej walki."
 sbs_orgy.2400.ff.desc: "Oddech rywalki jest ostry, gdy dłonie wreszcie się spotykają. Ten sam gniew staje się mokry pod palcami. Dotykamy się z intensywnością dawnej walki."
 sbs_orgy.2400.a: "Skończmy to tak."
 sbs_orgy.2400.a.tt: "Przyjmuję rywalizację w swoje ciało. Gdy się skończy, nienawiść może nie przetrwać."
 sbs_orgy.2400.b: "Ustąpić."
 sbs_orgy.2400.b.tt: "Ustępuję. Niech poddanie skończy to, czego walka nigdy nie zdołała."
 sbs_orgy.2400.c: "Nie z tobą."
 sbs_orgy.2400.c.tt: "Zostawiam starą nienawiść tam, gdzie jest. Niektóre rozejmy nie są warte skóry, którą by kosztowały."

 sbs_orgy.2500.t: "Bez tytułów tej nocy"
 sbs_orgy.2500.desc: "Jest wasal. Ranga wciąż istnieje, lecz szaty zniknęły, a noc jest długa. Władzę można odłożyć albo użyć inaczej."
 sbs_orgy.2500.fm.desc: "Mój wasal klęka lub stoi, jak wybiorę. Te same usta, co przysięgały wierność, otwierają się teraz dla mnie. Czuję żar jego członka o dłoń, gdy decyduję, jak daleko zajdzie służba."
 sbs_orgy.2500.mf.desc: "Moja wasalka czeka z ciszą kogoś, kto zna swe miejsce. Palce znajdują miękki żar między nogami; nie odwraca wzroku. Ranga staje się czymś mokrym i natychmiastowym."
 sbs_orgy.2500.mm.desc: "Mój wasal czeka z ciszą kogoś, kto zna swe miejsce. Zamykam dłoń wokół niego i czuję, jak wierność staje się żarem. Pieści mnie w odpowiedzi starannym, wprawnym ruchem."
 sbs_orgy.2500.ff.desc: "Moja wasalka czeka z ciszą kogoś, kto zna swe miejsce. Palce wślizgują się między uda i znajdują ją gotową. Odwzajemnia dotyk; ranga rozpuszcza się we wspólnym mokrym żarze."
 sbs_orgy.2500.a: "Nie bez ostrożności."
 sbs_orgy.2500.a.tt: "Ranga może poczekać. Ostrożność, potem biorę to, co wasal może ofiarować."
 sbs_orgy.2500.b: "Na kolana."
 sbs_orgy.2500.b.tt: "Każę im klęknąć i używam ust i rąk, aż ciężar rządów zelżeje."
 sbs_orgy.2500.c: "Podaj swoją cenę."
 sbs_orgy.2500.c.tt: "Oferuję monetę za to, czego ranga nie powinna nakazywać. Noc trwa na kupionych warunkach."
 sbs_orgy.2500.d: "Mówić, gdy się dotykamy."
 sbs_orgy.2500.d.tt: "Urząd i bliskość w jednym tchu. Ręce błądzą. Nic więcej nie trzeba."

 sbs_orgy.2600.t: "Znajoma obietnica"
 sbs_orgy.2600.desc: "Mój małżonek jest tutaj. Znane ciało, znany dotyk. Pocieszenie i pożądanie po równo."
 sbs_orgy.2600.fm.desc: "Ciało męża znam jak własne. Pasuje do dłoni jak zawsze. Tej nocy znajomość tylko pogłębia żar."
 sbs_orgy.2600.mf.desc: "Ciało żony znam jak własne. Miękkie fałdy między nogami otwierają się palcom jak zawsze. Tej nocy znajomość tylko pogłębia żar."
 sbs_orgy.2600.mm.desc: "Ciało męża znam jak własne. Pieścimy się z łatwością długiej wprawy, żar wciąż ostry po tylu latach."
 sbs_orgy.2600.ff.desc: "Ciało żony znam jak własne. Dłonie i usta krążą między udami z łatwością długiej wprawy, żar wciąż ostry po tylu latach."
 sbs_orgy.2600.a: "Jak zawsze."
 sbs_orgy.2600.a.tt: "Biorę małżonka w pełni i pozwalam znajomej rozkoszy iść swoim torem."
 sbs_orgy.2600.b: "Znajdź kogoś innego."
 sbs_orgy.2600.b.tt: "Odwracam się od znanego ciała i szukam żaru obcego."

 sbs_orgy.2700.t: "Interesy przed przyjemnością"
 sbs_orgy.2700.desc: "[sbs_orgy_guest.GetFirstName] znajduje mnie, gdy uczta trwa wokół nas. Jakoś zaczyna się posiedzenie rady, choć nikt z nas go nie zwołał."
 sbs_orgy.2700.a: "Najpierw królestwo."
 sbs_orgy.2700.a.tt: "Mówimy o urzędach i niedokończonej pracy, podczas gdy huczna noc trwa wokół nas."
 sbs_orgy.2700.b: "Czego żądałaby miłość?"
 sbs_orgy.2700.b.tt: "Rada może poczekać. Pytam, co miłość zrobiłaby z dwojgiem, które zwykle mówi o królestwie."
 sbs_orgy.2700.c: "Mówmy o żądzy."
 sbs_orgy.2700.c.tt: "Nazywamy wprost, czego chcemy. Ręce pozostają w miejscu. Słowa wystarczą, by ulżyć nocy."

 sbs_orgy.2800.t: "Dom wasala"
 sbs_orgy.2800.desc: "[sbs_orgy_guest.GetFirstName] należy do domu [sbs_orgy_vassal_spouse_owner.GetFirstName], jednego z mych wasali. Fakt trudno zapomnieć, choć nikt nie odchodzi."
 sbs_orgy.2800.fm.desc: "Małżonek mego wasala stoi blisko. Więź domu, co powinna chronić, wydaje się cienka. Twardnieje w mej dłoni, podczas gdy imię małżonka wisi niewypowiedziane między nami."
 sbs_orgy.2800.mf.desc: "Małżonek mego wasala stoi blisko. Więź domu wydaje się cienka. Palce znajdują ją już mokrą, podczas gdy imię małżonka wisi niewypowiedziane."
 sbs_orgy.2800.mm.desc: "Mąż mego wasala stoi blisko. Więź domu wydaje się cienka. Pieścimy się, podczas gdy imię małżonka wisi niewypowiedziane."
 sbs_orgy.2800.ff.desc: "Żona mego wasala stoi blisko. Więź domu wydaje się cienka. Dłonie krążą między udami, podczas gdy imię małżonka wisi niewypowiedziane."
 sbs_orgy.2800.a: "Ostrożna tajemnica."
 sbs_orgy.2800.a.tt: "Ostrożność, potem biorę małżonka mego wasala i zachowuję noc w tajemnicy."
 sbs_orgy.2800.b: "Nic między nami."
 sbs_orgy.2800.b.tt: "Biorę ich w pełni. Węzeł domu zostaje za drzwiami."
 sbs_orgy.2800.c: "Zostaw drzwi otwarte."
 sbs_orgy.2800.c.tt: "Biorę ich ostrożnie i zostawiam drzwi otwarte. To nie musi się skończyć, gdy zgasną lampy."
 sbs_orgy.2800.d: "Zawołaj [sbs_orgy_vassal_spouse_owner.GetFirstName]."
 sbs_orgy.2800.d.tt: "Wzywam [sbs_orgy_vassal_spouse_owner.GetFirstName] i stawiam ich razem. Wykonują to dla mnie. Oboje odchodzą zadowoleni z mego urządzenia. Patrzenie i układanie kosztuje mnie więcej niż ich."
 sbs_orgy.2800.e: "Wystarczy rozmowa."
 sbs_orgy.2800.e.tt: "Na razie sama rozmowa jest dość skandaliczna. Ręce pozostają w miejscu."

 sbs_orgy.2900.t: "Ponad rangą"
 sbs_orgy.2900.desc: "Z dala od formalnej sali [sbs_orgy_guest.GetFirstName] wciąż jest mym seniorem, choć ranga w izbie takiej jak ta wydaje się mniej pewna."
 sbs_orgy.2900.fm.desc: "Mój senior stoi dość blisko, by ranga wciąż miała ważyć. Nie waży. Jego dłoń znajduje miękki żar między mymi nogami; zamykam palce na twardej długości jego."
 sbs_orgy.2900.mf.desc: "Mój senior stoi dość blisko, by ranga wciąż miała ważyć. Nie waży. Palce znajdują miękki żar między jej nogami; w odpowiedzi zamyka dłoń wokół mnie."
 sbs_orgy.2900.mm.desc: "Mój senior stoi dość blisko, by ranga wciąż miała ważyć. Nie waży. Dłonie zamykają się na sobie naraz; hierarchia rozpuszcza się w zwykły żar."
 sbs_orgy.2900.ff.desc: "Mój senior stoi dość blisko, by ranga wciąż miała ważyć. Nie waży. Dłonie wślizgują się między uda i znajdują tę samą mokrą gotowość."
 sbs_orgy.2900.a: "Odłóż rangę."
 sbs_orgy.2900.a.tt: "Biorę mego seniora z ostrożnością i pozwalam nocy być tylko ciałami."
 sbs_orgy.2900.b: "Moje towarzystwo ma cenę."
 sbs_orgy.2900.b.tt: "Oferuję siebie słowem i wprawą i żądam ceny za przywilej."
 sbs_orgy.2900.b.success: "Moje warunki zostają przyjęte. Noc trwa na moich zasadach."
 sbs_orgy.2900.b.failure: "Mój senior nie daje się przekonać. Ranga wraca na swoje miejsce."
 sbs_orgy.2900.c: "Tylko słowa, mój seniorze."
 sbs_orgy.2900.c.tt: "Po raz pierwszy po prostu rozmawiamy. Ręce pozostają w miejscu. Hierarchia zostaje nietknięta."

 sbs_orgy.2920.t: "Związany gość"
 sbs_orgy.2920.desc: "[sbs_orgy_guest.GetFirstName] czeka z wprawną ciszą kogoś przywykłego do rozkazów. Tej nocy jest kilka sposobów odpowiedzieć na to posłuszeństwo."
 sbs_orgy.2920.fm.desc: "Niewolnik czeka. Na słowo klęka. Usta otwierają się dla mnie; dłoń zamyka się na twardej długości jego. Obroża, znak albo sam fakt posiadania czyni każdy dotyk cięższym."
 sbs_orgy.2920.mf.desc: "Niewolnica czeka. Na słowo klęka albo się otwiera. Palce znajdują miękki żar między nogami; nie odwraca wzroku. Obroża, znak albo sam fakt posiadania czyni każdy dotyk cięższym."
 sbs_orgy.2920.mm.desc: "Niewolnik czeka. Na słowo klęka. Pieścimy się z jasnością rozkazu i posłuszeństwa. Obroża, znak albo sam fakt posiadania czyni każdy dotyk cięższym."
 sbs_orgy.2920.ff.desc: "Niewolnica czeka. Na słowo klęka albo się otwiera. Dłonie krążą między udami z jasnością rozkazu i posłuszeństwa. Obroża, znak albo sam fakt posiadania czyni każdy dotyk cięższym."
 sbs_orgy.2920.a: "Służ ustami."
 sbs_orgy.2920.a.tt: "Każę im klęknąć. Usta i ręce pracują, aż ciężar rozkazu zelżeje."
 sbs_orgy.2920.b: "Obcy rozkaz."
 sbs_orgy.2920.b.tt: "Wydaję rozkaz, który nie ma nic wspólnego ze zwykłą służbą, i patrzę, jak słuchają."
 sbs_orgy.2920.c: "Chodź tutaj."
 sbs_orgy.2920.c.tt: "Dość ceremonii. Ostrożność, potem biorę ich jak kogokolwiek innego tej nocy."
 sbs_orgy.2920.d: "Nie tej nocy."
 sbs_orgy.2920.d.tt: "Każę im usiąść i odetchnąć. Litość zamiast rozkazu. Obroża może poczekać."


# Contest localization

# 3100 - Contest of Mouths
 sbs_orgy.3100.t: "Konkurs ust"
 sbs_orgy.3100.desc: "Ktoś wzywa do konkursu wprawy. Jeden po drugim chętni przystępują, by wziąć członek do ust. Kto weźmie najgłębiej i utrzyma najdłużej bez cofnięcia, zgarnie sakiewkę."
 sbs_orgy.3100.male.desc: "Gdy przychodzi moja kolej, klękam i biorę ofiarowany członek. Najpierw wolno, potem głębiej, aż sala widzi, jak znika każdy cal, gardło pełne, oczy wilgotne."
 sbs_orgy.3100.female.desc: "Gdy przychodzi moja kolej, klękam i biorę ofiarowany członek. Najpierw wolno, potem głębiej, językiem i gardłem, aż sala widzi, jak daleko chcę iść."
 sbs_orgy.3100.a: "Przyjmij wyzwanie."
 sbs_orgy.3100.a.tt: "Pokażę im, co potrafią moje usta."
 sbs_orgy.3100.a.success: "Biorę głębiej i trzymam dłużej niż ktokolwiek. Sakiewka ląduje w mych dłoniach wśród cichego oklasku."
 sbs_orgy.3100.a.failure: "Ktoś inny okazuje się wprawniejszy. Cofam się z mniejszą godnością, niż miałem nadzieję."
 sbs_orgy.3100.b: "Tylko patrz."
 sbs_orgy.3100.b.tt: "Zostaję wśród patrzących i pozwalam innym ustom wziąć sakiewkę."

# 3200 - Who Lasts the Longest
 sbs_orgy.3200.t: "Kto wytrzyma najdłużej"
 sbs_orgy.3200.desc: "Nowy konkurs zostaje ogłoszony. Tworzą się pary, a wyzwanie jest proste: trwać jak najdłużej bez skończenia. Sala patrzy i liczy minuty."
 sbs_orgy.3200.male.desc: "Biorę chętnego partnera pod sobą. Reguła jest jasna: trzymaj rytm, pchaj dalej i nie wydawaj, aż każda inna para już się złamie. Sala liczy każdą minutę głośno."
 sbs_orgy.3200.female.desc: "Biorę chętnego partnera w siebie. Reguła jest jasna: ruszaj się, trzymaj rytm i nie kończ, aż każda inna para już się złamie. Sala liczy każdą minutę głośno."
 sbs_orgy.3200.a: "Przyjmij wyzwanie."
 sbs_orgy.3200.a.tt: "Biorę swego partnera. Niech sala zobaczy, jak długo wytrzymam."
 sbs_orgy.3200.a.success: "Wytrzymuję dłużej niż każda inna para. Sakiewka i cicha zazdrość sali są moje."
 sbs_orgy.3200.a.failure: "Łamię się przed innymi. Sala zauważa to natychmiast."
 sbs_orgy.3200.b: "Tylko patrz."
 sbs_orgy.3200.b.tt: "Zostaję wśród patrzących i pozwalam innym parom ścigać się z minutami."

# 3300 - The Most Rounds
 sbs_orgy.3300.t: "Najwięcej rund"
 sbs_orgy.3300.desc: "Ktoś podnosi stawkę. Wyzwaniem jest teraz wytrzymałość: kto weźmie najwięcej partnerów, zanim będzie musiał stanąć. Rachunek prowadzi się głośno, by nikt nie oszukiwał."
 sbs_orgy.3300.male.desc: "Przechodzę od jednego chętnego partnera do następnego. Ilekroć skończę, odzyskuję się tylko tyle, by zacząć znów. Sala wywołuje liczbę po każdej rundzie."
 sbs_orgy.3300.female.desc: "Biorę jednego chętnego partnera po drugim. Ilekroć jeden skończy we mnie albo na mnie, następny już czeka. Sala wywołuje liczbę po każdej rundzie."
 sbs_orgy.3300.a: "Przyjmij wyzwanie."
 sbs_orgy.3300.a.tt: "Niech liczą, ilu mogę wziąć."
 sbs_orgy.3300.a.success: "Biorę więcej partnerów niż ktokolwiek, zanim się zatrzymam. Sakiewka jest moja."
 sbs_orgy.3300.a.failure: "Ktoś inny okazuje się nieubłagany. To nie ja mam najwyższy rachunek."
 sbs_orgy.3300.b: "Tylko patrz."
 sbs_orgy.3300.b.tt: "Licę wraz z salą i zostawiam rundy komuś głodniejszemu."

# 3400 - Who Breaks First
 sbs_orgy.3400.t: "Kto złamie się pierwszy"
 sbs_orgy.3400.desc: "Proponują cichszy konkurs. Chętni kładą się, podczas gdy wprawne dłonie i usta pracują na nich. Reguła prosta: nie kończ. Kto pierwszy się złamie, przegrywa."
 sbs_orgy.3400.male.desc: "Kładę się i pozwalam wprawnym dłoniom i ustom pracować na mnie. Każdy oddech i drgnienie jest obserwowane. Kto pierwszy wyda, traci sakiewkę."
 sbs_orgy.3400.female.desc: "Kładę się i pozwalam wprawnym dłoniom i ustom pracować między nogami. Każdy oddech i drżenie jest obserwowane. Kto pierwszy skończy, traci sakiewkę."
 sbs_orgy.3400.a: "Przyjmij wyzwanie."
 sbs_orgy.3400.a.tt: "Niech spróbują mnie złamać."
 sbs_orgy.3400.a.success: "Wytrzymuję dłużej niż ktokolwiek. Sakiewka i cichy szacunek sali są moje."
 sbs_orgy.3400.a.failure: "Łamię się pierwszy. Sala widzi to wyraźnie."
 sbs_orgy.3400.b: "Wolę dotykać."
 sbs_orgy.3400.b.tt: "Pracuję rękami i ustami nad kimś innym i zostawiam im konkurs wytrwałości."

# 3500 - Contest of Tongues
 sbs_orgy.3500.t: "Konkurs języków"
 sbs_orgy.3500.desc: "Ktoś wzywa do innego wyzwania. Jeden po drugim chętni opuszczają usta między ofiarowane uda. Kto zostanie najdłużej i wydobędzie najwięcej z partnera, zgarnie sakiewkę."
 sbs_orgy.3500.male.desc: "Gdy przychodzi moja kolej, opuszczam usta między ofiarowane uda i pracuję ze stałą uwagą. Język i wargi ruszają się, aż sala słyszy, jak dobrze mi idzie i jak długo chcę zostać."
 sbs_orgy.3500.female.desc: "Gdy przychodzi moja kolej, opuszczam usta między ofiarowane uda i pracuję ze stałą uwagą. Język i wargi ruszają się, aż sala słyszy, jak dobrze mi idzie i jak długo chcę zostać."
 sbs_orgy.3500.a: "Przyjmij wyzwanie."
 sbs_orgy.3500.a.tt: "Pokażę im, co potrafią moje usta."
 sbs_orgy.3500.a.success: "Wytrzymuję dłużej i wydobywam więcej dźwięków z partnera niż ktokolwiek. Sakiewka ląduje w mych dłoniach."
 sbs_orgy.3500.a.failure: "Ktoś inny okazuje się wprawniejszy. Cofam się z mniejszą godnością, niż miałem nadzieję."
 sbs_orgy.3500.b: "Tylko patrz."
 sbs_orgy.3500.b.tt: "Zostaję wśród patrzących i pozwalam innemu językowi wziąć sakiewkę."

# Heavy / extreme localization

# 6100 - Female alone with animal
 sbs_orgy.6100.t: "Inny gość"
 sbs_orgy.6100.desc: "Drzwi otwierają się szerzej niż zwykle. Coś wielkiego i ciepłego prowadzą do izby na grubym powrozie. Inni goście milkną i cofają się."
 sbs_orgy.6100.horse.desc: "Silny koń bywa wyprowadzony, już twardy i ciężki między nogami. Prowadzą mnie na czworakach pod nim. Gdy zwierzę wsiada, sam rozmiar wydziera z gardła długie, złamane jęknięcie. Każde głębokie pchnięcie rozciąga mnie, aż mogę tylko czepiać się podłogi i krzyczeć."
 sbs_orgy.6100.dog.desc: "Wielki pies bywa wyprowadzony, dyszący i już cieknący. Wsiada z tyłu bez wahania, biodra w szybkich, ostrych pchnięciach. Mokry dźwięk i niskie warknięcia wypełniają izbę, podczas gdy jęczę bezradnie pod ciężarem."
 sbs_orgy.6100.pig.desc: "Ciężki dzik bywa wprowadzony, chrząkając i już śliski. Gdy wsiada, gruba, tępa forma wpycha się stałym naciskiem. Każde głębokie pchnięcie wydziera z gardła surowy, zwierzęcy dźwięk, co miesza się z jego chrząkaniem, aż izba huczy oboma."
 sbs_orgy.6100.a: "Weź to w pełni."
 sbs_orgy.6100.a.tt: "Nie mogę powstrzymać dźwięków. Rozciągnięcie i żar są zbyt wielkie — jęczę i napieram, aż zwierzę skończy głęboko we mnie."
 sbs_orgy.6100.b: "Odepchnij to."
 sbs_orgy.6100.b.tt: "Po prostu za duże. Odpycham zwierzę, zanim wejdzie głębiej, sapiąc i drżąc na podłodze."

# 6200 - Guest leads female root like an animal
 sbs_orgy.6200.t: "Prowadzony jak bestia"
 sbs_orgy.6200.desc: "[sbs_orgy_guest.GetFirstName] bierze skórzaną smycz ze stołu i wpina ją w przyniesioną obrożę. Sala milcząc patrzy, jak każą mi stanąć na czworakach i czołgać się."
 sbs_orgy.6200.horse.desc: "Gdy zmuszono mnie, bym szczekał na komendę i zmoczył podłogę jak pies, [sbs_orgy_guest.GetFirstName] wyprowadza konia. Stawiają mnie pod zwierzęciem. Ogromny ciężar kładzie się na plecy, gruba długość wchodzi, smycz trzymana krótko."
 sbs_orgy.6200.dog.desc: "Gdy zmuszono mnie, bym szczekał i zmoczył podłogę, [sbs_orgy_guest.GetFirstName] przyprowadza wielkiego psa. Bestia wsiada od razu, pcha twardo i szybko. Gość trzyma smycz napiętą, podczas gdy mokre dźwięki i warknięcia wypełniają powietrze."
 sbs_orgy.6200.pig.desc: "Gdy zmuszono mnie, bym szczekał i zmoczył podłogę, [sbs_orgy_guest.GetFirstName] przyprowadza ciężkiego dzika. Tępa, gruba forma wpycha się stałym naciskiem, podczas gdy gość trzyma smycz krótko i patrzy, jak znika każdy cal."
 sbs_orgy.6200.a: "Słuchaj i weź to."
 sbs_orgy.6200.a.tt: "Zostaję na czworakach i biorę zwierzę dokładnie jak kazano, jęcząc przy rozciąganiu, aż skończy we mnie."
 sbs_orgy.6200.b: "Błagaj raczej gościa."
 sbs_orgy.6200.b.tt: "Odwracam się i klękam przed [sbs_orgy_guest.GetFirstName], błagając, by służyć im, nie zwierzęciu."
 sbs_orgy.6200.c: "Odmów."
 sbs_orgy.6200.c.tt: "Zrywam smycz i wstaję. To zaszło daleko poza każdą grę, w którą jestem skłonny grać."

# 6300 - Female root leads a female guest like an animal
 sbs_orgy.6300.t: "Moje własne zwierzę"
 sbs_orgy.6300.desc: "Biorę skórzaną smycz i wpínam ją [sbs_orgy_guest.GetFirstName]. Sala patrzy, jak każę jej czołgać się, szczekać na komendę i moczyć podłogę jak tresowane zwierzę."
 sbs_orgy.6300.horse.desc: "Gdy dość już wykonała, wyprowadzam konia i stawiam ją pod nim. Ciężkie zwierzę wsiada, podczas gdy trzymam smycz krótko i patrzę, jak każde głębokie pchnięcie wydziera z gardła złamany dźwięk."
 sbs_orgy.6300.dog.desc: "Gdy dość już wykonała, przyprowadzam wielkiego psa. Wsiada chętnie, biodra w szybkich pchnięciach, podczas gdy trzymam smycz krótko i zmuszam ją zostać nieruchomo dla niego."
 sbs_orgy.6300.pig.desc: "Gdy dość już wykonała, przyprowadzam ciężkiego dzika. Gruba, tępa forma wpycha się w nią, podczas gdy trzymam smycz i słucham surowych dźwięków, których nie zdoła wstrzymać."
 sbs_orgy.6300.a: "Zmuś ją do tego."
 sbs_orgy.6300.a.tt: "Trzymam ją, aż zwierzę skończy głęboko w niej, potem każę jej dziękować mi za przywilej."
 sbs_orgy.6300.b: "Nagrodź własnymi rękami."
 sbs_orgy.6300.b.tt: "Zatrzymuję zwierzę i używam własnych rąk i ust, nagradzając posłuszeństwo."

# 3600 - Vaginal beer contest
 sbs_orgy.3600.t: "Inny rodzaj toastu"
 sbs_orgy.3600.desc: "Obecne kobiety zostają wezwane. Czary mocnego piwa stoją na podłodze. Wyzwanie wypowiedziane jasno: utrzymać czarę bez rąk i ust. Kto wytrzyma najdłużej, wygrywa sakiewkę. Reszta sali czeka, kto złamie się pierwszy."
 sbs_orgy.3600.a: "Przyjmij wyzwanie."
 sbs_orgy.3600.a.tt: "Siadam nad pucharem, zdecydowana wytrzymać dłużej niż każda inna kobieta."
 sbs_orgy.3600.a.success: "Wytrzymuję dłużej niż ktokolwiek. Sakiewka ląduje w mych dłoniach, gdy sala klaszcze zwycięstwu."
 sbs_orgy.3600.a.failure: "Nie mogę utrzymać. Piwo się rozlewa, a sala bez litości ustala karę: każdy obecny mężczyzna bierze kolejno nas obie, zanim noc będzie mogła się skończyć."
 sbs_orgy.3600.b: "Odmów."
 sbs_orgy.3600.b.tt: "Niektóre gry nie są warte ceny przegranej."

# 1300-1400 indoor / 5100-5400 outdoor
 sbs_orgy.1300.t: "Wysokie Siedzenie"
 sbs_orgy.1300.desc: "Tron gospodarza nie stoi już pusty. Dwa ciała go zajęły, a sala widzi, do czego służy to siedzenie."
 sbs_orgy.1300.fm.desc: "Siedzę okrakiem na nim na rzeźbionym siedzeniu, poręcze twarde przy moich udach. Ilekroć opadam, drewno skrzypi. Jego dłonie trzymają moje biodra; sala w dole ucichła."
 sbs_orgy.1300.mf.desc: "Trzymam ją na kolanach na wysokim siedzeniu, jedną ręką pod jej udem, drugą na rzeźbionej poręczy. Rusza się przeciwko mnie na oczach całej sali. Tron nie powstał po to — i o to właśnie chodzi."
 sbs_orgy.1300.mm.desc: "Jest na moich kolanach na tronie gospodarza, plecami do mojej piersi, rzeźbione drewno gryzie nas obu. Nie kryjemy ruchu. Kto posiada to siedzenie, poczuje to później."
 sbs_orgy.1300.ff.desc: "Mam ją ze sobą na tronie, jedno udo na poręczy, usta przy jej gardle, podczas gdy dłoń pracuje między jej nogami. Siedzenie służyło sądowi. Tej nocy trzyma coś bardziej mokrego."
 sbs_orgy.1300.a: "Zajmij siedzenie ostrożnie."
 sbs_orgy.1300.a.tt: "Zachowuję ostrożność i kończę na tronie. Sala zapamięta uprzejmość równie dobrze jak żar."
 sbs_orgy.1300.b: "Znajdź inne miejsce."
 sbs_orgy.1300.b.tt: "Wysokie siedzenie nie jest łożem. Zsyłam ich z tronu, by szukali cichszego kąta."
 sbs_orgy.1400.t: "Łagodniejsza komnata"
 sbs_orgy.1400.desc: "Rzecz już się zaczęła. [sbs_orgy_guest.GetFirstName] wciąż jest przy mnie, gdy pada propozycja: opuścić publiczne komnaty i dokończyć to w prawdziwym łożu."
 sbs_orgy.1400.fm.desc: "Wciąż trwa w powolnym rytmie, który zaczęliśmy w przejściu. Jego usta są przy moim uchu. Alkowa, mówi, byłaby łaskawsza dla mych pleców niż kamień. Nie przestaje się ruszać, gdy pyta."
 sbs_orgy.1400.mf.desc: "Ma kolano na ławie i oddech przy moim gardle. Łoże jest tylko drzwi dalej. Chce prześcieradeł, zasuwki, czasu. Jej dłoń nie opuszcza mnie, póki czeka na odpowiedź."
 sbs_orgy.1400.mm.desc: "Przy ścianie jesteśmy już w pół drogi. Kiwa ku alkowie i nie zabiera ręki. Łoże pozwoliłoby nam trwać. Sala nie musiałaby tego słyszeć."
 sbs_orgy.1400.ff.desc: "Jej udo wciąż zahaczone o moje. Chce łoża: drzwi zamknięte, poduszki, miejsce do rana. Palce zostają, gdzie są, aż wybiorę."
 sbs_orgy.1400.a: "Weźmy łoże."
 sbs_orgy.1400.a.tt: "Pozwalam się tam zaprowadzić i kończymy bez pośpiechu. Zamknięte drzwi zyskują więcej ciepła, niż sala kiedykolwiek da."
 sbs_orgy.1400.b: "Czemu nie tron?"
 sbs_orgy.1400.b.tt: "Ciągnę ich ku wysokiemu siedzeniu. Sala może patrzeć. Zuchwałość mi ulży; są dość rozbawieni, by wybaczyć objazd."
 sbs_orgy.1400.c: "Zostańmy, jak jesteśmy."
 sbs_orgy.1400.c.tt: "Żadnej innej komnaty. Zachowuję rytm, który już mamy, i kończę tutaj."
 sbs_orgy.5100.t: "Wiejska procesja"
 sbs_orgy.5100.desc: "Orgia nie zostaje na polu. Przed południem wylała się do biednej wsi, naga kolumna między chatami, słońce wciąż wysoko.\n\nMężczyzna sika na odrzwia, nie przerywając kroku. Inny kuca w rynsztoku i nie podnosi wzroku. Ktoś trzyma żonę piekarza przy studni, spódnice już zdjęte, protest cieńszy już od żaru. Dzieci wciągane są do izb. Psy szczekają. Ksiądz, jeśli jest, znalazł okiennicę do zamknięcia.\n\nNikt nie przewodzi. Kolumna po prostu bierze ulicę, śmiejąc się, upaćkana, stając wszędzie, gdzie mur albo wóz utrzyma ciało. Władza nad tym miejscem cienieje z każdymi drzwiami, które zostają zamknięte."
 sbs_orgy.5100.a: "Niech kolumna idzie dalej."
 sbs_orgy.5100.a.tt: "Procesja trzyma ulicę, aż wieś zobaczy dość. Władza, jaka tu zostanie, odpowie wolniej."
 sbs_orgy.5200.t: "Między kamieniami"
 sbs_orgy.5200.desc: "[sbs_orgy_guest_a.GetFirstName] i [sbs_orgy_guest_b.GetFirstName] wybrali już płytę. Imiona w kamieniu są starsze niż my. Trawa między grobami leży tam, gdzie przeszły inne pary."
 sbs_orgy.5200.female.desc: "Leżę na wznak na startej inskrypcji, jeden między mych kolanami, drugi klęczy tam, gdzie mogę wziąć go w usta. Kamień jest zimny pod ramionami. Każde pchnięcie strąca kurz z liter. Gdy odwracam głowę, czytam datę. Nie przerywają z tego powodu."
 sbs_orgy.5200.male.desc: "Jednego mam pochylonego nad przechyloną płytą, drugiego siedzącego na grobie u mego biodra, bym dosięgnął obu. Ślady dłuta czepiają się skóry. Wieniec ze starszego pogrzebu leży zgnieciony pod kolanem. To miejsce pachnie ziemią i seksem w jednym tchu."
 sbs_orgy.5200.a: "To profanacja."
 sbs_orgy.5200.a.tt: "Ściągam nas z kamienia, zanim zajdzie dalej. Zmarłym się to należy, nawet jeśli nocy nie."
 sbs_orgy.5200.b: "Umarli nie będą dbać."
 sbs_orgy.5200.b.tt: "Zostawiam oboje na grobie i kończę tam. Niewłaściwość tego jest żarem."
 sbs_orgy.5300.t: "Po długim dniu"
 sbs_orgy.5300.desc: "Obóz od świtu był jednym długim splotem. Nikt nie włożył znów szat. Ogniska są niskie. Resztki jedzenia leżą nieco dalej, za posłaniami wciąż mokrymi po ostatniej parze."
 sbs_orgy.5300.body.desc: "Próbuję wstać, a uda nie chcą się złożyć. Mięśnie zbyt długo były rozwarte; sam próbny ruch ciągnie surowym bólem pachwinę. To, co wlane, wciąż ze mnie wychodzi powoli — z tyłu, spomiędzy nóg — i stygnie na wewnętrznej stronie uda, zanim dojdzie do kolana.\n\n[sbs_orgy_guest.GetFirstName] patrzy na chód, którego nie umiem zrobić. Oferta jest prosta. On przyniesie jedzenie. Ja przyjdę na czworakach i zaszczekam, kiedy każe."
 sbs_orgy.5300.a: "Zjeść to, co już mam."
 sbs_orgy.5300.a.tt: "Zbieram dwoma palcami to, co jeszcze ze mnie wychodzi, i kładę do ust. To sól i żar. To nie posiłek. Wystarczy, bym nie musiała czołgać się."
 sbs_orgy.5300.b: "Klęknij i szczekaj."
 sbs_orgy.5300.b.tt: "Opadam, gdzie stoję, i daję mu dźwięk, o który prosił. Jedzenie przychodzi. Godność nie."
 sbs_orgy.5300.c: "Czołgaj się po jedzenie."
 sbs_orgy.5300.c.tt: "Ruszam na czworakach ku garnkowi, uda wciąż rozwarte, ślad za mną aż do jedzenia."
 sbs_orgy.5400.t: "Następny ogień"
 sbs_orgy.5400.desc: "Dzień nie opróżnił obozu. Posłania leżą, gdzie je kopnięto. Kobiety chodzą między ogniskami, nie ubierając się znów; poranna robota wciąż na nich widać — połysk po wewnętrznej stronie uda, ślad na gardle, chód, który nie pamięta jeszcze, jak być zwyczajnym."
 sbs_orgy.5400.body.desc: "[sbs_orgy_guest.GetFirstName] nie wstała. Leży na rozłożonym płaszczu, kolana opadłe na boki, zbyt zużyta, by je złożyć; to, co wlano na końcu, wciąż znajduje tkaninę pod nią. Gdy podchodzę, nie okrywa się. Pyta tylko, czy przyniosę to, co zostało w garnku."
 sbs_orgy.5400.a: "Przynieś garnek."
 sbs_orgy.5400.a.tt: "Przynoszę, co zostało, i kładę, gdzie dosięgnie. Zapamięta uprzejmość."
 sbs_orgy.5400.b: "Nie, póki znów cię nie wezmę."
 sbs_orgy.5400.b.tt: "Garnek może poczekać. Biorę ją, gdzie leży. Pozwala. Nie dziękuje mi za to."
 sbs_orgy.5400.c: "Nakarm tym, co już w sobie ma."
 sbs_orgy.5400.c.tt: "Wkładam dwa palce, zbieram to, co zostawili inni mężczyźni, i kładę na jej języku. Połyka, bo niewiele innego może. Nie zapomni, kto ją do tego zmusił."

# 6400 extreme paddock
 sbs_orgy.6400.t: "Padok"
 sbs_orgy.6400.desc: "Padok jest w pełnym słońcu. Ani namiotu, ani nocy. Konie sprowadzono na tę samą zdeptaną ziemię co obóz, a kobiety postawiono przy nich."
 sbs_orgy.6400.body.desc: "[sbs_orgy_horse_girl.GetFirstName] nie kazała powtarzać. Klęczy w kurzu, ogier już wbity po nasadę. Trzon jest dość gruby, by jej brzuch unosił się i opadał wraz z nim — twardy grzbiet wędruje pod skórą przy każdym kroku w jej ciało.\n\nInne kobiety pcha się tą samą drogą. Mężczyźni stoją przy poręczy i patrzą. Ktoś się śmieje. Koń nie."
 sbs_orgy.6400.a: "Weź jednego."
 sbs_orgy.6400.a.tt: "Klękam w słońcu obok niej i pozwalam następnemu ogierowi mnie wziąć. Ten rozmiar zostaje w ciele długo po tym, jak padok ucichnie."
 sbs_orgy.6400.b: "Obsłuż raczej mężczyzn."
 sbs_orgy.6400.b.tt: "Zostawiam konie tym, które ich chcą, i biorę każdego mężczyznę przy poręczy, jednego po drugim, ostrożnie. [sbs_orgy_horse_girl.GetFirstName] wciąż jest pod ogierem, gdy kończę."

