l_japanese:
 carn_doctrine_same_slavery_name: "正義の信仰による奴隷制"
 carn_doctrine_same_slavery_crime_name: "犯罪者"
 carn_doctrine_same_slavery_crime_desc: "[ROOT.Faith.GetReligion.GetAdjectiveNoTooltip]の信者を奴隷とすることは、[ROOT.Faith.PantheonTerm]の権能を冒涜する根源的な罪です。"
 carn_doctrine_same_slavery_shunned_name: "非難される行為"
 carn_doctrine_same_slavery_shunned_desc: "信念が異なっても、[ROOT.Faith.GetReligion.GetAdjectiveNoTooltip]の信者は兄弟姉妹同然です。同じ信者を家畜扱いするのは、実に不当な行いです。"
 carn_doctrine_same_slavery_accepted_name: "許容される行為"
 carn_doctrine_same_slavery_accepted_desc: "罪を犯した[ROOT.Faith.GetAdherentNamePluralNoTooltip]は、奴隷となって罰を受けるべきではないでしょうか。一生を奉仕に捧げれば、贖罪となるでしょう。"
 doctrine_parameter_same_slavery_illegal: "[faith_righteous|E]または[faith_astray|E]の[faiths|E]の[slaves|E]を所有することは[crime|E] です"
 doctrine_parameter_same_slavery_shunned: "[faith_righteous|E]または[faith_astray|E]の[faiths|E]の[slaves|E]を所有することは[shunned|E] されます"
 doctrine_parameter_same_slavery_accepted: "[faith_righteous|E]または[faith_astray|E]の[faiths|E]の[slaves|E]を所有することは許容されます"

 carn_doctrine_other_slavery_name: "他の信仰による奴隷制"
 carn_doctrine_other_slavery_crime_name: "犯罪者"
 carn_doctrine_other_slavery_crime_desc: "信念に関係なく、すべての人間には尊重されるべき人権があります。[ROOT.Faith.PantheonTerm]を信じないからといって奴隷とすることは、犯罪です。"
 carn_doctrine_other_slavery_shunned_name: "非難される行為"
 carn_doctrine_other_slavery_shunned_desc: "誤った信仰を持つ者であっても、その命を自分のものと称することは非難されるべき行為です。"
 carn_doctrine_other_slavery_accepted_name: "許容される行為"
 carn_doctrine_other_slavery_accepted_desc: "すべての[ROOT.Faith.GetAdherentNamePluralNoTooltip]は、真の信仰を悟っていない者を救わなければなりません。手段を選んではいけません..."
 doctrine_parameter_other_slavery_illegal: "[faith_hostile|E]または[faith_evil|E の[faiths|E]の[slaves|E]を所有することは[crime|E]です"
 doctrine_parameter_other_slavery_shunned: "[faith_hostile|E]または[faith_evil|E]の[faiths|E]の[slaves|E]を所有することは[shunned|E]されます"
 doctrine_parameter_other_slavery_accepted: "[faith_hostile|E]または[faith_evil|E]の[faiths|E]の[slaves|E]を所有することは許容されます"

 carn_doctrine_prostitution_name: "売春"
 carn_doctrine_prostitution_crime_name: "犯罪者"
 carn_doctrine_prostitution_crime_desc: "性を売買することは、我々の社会の基盤を蝕む行為です。このような悪行に加担する者は、法で裁かれるべきです。"
 carn_doctrine_prostitution_shunned_name: "非難される行為"
 carn_doctrine_prostitution_shunned_desc: "体を売ることは恥ずべきことであり、品位を落とす行為ですが、本質的に[ROOT.Faith.PantheonTerm]の意志に反するものではありません。"
 carn_doctrine_prostitution_accepted_name: "許容される行為"
 carn_doctrine_prostitution_accepted_desc: "性行為は我々の社会の自然な要素であり、売春は他の事業と同様に自然な行為です。"
 carn_doctrine_prostitution_virtuous_name: "徳のある売春"
 carn_doctrine_prostitution_virtuous_desc: "売春は合法的で名誉ある職業であり、売春に従事する者はその仕事に対して尊敬を受けるべきです。"
 doctrine_parameter_carn_prostitution_illegal: "[prostitute|E][trait|E]を持つキャラクターは[criminals|E]です"
 doctrine_parameter_carn_prostitution_shunned: "[prostitute|E][trait|E]を持つキャラクターは[shunned|E]されます"
 doctrine_parameter_carn_prostitution_accepted: "[prostitute|E][trait|E]を持つキャラクターはすべて許容されます"

 carn_slavery_is_illegal: "あなたの信仰は、[CHARACTER.GetFaith.GetAdherentNamePluralNoTooltip|U]の奴隷化を許しません。"
