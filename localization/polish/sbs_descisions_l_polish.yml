l_polish:
 become_demon: "Stań się demonem"
 become_demon.desc: "Jako Sukkub pobłogosławiony przez szatana i książąt piekła, spełniłeś wszystkie warunki, aby stać się prawdziwym demonem, poświęcając 100 ludzkich istnień, aby odprawić ten święty rytuał."
 become_demon.c: "Przyjmij błogosławieństwo" 
 become_demon.t: "Rozpocznij święty rytuał"

 seal_the_gates_of_hell: "Zapieczętuj Bramy Piekła"
 seal_the_gates_of_hell.desc: "Bramy piekła są otwarte, a demony szykują się do inwazji na świat ludzi. Musisz znaleźć sposób na zapieczętowanie bram piekła i uniemożliwienie demonom wejścia do świata ludzi."
 seal_the_gates_of_hell.t: "Zapieczętuj Bramy Piekła"
 seal_the_gates_of_hell.c: "Zapieczętuj Bramy Piekła"
