l_russian:
 carnia_buy_from_slave_market: "Купить на невольничьем рынке"
 carnia_buy_from_slave_market_desc: "Посетить скрытный рынок и осмотреть выставленных на продажу."
 carnia_buy_from_slave_market_tooltip: "Будет представлено случайное предложение невольничьего рынка."
 carnia_buy_from_slave_market_effect: "Вам покажут случайное предложение. Покупка стоит небольшую сумму [gold|E] золота и добавляет [lowborn|E] рабов в ваш двор."
 carnia_buy_from_slave_market_confirm: "Посетить рынок"

 carnia_slave_market.0002.t: "Четыре лота"
 carnia_slave_market.0002.desc: "Маклер держит четыре лота на одном канате. [carnia_slave_man.GetFirstName] и [carnia_slave_woman.GetFirstName] молоды. [carnia_slave_child.GetFirstName] ещё мал. [carnia_slave_old.GetFirstName] уже прожил жизнь."
 carnia_slave_market.0002.a: "Возьму [carnia_slave_man.GetFirstName]."
 carnia_slave_market.0002.b: "Возьму [carnia_slave_woman.GetFirstName]."
 carnia_slave_market.0002.c: "Возьму [carnia_slave_child.GetFirstName]."
 carnia_slave_market.0002.d: "Возьму [carnia_slave_old.GetFirstName]."
 carnia_slave_market.0002.e: "Никого не куплю."
 carnia_slave_market.0003.t: "Падший дом"
 carnia_slave_market.0003.desc: "[carnia_slave_noble.GetFirstName] всё ещё носит имя. Вера враждебна вашей, нет сюзерена, нет родича на троне."
 carnia_slave_market.0003.a: "Имя ещё можно купить."
 carnia_slave_market.0003.b: "Пусть найдёт другой покупатель."
 carnia_slave_market.0004.t: "Дальний паломник"
 carnia_slave_market.0004.desc: "[carnia_slave_pilgrim.GetFirstName] пришёл не от двора, с которым вы ведёте дела. Дорога привела его сюда."
 carnia_slave_market.0004.a: "Дорога кончается в моём доме."
 carnia_slave_market.0004.b: "Паломник меня не касается."
 carnia_slave_market.0005.t: "Два договора"
 carnia_slave_market.0005.desc: "Маклер кладёт два договора вместе. [carnia_slave_a.GetFirstName] и [carnia_slave_b.GetFirstName] стоят рядом."
 carnia_slave_market.0005.a: "Возьму обоих."
 carnia_slave_market.0005.b: "Только [carnia_slave_a.GetFirstName]."
 carnia_slave_market.0005.c: "Только [carnia_slave_b.GetFirstName]."
 carnia_slave_market.0005.d: "Ищите другой дом."
 carnia_slave_market.0006.t: "Связанная семья"
 carnia_slave_market.0006.desc: "Маклер приводит [carnia_slave_mother.GetFirstName] с ребёнком, [carnia_slave_child.GetFirstName]. Они просят лишь не разлучать их."
 carnia_slave_market.0006.a: "Оставьте их вместе под моей кровлей."
 carnia_slave_market.0006.b: "Только мать."
 carnia_slave_market.0006.c: "Только ребёнка."
 carnia_slave_market.0006.d: "Их участь в другом месте."
 carnia_slave_market.0007.t: "Два сердца, одна цена"
 carnia_slave_market.0007.desc: "[carnia_slave_lover_a.GetFirstName] и [carnia_slave_lover_b.GetFirstName] стоят так близко, что соприкасаются плечами."
 carnia_slave_market.0007.a: "Они останутся вместе."
 carnia_slave_market.0007.b: "Только [carnia_slave_lover_a.GetFirstName]."
 carnia_slave_market.0007.c: "Только [carnia_slave_lover_b.GetFirstName]."
 carnia_slave_market.0007.d: "Их обещание я не куплю."
 carnia_slave_market.0008.t: "Редкое предложение"
 carnia_slave_market.0008.desc: "Последний договор предлагают с необычной уверенностью. [carnia_slave_good.GetFirstName] здоров и хорош собой."
 carnia_slave_market.0008.a: "Редкий слуга стоит золота."
 carnia_slave_market.0008.b: "Редкость меня не обязывает."
