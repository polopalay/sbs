 sbs_orgy.0002.t: "Une maison vide"
 sbs_orgy.0002.desc: "Les salles sont prêtes, mais la compagnie attendue ne vient pas. Les lampes brûlent pour personne."
 sbs_orgy.0002.a: "Éteignons les lampes."

 sbs_orgy.1100.t: "Un accord privé"
 sbs_orgy.1100.desc: "[sbs_orgy_guest.GetFirstName] se tient assez près pour que la chaleur de sa peau m'atteigne."
 # Female root + Male guest
 sbs_orgy.1100.fm.1.desc: "Sa main se pose à ma taille, puis suit la ligne de ma hanche. Quand je me penche, sa bouche trouve la mienne. Je le sens déjà dur contre ma paume, à travers le tissu mince."
 sbs_orgy.1100.fm.2.desc: "Je m'approche jusqu'à ce qu'il ne reste plus d'espace. Son souffle est chaud contre ma gorge. Une main sur sa poitrine ; l'autre trouve sa chaleur sans aller plus loin encore."
 sbs_orgy.1100.fm.3.desc: "Il me tire contre le mur. Sa bouche est chaude à mon cou, puis à mes lèvres. Sa main recouvre mon sein à travers l'étoffe et y reste, dans l'attente."
 sbs_orgy.1100.fm.4.desc: "Je guide sa main à ma hanche, puis plus bas, juste assez pour qu'il sente ma chaleur. Il déglutit. Ni l'un ni l'autre n'a encore décidé de la suite."
 sbs_orgy.1100.fm.5.desc: "Il me plaque au mur. Une main recouvre mon sein. L'autre repose haut sur ma cuisse, assez près pour que je sente chaque petit mouvement."
 sbs_orgy.1100.fm.6.desc: "Je me penche et l'embrasse lentement. Quand je me recule, ma main est encore à sa ceinture. Ses doigts restent dans mes cheveux, sans pousser ni tirer."
 sbs_orgy.1100.fm.7.desc: "Son pouce suit l'intérieur de ma cuisse. Je descends la main et le serre à travers le tissu, sentant le pouls contre ma paume. Nous restons ainsi un instant."
 sbs_orgy.1100.fm.8.desc: "Nous finissons sur le bas canapé, bouches ouvertes, mains errantes. Son corps est chaud contre le mien. Le pas suivant reste un choix."
 # Male root + Female guest
 sbs_orgy.1100.mf.1.desc: "Ma main trouve sa hanche, puis la chaleur de sa cuisse. Elle respire déjà plus vite. Quand elle me serre à travers le tissu, plus personne ne prétend que ce n'est qu'une conversation."
 sbs_orgy.1100.mf.2.desc: "Je baisse la tête vers sa gorge, puis sa bouche. L'odeur de sa peau est nette et vive. Ma main reste haute sur sa cuisse."
 sbs_orgy.1100.mf.3.desc: "Elle embrasse le long de ma poitrine et s'arrête juste avant d'aller plus loin. Une main sur ma cuisse ; l'autre suit la ligne de ma ceinture."
 sbs_orgy.1100.mf.4.desc: "Mes doigts reposent entre ses cuisses et sentent à quel point elle est déjà prête. Son autre main me caresse à travers le tissu, au même rythme sans hâte."
 sbs_orgy.1100.mf.5.desc: "Elle me pousse sur le canapé et s'installe à califourchon. Sa bouche trouve la mienne. Nous sommes assez proches pour que le choix suivant soit évident."
 sbs_orgy.1100.mf.6.desc: "Je la rapproche jusqu'à ce que nos hanches se rencontrent. Elle est chaude et consentante. J'attends le moment de décider jusqu'où cela ira."
 sbs_orgy.1100.mf.7.desc: "Sa main m'enlace tandis que la mienne reste entre ses cuisses. Nous demeurons ainsi longtemps, apprenant le rythme de l'autre sans aller plus loin encore."
 sbs_orgy.1100.mf.8.desc: "Elle s'agenouille devant moi et lève les yeux. Ses mains reposent sur mes cuisses. L'invitation est claire. La décision est encore la mienne."
 # Male + Male
 sbs_orgy.1100.mm.1.desc: "Sa main trouve ma hanche, puis ma chaleur à travers le tissu. Je lui rends le geste. Nos bouches se rencontrent, ouvertes et sans hâte."
 sbs_orgy.1100.mm.2.desc: "Je m'avance jusqu'à ce que nos poitrines se touchent. Son souffle se coupe quand ma main se pose sur lui. Ni l'un ni l'autre n'est allé plus loin."
 sbs_orgy.1100.mm.3.desc: "Il se penche et m'embrasse fort. Sa main reste à ma ceinture. Mes doigts restent dans ses cheveux, sans pousser ni tirer."
 sbs_orgy.1100.mm.4.desc: "Nous nous tenons près. Les deux mains travaillent à travers le tissu en même temps. L'espace mince entre nous est déjà trop chaud."
 sbs_orgy.1100.mm.5.desc: "Je le tourne et m'appuie contre son dos. Une main le contourne. Nous restons ainsi, à respirer, avant que davantage soit décidé."
 sbs_orgy.1100.mm.6.desc: "Il baisse la bouche à ma gorge, puis plus bas, et s'arrête. Je pose une main à sa nuque. Le pas suivant reste un choix."
 sbs_orgy.1100.mm.7.desc: "Nos mains bougent ensemble sur le tissu et la peau. Il se penche contre moi. Ni l'un ni l'autre n'a encore rien achevé."
 sbs_orgy.1100.mm.8.desc: "Il pose son front contre le mien. Nos mains restent où elles sont. La nuit est encore ouverte."
 # Female + Female
 sbs_orgy.1100.ff.1.desc: "Ma main se pose à sa hanche, puis sur la peau chaude de sa cuisse. Elle renvoie le geste. Nous restons ainsi, apprenant le rythme de l'autre."
 sbs_orgy.1100.ff.2.desc: "Je baisse la bouche à sa gorge, puis à ses lèvres. Sa main repose à ma nuque, guidant sans forcer."
 sbs_orgy.1100.ff.3.desc: "Elle me pousse sur le canapé et s'installe à califourchon. Nos bouches se rencontrent. Ses cuisses se resserrent autour de moi quand elle se penche."
 sbs_orgy.1100.ff.4.desc: "Mes doigts se posent entre ses cuisses et la trouvent déjà chaude. Elle me rend le même geste. La pièce se remplit d'une respiration basse."
 sbs_orgy.1100.ff.5.desc: "Nous finissons sur le côté, pressées l'une contre l'autre, bouches à la gorge. Le rythme est lent. Personne ne se presse."
 sbs_orgy.1100.ff.6.desc: "Elle tremble quand je l'embrasse encore. Un instant nous restons ainsi, ouvertes et dans l'attente, avant que davantage soit choisi."
 sbs_orgy.1100.ff.7.desc: "Sa main repose entre mes jambes tandis que ma bouche reste à sa gorge. Nous sommes déjà toutes deux chaudes. Le reste reste un choix."
 sbs_orgy.1100.ff.8.desc: "Nous nous embrassons jusqu'à en trembler. Les mains restent aux hanches et aux cuisses. Rien de plus n'a encore été décidé."
 # Options - more detailed
 sbs_orgy.1100.a: "Rien entre nous."
 sbs_orgy.1100.a.tt: "Je t'attire contre moi et je te prends tout entier. Peau contre peau, rien n'est retenu, jusqu'à ce que ni l'un ni l'autre ne puisse plus prétendre que ce n'était qu'un geste."
 sbs_orgy.1100.b: "Pas sans prudence."
 sbs_orgy.1100.b.tt: "D'abord une précaution. Ensuite je prends mon temps avec chaque endroit qui te fait frémir."
 sbs_orgy.1100.c: "Garde-moi après cette nuit."
 sbs_orgy.1100.c.tt: "Je te prends avec prudence, puis je parle d'une autre nuit. Je veux apprendre encore ton corps."
 sbs_orgy.1100.e: "Que demanderait l'amour ?"
 sbs_orgy.1100.e.tt: "Nous gardons les mains immobiles assez longtemps pour parler d'amour, même si la réponse est dangereuse."

 # Dirty talk (khẩu dâm) - gender variants
 sbs_orgy.1100.d_fm: "Dis-moi comment."
 sbs_orgy.1100.d_fm.tt: "Dis-moi exactement comment tu veux me prendre. Décris-le pendant que ta main est encore entre mes cuisses."
 sbs_orgy.1100.d_mf: "Dis-moi ce que tu veux."
 sbs_orgy.1100.d_mf.tt: "Dis-moi ce que tu veux que je te fasse. Je veux chaque détail pendant que mes doigts sont encore en toi."
 sbs_orgy.1100.d_mm: "Dis-moi à quel point."
 sbs_orgy.1100.d_mm.tt: "Dis-moi à quel point tu le veux. Décris ce que ma bouche et mes mains doivent faire pendant que je te caresse."
 sbs_orgy.1100.d_ff: "Dis-moi où."
 sbs_orgy.1100.d_ff.tt: "Dis-moi exactement où tu veux ma bouche et mes doigts. Je veux t'entendre le dire pendant que je te touche."

 # Mutual fondling / mutual masturbation
 sbs_orgy.1100.f_fm: "Nos mains seulement."
 sbs_orgy.1100.f_fm.tt: "Je te caresse pendant que tes doigts travaillent entre mes cuisses, jusqu'à ce que nous finissions tous les deux."
 sbs_orgy.1100.f_mf: "Nos mains seulement."
 sbs_orgy.1100.f_mf.tt: "Je garde mes doigts en toi pendant que tu me caresses, lentement, jusqu'à ce que plus personne ne puisse se retenir."
 sbs_orgy.1100.f_mm: "Nos mains seulement."
 sbs_orgy.1100.f_mm.tt: "Nous nous caressons au même rythme, à observer chaque réaction, jusqu'à ce que nous répandions tous les deux."
 sbs_orgy.1100.f_ff: "Mains et bouches seulement."
 sbs_orgy.1100.f_ff.tt: "Nous nous touchons jusqu'à être toutes deux mouillées et tremblantes, sans aller plus loin."





 sbs_orgy.1200.t: "Une troisième place"
 sbs_orgy.1200.desc: "[sbs_orgy_guest_a.GetFirstName] et [sbs_orgy_guest_b.GetFirstName] me rejoignent dans un coin plus calme. L'air entre nous trois est déjà chaud."
 sbs_orgy.1200.male.desc: "Deux corps se pressent de chaque côté. Des mains frôlent mes bras, ma taille, le bord des vêtements. Des bouches trouvent ma gorge et ma bouche. Nous restons ainsi, chauds et inachevés, à voir qui sera choisi."
 sbs_orgy.1200.female.desc: "Deux corps se pressent de chaque côté. Des mains frôlent mes bras, ma taille, le bord des vêtements. Des bouches trouvent ma gorge et ma bouche. Nous restons ainsi, chauds et inachevés, à voir qui sera choisi."
 sbs_orgy.1200.a: "Seulement [sbs_orgy_guest_a.GetFirstName]."
 sbs_orgy.1200.a.tt: "J'attire [sbs_orgy_guest_a.GetFirstName] contre moi. Cette nuit, je ne veux qu'un seul corps contre le mien."
 sbs_orgy.1200.b: "Seulement [sbs_orgy_guest_b.GetFirstName]."
 sbs_orgy.1200.b.tt: "J'attire [sbs_orgy_guest_b.GetFirstName] contre moi. Cette nuit, je ne veux qu'un seul corps contre le mien."
 sbs_orgy.1200.c: "Nous trois."
 sbs_orgy.1200.c.tt: "Personne n'est laissé de côté. Mains et bouches circulent jusqu'à ce que plus personne ne sache à qui appartient le plaisir."
 sbs_orgy.1200.d: "Parlons du désir."
 sbs_orgy.1200.d.tt: "Nous disons franchement ce que chacun veut, pendant que les mains continuent d'errer."
 sbs_orgy.1200.e: "Poussez-les l'un vers l'autre."
 sbs_orgy.1200.e.tt: "Je les oriente l'un vers l'autre et reste assez près pour regarder. Leurs corps se rencontrent ; le mien n'a pas à le faire."

 sbs_orgy.4100.t: "La couronne nue"
 sbs_orgy.4100.desc: "[sbs_orgy_nudity_guest.GetFirstName] pose la question avec une courtoisie soigneuse : si un souverain se montre si souvent sans vêtement, le peuple peut-il encore le regarder avec le même respect ?"
 sbs_orgy.4100.male.desc: "Je me tiens entièrement nu sous les lampes. Épaules en arrière, membre d'abord doux puis qui s'épaissit sous tant d'yeux. Je ne fais aucun geste pour me couvrir. Qu'ils regardent chaque ligne de muscle et le poids entre mes jambes."
 sbs_orgy.4100.female.desc: "Je me tiens entièrement nue sous les lampes. Épaules en arrière, seins et le triangle doux entre mes cuisses ouverts à tous les regards. Je ne fais aucun geste pour me couvrir. Qu'ils regardent chaque courbe et l'humidité qui déjà se rassemble."
 sbs_orgy.4100.a: "Qu'ils regardent."
 sbs_orgy.4100.a.tt: "Un corps digne n'a pas besoin de voile. Je tourne lentement pour que chaque angle soit vu."
 sbs_orgy.4100.b: "Honorer cette innocence."
 sbs_orgy.4100.b.tt: "Adam et Ève ne connaissaient pas la honte en Éden. J'honore cette innocence les mains ouvertes, le corps ouvert."
 sbs_orgy.4100.c: "Que la lumière décide."
 sbs_orgy.4100.c.tt: "Les vêtements doivent rehausser la beauté, non seulement la cacher."
 sbs_orgy.4100.d: "Laissons la question."
 sbs_orgy.4100.d.tt: "Je ne réponds pas à l'énigme. Je reste simplement tel que je suis jusqu'à ce que la salle s'habitue au spectacle."

 sbs_orgy.4200.t: "La plus belle forme"
 sbs_orgy.4200.desc: "Un compliment maladroit devient un concours. Au moins cinq d'entre nous se tiennent sous les lampes tandis que la compagnie décide quelle prestance mérite la louange la plus haute."
 sbs_orgy.4200.male.desc: "Je me tiens parmi les autres, entièrement nu. Les muscles jouent sous la lumière, le membre exposé. Quand vient mon tour je tourne lentement, laissant chaque œil mesurer les lignes de mon corps et le poids entre mes jambes."
 sbs_orgy.4200.female.desc: "Je me tiens parmi les autres, entièrement nue. Seins, hanches et les plis doux entre mes cuisses sont ouverts au jugement. Quand vient mon tour je tourne lentement, laissant chaque œil mesurer les courbes et l'humidité déjà visible."
 sbs_orgy.4200.a: "Montrer la force."
 sbs_orgy.4200.a.tt: "Je tiens la pose jusqu'à ce que la salle se taise."
 sbs_orgy.4200.b: "Les gagner par le charme."
 sbs_orgy.4200.b.tt: "Je souris, je tourne, et je laisse la salle décider que c'est moi qu'il faut regarder."
 sbs_orgy.4200.c: "Une pose habile."
 sbs_orgy.4200.c.tt: "Je me décale juste assez pour attirer tous les regards."
 sbs_orgy.4200.d: "Mettre le concours à profit."
 sbs_orgy.4200.d.tt: "J'attire les corps les plus proches et donne au concours un meilleur usage."

 sbs_orgy.2100.t: "Un malaise familier"
 sbs_orgy.2100.desc: "Malgré toute la liberté de la salle, [sbs_orgy_guest.GetFirstName] et moi hésitons. Le sang rend certains silences plus lourds que d'autres."
 sbs_orgy.2100.fm.desc: "Mon enfant adulte se tient devant moi, grandi et nu. Le même sang qui rendait cela impensable n'aiguise plus que la chaleur. Sa main trouve ma hanche ; la mienne trouve la longueur dure de lui."
 sbs_orgy.2100.mf.desc: "Mon enfant adulte se tient devant moi, grandi et nue. Le même sang qui rendait cela impensable n'aiguise plus que la chaleur. Ma main trouve les plis doux entre ses jambes ; elle est déjà mouillée."
 sbs_orgy.2100.mm.desc: "Mon fils adulte se tient devant moi, grandi et nu. Le même sang n'aiguise plus que la chaleur. Nos mains se ferment l'une sur l'autre en même temps."
 sbs_orgy.2100.ff.desc: "Ma fille adulte se tient devant moi, grandie et nue. Le même sang n'aiguise plus que la chaleur. Nos mains glissent entre les cuisses de l'autre et trouvent la même disposition mouillée."
 sbs_orgy.2100.a: "Rien entre nous."
 sbs_orgy.2100.a.tt: "Je te prends tout entier. Peau contre peau, sang contre sang, jusqu'à ce que ni l'un ni l'autre ne puisse plus prétendre que ce n'est que de la proximité."
 sbs_orgy.2100.b: "Pas sans prudence."
 sbs_orgy.2100.b.tt: "D'abord une précaution. La nuit reste intime, mais pas imprudente."
 sbs_orgy.2100.c: "Que cela dure au-delà de l'aube."
 sbs_orgy.2100.c.tt: "Ce qui nous lie est sacré, non honteux. Je laisse la nuit devenir quelque chose qui peut durer après l'aube."
 sbs_orgy.2100.d: "Mains et bouches seulement."
 sbs_orgy.2100.d.tt: "Nous en restons aux mains et aux bouches. Assez près pour goûter, pas assez loin pour oublier la limite."
 sbs_orgy.2100.e: "Jusqu'ici, pas plus loin."
 sbs_orgy.2100.e.tt: "Je recule avant que la chaleur ne décide pour nous. Le sang entre nous reste une limite cette nuit."

 sbs_orgy.2200.t: "Par le mariage"
 sbs_orgy.2200.desc: "[sbs_orgy_guest.GetFirstName] est entré dans ma maison par [sbs_orgy_child.GetFirstName]. Ce soir ce lien familier paraît moins simple qu'au grand jour."
 sbs_orgy.2200.fm.desc: "Le conjoint de mon enfant se tient près. Le mariage qui le lie à ma maison paraît mince ce soir. Sa main à ma taille ; je sens déjà combien il est prêt."
 sbs_orgy.2200.mf.desc: "Le conjoint de mon enfant se tient près. Le mariage qui la lie à ma maison paraît mince ce soir. Mes doigts trouvent la chaleur douce entre ses jambes ; elle ne se retire pas."
 sbs_orgy.2200.mm.desc: "Le mari de mon enfant se tient près. Le mariage qui le lie à ma maison paraît mince. Nos mains se ferment l'une sur l'autre sans un mot de plus."
 sbs_orgy.2200.ff.desc: "La femme de mon enfant se tient près. Le mariage qui la lie à ma maison paraît mince. Nos mains glissent entre les cuisses de l'autre et trouvent la même chaleur mouillée."
 sbs_orgy.2200.a: "Rien entre nous."
 sbs_orgy.2200.a.tt: "Je prends ce que le jour appellerait le leur. Rien entre nous que la chaleur de l'instant."
 sbs_orgy.2200.b: "Pas sans prudence."
 sbs_orgy.2200.b.tt: "Une précaution. Cela reste une seule nuit, non un lien durable."
 sbs_orgy.2200.c: "Reste près. Rien de plus."
 sbs_orgy.2200.c.tt: "Nous en restons à la chaleur et aux mains errantes. Le mariage n'est ni nommé ni franchi."
 sbs_orgy.2200.d: "Parlons du mariage."
 sbs_orgy.2200.d.tt: "Je nomme le lien à voix haute. Nous parlons de [sbs_orgy_child.GetFirstName] jusqu'à ce que la chaleur ait ailleurs où aller."

 sbs_orgy.2300.t: "Preuve d'amitié"
 sbs_orgy.2300.desc: "Un ami, ou le plus proche des amis, se tient près. La vieille confiance s'assied entre nous comme un autre corps. Ce soir elle pourrait devenir autre chose."
 sbs_orgy.2300.fm.desc: "Mon ami se tient assez près pour que je sente la chaleur de sa peau. Des années de confiance rendent le premier geste facile. Il durcit contre ma paume tandis que je le caresse ; ses doigts me trouvent déjà mouillée."
 sbs_orgy.2300.mf.desc: "Mon amie se tient assez près pour que je sente la chaleur de sa peau. Des années de confiance rendent le premier geste facile. Mes doigts glissent entre ses cuisses et la trouvent mouillée ; elle me serre en réponse."
 sbs_orgy.2300.mm.desc: "Mon ami se tient assez près pour que je sente la chaleur de sa peau. Des années de confiance rendent le premier geste facile. Nous nous caressons au même rythme lent, à regarder chaque réaction."
 sbs_orgy.2300.ff.desc: "Mon amie se tient assez près pour que je sente la chaleur de sa peau. Des années de confiance rendent le premier geste facile. Mains et bouches circulent entre nos cuisses jusqu'à ce que nous tremblions toutes deux."
 sbs_orgy.2300.a: "Prouve-le ainsi."
 sbs_orgy.2300.a.tt: "Je te prends sans obstacle et laisse les années de confiance devenir plus brûlantes."
 sbs_orgy.2300.b: "Pas sans prudence."
 sbs_orgy.2300.b.tt: "Une précaution. Les années de confiance deviennent de la chaleur, non une prétention durable."
 sbs_orgy.2300.c: "Plus que des amis."
 sbs_orgy.2300.c.tt: "Je te prends avec prudence et laisse l'ancienne confiance devenir un lien d'amants."
 sbs_orgy.2300.d: "Souviens-toi comment nous avons commencé."
 sbs_orgy.2300.d.tt: "Nous parlons de nuits plus anciennes et de jours plus simples. Les mains restent immobiles. L'amitié suffit."

 sbs_orgy.2400.t: "Une trêve en privé"
 sbs_orgy.2400.desc: "Mon rival se tient de l'autre côté de l'espace étroit. La haine a toujours été une sorte d'intimité. Ce soir l'air entre nous est chargé d'autre chose."
 sbs_orgy.2400.fm.desc: "Les mains de mon rival sont rudes quand elles me touchent enfin. La même colère qui voulait me briser me veut maintenant ouverte. Je le sens dur contre ma cuisse tandis que la vieille haine s'adoucit en chaleur."
 sbs_orgy.2400.mf.desc: "Le corps de mon rival est tendu quand je la touche enfin. La même colère qui voulait me briser s'ouvre sous mes doigts. Elle est mouillée avant même que je l'embrasse."
 sbs_orgy.2400.mm.desc: "La prise de mon rival est dure quand nos mains se rencontrent enfin. La même colère qui voulait me briser s'épaissit contre ma paume. Nous nous caressons avec l'intensité de l'ancienne lutte."
 sbs_orgy.2400.ff.desc: "Le souffle de mon rival est vif quand nos mains se rencontrent enfin. La même colère qui voulait me briser devient mouillée sous mes doigts. Nous nous touchons avec l'intensité de l'ancienne lutte."
 sbs_orgy.2400.a: "Finissons-en ainsi."
 sbs_orgy.2400.a.tt: "Je prends la rivalité dans mon corps. Quand ce sera fini, la haine pourrait ne pas survivre."
 sbs_orgy.2400.b: "Céder."
 sbs_orgy.2400.b.tt: "Je cède. Que la reddition achève ce que le combat n'a jamais pu."
 sbs_orgy.2400.c: "Pas avec toi."
 sbs_orgy.2400.c.tt: "Je laisse la vieille haine où elle est. Certaines trêves ne valent pas la peau qu'elles coûteraient."

 sbs_orgy.2500.t: "Pas de titres ce soir"
 sbs_orgy.2500.desc: "Un vassal est présent. Le rang existe encore, mais les vêtements sont partis et la nuit est longue. On peut poser le pouvoir, ou s'en servir autrement."
 sbs_orgy.2500.fm.desc: "Mon vassal s'agenouille ou se tient selon mon choix. La même bouche qui jura fidélité s'ouvre maintenant pour moi. Je sens la chaleur de son membre contre ma paume tandis que je décide jusqu'où ira le service."
 sbs_orgy.2500.mf.desc: "Mon vassal attend avec le calme de qui connaît sa place. Mes doigts trouvent la chaleur douce entre ses jambes ; elle ne détourne pas le regard. Le rang devient quelque chose de mouillé et d'immédiat."
 sbs_orgy.2500.mm.desc: "Mon vassal attend avec le calme de qui connaît sa place. Je ferme la main sur lui et sens la fidélité devenir chaleur. Il me caresse en retour d'un geste soigneux, exercé."
 sbs_orgy.2500.ff.desc: "Mon vassal attend avec le calme de qui connaît sa place. Mes doigts glissent entre ses cuisses et la trouvent prête. Elle renvoie le geste, le rang se dissolvant en une chaleur mouillée partagée."
 sbs_orgy.2500.a: "Pas sans prudence."
 sbs_orgy.2500.a.tt: "Le rang peut attendre. Une précaution, puis je prends ce qu'un vassal peut offrir."
 sbs_orgy.2500.b: "À genoux."
 sbs_orgy.2500.b.tt: "Je les mets à genoux et use de la bouche et des mains jusqu'à ce que le poids du gouvernement s'allège."
 sbs_orgy.2500.c: "Nomme ton prix."
 sbs_orgy.2500.c.tt: "J'offre de l'or pour ce que le rang ne devrait pas commander. La nuit continue aux termes achetés."
 sbs_orgy.2500.d: "Parler tout en touchant."
 sbs_orgy.2500.d.tt: "Affaires et proximité dans le même souffle. Les mains errent. Rien de plus n'est requis."

 sbs_orgy.2600.t: "Une promesse familière"
 sbs_orgy.2600.desc: "Mon conjoint est là. Le corps connu, le geste familier. Confort et désir à parts égales."
 sbs_orgy.2600.fm.desc: "Le corps de mon mari m'est aussi connu que le mien. Il s'ajuste à ma main comme toujours. Ce soir la familiarité ne fait qu'approfondir la chaleur."
 sbs_orgy.2600.mf.desc: "Le corps de ma femme m'est aussi connu que le mien. Les plis doux entre ses jambes s'ouvrent à mes doigts comme toujours. Ce soir la familiarité ne fait qu'approfondir la chaleur."
 sbs_orgy.2600.mm.desc: "Le corps de mon mari m'est aussi connu que le mien. Nous nous caressons avec l'aisance d'une longue pratique, la chaleur encore vive après tant d'années."
 sbs_orgy.2600.ff.desc: "Le corps de ma femme m'est aussi connu que le mien. Mains et bouches circulent entre nos cuisses avec l'aisance d'une longue pratique, la chaleur encore vive après tant d'années."
 sbs_orgy.2600.a: "Comme toujours."
 sbs_orgy.2600.a.tt: "Je prends mon époux pleinement et laisse le plaisir familier suivre son cours."
 sbs_orgy.2600.b: "Trouve quelqu'un d'autre."
 sbs_orgy.2600.b.tt: "Je me détourne du corps connu et cherche plutôt la chaleur d'un inconnu."

 sbs_orgy.2700.t: "Les affaires avant le plaisir"
 sbs_orgy.2700.desc: "[sbs_orgy_guest.GetFirstName] me trouve tandis que la fête continue autour de nous. Une séance de conseil commence sans que l'un ni l'autre l'ait convoquée."
 sbs_orgy.2700.a: "Le royaume d'abord."
 sbs_orgy.2700.a.tt: "Nous parlons de charges et de travaux inachevés pendant que la fête continue autour de nous."
 sbs_orgy.2700.b: "Que demanderait l'amour ?"
 sbs_orgy.2700.b.tt: "Le conseil peut attendre. Je demande ce que l'amour ferait de deux personnes qui parlent d'ordinaire du royaume."
 sbs_orgy.2700.c: "Parlons du désir."
 sbs_orgy.2700.c.tt: "Nous nommons ce que nous voulons en termes clairs. Les mains restent immobiles. La parole suffit à alléger la nuit."

 sbs_orgy.2800.t: "Le foyer d'un vassal"
 sbs_orgy.2800.desc: "[sbs_orgy_guest.GetFirstName] appartient à la maison de [sbs_orgy_vassal_spouse_owner.GetFirstName], l'un de mes propres vassaux. Le fait est difficile à oublier, bien que personne ne parte."
 sbs_orgy.2800.fm.desc: "Le conjoint de mon vassal se tient près. Le lien du foyer qui devrait le protéger paraît mince. Il durcit dans ma main tandis que le nom de leur époux reste non dit entre nous."
 sbs_orgy.2800.mf.desc: "Le conjoint de mon vassal se tient près. Le lien du foyer qui devrait la protéger paraît mince. Mes doigts la trouvent déjà mouillée tandis que le nom de leur époux reste non dit entre nous."
 sbs_orgy.2800.mm.desc: "Le mari de mon vassal se tient près. Le lien du foyer qui devrait le protéger paraît mince. Nous nous caressons tandis que le nom de leur époux reste non dit entre nous."
 sbs_orgy.2800.ff.desc: "La femme de mon vassal se tient près. Le lien du foyer qui devrait la protéger paraît mince. Nos mains circulent entre nos cuisses tandis que le nom de leur époux reste non dit entre nous."
 sbs_orgy.2800.a: "Un secret prudent."
 sbs_orgy.2800.a.tt: "Une précaution, puis je prends l'époux de mon vassal et garde la nuit secrète."
 sbs_orgy.2800.b: "Rien entre nous."
 sbs_orgy.2800.b.tt: "Je les prends tout entier. Le lien du foyer reste hors de la porte."
 sbs_orgy.2800.c: "Laissez la porte ouverte."
 sbs_orgy.2800.c.tt: "Je les prends avec prudence et laisse la porte ouverte. Cela n'a pas à finir quand les lampes s'éteignent."
 sbs_orgy.2800.d: "Appelez [sbs_orgy_vassal_spouse_owner.GetFirstName]."
 sbs_orgy.2800.d.tt: "Je fais venir [sbs_orgy_vassal_spouse_owner.GetFirstName] et les mets ensemble. Ils s'exécutent pour moi. Tous deux partent satisfaits de la manière dont je l'ai mené. Regarder et arranger me coûte plus qu'à eux."
 sbs_orgy.2800.e: "La parole suffira."
 sbs_orgy.2800.e.tt: "Pour l'heure, parler est déjà assez scandaleux. Les mains restent immobiles."

 sbs_orgy.2900.t: "Au-dessus du rang"
 sbs_orgy.2900.desc: "Loin de la salle formelle, [sbs_orgy_guest.GetFirstName] est encore mon suzerain, bien que le rang paraisse moins certain dans une pièce comme celle-ci."
 sbs_orgy.2900.fm.desc: "Mon suzerain se tient assez près pour que le rang devrait encore compter. Il ne compte plus. Sa main trouve la chaleur douce entre mes jambes ; je ferme les doigts sur la longueur dure de lui."
 sbs_orgy.2900.mf.desc: "Mon suzerain se tient assez près pour que le rang devrait encore compter. Il ne compte plus. Mes doigts trouvent la chaleur douce entre ses jambes ; elle me serre en retour."
 sbs_orgy.2900.mm.desc: "Mon suzerain se tient assez près pour que le rang devrait encore compter. Il ne compte plus. Nous fermons les mains l'un sur l'autre en même temps, la hiérarchie se dissolvant en simple chaleur."
 sbs_orgy.2900.ff.desc: "Mon suzerain se tient assez près pour que le rang devrait encore compter. Il ne compte plus. Nos mains glissent entre les cuisses de l'autre et trouvent la même disposition mouillée."
 sbs_orgy.2900.a: "Mettez le rang de côté."
 sbs_orgy.2900.a.tt: "Je prends mon suzerain avec une précaution et laisse la nuit n'être que des corps."
 sbs_orgy.2900.b: "Ma compagnie a un prix."
 sbs_orgy.2900.b.tt: "Je m'offre par la parole et l'art, et je demande un prix pour le privilège."
 sbs_orgy.2900.b.success: "Mes termes sont acceptés. La nuit continue à mes conditions."
 sbs_orgy.2900.b.failure: "Mon suzerain n'est pas persuadé. Le rang reprend sa place."
 sbs_orgy.2900.c: "Des mots seulement, mon seigneur."
 sbs_orgy.2900.c.tt: "Pour une fois, nous parlons simplement. Les mains restent immobiles. La hiérarchie demeure intacte."

 sbs_orgy.2920.t: "Un invité lié"
 sbs_orgy.2920.desc: "[sbs_orgy_guest.GetFirstName] attend avec le calme exercé de qui est habitué à recevoir des ordres. Ce soir offre plusieurs façons de répondre à cette obéissance."
 sbs_orgy.2920.fm.desc: "L'esclave attend. Au mot donné, il s'agenouille. Sa bouche s'ouvre pour moi ; ma main se ferme sur la longueur dure de lui. Le collier, ou la marque, ou le simple fait de la possession alourdit chaque geste."
 sbs_orgy.2920.mf.desc: "L'esclave attend. Au mot donné, elle s'agenouille ou s'ouvre. Mes doigts trouvent la chaleur douce entre ses jambes ; elle ne détourne pas le regard. Le collier, ou la marque, ou le simple fait de la possession alourdit chaque geste."
 sbs_orgy.2920.mm.desc: "L'esclave attend. Au mot donné, il s'agenouille. Nous nous caressons avec la clarté de l'ordre et de l'obéissance. Le collier, ou la marque, ou le simple fait de la possession alourdit chaque geste."
 sbs_orgy.2920.ff.desc: "L'esclave attend. Au mot donné, elle s'agenouille ou s'ouvre. Nos mains circulent entre nos cuisses avec la clarté de l'ordre et de l'obéissance. Le collier, ou la marque, ou le simple fait de la possession alourdit chaque geste."
 sbs_orgy.2920.a: "Sers de ta bouche."
 sbs_orgy.2920.a.tt: "Je les mets à genoux. Bouche et mains travaillent jusqu'à ce que le poids du commandement s'allège."
 sbs_orgy.2920.b: "Un ordre étrange."
 sbs_orgy.2920.b.tt: "Je donne un ordre qui n'a rien à voir avec le service ordinaire, et je les regarde obéir."
 sbs_orgy.2920.c: "Viens ici."
 sbs_orgy.2920.c.tt: "Plus de cérémonie. Une précaution, puis je les prends comme n'importe qui d'autre cette nuit."
 sbs_orgy.2920.d: "Pas cette nuit."
 sbs_orgy.2920.d.tt: "Je leur dis de s'asseoir et de respirer. La compassion plutôt que le commandement. Le collier peut attendre."


# Contest localization

# 3100 - Contest of Mouths
 sbs_orgy.3100.t: "Un concours de bouches"
 sbs_orgy.3100.desc: "Quelqu'un appelle un concours d'adresse. Un à un les volontaires s'avancent pour prendre un membre en bouche. Celui qui le prendra le plus profond et le tiendra le plus longtemps sans se retirer emportera la bourse."
 sbs_orgy.3100.male.desc: "Quand vient mon tour je m'agenouille et prends le membre offert. Je travaille d'abord lentement, puis plus profond, jusqu'à ce que la salle voie chaque pouce disparaître, la gorge pleine et les yeux humides."
 sbs_orgy.3100.female.desc: "Quand vient mon tour je m'agenouille et prends le membre offert. Je travaille d'abord lentement, puis plus profond, langue et gorge, jusqu'à ce que la salle voie jusqu'où je veux aller."
 sbs_orgy.3100.a: "Accepter le défi."
 sbs_orgy.3100.a.tt: "Je leur montrerai ce que ma bouche peut faire."
 sbs_orgy.3100.a.success: "Je prends plus profond et je tiens plus longtemps que quiconque. La bourse est placée dans mes mains parmi de discrets applaudissements."
 sbs_orgy.3100.a.failure: "Quelqu'un d'autre se montre plus habile. Je recule avec moins de dignité que je n'espérais."
 sbs_orgy.3100.b: "Seulement regarder."
 sbs_orgy.3100.b.tt: "Je reste parmi les spectateurs et laisse une autre bouche réclamer la bourse."

# 3200 - Who Lasts the Longest
 sbs_orgy.3200.t: "Qui dure le plus longtemps"
 sbs_orgy.3200.desc: "Un nouveau concours est lancé. Des paires se forment et le défi est simple : continuer le plus longtemps possible sans finir. La salle regarde et compte les minutes."
 sbs_orgy.3200.male.desc: "Je prends un partenaire consentant sous moi. La règle est claire : garder le rythme, continuer à pousser, et ne pas dépenser avant que tous les autres couples aient déjà cédé. La salle compte chaque minute à voix haute."
 sbs_orgy.3200.female.desc: "Je prends un partenaire consentant en moi. La règle est claire : continuer à bouger, garder le rythme, et ne pas finir avant que tous les autres couples aient déjà cédé. La salle compte chaque minute à voix haute."
 sbs_orgy.3200.a: "Accepter le défi."
 sbs_orgy.3200.a.tt: "Je prends mon partenaire. Que la salle voie combien je peux durer."
 sbs_orgy.3200.a.success: "Je dure plus longtemps que chaque autre couple. La bourse et la discrète envie de la salle sont à moi."
 sbs_orgy.3200.a.failure: "Je cède avant les autres. La salle s'en aperçoit aussitôt."
 sbs_orgy.3200.b: "Seulement regarder."
 sbs_orgy.3200.b.tt: "Je reste parmi les spectateurs et laisse d'autres couples courir contre les minutes."

# 3300 - The Most Rounds
 sbs_orgy.3300.t: "Le plus de tours"
 sbs_orgy.3300.desc: "Quelqu'un hausse l'enjeu. Le défi est maintenant l'endurance : qui peut prendre le plus de partenaires avant de devoir s'arrêter. On compte à voix haute pour que personne ne triche."
 sbs_orgy.3300.male.desc: "Je passe d'un partenaire consentant à l'autre. Chaque fois que je finis je ne me reprends que le temps de recommencer. La salle crie le nombre après chaque tour."
 sbs_orgy.3300.female.desc: "Je prends un partenaire consentant après l'autre. Chaque fois que l'un finit en moi ou sur moi, le suivant attend déjà. La salle crie le nombre après chaque tour."
 sbs_orgy.3300.a: "Accepter le défi."
 sbs_orgy.3300.a.tt: "Qu'ils comptent combien j'en peux prendre."
 sbs_orgy.3300.a.success: "Je prends plus de partenaires que quiconque avant de m'arrêter. La bourse est à moi."
 sbs_orgy.3300.a.failure: "Quelqu'un d'autre se montre plus implacable. Ce n'est pas moi qui ai le plus haut compte."
 sbs_orgy.3300.b: "Seulement regarder."
 sbs_orgy.3300.b.tt: "Je compte avec la salle et laisse les tours à quelqu'un de plus affamé."

# 3400 - Who Breaks First
 sbs_orgy.3400.t: "Qui cède le premier"
 sbs_orgy.3400.desc: "On propose un concours plus calme. Les volontaires s'allongent tandis que des mains et des bouches habiles travaillent sur eux. La règle est simple : ne pas finir. Le premier à céder perd."
 sbs_orgy.3400.male.desc: "Je m'allonge et laisse des mains et des bouches habiles travailler sur moi. Chaque souffle, chaque sursaut est regardé. Le premier à dépenser perd la bourse."
 sbs_orgy.3400.female.desc: "Je m'allonge et laisse des mains et des bouches habiles travailler entre mes jambes. Chaque souffle, chaque tremblement est regardé. La première à finir perd la bourse."
 sbs_orgy.3400.a: "Accepter le défi."
 sbs_orgy.3400.a.tt: "Qu'ils essaient de me briser."
 sbs_orgy.3400.a.success: "Je tiens plus longtemps que quiconque. La bourse et le discret respect de la salle sont à moi."
 sbs_orgy.3400.a.failure: "Je cède le premier. La salle le voit clairement."
 sbs_orgy.3400.b: "Je toucherai plutôt."
 sbs_orgy.3400.b.tt: "Je travaille d'une autre de mes mains et de ma bouche et laisse le concours d'endurance à eux."

# 3500 - Contest of Tongues
 sbs_orgy.3500.t: "Un concours de langues"
 sbs_orgy.3500.desc: "Quelqu'un appelle un autre défi. Un à un les volontaires baissent la bouche entre des cuisses offertes. Celui qui restera le plus longtemps et tirera le plus de son partenaire emportera la bourse."
 sbs_orgy.3500.male.desc: "Quand vient mon tour je baisse la bouche entre les cuisses offertes et travaille avec une attention soutenue. Langue et lèvres bougent jusqu'à ce que la salle entende combien je fais bien et combien je veux rester."
 sbs_orgy.3500.female.desc: "Quand vient mon tour je baisse la bouche entre les cuisses offertes et travaille avec une attention soutenue. Langue et lèvres bougent jusqu'à ce que la salle entende combien je fais bien et combien je veux rester."
 sbs_orgy.3500.a: "Accepter le défi."
 sbs_orgy.3500.a.tt: "Je leur montrerai ce que ma bouche peut faire."
 sbs_orgy.3500.a.success: "Je dure plus longtemps et tire plus de sons de mon partenaire que quiconque. La bourse est placée dans mes mains."
 sbs_orgy.3500.a.failure: "Quelqu'un d'autre se montre plus habile. Je recule avec moins de dignité que je n'espérais."
 sbs_orgy.3500.b: "Seulement regarder."
 sbs_orgy.3500.b.tt: "Je reste parmi les spectateurs et laisse une autre langue réclamer la bourse."

# Heavy / extreme localization

# 6100 - Female alone with animal
 sbs_orgy.6100.t: "Un autre genre d'invité"
 sbs_orgy.6100.desc: "Les portes s'ouvrent plus large que d'habitude. Quelque chose de grand et de chaud est mené dans la pièce au bout d'une corde épaisse. Les autres invités se taisent et reculent."
 sbs_orgy.6100.horse.desc: "Un cheval fort est avancé, déjà dur et lourd entre les jambes. On me guide à quatre pattes sous lui. Quand l'animal monte, la seule taille arrache un gémissement long et brisé. Chaque poussée profonde m'ouvre jusqu'à ce que je ne puisse plus que m'accrocher au sol et crier."
 sbs_orgy.6100.dog.desc: "Un grand chien est avancé, haletant et déjà suintant. Il me monte par-derrière sans hésiter, les hanches claquant de poussées vives. Le bruit mouillé et les grognements emplissent la pièce tandis que je gémis sous le poids."
 sbs_orgy.6100.pig.desc: "Un sanglier lourd est mené, grognant et déjà glissant. Quand il monte, la forme épaisse et émoussée s'enfonce d'une pression soutenue. Chaque poussée profonde tire de ma gorge un cri brut qui se mêle aux siens jusqu'à ce que la pièce résonne des deux."
 sbs_orgy.6100.a: "Le prendre tout entier."
 sbs_orgy.6100.a.tt: "Je ne peux retenir les sons. L'étirement et la chaleur sont trop forts — je gémis et je m'enfonce jusqu'à ce que la bête finisse au fond de moi."
 sbs_orgy.6100.b: "Repousse-le."
 sbs_orgy.6100.b.tt: "C'est simplement trop grand. Je repousse la bête avant qu'elle n'aille plus loin, haletant et tremblant au sol."

# 6200 - Guest leads female root like an animal
 sbs_orgy.6200.t: "Mené comme une bête"
 sbs_orgy.6200.desc: "[sbs_orgy_guest.GetFirstName] prend une laisse de cuir sur la table et l'attache au collier apporté. La salle regarde en silence tandis qu'on m'ordonne de me mettre à quatre pattes et de ramper."
 sbs_orgy.6200.horse.desc: "Après m'avoir forcé à aboyer sur ordre et à mouiller le sol comme un chien, [sbs_orgy_guest.GetFirstName] avance le cheval. On me place à quatre pattes sous l'animal. Le poids massif s'abat sur mon dos et la longueur épaisse s'enfonce, la laisse tenue courte."
 sbs_orgy.6200.dog.desc: "Après m'avoir forcé à aboyer et à mouiller le sol, [sbs_orgy_guest.GetFirstName] amène un grand chien. La bête me monte aussitôt, poussant fort et vite. L'invité tient la laisse tendue tandis que les bruits mouillés et les grognements emplissent l'air."
 sbs_orgy.6200.pig.desc: "Après m'avoir forcé à aboyer et à mouiller le sol, [sbs_orgy_guest.GetFirstName] amène un sanglier lourd. La forme émoussée et épaisse s'enfonce d'une pression soutenue tandis que l'invité tient la laisse courte et regarde chaque pouce disparaître."
 sbs_orgy.6200.a: "Obéis et prends-le."
 sbs_orgy.6200.a.tt: "Je reste à quatre pattes et prends la bête exactement comme on l'ordonne, gémissant sous l'étirement jusqu'à ce qu'elle finisse en moi."
 sbs_orgy.6200.b: "Supplier l'hôte plutôt."
 sbs_orgy.6200.b.tt: "Je me tourne et m'agenouille devant [sbs_orgy_guest.GetFirstName], implorant de les servir plutôt que la bête."
 sbs_orgy.6200.c: "Refuser."
 sbs_orgy.6200.c.tt: "J'arrache la laisse et me relève. Cela a dépassé tout jeu auquel je sois prêt à jouer."

# 6300 - Female root leads a female guest like an animal
 sbs_orgy.6300.t: "Ma propre bête"
 sbs_orgy.6300.desc: "Je prends la laisse de cuir et l'attache à [sbs_orgy_guest.GetFirstName]. La salle regarde tandis que je la fais ramper, aboyer sur ordre et mouiller le sol comme une bête dressée."
 sbs_orgy.6300.horse.desc: "Quand elle a assez joué son rôle, j'avance le cheval et la place à quatre pattes sous lui. L'animal lourd la monte tandis que je tiens la laisse courte et regarde chaque poussée profonde arracher un son brisé de sa gorge."
 sbs_orgy.6300.dog.desc: "Quand elle a assez joué son rôle, j'amène un grand chien. Il la monte avec empressement, les hanches claquant de poussées vives tandis que je tiens la laisse courte et la force à rester immobile pour lui."
 sbs_orgy.6300.pig.desc: "Quand elle a assez joué son rôle, j'amène un sanglier lourd. La forme épaisse et émoussée s'enfonce en elle tandis que je tiens la laisse et écoute les sons bruts qu'elle ne peut retenir."
 sbs_orgy.6300.a: "Force-la dessus."
 sbs_orgy.6300.a.tt: "Je la maintiens jusqu'à ce que la bête finisse au fond d'elle, puis je lui fais me remercier du privilège."
 sbs_orgy.6300.b: "Récompenser de mes mains."
 sbs_orgy.6300.b.tt: "J'arrête la bête et use plutôt de mes propres mains et de ma bouche, pour récompenser l'obéissance."

# 3600 - Vaginal beer contest
 sbs_orgy.3600.t: "Un autre genre de toast"
 sbs_orgy.3600.desc: "Les femmes présentes sont appelées. Des coupes de bière forte sont posées au sol. Le défi est dit clairement : tenir la coupe sans se servir des mains ni de la bouche. Celle qui dure le plus longtemps gagne la bourse. Le reste de la salle attend de voir qui cédera le premier."
 sbs_orgy.3600.a: "Accepter le défi."
 sbs_orgy.3600.a.tt: "Je m'installe au-dessus de la coupe, résolue à durer plus longtemps que toute autre femme."
 sbs_orgy.3600.a.success: "Je tiens plus longtemps que quiconque. La bourse est placée dans mes mains pendant que la salle applaudit la victoire."
 sbs_orgy.3600.a.failure: "Je ne peux plus tenir. La bière se répand et la salle décide du forfait sans pitié : chaque homme présent prend son tour avec nous deux avant que la nuit soit autorisée à finir."
 sbs_orgy.3600.b: "Refuser."
 sbs_orgy.3600.b.tt: "Certains jeux ne valent pas le prix d'une défaite."

# 1300-1400 indoor / 5100-5400 outdoor
 sbs_orgy.1300.t: "Le Haut Siège"
 sbs_orgy.1300.desc: "Le trône de l'hôte n'est plus vide. Deux corps l'ont pris, et la salle voit exactement à quoi sert le siège."
 sbs_orgy.1300.fm.desc: "Je suis à califourchon sur lui dans le siège sculpté, les accoudoirs durs contre mes cuisses. Chaque fois que je m'enfonce, le bois gémit. Ses mains retiennent mes hanches ; la salle en bas s'est tue."
 sbs_orgy.1300.mf.desc: "Je la garde sur mes genoux au haut siège, une main sous sa cuisse, l'autre sur l'accoudoir sculpté. Elle bouge contre moi à la vue de toute la salle. Le trône n'était pas fait pour cela, et c'est bien le propos."
 sbs_orgy.1300.mm.desc: "Il est sur mes genoux sur le trône de l'hôte, le dos contre ma poitrine, le bois sculpté qui nous mord tous les deux. Nous ne cachons pas le mouvement. Qui possède ce siège le sentira plus tard."
 sbs_orgy.1300.ff.desc: "Je l'ai sur le trône avec moi, une cuisse sur l'accoudoir, ma bouche à sa gorge pendant que ma main travaille entre ses jambes. Le siège était fait pour juger. Ce soir il tient quelque chose de plus humide."
 sbs_orgy.1300.a: "Prendre le siège avec prudence."
 sbs_orgy.1300.a.tt: "Je garde une précaution et je termine sur le trône. La salle se souviendra de la courtoisie autant que de la chaleur."
 sbs_orgy.1300.b: "Trouvez un autre endroit."
 sbs_orgy.1300.b.tt: "Le haut siège n'est pas un lit. Je les fais descendre du trône chercher un coin plus discret."
 sbs_orgy.1400.t: "Une pièce plus douce"
 sbs_orgy.1400.desc: "L'affaire est déjà commencée. [sbs_orgy_guest.GetFirstName] est encore contre moi quand vient la suggestion : quitter les salles publiques et finir cela dans un vrai lit."
 sbs_orgy.1400.fm.desc: "Il est encore dans le rythme lent commencé dans le passage. Sa bouche est à mon oreille. La chambre, dit-il, serait plus douce à mon dos que la pierre. Il ne s'arrête pas de bouger en demandant."
 sbs_orgy.1400.mf.desc: "Elle a un genou sur le banc et le souffle contre ma gorge. Le lit n'est qu'une porte plus loin. Elle veut les draps, le loquet fermé, le temps. Sa main ne me quitte pas en attendant la réponse."
 sbs_orgy.1400.mm.desc: "Nous sommes déjà à moitié finis contre le mur. Il désigne la chambre et ne retire pas sa main. Un lit nous laisserait durer. La salle n'aurait pas à l'entendre."
 sbs_orgy.1400.ff.desc: "Sa cuisse est encore accrochée à la mienne. Elle veut le lit : la porte close, les oreillers, de quoi rester jusqu'au matin. Ses doigts restent où ils sont jusqu'à ce que je choisisse."
 sbs_orgy.1400.a: "Prenons le lit."
 sbs_orgy.1400.a.tt: "Je les laisse m'y mener et nous finissons sans hâte. La porte close gagne plus de chaleur que la salle n'en donnerait jamais."
 sbs_orgy.1400.b: "Pourquoi pas le trône ?"
 sbs_orgy.1400.b.tt: "Je les tire vers le haut siège. La salle peut regarder. L'audace m'allège ; ils sont assez amusés pour pardonner le détour."
 sbs_orgy.1400.c: "Restons comme nous sommes."
 sbs_orgy.1400.c.tt: "Pas d'autre pièce. Je garde le rythme que nous avons déjà et je termine ici."
 sbs_orgy.5100.t: "Une procession de village"
 sbs_orgy.5100.desc: "L'orgie ne reste pas au champ. Vers le milieu du matin elle a débordé dans un pauvre village, une colonne de peaux nues entre les maisons, le soleil encore haut.\n\nUn homme pisse contre un montant sans rompre le pas. Un autre s'accroupit dans le ruisseau et ne lève pas les yeux. Quelqu'un tient la femme du boulanger contre le puits, les jupes déjà parties, la protestation déjà plus mince que la chaleur. On rentre les enfants. Les chiens aboient. Le prêtre, s'il y en a un, a trouvé un volet à fermer.\n\nPersonne ne mène. La colonne prend simplement la rue, riant, souillée, s'arrêtant partout où un mur ou une charrette tiendra un corps. L'autorité de ce lieu s'amincit à chaque porte qui reste close."
 sbs_orgy.5100.a: "Que la colonne continue."
 sbs_orgy.5100.a.tt: "La procession garde la rue jusqu'à ce que le village en ait assez vu. L'autorité qui reste ici mettra plus longtemps à répondre."
 sbs_orgy.5200.t: "Parmi les pierres"
 sbs_orgy.5200.desc: "[sbs_orgy_guest_a.GetFirstName] et [sbs_orgy_guest_b.GetFirstName] ont déjà choisi une dalle. Les noms gravés sont plus vieux que nous. L'herbe entre les tombes est couchée là où d'autres couples sont passés."
 sbs_orgy.5200.female.desc: "Je suis sur le dos au-dessus d'une inscription usée, l'un entre mes genoux, l'autre à genoux où je peux le prendre en bouche. La pierre est froide sous mes épaules. Chaque poussée fait tomber un peu de poussière des lettres. Quand je tourne la tête, je peux lire une date. Ils ne s'arrêtent pas pour autant."
 sbs_orgy.5200.male.desc: "J'en ai un penché sur une pierre penchée, l'autre assis sur la tombe à ma hanche pour que je puisse atteindre les deux. Les marques du ciseau accrochent la peau. Une couronne d'un deuil plus ancien est écrasée sous un genou. L'endroit sent la terre et le sexe dans le même souffle."
 sbs_orgy.5200.a: "C'est une profanation."
 sbs_orgy.5200.a.tt: "Je nous tire hors de la pierre avant que cela n'aille plus loin. Les morts ont droit à cela, même si la nuit n'en a pas."
 sbs_orgy.5200.b: "Les morts ne s'en soucieront pas."
 sbs_orgy.5200.b.tt: "Je garde les deux sur la tombe et je termine là. C'est le mal de la chose qui fait la chaleur."
 sbs_orgy.5300.t: "Après la longue journée"
 sbs_orgy.5300.desc: "Le camp n'a été qu'une seule longue étreinte depuis l'aube. Personne n'a remis d'habits. Les feux sont bas. Ce qui reste à manger est un peu à l'écart, au-delà des couchages encore mouillés de la dernière paire."
 sbs_orgy.5300.body.desc: "J'essaie de me lever pour y aller et mes cuisses ne veulent pas se fermer. Les muscles sont restés ouverts trop longtemps ; même l'essai tire une douleur crue dans l'aine. Ce qui a été versé continue de sortir de moi, lentement — du fondement, d'entre les jambes — et refroidit à l'intérieur de la cuisse avant d'atteindre le genou.\n\n[sbs_orgy_guest.GetFirstName] regarde la marche que je ne peux pas faire. L'offre est simple. Il apportera la nourriture. Je viendrai vers lui à quatre pattes, et j'aboirai quand il le dira."
 sbs_orgy.5300.a: "Manger ce que j'ai déjà."
 sbs_orgy.5300.a.tt: "Je ramasse sur deux doigts ce qui sort encore de moi et je le mets en bouche. C'est sel et chaleur. Ce n'est pas un repas. Cela suffit pour ne pas ramper."
 sbs_orgy.5300.b: "Agenouille-toi et aboie."
 sbs_orgy.5300.b.tt: "Je descends où je suis et je lui donne le son demandé. La nourriture vient. La dignité non."
 sbs_orgy.5300.c: "Rampe jusqu'à la nourriture."
 sbs_orgy.5300.c.tt: "Je pars vers le pot à quatre pattes, les cuisses encore ouvertes, la trace derrière moi jusqu'à la nourriture."
 sbs_orgy.5400.t: "Le feu suivant"
 sbs_orgy.5400.desc: "Le jour n'a pas vidé le camp. Les couches restent où on les a poussées. Les femmes vont d'un feu à l'autre sans se rhabiller ; le travail du matin se lit encore sur elles — un luisant à l'intérieur de la cuisse, une marque à la gorge, une démarche qui n'a pas encore rappelé comment être ordinaire."
 sbs_orgy.5400.body.desc: "[sbs_orgy_guest.GetFirstName] ne s'est pas relevée. Elle est allongée sur un manteau ouvert, les genoux tombés de chaque côté, trop usée pour les rejoindre, le dernier versement trouvant encore le tissu sous elle. Quand je m'approche, elle ne se couvre pas. Elle demande seulement si j'apporterai ce qui reste dans le pot."
 sbs_orgy.5400.a: "Apporte le pot."
 sbs_orgy.5400.a.tt: "Je vais chercher ce qui reste et je le pose à sa portée. Elle se souvient de la courtoisie."
 sbs_orgy.5400.b: "Pas avant de t'avoir encore."
 sbs_orgy.5400.b.tt: "Le pot peut attendre. Je la prends où elle est. Elle me laisse faire. Elle ne me remercie pas."
 sbs_orgy.5400.c: "Nourris-la de ce qu'elle contient déjà."
 sbs_orgy.5400.c.tt: "Je mets deux doigts en elle, ramasse ce que d'autres hommes ont laissé, et le pose sur sa langue. Elle avale faute de mieux. Elle n'oubliera pas qui l'y a contrainte."

# 6400 extreme paddock
 sbs_orgy.6400.t: "Le paddock"
 sbs_orgy.6400.desc: "Le paddock est en plein soleil. Ni tente, ni nuit. Les chevaux ont été menés sur la même terre piétinée que le camp, et les femmes ont été mises avec eux."
 sbs_orgy.6400.body.desc: "[sbs_orgy_horse_girl.GetFirstName] n'a pas attendu qu'on le lui dise deux fois. Elle est à genoux dans la poussière, un étalon déjà enfoncé jusqu'à la garde. Le fût est assez gros pour que son ventre se lève et retombe avec lui — une crête dure qui voyage sous la peau à chaque foulée dans son corps.\n\nLes autres femmes sont poussées dans la même voie. Les hommes restent à la barrière et regardent. Quelqu'un rit. Le cheval, non."
 sbs_orgy.6400.a: "En prendre un."
 sbs_orgy.6400.a.tt: "Je m'agenouille au soleil près d'elle et je laisse le prochain étalon me prendre. La taille en reste dans le corps longtemps après le silence du paddock."
 sbs_orgy.6400.b: "Servir les hommes plutôt."
 sbs_orgy.6400.b.tt: "Je laisse les chevaux à celles qui les veulent et je prends chaque homme à la barrière, l'un après l'autre, avec précaution. [sbs_orgy_horse_girl.GetFirstName] est encore sous l'étalon quand j'ai fini."

