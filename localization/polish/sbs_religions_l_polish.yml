l_polish:
 demonic_religion: "Satanizm"
 demonic_religion_adj: "Satanistyczna"
 demonic_religion_adherent: "Satanista"
 demonic_religion_adherent_plural: "Sataniści"
 demonic_religion_desc: "Satanizm to religia, która czci demony. Często jest kojarzona z kultem Szatana, ale nie wszyscy demoniści czczą Szatana."
 satan: "Satanizm"

 nature: "Naturyzm"
 nature_adj: "Naturystyczny"
 nature_adherent: "Naturzysta"
 nature_adherent_plural: "Naturzyści"
 nature_desc: "Naturyzm to religia, która czci czystość natury i odrzuca społeczne konwenanse, wierząc, że noszenie ubrań jest sprzeczne z naturalnym porządkiem. Wyznawcy naturyzmu wierzą, że prawdziwą harmonię z ziemią można osiągnąć jedynie poprzez pełne fizyczne i duchowe odsłonięcie. Przywódcą tej religii jest Belzebub, potężny demon, który budzi szacunek wszystkich naturystów i jest postrzegany jako ostateczne ucieleśnienie dzikich sił natury."

 pleasure: "Rozwiązłość"
 pleasure_adj: "Rozwiązły"
 pleasure_adherent: "Rozwiązłysta"
 pleasure_adherent_plural: "Rozwiązłysi"
 pleasure_desc: "Rozwiązłość to religia, która czci przyjemność, zmysłowość i hedonizm jako najwyższe wartości. Wyznawcy są zachęcani do swobodnego wyrażania swojej seksualności i doświadczania wszelkich przyjemności życia bez zahamowań. Na czele Rozwiązłości stoi Lilith, demonica namiętności i pożądania, która przewodzi swoim wyznawcom z magnetycznym urokiem, promując wolność seksualną i ekstazę."

 violence: "Gwałtownictwo"
 violence_adj: "Gwałtowniczy"
 violence_adherent: "Gwałtownik"
 violence_adherent_plural: "Gwałtownicy"
 violence_desc: "Violentism gloryfikuje wojnę, przemoc i brutalność jako najwyższe cnoty, promując siłę i dominację poprzez walkę. Wyznawcy są zachęcani do traktowania konfliktu jako drogi do osobistej i zbiorowej wielkości. Na czele Violentism stoi Abaddon, dziki demon zniszczenia, którego imię budzi przerażenie i który prowadzi swoich wojowników żelazną pięścią, broniąc drogi śmierci i podboju."

 greedy: "Chciwość"
 greedy_adj: "Chciwy"
 greedy_adherent: "Chciwy"
 greedy_adherent_plural: "Chciwcy"
 greedy_desc: "Chciwość to religia, która czci bogactwo, materializm i gromadzenie dóbr jako najwyższe cele. Wyznawcy są zachęcani do dążenia do bogactwa za wszelką cenę, wierząc, że posiadanie dóbr materialnych jest oznaką boskiego błogosławieństwa. Na czele Chciwości stoi Mammon, przebiegły demon bogactwa i zachłanności, który kusi swoich wyznawców obietnicami nieograniczonego bogactwa i dobrobytu."

