l_spanish:
 carnia_buy_from_slave_market: "Comprar en el mercado de esclavos"
 carnia_buy_from_slave_market_desc: "Visitar un mercado discreto e inspeccionar a las personas puestas a la venta."
 carnia_buy_from_slave_market_tooltip: "Se presentará una oferta aleatoria del mercado de esclavos."
 carnia_buy_from_slave_market_effect: "Se presenta una oferta al azar. Completar la compra cuesta una suma menor de [gold|E] oro y añade esclavos [lowborn|E] a tu casa."
 carnia_buy_from_slave_market_confirm: "Visitar el mercado"

 carnia_slave_market.0002.t: "Cuatro lotes"
 carnia_slave_market.0002.desc: "El corredor tiene cuatro lotes en la misma cuerda. [carnia_slave_man.GetFirstName] y [carnia_slave_woman.GetFirstName] son jóvenes. [carnia_slave_child.GetFirstName] es aún pequeño. [carnia_slave_old.GetFirstName] ya ha vivido."
 carnia_slave_market.0002.a: "Me llevo a [carnia_slave_man.GetFirstName]."
 carnia_slave_market.0002.b: "Me llevo a [carnia_slave_woman.GetFirstName]."
 carnia_slave_market.0002.c: "Me llevo a [carnia_slave_child.GetFirstName]."
 carnia_slave_market.0002.d: "Me llevo a [carnia_slave_old.GetFirstName]."
 carnia_slave_market.0002.e: "No compro a ninguno."
 carnia_slave_market.0003.t: "Una casa caída"
 carnia_slave_market.0003.desc: "[carnia_slave_noble.GetFirstName] aún lleva un nombre. Su fe os es hostil, ningún señor responde por él, ningún pariente sostiene un trono."
 carnia_slave_market.0003.a: "Un nombre aún se puede comprar."
 carnia_slave_market.0003.b: "Que otro comprador lo encuentre."
 carnia_slave_market.0004.t: "Un peregrino lejano"
 carnia_slave_market.0004.desc: "[carnia_slave_pilgrim.GetFirstName] no viene de ninguna corte con la que tratéis. El camino lo trajo aquí."
 carnia_slave_market.0004.a: "El camino acaba en mi casa."
 carnia_slave_market.0004.b: "Un peregrino no es asunto mío."
 carnia_slave_market.0005.t: "Dos contratos"
 carnia_slave_market.0005.desc: "El corredor presenta dos contratos juntos. [carnia_slave_a.GetFirstName] y [carnia_slave_b.GetFirstName] están cerca."
 carnia_slave_market.0005.a: "Me llevo a ambos."
 carnia_slave_market.0005.b: "Solo [carnia_slave_a.GetFirstName]."
 carnia_slave_market.0005.c: "Solo [carnia_slave_b.GetFirstName]."
 carnia_slave_market.0005.d: "Buscad otra casa."
 carnia_slave_market.0006.t: "Una familia atada"
 carnia_slave_market.0006.desc: "El corredor trae a [carnia_slave_mother.GetFirstName] con su hijo, [carnia_slave_child.GetFirstName]. Piden solo no ser separados."
 carnia_slave_market.0006.a: "Mantenedlos juntos bajo mi techo."
 carnia_slave_market.0006.b: "Solo la madre."
 carnia_slave_market.0006.c: "Solo el niño."
 carnia_slave_market.0006.d: "Su suerte está en otra parte."
 carnia_slave_market.0007.t: "Dos corazones, un precio"
 carnia_slave_market.0007.desc: "[carnia_slave_lover_a.GetFirstName] y [carnia_slave_lover_b.GetFirstName] están tan cerca que se tocan los hombros."
 carnia_slave_market.0007.a: "Seguirán juntos."
 carnia_slave_market.0007.b: "Solo [carnia_slave_lover_a.GetFirstName]."
 carnia_slave_market.0007.c: "Solo [carnia_slave_lover_b.GetFirstName]."
 carnia_slave_market.0007.d: "No compraré su promesa."
 carnia_slave_market.0008.t: "Una oferta rara"
 carnia_slave_market.0008.desc: "Un último contrato se ofrece con inusitada seguridad. [carnia_slave_good.GetFirstName] está sano y bien formado."
 carnia_slave_market.0008.a: "Un siervo raro vale el oro."
 carnia_slave_market.0008.b: "La rareza no me obliga."
