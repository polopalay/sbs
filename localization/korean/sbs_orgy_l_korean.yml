 sbs_orgy.0002.t: "빈 집"
 sbs_orgy.0002.desc: "방은 준비되었으나 오기로 한 손님은 오지 않는다. 등은 아무도 위해 타지 않는다."
 sbs_orgy.0002.a: "불을 꺼라."

 sbs_orgy.1100.t: "사적인 합의"
 sbs_orgy.1100.desc: "[sbs_orgy_guest.GetFirstName]는 피부의 온기가 닿을 만큼 가까이 선다."
 # Female root + Male guest
 sbs_orgy.1100.fm.1.desc: "그의 손이 허리에 닿았다가 엉덩이 선을 따른다. 몸을 기울이면 입이 맞닿는다. 얇은 옷감 너머로 이미 단단한 열이 손바닥에 전해진다."
 sbs_orgy.1100.fm.2.desc: "틈이 없어질 때까지 다가선다. 숨이 목덜미에 따뜻하다. 한 손은 가슴에, 다른 손은 그 열을 찾을 뿐 아직은 더 나아가지 않는다."
 sbs_orgy.1100.fm.3.desc: "그가 나를 벽에 끌어당긴다. 입이 목에, 이어 입술에 따뜻하다. 손이 옷감 너머로 가슴을 감싸고 그 자리에 머문다."
 sbs_orgy.1100.fm.4.desc: "그의 손을 엉덩이로, 이어서 조금만 아래로 이끈다. 내 열이 느껴질 만큼만. 그가 침을 삼킨다. 아직 다음을 정한 사람은 없다."
 sbs_orgy.1100.fm.5.desc: "벽에 밀린다. 한 손은 가슴을, 다른 손은 허벅지 위쪽에 있어 작은 움직임까지 느껴진다."
 sbs_orgy.1100.fm.6.desc: "몸을 기울여 천천히 입맞춘다. 물러설 때 손은 아직 허리띠에 있다. 그의 손가락은 머리카락에 머문 채 밀지도 당기지도 않는다."
 sbs_orgy.1100.fm.7.desc: "엄지가 허벅지 안쪽을 따른다. 손을 내려 옷감 너머로 쥐면 맥박이 손바닥에 닿는다. 잠시 그대로 머문다."
 sbs_orgy.1100.fm.8.desc: "낮은 소파에 쓰러져 입을 벌리고 손이 헤맨다. 몸이 따뜻하게 맞닿는다. 다음 단계는 아직 선택이다."
 # Male root + Female guest
 sbs_orgy.1100.mf.1.desc: "손이 엉덩이를, 이어 허벅지의 온기를 찾는다. 이미 숨이 가쁘다. 옷감 너머로 나를 쥐면 더 이상 대화인 척할 수 없다."
 sbs_orgy.1100.mf.2.desc: "목을, 이어 입을 향해 고개를 숙인다. 피부 냄새가 날카롭고 맑다. 손은 허벅지 위에 머문다."
 sbs_orgy.1100.mf.3.desc: "가슴을 따라 입맞추다 더 나아가기 직전에 멈춘다. 한 손은 허벅지에, 다른 손은 허리띠 선을 따른다."
 sbs_orgy.1100.mf.4.desc: "손가락이 허벅지 사이에 놓여 이미 준비된 열을 느낀다. 빈 손은 같은 느린 속도로 옷감 너머를 쓸어 내린다."
 sbs_orgy.1100.mf.5.desc: "소파로 밀리고 무릎 위에 앉힌다. 입이 맞닿는다. 다음 선택이 분명할 만큼 가깝다."
 sbs_orgy.1100.mf.6.desc: "엉덩이가 맞닿을 때까지 끌어당긴다. 따뜻하고 기꺼이 한다. 어디까지 갈지 정할 때를 기다린다."
 sbs_orgy.1100.mf.7.desc: "손이 나를 감싸고 내 손은 허벅지 사이에 머문다. 오래 그대로 두며 더 나아가지 않은 채 서로의 박자를 익힌다."
 sbs_orgy.1100.mf.8.desc: "앞에 무릎 꿇고 올려다본다. 손이 허벅지에 놓인다. 초대는 분명하다. 결정은 아직 내 것이다."
 # Male + Male
 sbs_orgy.1100.mm.1.desc: "손이 엉덩이를, 옷감 너머의 열을 찾는다. 같은 손길을 되돌린다. 입이 열리고 서두르지 않고 맞닿는다."
 sbs_orgy.1100.mm.2.desc: "가슴이 맞닿을 때까지 다가선다. 손이 그에게 닿자 숨이 멎는다. 누구도 더 나아가지 않았다."
 sbs_orgy.1100.mm.3.desc: "몸을 기울여 세게 입맞춘다. 손은 허리띠에 머문다. 손가락은 머리카락에 남아 밀지도 당기지도 않는다."
 sbs_orgy.1100.mm.4.desc: "가까이 선다. 두 손이 동시에 옷감 위를 움직인다. 사이 좁은 틈은 이미 너무 덥다."
 sbs_orgy.1100.mm.5.desc: "그를 돌리고 등에 몸을 붙인다. 한 손이 감싼다. 더 정하기 전에 숨만 고르며 머문다."
 sbs_orgy.1100.mm.6.desc: "입이 목으로, 이어 더 아래로 내려가다 멈춘다. 손을 목덜미에 올린다. 다음은 아직 선택이다."
 sbs_orgy.1100.mm.7.desc: "손이 옷감과 피부 위를 함께 움직인다. 그가 몸을 기댄다. 누구도 아직 끝내지 않았다."
 sbs_orgy.1100.mm.8.desc: "이마가 맞닿는다. 손은 그 자리에 머문다. 밤은 아직 열려 있다."
 # Female + Female
 sbs_orgy.1100.ff.1.desc: "손이 엉덩이에, 이어 따뜻한 허벅지 피부에 놓인다. 같은 동작이 돌아온다. 서로의 박자를 익히며 머문다."
 sbs_orgy.1100.ff.2.desc: "입을 목으로, 이어 입술에 내린다. 손이 목덜미에 놓여 힘주지 않고 이끈다."
 sbs_orgy.1100.ff.3.desc: "소파로 밀리고 무릎 위에 앉힌다. 입이 맞닿는다. 몸을 기울이자 허벅지가 조인다."
 sbs_orgy.1100.ff.4.desc: "손가락이 허벅지 사이에 놓여 이미 따뜻한 열을 찾는다. 같은 손길이 돌아온다. 방이 고요한 숨으로 찬다."
 sbs_orgy.1100.ff.5.desc: "옆으로 누워 밀착하고 입은 서로의 목에 있다. 박자는 느리다. 서두르는 이는 없다."
 sbs_orgy.1100.ff.6.desc: "다시 입맞추자 몸이 떤다. 열린 채로 기다리는 순간이 있고, 그다음 더할 것을 고른다."
 sbs_orgy.1100.ff.7.desc: "손이 다리 사이에 놓이고 입은 목에 머문다. 이미 둘 다 덥다. 나머지는 아직 선택이다."
 sbs_orgy.1100.ff.8.desc: "몸이 떨릴 때까지 입맞춘다. 손은 엉덩이와 허벅지에 머문다. 그 이상은 아직 정해지지 않았다."
 # Options - more detailed
 sbs_orgy.1100.a: "우리 사이에 아무것도 두지 않겠다."
 sbs_orgy.1100.a.tt: "끌어당겨 남김없이 받는다. 살과 살. 더는 그저 스침이었다고 말할 수 없을 때까지."
 sbs_orgy.1100.b: "조심 없이는 안 된다."
 sbs_orgy.1100.b.tt: "먼저 한 가지 조심을 한다. 그다음, 몸을 떨게 하는 곳을 서두르지 않고 다룬다."
 sbs_orgy.1100.c: "오늘 밤으로 끝내지 마라."
 sbs_orgy.1100.c.tt: "조심히 받은 뒤, 다른 밤을 이야기한다. 이 몸을 다시 알고 싶다."
 sbs_orgy.1100.e: "사랑이라면 무엇을 바라겠는가."
 sbs_orgy.1100.e.tt: "손을 멈춘 채 사랑에 대해 말한다. 답이 위험하더라도."

 # Dirty talk (khẩu dâm) - gender variants
 sbs_orgy.1100.d_fm: "어떻게 할지 말해."
 sbs_orgy.1100.d_fm.tt: "나를 어떻게 쓰고 싶은지 정확히 말해. 아직 손이 다리 사이에 있는 동안."
 sbs_orgy.1100.d_mf: "무엇을 원하는지 말해."
 sbs_orgy.1100.d_mf.tt: "내가 무엇을 하길 원하는지 말해. 손가락이 아직 안에 있는 동안, 모조리 듣고 싶다."
 sbs_orgy.1100.d_mm: "얼마나 세게 원하는지 말해."
 sbs_orgy.1100.d_mm.tt: "얼마나 세게 원하는지 말해. 쓰다듬는 동안 입과 손이 무엇을 하길 바라는지."
 sbs_orgy.1100.d_ff: "어디에 하길 원하는지 말해."
 sbs_orgy.1100.d_ff.tt: "입과 손가락을 어디에 두길 원하는지 정확히 말해. 만지는 동안 그 말을 듣고 싶다."

 # Mutual fondling / mutual masturbation
 sbs_orgy.1100.f_fm: "손만으로."
 sbs_orgy.1100.f_fm.tt: "다리 사이에서 움직이는 손가락에 답하며, 손으로 상대를 어루만져 둘 다 끝날 때까지."
 sbs_orgy.1100.f_mf: "손만으로."
 sbs_orgy.1100.f_mf.tt: "손가락을 안에 둔 채, 천천히 어루만기며 더는 참지 못할 때까지."
 sbs_orgy.1100.f_mm: "손만으로."
 sbs_orgy.1100.f_mm.tt: "같은 박자로 서로를 어루만지며 반응을 보다가, 둘 다 끝날 때까지."
 sbs_orgy.1100.f_ff: "손과 입만으로."
 sbs_orgy.1100.f_ff.tt: "서로를 만져 젖고 떨릴 때까지. 그 이상은 가지 않는다."





 sbs_orgy.1200.t: "셋이서의 자리"
 sbs_orgy.1200.desc: "[sbs_orgy_guest_a.GetFirstName]와 [sbs_orgy_guest_b.GetFirstName]가 더 고요한 구석으로 온다. 셋 사이의 공기는 이미 덥다."
 sbs_orgy.1200.male.desc: "양쪽에서 몸이 밀착한다. 손이 팔과 허리, 옷자락을 스친다. 입이 목과 입을 찾는다. 뜨겁고 미완인 채 누가 선택될지 기다린다."
 sbs_orgy.1200.female.desc: "양쪽에서 몸이 밀착한다. 손이 팔과 허리, 옷자락을 스친다. 입이 목과 입을 찾는다. 뜨겁고 미완인 채 누가 선택될지 기다린다."
 sbs_orgy.1200.a: "오직 [sbs_orgy_guest_a.GetFirstName]뿐."
 sbs_orgy.1200.a.tt: "[sbs_orgy_guest_a.GetFirstName]을 끌어당긴다. 오늘 밤은 한 몸이면 충분하다."
 sbs_orgy.1200.b: "오직 [sbs_orgy_guest_b.GetFirstName]뿐."
 sbs_orgy.1200.b.tt: "[sbs_orgy_guest_b.GetFirstName]을 끌어당긴다. 오늘 밤은 한 몸이면 충분하다."
 sbs_orgy.1200.c: "우리 셋이."
 sbs_orgy.1200.c.tt: "아무도 빼놓지 않는다. 손과 입이 오가며 쾌락이 누구의 것인지 알 수 없을 때까지."
 sbs_orgy.1200.d: "욕망을 말하자."
 sbs_orgy.1200.d.tt: "손이 아직 헤매는 동안, 각자 원하는 바를 숨기지 않고 말한다."
 sbs_orgy.1200.e: "서로를 향해 밀어라."
 sbs_orgy.1200.e.tt: "서로를 향하게 하고 볼 수 있을 만큼만 곁에 선다. 맞닿는 것은 그들의 몸이지, 내 몸은 아니어도 된다."

 sbs_orgy.4100.t: "벗은 왕관"
 sbs_orgy.4100.desc: "[sbs_orgy_nudity_guest.GetFirstName]가 조심스러운 예로 묻는다. 통치자가 옷 없이 자주 보인다면, 백성은 같은 존경으로 볼 수 있는가."
 sbs_orgy.4100.male.desc: "등불 아래 완전히 벗고 선다. 어깨를 펴고, 많은 눈 아래에서 것이 부드럽다 굵어진다. 가릴 생각은 없다. 근육의 선과 다리 사이의 무게를 보게 하라."
 sbs_orgy.4100.female.desc: "등불 아래 완전히 벗고 선다. 어깨를 펴고 가슴과 허벅지 사이의 부드러운 삼각형이 모든 눈에 열린다. 가릴 생각은 없다. 곡선과 이미 고이는 축축함을 보게 하라."
 sbs_orgy.4100.a: "보게 두어라."
 sbs_orgy.4100.a.tt: "합당한 몸에 가림은 필요 없다. 천천히 돌아 모든 각이 보이게 한다."
 sbs_orgy.4100.b: "그 순진함을 받들어라."
 sbs_orgy.4100.b.tt: "에덴의 아담과 하와는 부끄러움을 몰랐다. 열린 손과 열린 몸으로 그 순진함을 받든다."
 sbs_orgy.4100.c: "빛에게 맡기라."
 sbs_orgy.4100.c.tt: "옷은 아름다움을 가리기만 하는 것이 아니라 돋보이게 해야 한다."
 sbs_orgy.4100.d: "그 질문은 두어라."
 sbs_orgy.4100.d.tt: "수수께끼에는 답하지 않는다. 이대로 서서, 방이 그 모습에 익숙해질 때까지 둔다."

 sbs_orgy.4200.t: "가장 아름다운 형체"
 sbs_orgy.4200.desc: "무심한 칭찬이 시합이 된다. 적어도 다섯이 등불 아래 서고, 자리가 누구의 자태가 가장 큰 찬사를 받을지 정한다."
 sbs_orgy.4200.male.desc: "다른 이들 사이에 완전히 벗고 선다. 빛 아래 근육이 움직이고 것이 드러난다. 차례가 오면 천천히 돌아, 몸의 선과 다리 사이 무게를 모든 눈이 재게 한다."
 sbs_orgy.4200.female.desc: "다른 이들 사이에 완전히 벗고 선다. 가슴과 엉덩이, 허벅지 사이의 부드러운 주름이 판단에 열린다. 차례가 오면 천천히 돌아, 곡선과 이미 보이는 축축함을 모든 눈이 재게 한다."
 sbs_orgy.4200.a: "힘을 보여라."
 sbs_orgy.4200.a.tt: "방이 잠잠해질 때까지 자세를 유지한다."
 sbs_orgy.4200.b: "매혹으로 이겨라."
 sbs_orgy.4200.b.tt: "웃고 몸을 돌려, 볼 만한 이는 나라고 방이 스스로 결정하게 한다."
 sbs_orgy.4200.c: "영리한 자세."
 sbs_orgy.4200.c.tt: "모든 시선이 모일 만큼만 몸을 살짝 옮긴다."
 sbs_orgy.4200.d: "경기를 쓸모 있게."
 sbs_orgy.4200.d.tt: "가장 가까운 몸을 끌어당겨, 경기를 더 나은 일에 쓴다."

 sbs_orgy.2100.t: "익숙한 불편"
 sbs_orgy.2100.desc: "방의 자유에도 [sbs_orgy_guest.GetFirstName]와 나는 머뭇거린다. 피는 어떤 침묵을 다른 것보다 무겁게 한다."
 sbs_orgy.2100.fm.desc: "다 큰 자식이 벗은 채로 앞에 선다. 한때 생각조차 못 하게 했던 같은 피가 이제 열만 더 날카롭게 한다. 손이 엉덩이를 찾고, 내 손은 단단한 길이를 찾는다."
 sbs_orgy.2100.mf.desc: "다 큰 자식이 벗은 채로 앞에 선다. 같은 피가 열만 더 날카롭게 한다. 손이 다리 사이 부드러운 주름을 찾고, 이미 젖어 있다."
 sbs_orgy.2100.mm.desc: "다 큰 아들이 벗은 채로 앞에 선다. 같은 피가 열만 더 날카롭게 한다. 손이 동시에 서로를 쥔다."
 sbs_orgy.2100.ff.desc: "다 큰 딸이 벗은 채로 앞에 선다. 같은 피가 열만 더 날카롭게 한다. 손이 서로의 허벅지 사이로 미끄러져 같은 젖은 준비를 찾는다."
 sbs_orgy.2100.a: "우리 사이에 아무것도 두지 않겠다."
 sbs_orgy.2100.a.tt: "남김없이 받는다. 살과 살, 피와 피. 더는 가까움일 뿐이라고 말할 수 없을 때까지."
 sbs_orgy.2100.b: "조심 없이는 안 된다."
 sbs_orgy.2100.b.tt: "먼저 한 가지 조심을 한다. 밤은 친밀하되, 무모하지는 않다."
 sbs_orgy.2100.c: "아침 너머까지 남게 하라."
 sbs_orgy.2100.c.tt: "우리를 묶는 것은 부끄러움이 아니라 성스러움이다. 아침 너머까지 남을 수 있는 밤으로 둔다."
 sbs_orgy.2100.d: "손과 입만으로."
 sbs_orgy.2100.d.tt: "손과 입에 머문다. 맛볼 만큼은 가깝고, 경계를 잊을 만큼은 아니다."
 sbs_orgy.2100.e: "여기까지다. 더는 아니다."
 sbs_orgy.2100.e.tt: "열이 우리를 대신해 결정하기 전에 물러선다. 오늘 밤, 피줄은 경계로 남는다."

 sbs_orgy.2200.t: "혼인으로"
 sbs_orgy.2200.desc: "[sbs_orgy_guest.GetFirstName]는 [sbs_orgy_child.GetFirstName]를 통해 내 집에 들어왔다. 오늘 밤 그 익숙한 유대는 낮보다 단순하지 않다."
 sbs_orgy.2200.fm.desc: "자식의 배우자가 가까이 선다. 집을 묶는 혼인이 오늘 밤은 얇다. 손이 허리에 닿고, 이미 얼마나 준비됐는지 느껴진다."
 sbs_orgy.2200.mf.desc: "자식의 배우자가 가까이 선다. 혼인이 오늘 밤은 얇다. 손가락이 다리 사이 부드러운 열을 찾고, 물러서지 않는다."
 sbs_orgy.2200.mm.desc: "자식의 남편이 가까이 선다. 혼인이 얇다. 더 말 없이 손이 서로를 쥔다."
 sbs_orgy.2200.ff.desc: "자식의 아내가 가까이 선다. 혼인이 얇다. 손이 서로의 허벅지 사이로 미끄러져 같은 젖은 열을 찾는다."
 sbs_orgy.2200.a: "우리 사이에 아무것도 두지 않겠다."
 sbs_orgy.2200.a.tt: "낮이라면 그들의 것이라 부를 것을 취한다. 우리 사이엔 순간의 열뿐."
 sbs_orgy.2200.b: "조심 없이는 안 된다."
 sbs_orgy.2200.b.tt: "한 가지 조심. 이어질 인연이 아니라 하룻밤으로 둔다."
 sbs_orgy.2200.c: "가까이만 있어라. 그 이상은 아니다."
 sbs_orgy.2200.c.tt: "온기와 헤매는 손에 머문다. 혼인은 입에 올리지도, 넘지도 않는다."
 sbs_orgy.2200.d: "혼인에 대해 말하자."
 sbs_orgy.2200.d.tt: "그 인연을 소리 내어 부른다. [sbs_orgy_child.GetFirstName] 이야기를 하며 열이 다른 곳으로 가게 한다."

 sbs_orgy.2300.t: "우정의 증거"
 sbs_orgy.2300.desc: "벗, 혹은 가장 가까운 벗이 가까이 선다. 오래된 신뢰가 또 하나의 몸처럼 사이에 앉는다. 오늘 밤 다른 것이 될 수 있다."
 sbs_orgy.2300.fm.desc: "벗의 피부 온기가 닿을 만큼 가깝다. 오랜 신뢰가 첫 손길을 쉽게 한다. 쓸어 주는 동안 손바닥에 단단해지고, 손가락은 이미 젖은 나를 찾는다."
 sbs_orgy.2300.mf.desc: "벗의 피부 온기가 닿을 만큼 가깝다. 오랜 신뢰가 첫 손길을 쉽게 한다. 손가락이 허벅지 사이로 미끄러져 젖은 것을 찾고, 대답으로 나를 쥔다."
 sbs_orgy.2300.mm.desc: "벗의 피부 온기가 닿을 만큼 가깝다. 오랜 신뢰가 첫 손길을 쉽게 한다. 같은 느린 박자로 서로를 쓸며 반응을 본다."
 sbs_orgy.2300.ff.desc: "벗의 피부 온기가 닿을 만큼 가깝다. 오랜 신뢰가 첫 손길을 쉽게 한다. 손과 입이 서로의 허벅지 사이를 오가며 둘 다 떨 때까지 한다."
 sbs_orgy.2300.a: "이렇게 증명하라."
 sbs_orgy.2300.a.tt: "막힘 없이 받아, 쌓아 온 신뢰를 더 뜨거운 것으로 만든다."
 sbs_orgy.2300.b: "조심 없이는 안 된다."
 sbs_orgy.2300.b.tt: "한 가지 조심. 신뢰의 세월은 열이 되지만, 오래 남을 주장은 되지 않는다."
 sbs_orgy.2300.c: "친구 이상이다."
 sbs_orgy.2300.c.tt: "조심히 받아, 오래된 신뢰를 연인의 인연으로 만든다."
 sbs_orgy.2300.d: "우리가 어떻게 시작했는지 기억하라."
 sbs_orgy.2300.d.tt: "더 오래된 밤과 더 수월하던 날을 이야기한다. 손은 그대로 둔다. 우정으로 충분하다."

 sbs_orgy.2400.t: "사적인 휴전"
 sbs_orgy.2400.desc: "라이벌이 좁은 공간 건너편에 선다. 증오는 늘 친밀의 일종이었다. 오늘 밤 사이 공기는 다른 것을 띤다."
 sbs_orgy.2400.fm.desc: "라이벌의 손은 마침내 닿을 때 거칠다. 나를 꺾으려 했던 같은 분노가 이제 열어 주길 바란다. 허벅지에 단단함이 닿고 옛 증오가 열로 풀어진다."
 sbs_orgy.2400.mf.desc: "라이벌의 몸은 마침내 만질 때 팽팽하다. 같은 분노가 손가락 아래 열린다. 입맞추기도 전에 젖어 있다."
 sbs_orgy.2400.mm.desc: "라이벌의 쥐는 손이 마침내 만날 때 세다. 같은 분노가 손바닥에서 굵어진다. 옛 싸움의 강도로 서로를 쓴다."
 sbs_orgy.2400.ff.desc: "라이벌의 숨은 손이 마침내 만날 때 날카롭다. 같은 분노가 손가락 아래 젖는다. 옛 싸움의 강도로 서로를 만진다."
 sbs_orgy.2400.a: "이렇게 끝내라."
 sbs_orgy.2400.a.tt: "적대를 이 몸으로 받아들인다. 끝나면 증오는 살아남지 못할지도 모른다."
 sbs_orgy.2400.b: "물러서라."
 sbs_orgy.2400.b.tt: "물러선다. 싸움이 끝내지 못한 것을 굴복이 끝내게 한다."
 sbs_orgy.2400.c: "너와는 하지 않겠다."
 sbs_orgy.2400.c.tt: "옛 증오는 그 자리에 둔다. 어떤 휴전은 치러야 할 살값만큼 가치가 없다."

 sbs_orgy.2500.t: "오늘 밤엔 작위 없이"
 sbs_orgy.2500.desc: "봉신이 있다. 작위는 남았으나 옷은 없고 밤은 길다. 권력은 내려놓을 수도, 달리 쓸 수도 있다."
 sbs_orgy.2500.fm.desc: "봉신은 내가 정하는 대로 무릎 꿇거나 선다. 충성을 맹세했던 같은 입이 이제 나를 위해 열린다. 봉사가 어디까지일지 정하는 동안 손바닥에 그 열을 느낀다."
 sbs_orgy.2500.mf.desc: "봉신은 제 자리를 아는 자의 고요함으로 기다린다. 손가락이 다리 사이 부드러운 열을 찾고, 눈을 피하지 않는다. 작위는 젖고 당장의 것이 된다."
 sbs_orgy.2500.mm.desc: "봉신은 제 자리를 아는 자의 고요함으로 기다린다. 손을 쥐면 충성이 열로 바뀐다. 익숙하고 조심스러운 동작으로 되쓸어 준다."
 sbs_orgy.2500.ff.desc: "봉신은 제 자리를 아는 자의 고요함으로 기다린다. 손가락이 허벅지 사이로 미끄러져 준비를 찾는다. 같은 손길이 돌아오고 작위는 서로 젖은 열로 녹는다."
 sbs_orgy.2500.a: "조심 없이는 안 된다."
 sbs_orgy.2500.a.tt: "작위는 기다릴 수 있다. 조심한 뒤, 가신이 내놓을 수 있는 것을 받는다."
 sbs_orgy.2500.b: "무릎을 꿇어라."
 sbs_orgy.2500.b.tt: "무릎 꿇리고 입과 손을 써서, 다스림의 무게가 가벼워질 때까지."
 sbs_orgy.2500.c: "값을 말해라."
 sbs_orgy.2500.c.tt: "작위가 명해서는 안 될 일에 돈을 낸다. 밤은 사 둔 조건으로 이어진다."
 sbs_orgy.2500.d: "만지며 말하자."
 sbs_orgy.2500.d.tt: "정무와 가까움을 한숨에 말한다. 손은 헤맨다. 그 이상은 필요 없다."

 sbs_orgy.2600.t: "익숙한 약속"
 sbs_orgy.2600.desc: "배우자가 있다. 익숙한 몸, 아는 손길. 위안과 욕망이 같은 몫으로."
 sbs_orgy.2600.fm.desc: "남편의 몸은 내 몸만큼 안다. 언제나처럼 손에 맞는다. 오늘 밤 익숙함은 열만 더 깊게 한다."
 sbs_orgy.2600.mf.desc: "아내의 몸은 내 몸만큼 안다. 다리 사이 부드러운 주름은 언제나처럼 손가락에 열린다. 오늘 밤 익숙함은 열만 더 깊게 한다."
 sbs_orgy.2600.mm.desc: "남편의 몸은 내 몸만큼 안다. 오랜 익숙함의 수월함으로 서로를 쓸고, 세월이 가도 열은 날카롭다."
 sbs_orgy.2600.ff.desc: "아내의 몸은 내 몸만큼 안다. 손과 입이 오랜 익숙함의 수월함으로 허벅지 사이를 오가고, 세월이 가도 열은 날카롭다."
 sbs_orgy.2600.a: "늘 해 온 대로."
 sbs_orgy.2600.a.tt: "배우자를 남김없이 받아, 익숙한 쾌락이 제 길을 가게 둔다."
 sbs_orgy.2600.b: "다른 이를 찾아라."
 sbs_orgy.2600.b.tt: "익숙한 몸에서 돌아서서 낯선 이의 열을 찾는다."

 sbs_orgy.2700.t: "쾌락보다 정무"
 sbs_orgy.2700.desc: "잔치가 이어지는 동안 [sbs_orgy_guest.GetFirstName]가 나를 찾는다. 누구도 부르지 않았는데 회의가 시작된다."
 sbs_orgy.2700.a: "먼저 나라다."
 sbs_orgy.2700.a.tt: "잔치가 주위에서 이어지는 동안, 직과 못 마친 일을 이야기한다."
 sbs_orgy.2700.b: "사랑이라면 무엇을 바라겠는가."
 sbs_orgy.2700.b.tt: "회의는 기다릴 수 있다. 늘 나라를 이야기하는 두 사람에게 사랑이 무엇을 할지 묻는다."
 sbs_orgy.2700.c: "욕망을 말하자."
 sbs_orgy.2700.c.tt: "원하는 것을 분명한 말로 부른다. 손은 그대로 둔다. 이야기만으로 밤은 가벼워진다."

 sbs_orgy.2800.t: "봉신의 집안"
 sbs_orgy.2800.desc: "[sbs_orgy_guest.GetFirstName]는 내 봉신 [sbs_orgy_vassal_spouse_owner.GetFirstName]의 집안에 속한다. 잊기 어려운 사실이나 누구도 떠나지 않는다."
 sbs_orgy.2800.fm.desc: "봉신의 배우자가 가까이 선다. 지켜야 할 집안의 유대가 얇다. 손안에서 단단해지고, 배우자의 이름은 말하지 않은 채 사이에 남는다."
 sbs_orgy.2800.mf.desc: "봉신의 배우자가 가까이 선다. 집안의 유대가 얇다. 손가락은 이미 젖은 것을 찾고, 배우자의 이름은 말하지 않은 채 사이에 남는다."
 sbs_orgy.2800.mm.desc: "봉신의 남편이 가까이 선다. 집안의 유대가 얇다. 배우자의 이름은 말하지 않은 채 서로를 쓴다."
 sbs_orgy.2800.ff.desc: "봉신의 아내가 가까이 선다. 집안의 유대가 얇다. 배우자의 이름은 말하지 않은 채 손이 허벅지 사이를 오간다."
 sbs_orgy.2800.a: "조심스러운 비밀."
 sbs_orgy.2800.a.tt: "조심한 뒤 가신의 배우자를 받고, 이 밤을 비밀로 둔다."
 sbs_orgy.2800.b: "우리 사이에 아무것도 두지 않겠다."
 sbs_orgy.2800.b.tt: "남김없이 받는다. 가문의 인연은 문 밖에 둔다."
 sbs_orgy.2800.c: "문은 열어 두어라."
 sbs_orgy.2800.c.tt: "조심히 받은 뒤 문은 열어 둔다. 불이 꺼져도 여기서 끝낼 필요는 없다."
 sbs_orgy.2800.d: "[sbs_orgy_vassal_spouse_owner.GetFirstName]을 불러라."
 sbs_orgy.2800.d.tt: "[sbs_orgy_vassal_spouse_owner.GetFirstName]을 불러 둘을 맞춘다. 나를 위해 행하고, 둘 다 내가 다룬 방식에 흡족해 떠난다. 지켜보고 주선하는 값은 그들보다 내게 더 크다."
 sbs_orgy.2800.e: "말로 충분하다."
 sbs_orgy.2800.e.tt: "지금은 이야기만으로도 스캔들이다. 손은 그대로 둔다."

 sbs_orgy.2900.t: "작위 너머"
 sbs_orgy.2900.desc: "공식 홀을 떠나도 [sbs_orgy_guest.GetFirstName]는 여전히 내 주군이지만, 이런 방에서는 작위가 덜 분명하다."
 sbs_orgy.2900.fm.desc: "주군은 작위가 아직 중요해야 할 만큼 가깝다. 더는 아니다. 손이 다리 사이 부드러운 열을 찾고, 나는 단단한 길이를 쥔다."
 sbs_orgy.2900.mf.desc: "주군은 작위가 아직 중요해야 할 만큼 가깝다. 더는 아니다. 손가락이 다리 사이 부드러운 열을 찾고, 대답으로 나를 쥔다."
 sbs_orgy.2900.mm.desc: "주군은 작위가 아직 중요해야 할 만큼 가깝다. 더는 아니다. 손이 동시에 서로를 쥐고, 위계는 단순한 열로 녹는다."
 sbs_orgy.2900.ff.desc: "주군은 작위가 아직 중요해야 할 만큼 가깝다. 더는 아니다. 손이 서로의 허벅지 사이로 미끄러져 같은 젖은 준비를 찾는다."
 sbs_orgy.2900.a: "작위는 잠시 내려놓아라."
 sbs_orgy.2900.a.tt: "조심하여 주군을 받고, 밤은 몸뿐이게 둔다."
 sbs_orgy.2900.b: "내 동행에는 값이 있다."
 sbs_orgy.2900.b.tt: "말과 솜씨로 나를 내놓고, 그 특권에 값을 청한다."
 sbs_orgy.2900.b.success: "조건이 받아들여졌다. 밤은 내 조건대로 이어진다."
 sbs_orgy.2900.b.failure: "주군은 설득되지 않았다. 작위가 다시 자리를 찾는다."
 sbs_orgy.2900.c: "말만 하겠습니다, 주군."
 sbs_orgy.2900.c.tt: "이번만은 그저 말한다. 손은 그대로 둔다. 위계는 그대로다."

 sbs_orgy.2920.t: "묶인 손님"
 sbs_orgy.2920.desc: "[sbs_orgy_guest.GetFirstName]는 명령받는 데 익숙한 자의 고요함으로 기다린다. 오늘 밤 그 복종에 답할 길이 여러 가지다."
 sbs_orgy.2920.fm.desc: "노예는 기다린다. 말을 내리면 무릎 꿇는다. 입이 열리고 손은 단단한 길이를 쥔다. 목걸이든 표식이든 소유라는 사실 자체가 손길을 무겁게 한다."
 sbs_orgy.2920.mf.desc: "노예는 기다린다. 말을 내리면 무릎 꿇거나 연다. 손가락이 다리 사이 부드러운 열을 찾고, 눈을 피하지 않는다. 목걸이든 표식이든 소유라는 사실 자체가 손길을 무겁게 한다."
 sbs_orgy.2920.mm.desc: "노예는 기다린다. 말을 내리면 무릎 꿇는다. 명령과 복종의 분명함으로 서로를 쓴다. 목걸이든 표식이든 소유라는 사실 자체가 손길을 무겁게 한다."
 sbs_orgy.2920.ff.desc: "노예는 기다린다. 말을 내리면 무릎 꿇거나 연다. 명령과 복종의 분명함으로 손이 허벅지 사이를 오간다. 목걸이든 표식이든 소유라는 사실 자체가 손길을 무겁게 한다."
 sbs_orgy.2920.a: "입으로 섬겨라."
 sbs_orgy.2920.a.tt: "무릎 꿇린다. 입과 손이 움직여, 명령의 무게가 가벼워질 때까지."
 sbs_orgy.2920.b: "낯선 명령이다."
 sbs_orgy.2920.b.tt: "평범한 섬김과 무관한 명령을 내리고, 따르는 것을 본다."
 sbs_orgy.2920.c: "이리 오너라."
 sbs_orgy.2920.c.tt: "더 이상의 예식은 없다. 조심한 뒤, 오늘 밤의 누구처럼 받는다."
 sbs_orgy.2920.d: "오늘 밤은 아니다."
 sbs_orgy.2920.d.tt: "앉아서 숨 고르라 이른다. 명령 대신 연민이다. 목걸이는 기다릴 수 있다."


# Contest localization

# 3100 - Contest of Mouths
 sbs_orgy.3100.t: "입의 시합"
 sbs_orgy.3100.desc: "누군가가 솜씨 시합을 청한다. 자원하는 이가 차례로 나서 것을 입에 넣는다. 가장 깊게 물고 가장 오래 빼지 않고 버티는 자가 돈주머니를 갖는다."
 sbs_orgy.3100.male.desc: "차례가 오면 무릎 꿇고 내민 것을 입에 넣는다. 처음엔 천천히, 이어서 더 깊게. 방이 한 치씩 사라짐을 보고, 목은 차고 눈은 젖는다."
 sbs_orgy.3100.female.desc: "차례가 오면 무릎 꿇고 내민 것을 입에 넣는다. 처음엔 천천히, 이어서 혀와 목으로 더 깊게. 방이 내가 어디까지 갈지 보게 한다."
 sbs_orgy.3100.a: "도전을 받아라."
 sbs_orgy.3100.a.tt: "이 입이 무엇을 할 수 있는지 보여 주겠다."
 sbs_orgy.3100.a.success: "누구보다 깊게, 누구보다 오래 버틴다. 낮은 박수 속에 주머니가 내 손에 놓인다."
 sbs_orgy.3100.a.failure: "더 능한 이가 있다. 바라던 품위도 없이 물러선다."
 sbs_orgy.3100.b: "보기만 한다."
 sbs_orgy.3100.b.tt: "구경하는 자리에 남아, 다른 입이 주머니를 가져가게 둔다."

# 3200 - Who Lasts the Longest
 sbs_orgy.3200.t: "가장 오래 버티는 자"
 sbs_orgy.3200.desc: "새 시합이 불린다. 쌍이 만들어지고 과제는 단순하다. 끝내지 않고 가능한 한 오래 계속한다. 방이 보고 분을 센다."
 sbs_orgy.3200.male.desc: "기꺼이 하는 상대를 아래에 둔다. 규칙은 분명하다. 박자를 지키고 계속 밀며, 다른 쌍이 먼저 무너질 때까지 쏟지 않는다. 방이 분마다 소리 내어 센다."
 sbs_orgy.3200.female.desc: "기꺼이 하는 상대를 안에 받는다. 규칙은 분명하다. 움직임을 유지하고 박자를 지키며, 다른 쌍이 먼저 무너질 때까지 끝내지 않는다. 방이 분마다 소리 내어 센다."
 sbs_orgy.3200.a: "도전을 받아라."
 sbs_orgy.3200.a.tt: "상대를 받는다. 얼마나 버티는지 방이 보게 한다."
 sbs_orgy.3200.a.success: "다른 어떤 쌍보다 오래 버틴다. 주머니와 방의 낮은 질투가 내 것이 된다."
 sbs_orgy.3200.a.failure: "남들보다 먼저 무너진다. 방이 곧 알아챈다."
 sbs_orgy.3200.b: "보기만 한다."
 sbs_orgy.3200.b.tt: "구경하는 자리에 남아, 다른 쌍이 분과 겨루게 둔다."

# 3300 - The Most Rounds
 sbs_orgy.3300.t: "가장 많은 차례"
 sbs_orgy.3300.desc: "누군가가 판돈을 올린다. 이제 과제는 지구력이다. 멈추기 전에 얼마나 많은 상대를 받을 수 있는가. 속이지 못하게 소리 내어 센다."
 sbs_orgy.3300.male.desc: "기꺼이 하는 상대에서 다음으로 옮긴다. 끝날 때마다 다시 시작할 만큼만 회복한다. 방이 차례마다 수를 외친다."
 sbs_orgy.3300.female.desc: "기꺼이 하는 상대를 잇달아 받는다. 안에서 혹은 위에 끝날 때마다 다음이 이미 기다린다. 방이 차례마다 수를 외친다."
 sbs_orgy.3300.a: "도전을 받아라."
 sbs_orgy.3300.a.tt: "몇이나 받을 수 있는지 세게 하라."
 sbs_orgy.3300.a.success: "누구보다 많은 상대를 받은 뒤에야 멈춘다. 주머니는 내 것이다."
 sbs_orgy.3300.a.failure: "더 집요한 이가 있다. 가장 높은 수는 내가 아니다."
 sbs_orgy.3300.b: "보기만 한다."
 sbs_orgy.3300.b.tt: "방과 함께 세며, 차례는 더 굶주린 이에게 맡긴다."

# 3400 - Who Breaks First
 sbs_orgy.3400.t: "먼저 무너지는 자"
 sbs_orgy.3400.desc: "더 고요한 시합이 제안된다. 자원하는 이가 눕고 능한 손과 입이 일한다. 규칙은 단순하다. 끝내지 마라. 먼저 무너진 자가 진다."
 sbs_orgy.3400.male.desc: "누워 능한 손과 입에 몸을 맡긴다. 숨과 떨림이 모두 지켜진다. 먼저 쏟은 자가 돈주머니를 잃는다."
 sbs_orgy.3400.female.desc: "누워 능한 손과 입에 다리 사이를 맡긴다. 숨과 떨림이 모두 지켜진다. 먼저 끝낸 자가 돈주머니를 잃는다."
 sbs_orgy.3400.a: "도전을 받아라."
 sbs_orgy.3400.a.tt: "나를 꺾어 보게 하라."
 sbs_orgy.3400.a.success: "누구보다 오래 버틴다. 주머니와 방의 낮은 존중이 내 것이 된다."
 sbs_orgy.3400.a.failure: "가장 먼저 무너진다. 방이 분명히 본다."
 sbs_orgy.3400.b: "차라리 내가 만지겠다."
 sbs_orgy.3400.b.tt: "손과 입으로 다른 이를 다루고, 인내의 경기는 그들에게 맡긴다."

# 3500 - Contest of Tongues
 sbs_orgy.3500.t: "혀의 시합"
 sbs_orgy.3500.desc: "누군가가 다른 도전을 청한다. 자원하는 이가 차례로 내민 허벅지 사이에 입을 내린다. 가장 오래 머물며 상대에게서 가장 많이 끌어내는 자가 돈주머니를 갖는다."
 sbs_orgy.3500.male.desc: "차례가 오면 내민 허벅지 사이에 입을 내리고 집중해 일한다. 혀와 입술이 움직여, 얼마나 잘하는지 얼마나 머물지를 방이 듣게 한다."
 sbs_orgy.3500.female.desc: "차례가 오면 내민 허벅지 사이에 입을 내리고 집중해 일한다. 혀와 입술이 움직여, 얼마나 잘하는지 얼마나 머물지를 방이 듣게 한다."
 sbs_orgy.3500.a: "도전을 받아라."
 sbs_orgy.3500.a.tt: "이 입이 무엇을 할 수 있는지 보여 주겠다."
 sbs_orgy.3500.a.success: "누구보다 오래 머물며 상대에게서 더 많은 소리를 끌어낸다. 주머니가 내 손에 놓인다."
 sbs_orgy.3500.a.failure: "더 능한 이가 있다. 바라던 품위도 없이 물러선다."
 sbs_orgy.3500.b: "보기만 한다."
 sbs_orgy.3500.b.tt: "구경하는 자리에 남아, 다른 혀가 주머니를 가져가게 둔다."

# Heavy / extreme localization

# 6100 - Female alone with animal
 sbs_orgy.6100.t: "다른 종류의 손님"
 sbs_orgy.6100.desc: "문이 평소보다 넓게 열린다. 크고 따뜻한 것이 굵은 밧줄에 끌려 방으로 들어온다. 다른 손님들은 입을 다물고 물러선다."
 sbs_orgy.6100.horse.desc: "힘센 말이 앞으로 나오고, 이미 다리 사이에서 단단하고 무겁다. 네 발로 그 아래로 이끌린다. 짐승이 오르면 크기만으로 길고 깨진 신음이 목에서 터진다. 깊은 밀침마다 벌어져 바닥에 매달리고 소리칠 수밖에 없다."
 sbs_orgy.6100.dog.desc: "큰 개가 앞으로 나오고, 헐떡이며 이미 흘린다. 망설임 없이 뒤에서 올라타 허리를 빠르고 날카롭게 친다. 젖은 소리와 낮은 으르렁이 방을 채우고, 무게 아래 신음한다."
 sbs_orgy.6100.pig.desc: "무거운 수퇘지가 끌려 들어오고, 꿀꿀거리며 이미 미끄럽다. 올라타면 굵고 뭉툭한 모양이 일정한 압력으로 들어온다. 깊은 밀침마다 거친 짐승 소리가 목에서 나와 그 꿀꿀거림과 섞여 방에 울린다."
 sbs_orgy.6100.a: "남김없이 받아라."
 sbs_orgy.6100.a.tt: "소리를 억누르지 못한다. 벌어짐과 열이 지나치다. 신음하며 밀어 넣어, 짐승이 깊은 곳에서 끝날 때까지."
 sbs_orgy.6100.b: "밀어내라."
 sbs_orgy.6100.b.tt: "그저 너무 크다. 더 깊이 들어가기 전에 밀어내고, 바닥에서 헐떡이며 떤다."

# 6200 - Guest leads female root like an animal
 sbs_orgy.6200.t: "짐승처럼 끌려"
 sbs_orgy.6200.desc: "[sbs_orgy_guest.GetFirstName]가 탁자의 가죽 목줄을 집어 가져온 목걸이에 채운다. 네 발로 기어라 명령받는 것을 방이 침묵 속에 본다."
 sbs_orgy.6200.horse.desc: "명령에 짖고 개처럼 바닥을 적신 뒤 [sbs_orgy_guest.GetFirstName]가 말을 데려온다. 네 발로 그 아래에 놓인다. 거대한 무게가 등에 내리고 굵은 길이가 들어오며 목줄은 짧게 잡힌다."
 sbs_orgy.6200.dog.desc: "짖고 바닥을 적신 뒤 [sbs_orgy_guest.GetFirstName]가 큰 개를 데려온다. 짐승이 곧 올라타 세고 빠르게 민다. 손님은 목줄을 팽팽히 잡고, 젖은 소리와 으르렁이 공기를 채운다."
 sbs_orgy.6200.pig.desc: "짖고 바닥을 적신 뒤 [sbs_orgy_guest.GetFirstName]가 무거운 수퇘지를 데려온다. 뭉툭하고 굵은 모양이 일정한 압력으로 들어오고, 손님은 목줄을 짧게 잡아 한 치씩 사라짐을 본다."
 sbs_orgy.6200.a: "복종하고 받아라."
 sbs_orgy.6200.a.tt: "네 발로 남은 채 시킨 대로 받고, 벌어짐에 신음하며 안에서 끝날 때까지."
 sbs_orgy.6200.b: "손님에게 빌라."
 sbs_orgy.6200.b.tt: "[sbs_orgy_guest.GetFirstName] 앞으로 돌아 무릎 꿇고, 짐승이 아니라 그이를 섬기게 해 달라 빈다."
 sbs_orgy.6200.c: "거절한다."
 sbs_orgy.6200.c.tt: "끈을 끊어 내고 일어선다. 더 이상 함께할 마음이 있는 놀이가 아니다."

# 6300 - Female root leads a female guest like an animal
 sbs_orgy.6300.t: "나의 짐승"
 sbs_orgy.6300.desc: "가죽 목줄을 집어 [sbs_orgy_guest.GetFirstName]에게 채운다. 기게 하고 명령에 짖게 하며 길든 짐승처럼 바닥을 적시는 것을 방이 본다."
 sbs_orgy.6300.horse.desc: "충분히 시킨 뒤 말을 데려와 네 발로 그 아래에 놓는다. 무거운 짐승이 올라타고, 목줄을 짧게 잡은 채 깊은 밀침마다 깨진 소리가 목에서 나오는 것을 본다."
 sbs_orgy.6300.dog.desc: "충분히 시킨 뒤 큰 개를 데려온다. 급히 올라타 허리를 빠르게 치고, 목줄을 짧게 잡아 가만히 있게 한다."
 sbs_orgy.6300.pig.desc: "충분히 시킨 뒤 무거운 수퇘지를 데려온다. 굵고 뭉툭한 모양이 들어가고, 목줄을 잡은 채 참지 못하는 거친 짐승 소리를 듣는다."
 sbs_orgy.6300.a: "강제로 받게 하라."
 sbs_orgy.6300.a.tt: "짐승이 깊은 곳에서 끝날 때까지 붙잡아 두고, 그 특권에 감사를 말하게 한다."
 sbs_orgy.6300.b: "손으로 보상하라."
 sbs_orgy.6300.b.tt: "짐승을 멈추고 내 손과 입으로 다루어, 복종에 보상한다."

# 3600 - Vaginal beer contest
 sbs_orgy.3600.t: "다른 종류의 건배"
 sbs_orgy.3600.desc: "자리에 있는 여자들이 불린다. 센 맥주의 잔이 바닥에 놓인다. 과제는 분명하다. 손도 입도 쓰지 않고 잔을 버텨라. 가장 오래 버틴 자가 돈주머니를 갖는다. 방의 나머지는 누가 먼저 무너질지 기다린다."
 sbs_orgy.3600.a: "도전을 받아라."
 sbs_orgy.3600.a.tt: "잔 위에 몸을 내려, 다른 어떤 여자보다 오래 버티기로 한다."
 sbs_orgy.3600.a.success: "누구보다 오래 버틴다. 승리를 치는 박수 속에 주머니가 내 손에 놓인다."
 sbs_orgy.3600.a.failure: "버티지 못해 술이 쏟아진다. 방은 가차 없이 벌을 정한다. 밤이 끝나기 전에, 자리한 남자마다 우리 둘을 차례로 취한다."
 sbs_orgy.3600.b: "거절한다."
 sbs_orgy.3600.b.tt: "패배의 값에 걸 만한 놀이는 많지 않다."

# 1300-1400 indoor / 5100-5400 outdoor
 sbs_orgy.1300.t: "높은 자리"
 sbs_orgy.1300.desc: "주인의 자리는 더 이상 비어 있지 않다. 두 몸이 차지했고, 홀은 그 자리가 무엇에 쓰이는지 똑똑히 본다."
 sbs_orgy.1300.fm.desc: "조각된 자리에 그를 타고 앉으니 팔걸이가 허벅지에 단단하다. 내려앉을 때마다 나무가 삐걱인다. 그의 손이 허리를 붙잡고, 아래 홀은 매우 조용하다."
 sbs_orgy.1300.mf.desc: "높은 자리 무릎 위에 그녀를 두고, 한 손은 허벅지 아래, 한 손은 조각된 팔걸이에 둔다. 홀이 보는 앞에서 그녀가 움직인다. 왕좌는 이런 용도가 아니다. 바로 그래서다."
 sbs_orgy.1300.mm.desc: "주인의 자리 무릎 위에 그를 두고, 등은 내 가슴에, 조각된 나무가 둘을 벤다. 움직임은 숨기지 않는다. 이 자리의 주인은 나중에 냄새로 알 것이다."
 sbs_orgy.1300.ff.desc: "왕좌에 그녀를 두고 한쪽 허벅지를 팔걸이에 걸친다. 입은 목덜미에, 손은 다리 사이에서 움직인다. 이 자리는 판결을 위한 것이었다. 오늘 밤은 더 젖은 것을 받친다."
 sbs_orgy.1300.a: "조심히 자리를 취해라."
 sbs_orgy.1300.a.tt: "조심을 남긴 채 왕좌 위에서 끝낸다. 홀은 열만큼이나 그 예의를 기억할 것이다."
 sbs_orgy.1300.b: "다른 곳을 찾아라."
 sbs_orgy.1300.b.tt: "높은 자리는 침대가 아니다. 왕좌에서 내려보내 더 조용한 구석을 찾게 한다."
 sbs_orgy.1400.t: "더 부드러운 방"
 sbs_orgy.1400.desc: "일은 이미 시작되었다. [sbs_orgy_guest.GetFirstName]이 아직 붙어 있는 채로 제안이 온다. 공개된 방을 떠나 제대로 된 침대에서 마치자는 것이다."
 sbs_orgy.1400.fm.desc: "통로에서 시작한 느린 리듬 그대로다. 입이 귓가에 있다. 돌보다는 침실이 등에 낫다고 한다. 물으면서도 움직임은 멈추지 않는다."
 sbs_orgy.1400.mf.desc: "한쪽 무릎은 벤치에, 숨은 내 목에 닿아 있다. 침대는 문 하나 너머다. 시트와 잠긴 빗장, 시간을 원한다. 답을 기다리는 동안에도 손은 나를 떠나지 않는다."
 sbs_orgy.1400.mm.desc: "벽에 기대 이미 반쯤 왔다. 침실을 가리키고 손은 떼지 않는다. 침대라면 더 오래 갈 수 있다. 홀이 들을 필요도 없다."
 sbs_orgy.1400.ff.desc: "그녀의 허벅지가 아직 내 것에 걸려 있다. 원하는 것은 바다. 닫힌 문, 베개, 아침까지 머무를 자리. 내가 고를 때까지 손가락은 그 자리에 있다."
 sbs_orgy.1400.a: "침대로 가자."
 sbs_orgy.1400.a.tt: "이끌리는 대로 들어가 서두르지 않고 마친다. 닫힌 문은 홀이 줄 수 있는 것보다 더 많은 온기를 산다."
 sbs_orgy.1400.b: "왕좌면 안 되는가."
 sbs_orgy.1400.b.tt: "높은 자리로 끌어간다. 홀은 봐도 된다. 그 배짱이 나를 가볍게 하고, 상대도 우회를 용서할 만큼은 재미있어 한다."
 sbs_orgy.1400.c: "이대로면 된다."
 sbs_orgy.1400.c.tt: "다른 방은 필요 없다. 이미 가진 박자를 유지한 채 여기서 끝낸다."
 sbs_orgy.5100.t: "마을의 행렬"
 sbs_orgy.5100.desc: "난교는 들판에 머물지 않는다. 오전 중에 가난한 마을로 흘러들어, 아직 높은 햇살 아래 집들 사이를 벗은 행렬이 지난다.\n\n한 남자가 걸음을 멈추지 않고 문설주에 소변을 본다. 다른 이는 도랑에 쪼그려 앉아 고개를 들지 않는다. 누군가 우물가에서 빵집 아내를 붙잡았고, 치마는 이미 없고 항의는 열보다 가늘다. 아이들은 집 안으로 끌려 들어간다. 개가 짖는다. 신부가 있다면 닫을 덧문을 찾았을 것이다.\n\n이끄는 자는 없다. 행렬은 그저 길을 차지하고, 웃고, 더러워진 채로, 벽이나 수레가 몸을 받칠 수 있는 곳에서 멈춘다. 닫힌 채인 문마다 이 땅의 통제는 얇아진다."
 sbs_orgy.5100.a: "행렬을 가게 두어라."
 sbs_orgy.5100.a.tt: "마을이 충분히 볼 때까지 행렬은 길을 지킨다. 이곳에 남는 권위는 한동안 더디게 응답할 것이다."
 sbs_orgy.5200.t: "비석 사이에서"
 sbs_orgy.5200.desc: "[sbs_orgy_guest_a.GetFirstName]와 [sbs_orgy_guest_b.GetFirstName]은 이미 석판을 골랐다. 새겨진 이름은 우리보다 오래되었다. 무덤 사이 풀은 다른 쌍이 지나간 자리에 눕혀 있다."
 sbs_orgy.5200.female.desc: "닳은 비문 위에 눕는다. 하나는 무릎 사이에, 하나는 입으로 받을 수 있는 자리에 무릎 꿇는다. 돌은 어깨 아래에서 차갑다. 밀칠 때마다 글자에서 먼지가 떨어진다. 고개를 돌리면 연도가 읽힌다. 그래도 그들은 멈추지 않는다."
 sbs_orgy.5200.male.desc: "기울어진 돌 위에 하나를 숙이고, 다른 하나는 허리맡 무덤에 앉혀 둘 다 닿게 한다. 끌 자국이 피부에 걸린다. 더 오래된 장례의 화환이 무릎 아래 짓눌려 있다. 흙과 정의 냄새가 한숨에 있다."
 sbs_orgy.5200.a: "이것은 모독이다."
 sbs_orgy.5200.a.tt: "더 나아가기 전에 돌에서 끌어내린다. 밤이 빚지지 않더라도, 죽은 이에게는 그만큼의 도리가 있다."
 sbs_orgy.5200.b: "죽은 자는 상관하지 않는다."
 sbs_orgy.5200.b.tt: "둘을 무덤 위에 두고 거기서 마친다. 그 잘못됨이 곧 열이다."
 sbs_orgy.5300.t: "긴 하루가 지난 뒤"
 sbs_orgy.5300.desc: "진영은 새벽부터 하나의 긴 뒤얽힘이었다. 아무도 옷을 다시 입지 않았다. 불은 낮다. 남은 음식은 조금 떨어진 곳, 마지막 쌍으로 아직 젖은 잠자리 너머에 있다."
 sbs_orgy.5300.body.desc: "일어서려 해도 허벅지가 붙지 않는다. 너무 오래 벌어진 근육이, 시도만으로도 사타구니를 날것으로 당긴다. 부어진 것이 아직 천천히 흘러나온다. 뒤에서, 다리 사이에서. 무릎에 닿기 전 허벅지 안에서 식는다.\n\n[sbs_orgy_guest.GetFirstName]은 내가 못 하는 걸음을 본다. 제안은 짧다. 음식은 가져오겠다. 네 발로 오너라. 시키면 짖어라."
 sbs_orgy.5300.a: "이미 가진 것을 먹어라."
 sbs_orgy.5300.a.tt: "아직 나오는 것을 두 손가락으로 모아 입에 넣는다. 소금과 열이다. 식사는 아니다. 기어가지 않아도 될 정도는 된다."
 sbs_orgy.5300.b: "무릎 꿇고 짖어라."
 sbs_orgy.5300.b.tt: "선 자리에 내려앉아 시키라는 소리를 낸다. 음식은 온다. 존엄은 오지 않는다."
 sbs_orgy.5300.c: "음식까지 기어가라."
 sbs_orgy.5300.c.tt: "네 발로 솥을 향해 간다. 허벅지는 아직 벌어져 있고, 자국이 음식까지 이어진다."
 sbs_orgy.5400.t: "다음 불"
 sbs_orgy.5400.desc: "낮이 진영을 비우지는 못했다. 잠자리는 걷어차인 자리에 남는다. 여자들은 옷을 다시 입지 않은 채 불 사이를 오간다. 아침의 일이 아직 보인다. 허벅지 안의 윤기, 목의 자국, 아직 평범한 걸음을 기억하지 못한 걸음걸이."
 sbs_orgy.5400.body.desc: "[sbs_orgy_guest.GetFirstName]은 일어나지 않았다. 펼친 외투 위에 무릎을 양옆으로 떨어뜨린 채, 붙일 힘도 없고, 마지막에 남은 것이 아래 천을 찾는다. 다가가도 가리지 않는다. 솥에 남은 것을 가져다 줄지, 그것만 묻는다."
 sbs_orgy.5400.a: "솥을 가져오너라."
 sbs_orgy.5400.a.tt: "남은 것을 가져와 닿는 곳에 둔다. 그 예의를 기억한다."
 sbs_orgy.5400.b: "다시 가지기 전에는 안 된다."
 sbs_orgy.5400.b.tt: "솥은 기다릴 수 있다. 누운 자리에서 가진다. 막지는 않는다. 고마워하지는 않는다."
 sbs_orgy.5400.c: "이미 머금은 것으로 먹여라."
 sbs_orgy.5400.c.tt: "두 손가락을 넣어 다른 남자들이 남긴 것을 모아 혀 위에 올린다. 달리 할 일이 적어 삼킨다. 누가 그렇게 했는지는 잊지 않는다."

# 6400 extreme paddock
 sbs_orgy.6400.t: "마장"
 sbs_orgy.6400.desc: "마장은 한낮의 볕 아래다. 천막도 밤도 없다. 말은 진영과 같은 밟힌 흙으로 끌려왔고, 여자들도 그 곁에 세워졌다."
 sbs_orgy.6400.body.desc: "[sbs_orgy_horse_girl.GetFirstName]은 두 번 듣기도 전에 따랐다. 먼지 속에 무릎을 꿇고, 씨말은 이미 뿌리까지 들어와 있다. 굵기 때문에 배가 그와 함께 올랐다 내린다. 한 걸음씩 밀어 넣을 때마다 피부 밑으로 단단한 줄기가 지나간다.\n\n다른 여자들도 같은 쪽으로 밀린다. 남자들은 울타리에서 본다. 누군가 웃는다. 말은 웃지 않는다."
 sbs_orgy.6400.a: "한 마리를 받아라."
 sbs_orgy.6400.a.tt: "볕 아래 그녀 옆에 무릎을 꿇고 다음 씨말에게 몸을 맡긴다. 그 크기는 마장이 고요해진 뒤에도 몸에 남는다."
 sbs_orgy.6400.b: "남자들을 섬겨라."
 sbs_orgy.6400.b.tt: "말은 원하는 이에게 맡기고, 울타리의 남자를 한 명씩 조심히 가진다. 내가 끝날 때도 [sbs_orgy_horse_girl.GetFirstName]은 씨말 아래에 있다."

# Activity option keys matching sbs_private_orgy.txt
 sbs_orgy_option_size: "난교 규모"
 sbs_orgy_option_location: "장소"
 sbs_orgy_location_indoor: "실내"
 sbs_orgy_location_indoor_desc: "$EFFECT_LIST_BULLET$ 주최자의 홀에서 연다\n$EFFECT_LIST_BULLET$ 침실과 높은 자리가 닿는 곳에 있다\n\n#weak 영지를 가진 주최자에게 맞다.#!"
 sbs_orgy_location_outdoor: "야외"
 sbs_orgy_location_outdoor_desc: "$EFFECT_LIST_BULLET$ 진영이나 들판에서 연다\n$EFFECT_LIST_BULLET$ 시선을 피하기 어렵다\n\n#weak 무영지 주최자에게 유효한 유일한 선택.#!"
 sbs_orgy_location_indoor_landless_invalid: "무영지 주최자에게는 닫을 홀이 없다. 야외 모임을 선택하라."
 sbs_orgy_size_small: "소규모 난교"
 sbs_orgy_size_small_desc: "$EFFECT_LIST_BULLET$ 최대 #V 20#!명의 손님\\n$EFFECT_LIST_BULLET$ 도착에 #V 10일#!\\n$EFFECT_LIST_BULLET$ #V 3#!번의 만남\\n\\n#weak 가깝고 익숙한 자리.#!"
 sbs_orgy_size_medium: "중규모 난교"
 sbs_orgy_size_medium_desc: "$EFFECT_LIST_BULLET$ 최대 #V 30#!명의 손님\\n$EFFECT_LIST_BULLET$ 도착에 #V 20일#!\\n$EFFECT_LIST_BULLET$ #V 5#!번의 만남\\n\\n#weak 더 넓은 자리와 활기찬 밤.#!"
 sbs_orgy_size_large: "대규모 난교"
 sbs_orgy_size_large_desc: "$EFFECT_LIST_BULLET$ 최대 #V 40#!명의 손님\\n$EFFECT_LIST_BULLET$ 도착에 #V 30일#!\\n$EFFECT_LIST_BULLET$ #V 7#!번의 만남\\n\\n#weak 집이 가득 차 절제의 여지가 거의 없다.#!"
