 sbs_private_orgy_desc: "예의가 옅어지고 사적인 동석이 그 이상이 될 수 있는 은밀한 모임을 연다."
 sbs_private_orgy_owner: "주최자"
 sbs_private_orgy_host: "주최자"
 sbs_private_orgy_host_an_a: "의"
 sbs_private_orgy_guest: "손님"
 sbs_private_orgy_guest_an_a: "의"
 sbs_private_orgy_selection_tooltip: "고른 이들을 모아 술과 솔직함, 불확실한 유대의 사적인 밤을 보낸다.\\n\\n예상 보상:\\n$BULLET_WITH_TAB$[stress_i] 스트레스 감소\\n$BULLET_WITH_TAB$새로운 연인\\n$BULLET_WITH_TAB$관계 개선"
 sbs_private_orgy_host_desc: "은밀한 이들에게 문을 열고 밤이 제 길을 찾게 둔다."
 sbs_private_orgy_guest_desc: "편한 자리와 사담, 그리고 밤이 내줄 것을 위해 간다."
 sbs_orgy_conclusion_desc: "마지막 등이 낮게 탄다. 어떤 이는 더 가벼워지고, 어떤 이는 더 가까워지며, 어떤 이는 낮에 숨길 약속을 안고 떠난다."
 sbs_private_orgy_phase: "난교"
 sbs_private_orgy_cost_desc: "은밀한 사적 모임"
 TRAVEL_NAME_FOR_sbs_private_orgy: "난교로 가는 여정"
 sbs_private_orgy_province_desc: "호기심 어린 눈이 닿지 않는 곳을 고른다."
 sbs_private_orgy_destination_selection: "난교를 열 장소를 고른다."
 sbs_private_orgy_guest_help_text: "$sbs_private_orgy_desc$"
 sbs_private_orgy_predicted_cost: "은밀함과 술, 자발적인 함구에는 값이 따른다."
 sbs_private_orgy_phase_desc: "문이 닫힌다. 격식 있는 예절도 곧 따라 사라진다."
 sbs_orgy_host_desc: "$BULLET_WITH_TAB$참가자는 [stress_i] 스트레스를 잃을 수 있다\\n$BULLET_WITH_TAB$참가자가 연인이 될 수 있다\\n$BULLET_WITH_TAB$관계가 개선될 수 있다"
 sbs_orgy_guest_desc: "$BULLET_WITH_TAB$[stress_i] 스트레스를 잃을 수 있다\\n$BULLET_WITH_TAB$새로운 연인을 찾을 수 있다"
 sbs_orgy_invite_rule_barony_rulers: "남작령 지배자"
 sbs_orgy_option_focus: "난교 규모"
 sbs_orgy_focus_small: "소규모 난교"
 sbs_orgy_focus_small_desc: "$EFFECT_LIST_BULLET$ 최대 #V 20#!명의 손님\\n$EFFECT_LIST_BULLET$ 도착에 #V 10일#!\\n$EFFECT_LIST_BULLET$ #V 3#!번의 만남\\n\\n#weak 가깝고 익숙한 자리.#!"
 sbs_orgy_focus_medium: "중규모 난교"
