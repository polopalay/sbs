l_polish:
 trait_sbs_demon: "Demon"
 sbs_demon_desc: "Ci przeklęci przez niebo, błogosławieni przez piekło. Głęboko w nich jest śmierć i zniszczenie."
 sbs_demon_character_desc: "Jako dzieci diabła, błogosławieni przez książąt piekła, misją [ROOT.GetCharacter.GetNamePossessive]jest błogosławienie chaosu i zniszczenia na całym świecie."

 trait_sbs_succubus_neutral: "Sukkub"
 trait_sbs_succubus_female: "Sukkub"
 trait_sbs_succubus_male: "Inkub"
 sbs_succubus_desc: "Niektórzy to widzieli, inni o tym słyszeli, wszyscy szepczą o dziwnym zachowaniu [ROOT.GetCharacter.GetNamePossessive]."
 sbs_succubus_character_desc: "Większość to widziała, wszyscy o tym słyszeli. Zachowanie [ROOT.GetCharacter.GetNamePossessive] jest moralnie zepsute. Mówi się o niej z takim samym pogardą, jakby komentowano zwykłą uliczną prostytutkę."
 trait_track_corruption: "Dewiantka"
 trait_track_corruption_desc: "Z dusz, które zbiera, zyskuje większą moc przywoływania potwornych stworzeń"
 trait_track_power: "Moc"
 trait_track_power_desc: "Jej ciało jest narzędziem do zdobywania siły życiowej od innych"
 trait_track_loyalty: "Lojalność"
 trait_track_loyalty_desc: "Służy swojemu panu z oddaniem i wiernością"
 trait_track_daring: "Odwaga"
 trait_track_daring_desc: "Nieustraszona w obliczu niebezpieczeństwa, gotowa stawić czoła każdemu wyzwaniu"

 trait_lesser_succubus_neutral: "Mniejszy Sukkub"
 trait_lesser_succubus_female: "Mniejszy Sukkub"
 trait_lesser_succubus_male: "Mniejszy Inkub"
 lesser_sbs_succubus_desc: "Niektórzy to widzieli, inni o tym słyszeli, wszyscy szepczą o dziwnym zachowaniu [ROOT.GetCharacter.GetNamePossessive]."
 lesser_sbs_succubus_character_desc: "Większość to widziała, wszyscy o tym słyszeli. Zachowanie [ROOT.GetCharacter.GetNamePossessive] jest moralnie zepsute. Mówi się o niej z takim samym pogardą, jakby komentowano zwykłą uliczną prostytutkę."
 trait_track_sbs_lesser_succubus: "Prostytutka"
 trait_track_sbs_lesser_succubus_desc: "Z dusz, które zbiera, zyskuje większą moc przywoływania potwornych stworzeń."

 trait_sbs_seed_of_demon: "Nasienie demona"
 sbs_seed_of_demon_desc: "[ROOT.GetCharacter.GetName] otrzymała moc od diabła, jest symbolem zniszczenia i chaosu."
 sbs_seed_of_demon_character_desc: "Słudzy przemocy, którzy przynoszą światu zniszczenie i chaos."
 trait_track_sbs_seed_of_demon: "Zepsucie"
 trait_track_sbs_seed_of_demon_desc: "Nasiona zniszczenia potrzebują czasu, aby wykiełkować."
