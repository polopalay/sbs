l_english:
 carnia_buy_from_slave_market: "Buy from Slave Market"
 carnia_buy_from_slave_market_desc: "Visit a discreet market and inspect the people offered for sale."
 carnia_buy_from_slave_market_tooltip: "A random offering from the slave market will be presented."
 carnia_buy_from_slave_market_effect: "A random offering is presented. Completing a purchase costs [gold|E] Gold and adds slaves to your household."
 carnia_buy_from_slave_market_confirm: "Visit the Market"

 carnia_slave_market.0002.t: "Four Lots"
 carnia_slave_market.0002.desc: "The broker has four lots on the same rope. [carnia_slave_man.GetFirstName] and [carnia_slave_woman.GetFirstName] are both young. [carnia_slave_child.GetFirstName] is still small. [carnia_slave_old.GetFirstName] has already lived a full life. They are sold as the market finds buyers."
 carnia_slave_market.0002.a: "I will take [carnia_slave_man.GetFirstName]."
 carnia_slave_market.0002.b: "I will take [carnia_slave_woman.GetFirstName]."
 carnia_slave_market.0002.c: "I will take [carnia_slave_child.GetFirstName]."
 carnia_slave_market.0002.d: "I will take [carnia_slave_old.GetFirstName]."
 carnia_slave_market.0002.e: "I will buy none of them."

 carnia_slave_market.0003.t: "A Fallen House"
 carnia_slave_market.0003.desc: "[carnia_slave_noble.GetFirstName] still carries a name. Faith stands hostile to yours, no liege answers for them, and no kinsman holds a throne. The market has them all the same."
 carnia_slave_market.0003.a: "A name can still be bought."
 carnia_slave_market.0003.b: "Let some other buyer find them."

 carnia_slave_market.0004.t: "A Far Pilgrim"
 carnia_slave_market.0004.desc: "[carnia_slave_pilgrim.GetFirstName] did not come from any court you treat with. The road brought them here, and the market kept them. They are a stranger even to the language of your neighbors."
 carnia_slave_market.0004.a: "The road ends in my household."
 carnia_slave_market.0004.b: "A pilgrim is not my concern."

 carnia_slave_market.0005.t: "Two Contracts"
 carnia_slave_market.0005.desc: "A broker presents two contracts together. [carnia_slave_a.GetFirstName] and [carnia_slave_b.GetFirstName] stand close, skin still warm from the last inspection."
 carnia_slave_market.0005.a: "I will take both."
 carnia_slave_market.0005.b: "Only [carnia_slave_a.GetFirstName]."
 carnia_slave_market.0005.c: "Only [carnia_slave_b.GetFirstName]."
 carnia_slave_market.0005.d: "Find another household."

 carnia_slave_market.0006.t: "A Family Bound Together"
 carnia_slave_market.0006.desc: "The broker brings [carnia_slave_mother.GetFirstName] with her child, [carnia_slave_child.GetFirstName]. They stand close enough that the shared blood is plain. They ask only not to be separated."
 carnia_slave_market.0006.a: "Keep them together under my roof."
 carnia_slave_market.0006.b: "Only the mother."
 carnia_slave_market.0006.c: "Only the child."
 carnia_slave_market.0006.d: "Their fate belongs elsewhere."

 carnia_slave_market.0007.t: "Two Hearts, One Price"
 carnia_slave_market.0007.desc: "[carnia_slave_lover_a.GetFirstName] and [carnia_slave_lover_b.GetFirstName] stand so close that their shoulders touch. The quiet way their hands brush leaves no doubt about the bond between them."
 carnia_slave_market.0007.a: "They will remain together."
 carnia_slave_market.0007.b: "Only [carnia_slave_lover_a.GetFirstName]."
 carnia_slave_market.0007.c: "Only [carnia_slave_lover_b.GetFirstName]."
 carnia_slave_market.0007.d: "I will not buy their promise."

 carnia_slave_market.0008.t: "A Rare Offering"
 carnia_slave_market.0008.desc: "One final contract is offered with unusual confidence. [carnia_slave_good.GetFirstName] is healthy, well-formed, and clearly expected to command a higher price."
 carnia_slave_market.0008.a: "A rare servant is worth the coin."
 carnia_slave_market.0008.b: "Rarity does not compel me."
