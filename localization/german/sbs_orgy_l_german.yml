 sbs_orgy.0002.t: "Ein leeres Haus"
 sbs_orgy.0002.desc: "Die Räume sind bereitet, doch die erwartete Gesellschaft bleibt aus. Die Lampen brennen für niemanden."
 sbs_orgy.0002.a: "Löscht die Lampen."

 sbs_orgy.1100.t: "Ein privates Einvernehmen"
 sbs_orgy.1100.desc: "[sbs_orgy_guest.GetFirstName] steht nah genug, dass die Wärme der Haut mich erreicht."
 # Female root + Male guest
 sbs_orgy.1100.fm.1.desc: "Seine Hand liegt an meiner Taille, folgt dann der Linie meiner Hüfte. Als ich mich zuneige, findet sein Mund meinen. Ich spüre ihn schon hart gegen meine Handfläche durch das dünne Tuch."
 sbs_orgy.1100.fm.2.desc: "Ich trete näher, bis kein Raum mehr bleibt. Sein Atem ist warm an meiner Kehle. Eine Hand auf seiner Brust; die andere findet seine Hitze, ohne schon weiterzugehen."
 sbs_orgy.1100.fm.3.desc: "Er zieht mich an die Wand. Sein Mund ist warm an meinem Hals, dann an meinen Lippen. Seine Hand umfasst meine Brust durch den Stoff und bleibt dort, wartend."
 sbs_orgy.1100.fm.4.desc: "Ich führe seine Hand an die Hüfte, dann tiefer, gerade weit genug, dass er meine Hitze spürt. Er schluckt. Keiner von uns hat entschieden, was folgt."
 sbs_orgy.1100.fm.5.desc: "Er drückt mich an die Wand. Eine Hand umfasst die Brust. Die andere liegt hoch am Oberschenkel, nah genug, dass ich jede kleine Bewegung spüre."
 sbs_orgy.1100.fm.6.desc: "Ich lehne mich vor und küsse ihn langsam. Als ich zurückweiche, liegt meine Hand noch an seinem Gürtel. Seine Finger bleiben in meinem Haar, ohne zu drängen oder zu ziehen."
 sbs_orgy.1100.fm.7.desc: "Sein Daumen streicht die Innenseite meines Schenkels. Ich greife hinab und schließe die Hand um ihn durch das Tuch, spüre den Puls an der Handfläche. So bleiben wir einen Moment."
 sbs_orgy.1100.fm.8.desc: "Wir landen auf der niedrigen Couch, Münder offen, Hände wandernd. Sein Leib ist warm gegen meinen. Der nächste Schritt bleibt eine Wahl."
 # Male root + Female guest
 sbs_orgy.1100.mf.1.desc: "Meine Hand findet ihre Hüfte, dann die Wärme ihres Schenkels. Sie atmet schon schneller. Als sie mich durch das Tuch umfasst, tut niemand mehr so, als wäre dies nur Gespräch."
 sbs_orgy.1100.mf.2.desc: "Ich senke den Kopf zu ihrer Kehle, dann zu ihrem Mund. Der Duft ihrer Haut ist scharf und rein. Meine Hand bleibt hoch an ihrem Schenkel."
 sbs_orgy.1100.mf.3.desc: "Sie küsst meine Brust hinab und hält knapp davor inne, weiterzugehen. Eine Hand auf meinem Schenkel; die andere folgt der Linie meines Gürtels."
 sbs_orgy.1100.mf.4.desc: "Meine Finger ruhen zwischen ihren Schenkeln und spüren, wie bereit sie schon ist. Ihre freie Hand streichelt mich durch das Tuch im selben unhurryten Takt."
 sbs_orgy.1100.mf.5.desc: "Sie stößt mich auf die Couch und setzt sich über meinen Schoß. Ihr Mund findet meinen. Wir sind nah genug, dass die nächste Wahl offensichtlich ist."
 sbs_orgy.1100.mf.6.desc: "Ich ziehe sie näher, bis sich unsere Hüften treffen. Sie ist warm und willig. Ich warte auf den Augenblick zu entscheiden, wie weit dies geht."
 sbs_orgy.1100.mf.7.desc: "Ihre Hand schließt sich um mich, während meine zwischen ihren Schenkeln bleibt. So bleiben wir lange, lernen einander den Rhythmus, ohne schon weiterzugehen."
 sbs_orgy.1100.mf.8.desc: "Sie kniet vor mir und blickt auf. Ihre Hände ruhen auf meinen Schenkeln. Die Einladung ist klar. Die Entscheidung bleibt meine."
 # Male + Male
 sbs_orgy.1100.mm.1.desc: "Seine Hand findet meine Hüfte, dann meine Hitze durch das Tuch. Ich erwidere die Berührung. Unsere Münder treffen sich, offen und ohne Eile."
 sbs_orgy.1100.mm.2.desc: "Ich trete vor, bis sich unsere Brustkörbe berühren. Sein Atem stockt, als meine Hand auf ihm ruht. Keiner von uns ist weiter gegangen."
 sbs_orgy.1100.mm.3.desc: "Er lehnt sich vor und küsst mich hart. Seine Hand bleibt an meinem Gürtel. Meine Finger bleiben in seinem Haar, ohne zu drängen oder zu ziehen."
 sbs_orgy.1100.mm.4.desc: "Wir stehen nah. Beide Hände arbeiten zugleich durch das Tuch. Der schmale Raum zwischen uns ist schon zu warm."
 sbs_orgy.1100.mm.5.desc: "Ich drehe ihn und drücke mich an seinen Rücken. Eine Hand greift um ihn. So bleiben wir, atmend, bevor mehr entschieden wird."
 sbs_orgy.1100.mm.6.desc: "Er senkt den Mund an meine Kehle, dann tiefer, und hält inne. Ich lege eine Hand in seinen Nacken. Der nächste Schritt bleibt eine Wahl."
 sbs_orgy.1100.mm.7.desc: "Unsere Hände bewegen sich gemeinsam über Tuch und Haut. Er lehnt sich an mich. Keiner von uns hat noch etwas zu Ende gebracht."
 sbs_orgy.1100.mm.8.desc: "Er legt die Stirn an meine. Unsere Hände bleiben, wo sie sind. Die Nacht ist noch offen."
 # Female + Female
 sbs_orgy.1100.ff.1.desc: "Meine Hand liegt an ihrer Hüfte, dann auf der warmen Haut ihres Schenkels. Sie spiegelt die Bewegung. So bleiben wir und lernen einander den Takt."
 sbs_orgy.1100.ff.2.desc: "Ich senke den Mund an ihre Kehle, dann an ihre Lippen. Ihre Hand ruht in meinem Nacken und führt, ohne zu zwingen."
 sbs_orgy.1100.ff.3.desc: "Sie drückt mich auf die Couch und setzt sich über meinen Schoß. Unsere Münder treffen sich. Ihre Schenkel schließen sich um mich, als sie sich zuneigt."
 sbs_orgy.1100.ff.4.desc: "Meine Finger ruhen zwischen ihren Schenkeln und finden sie schon warm. Sie tut mir dasselbe. Der Raum füllt sich mit leisem Atem."
 sbs_orgy.1100.ff.5.desc: "Wir landen auf der Seite, eng aneinander, Münder an den Kehlen. Der Rhythmus ist langsam. Keine von uns eilt."
 sbs_orgy.1100.ff.6.desc: "Sie zittert, als ich sie wieder küsse. Einen Moment bleiben wir so, offen und wartend, bevor mehr gewählt wird."
 sbs_orgy.1100.ff.7.desc: "Ihre Hand ruht zwischen meinen Beinen, während mein Mund an ihrer Kehle bleibt. Wir beide sind schon warm. Der Rest bleibt eine Wahl."
 sbs_orgy.1100.ff.8.desc: "Wir küssen uns, bis beide zittern. Hände bleiben an Hüften und Schenkeln. Mehr ist noch nicht entschieden."
 # Options - more detailed
 sbs_orgy.1100.a: "Nichts zwischen uns."
 sbs_orgy.1100.a.tt: "Ich ziehe dich an mich und nehme dich ganz. Haut an Haut, nichts zurückgehalten, bis keiner von uns noch so tun kann, als wäre dies nur eine Berührung gewesen."
 sbs_orgy.1100.b: "Nicht ohne Vorsicht."
 sbs_orgy.1100.b.tt: "Zuerst eine Vorsicht. Dann nehme ich mir Zeit für jede Stelle, die dich erzittern lässt."
 sbs_orgy.1100.c: "Behaltet mich nach dieser Nacht."
 sbs_orgy.1100.c.tt: "Ich nehme dich behutsam und spreche dann von einer weiteren Nacht. Ich will deinen Leib noch einmal kennenlernen."
 sbs_orgy.1100.e: "Was würde die Liebe verlangen?"
 sbs_orgy.1100.e.tt: "Wir halten die Hände still lange genug, um von Liebe zu sprechen, auch wenn die Antwort gefährlich ist."

 # Dirty talk (khẩu dâm) - gender variants
 sbs_orgy.1100.d_fm: "Sag mir, wie."
 sbs_orgy.1100.d_fm.tt: "Sag genau, wie du mich brauchen willst. Beschreib es, während deine Hand noch zwischen meinen Schenkeln liegt."
 sbs_orgy.1100.d_mf: "Sag mir, was du willst."
 sbs_orgy.1100.d_mf.tt: "Sag, was ich mit dir tun soll. Ich will jede Einzelheit hören, während meine Finger noch in dir sind."
 sbs_orgy.1100.d_mm: "Sag mir, wie hart."
 sbs_orgy.1100.d_mm.tt: "Sag, wie hart du es willst. Beschreib, was Mund und Hände tun sollen, während ich dich streiche."
 sbs_orgy.1100.d_ff: "Sag mir, wohin."
 sbs_orgy.1100.d_ff.tt: "Sag genau, wohin du Mund und Finger willst. Ich will es hören, während ich dich berühre."

 # Mutual fondling / mutual masturbation
 sbs_orgy.1100.f_fm: "Nur unsere Hände."
 sbs_orgy.1100.f_fm.tt: "Ich streiche dich, während deine Finger zwischen meinen Schenkeln arbeiten, bis wir beide fertig sind."
 sbs_orgy.1100.f_mf: "Nur unsere Hände."
 sbs_orgy.1100.f_mf.tt: "Ich lasse die Finger in dir, während du mich langsam streichst, bis keiner von uns noch anhalten kann."
 sbs_orgy.1100.f_mm: "Nur unsere Hände."
 sbs_orgy.1100.f_mm.tt: "Wir streichen einander im gleichen Takt und achten auf jede Regung, bis wir beide kommen."
 sbs_orgy.1100.f_ff: "Nur Hände und Münder."
 sbs_orgy.1100.f_ff.tt: "Wir berühren uns, bis wir beide nass und zitternd sind, ohne weiterzugehen."





 sbs_orgy.1200.t: "Ein dritter Platz"
 sbs_orgy.1200.desc: "[sbs_orgy_guest_a.GetFirstName] und [sbs_orgy_guest_b.GetFirstName] kommen zu mir in eine stillere Ecke. Die Luft zwischen uns dreien ist schon warm."
 sbs_orgy.1200.male.desc: "Zwei Leiber drängen sich zu beiden Seiten. Hände streifen Arme, Taille, den Saum der Kleider. Münder finden Kehle und Mund. So bleiben wir, warm und unvollendet, und warten, wer gewählt wird."
 sbs_orgy.1200.female.desc: "Zwei Leiber drängen sich zu beiden Seiten. Hände streifen Arme, Taille, den Saum der Kleider. Münder finden Kehle und Mund. So bleiben wir, warm und unvollendet, und warten, wer gewählt wird."
 sbs_orgy.1200.a: "Nur [sbs_orgy_guest_a.GetFirstName]."
 sbs_orgy.1200.a.tt: "Ich ziehe [sbs_orgy_guest_a.GetFirstName] näher. Heute Nacht will ich nur einen Leib an meinem."
 sbs_orgy.1200.b: "Nur [sbs_orgy_guest_b.GetFirstName]."
 sbs_orgy.1200.b.tt: "Ich ziehe [sbs_orgy_guest_b.GetFirstName] näher. Heute Nacht will ich nur einen Leib an meinem."
 sbs_orgy.1200.c: "Wir alle drei."
 sbs_orgy.1200.c.tt: "Niemand bleibt außen. Hände und Münder gehen frei, bis keiner mehr sagen kann, wessen Lust wessen ist."
 sbs_orgy.1200.d: "Sprecht von Begierde."
 sbs_orgy.1200.d.tt: "Wir sagen offen, was jeder will, während die Hände noch wandern."
 sbs_orgy.1200.e: "Schickt sie zueinander."
 sbs_orgy.1200.e.tt: "Ich lenke sie zueinander und bleibe nah genug, um zuzusehen. Ihre Leiber treffen sich; meiner muss es nicht."

 sbs_orgy.4100.t: "Die nackte Krone"
 sbs_orgy.4100.desc: "[sbs_orgy_nudity_guest.GetFirstName] stellt die Frage mit behutsamer Höflichkeit: wenn ein Herrscher so oft ohne Gewand gesehen wird, kann das Volk ihn noch mit gleichem Respekt ansehen?"
 sbs_orgy.4100.male.desc: "Ich stehe völlig bloß unter den Lampen. Schultern zurück, der Schwanz erst weich, dann sich verdickend unter so vielen Augen. Ich rühre mich nicht, mich zu bedecken. Lasst sie jede Muskellinie und das Gewicht zwischen den Beinen sehen."
 sbs_orgy.4100.female.desc: "Ich stehe völlig bloß unter den Lampen. Schultern zurück, Brüste und das weiche Dreieck zwischen den Schenkeln offen jedem Blick. Ich rühre mich nicht, mich zu bedecken. Lasst sie jede Kurve und die Nässe sehen, die sich schon sammelt."
 sbs_orgy.4100.a: "Lasst sie schauen."
 sbs_orgy.4100.a.tt: "Ein würdiger Leib braucht keinen Vorhang. Ich drehe mich langsam, bis jeder Winkel gesehen ist."
 sbs_orgy.4100.b: "Diese Unschuld ehren."
 sbs_orgy.4100.b.tt: "Adam und Eva kannten in Eden keine Scham. Ich ehre diese Unschuld mit offenen Händen und offenem Leib."
 sbs_orgy.4100.c: "Lasst das Licht entscheiden."
 sbs_orgy.4100.c.tt: "Kleider sollen Schönheit heben, nicht bloß verhüllen."
 sbs_orgy.4100.d: "Lasst die Frage ruhen."
 sbs_orgy.4100.d.tt: "Ich beantworte das Rätsel nicht. Ich stehe einfach so, bis der Saal sich an den Anblick gewöhnt."

 sbs_orgy.4200.t: "Die schönste Gestalt"
 sbs_orgy.4200.desc: "Ein unbedachtes Kompliment wird zum Wettstreit. Wenigstens fünf von uns stehen unter den Lampen, während die Gesellschaft entscheidet, wessen Haltung das lauteste Lob verdient."
 sbs_orgy.4200.male.desc: "Ich stehe unter den anderen, völlig bloß. Muskeln spielen im Licht, der Schwanz zur Schau. Wenn ich dran bin, drehe ich mich langsam und lasse jedes Auge die Linien meines Leibes und das Gewicht zwischen den Beinen messen."
 sbs_orgy.4200.female.desc: "Ich stehe unter den anderen, völlig bloß. Brüste, Hüften und die weichen Falten zwischen den Schenkeln sind dem Urteil offen. Wenn ich dran bin, drehe ich mich langsam und lasse jedes Auge die Kurven und die schon sichtbare Nässe messen."
 sbs_orgy.4200.a: "Stärke zeigen."
 sbs_orgy.4200.a.tt: "Ich halte die Haltung, bis der Saal verstummt."
 sbs_orgy.4200.b: "Mit Anmut gewinnen."
 sbs_orgy.4200.b.tt: "Ich lächle, drehe mich und lasse den Saal entscheiden, dass ich es bin, den man ansehen soll."
 sbs_orgy.4200.c: "Eine kluge Pose."
 sbs_orgy.4200.c.tt: "Ich rücke gerade weit genug, um jeden Blick zu fangen."
 sbs_orgy.4200.d: "Den Wettstreit nutzen."
 sbs_orgy.4200.d.tt: "Ich ziehe die nächsten Leiber heran und gebe dem Wettstreit einen besseren Zweck."

 sbs_orgy.2100.t: "Ein vertrautes Unbehagen"
 sbs_orgy.2100.desc: "Bei aller Freiheit im Raum zögern [sbs_orgy_guest.GetFirstName] und ich. Blut macht manches Schweigen schwerer als anderes."
 sbs_orgy.2100.fm.desc: "Mein erwachsenes Kind steht vor mir, gewachsen und bloß. Dasselbe Blut, das dies einst undenkbar machte, macht die Hitze nur schärfer. Seine Hand findet meine Hüfte; die meine findet die harte Länge von ihm."
 sbs_orgy.2100.mf.desc: "Mein erwachsenes Kind steht vor mir, gewachsen und bloß. Dasselbe Blut, das dies einst undenkbar machte, macht die Hitze nur schärfer. Meine Hand findet die weichen Falten zwischen ihren Beinen; sie ist schon nass."
 sbs_orgy.2100.mm.desc: "Mein erwachsener Sohn steht vor mir, gewachsen und bloß. Dasselbe Blut macht die Hitze nur schärfer. Unsere Hände schließen sich zugleich umeinander."
 sbs_orgy.2100.ff.desc: "Meine erwachsene Tochter steht vor mir, gewachsen und bloß. Dasselbe Blut macht die Hitze nur schärfer. Unsere Hände gleiten zwischen die Schenkel der anderen und finden dieselbe nasse Bereitschaft."
 sbs_orgy.2100.a: "Nichts zwischen uns."
 sbs_orgy.2100.a.tt: "Ich nehme dich ganz. Haut an Haut, Blut an Blut, bis keiner von uns noch so tun kann, als wäre dies nur Nähe."
 sbs_orgy.2100.b: "Nicht ohne Vorsicht."
 sbs_orgy.2100.b.tt: "Zuerst eine Vorsicht. Die Nacht bleibt vertraut, aber nicht unbesonnen."
 sbs_orgy.2100.c: "Lasst es über den Morgen hinaus dauern."
 sbs_orgy.2100.c.tt: "Was uns bindet, ist heilig, nicht schändlich. Ich lasse die Nacht zu etwas werden, das den Morgen überdauern darf."
 sbs_orgy.2100.d: "Nur Hände und Münder."
 sbs_orgy.2100.d.tt: "Wir bleiben bei Händen und Mündern. Nah genug zum Kosten, nicht weit genug, die Grenze zu vergessen."
 sbs_orgy.2100.e: "Bis hierher, nicht weiter."
 sbs_orgy.2100.e.tt: "Ich trete zurück, bevor die Hitze für uns entscheidet. Das Blut zwischen uns bleibt heute Nacht eine Grenze."

 sbs_orgy.2200.t: "Durch die Ehe"
 sbs_orgy.2200.desc: "[sbs_orgy_guest.GetFirstName] kam durch [sbs_orgy_child.GetFirstName] in mein Haus. Heute Nacht fühlt sich dieses vertraute Band weniger einfach an als bei Tageslicht."
 sbs_orgy.2200.fm.desc: "Der Gatte meines Kindes steht nah. Die Ehe, die ihn an mein Haus bindet, fühlt sich dünn an. Seine Hand an meiner Taille; ich spüre, wie bereit er schon ist."
 sbs_orgy.2200.mf.desc: "Der Gatte meines Kindes steht nah. Die Ehe fühlt sich dünn an. Meine Finger finden die weiche Hitze zwischen ihren Beinen; sie weicht nicht."
 sbs_orgy.2200.mm.desc: "Der Ehemann meines Kindes steht nah. Die Ehe fühlt sich dünn an. Unsere Hände schließen sich umeinander ohne ein weiteres Wort."
 sbs_orgy.2200.ff.desc: "Die Ehefrau meines Kindes steht nah. Die Ehe fühlt sich dünn an. Unsere Hände gleiten zwischen die Schenkel der anderen und finden dieselbe nasse Hitze."
 sbs_orgy.2200.a: "Nichts zwischen uns."
 sbs_orgy.2200.a.tt: "Ich nehme, was das Tageslicht das ihre nennen würde. Nichts zwischen uns als die Hitze des Augenblicks."
 sbs_orgy.2200.b: "Nicht ohne Vorsicht."
 sbs_orgy.2200.b.tt: "Eine Vorsicht. Es bleibt eine Nacht, kein dauerndes Band."
 sbs_orgy.2200.c: "Bleib nah. Sonst nichts."
 sbs_orgy.2200.c.tt: "Wir bleiben bei Wärme und wandernden Händen. Die Ehe bleibt ungenannt und ungebrochen."
 sbs_orgy.2200.d: "Sprecht von der Ehe."
 sbs_orgy.2200.d.tt: "Ich nenne das Band laut. Wir sprechen von [sbs_orgy_child.GetFirstName], bis die Hitze einen anderen Weg findet."

 sbs_orgy.2300.t: "Beweis der Freundschaft"
 sbs_orgy.2300.desc: "Ein Freund, oder der nächste der Freunde, steht nah. Das alte Vertrauen sitzt zwischen uns wie ein anderer Leib. Heute Nacht könnte es etwas anderes werden."
 sbs_orgy.2300.fm.desc: "Mein Freund steht nah genug, dass ich die Wärme seiner Haut spüre. Jahre des Vertrauens machen die erste Berührung leicht. Er härtet gegen meine Handfläche, während ich ihn streichele; seine Finger finden mich schon nass."
 sbs_orgy.2300.mf.desc: "Meine Freundin steht nah genug, dass ich die Wärme ihrer Haut spüre. Jahre des Vertrauens machen die erste Berührung leicht. Meine Finger gleiten zwischen ihre Schenkel und finden sie nass; sie schließt die Hand um mich zur Antwort."
 sbs_orgy.2300.mm.desc: "Mein Freund steht nah genug, dass ich die Wärme seiner Haut spüre. Jahre des Vertrauens machen die erste Berührung leicht. Wir streicheln einander im selben langsamen Takt und beobachten jede Regung."
 sbs_orgy.2300.ff.desc: "Meine Freundin steht nah genug, dass ich die Wärme ihrer Haut spüre. Jahre des Vertrauens machen die erste Berührung leicht. Hände und Münder bewegen sich zwischen unseren Schenkeln, bis wir beide zittern."
 sbs_orgy.2300.a: "Beweist es so."
 sbs_orgy.2300.a.tt: "Ich nehme dich ohne Hindernis und lasse die Jahre des Vertrauens heißer werden."
 sbs_orgy.2300.b: "Nicht ohne Vorsicht."
 sbs_orgy.2300.b.tt: "Eine Vorsicht. Die Jahre des Vertrauens werden zu Hitze, nicht zu einem dauernden Anspruch."
 sbs_orgy.2300.c: "Mehr als Freunde."
 sbs_orgy.2300.c.tt: "Ich nehme dich behutsam und lasse das alte Vertrauen zu einem Band der Liebenden werden."
 sbs_orgy.2300.d: "Erinnert euch, wie wir begannen."
 sbs_orgy.2300.d.tt: "Wir sprechen von älteren Nächten und leichteren Tagen. Die Hände bleiben still. Die Freundschaft genügt."

 sbs_orgy.2400.t: "Ein privater Waffenstillstand"
 sbs_orgy.2400.desc: "Mein Rivale steht jenseits des engen Raums. Hass war immer eine Art von Intimität. Heute Nacht ist die Luft zwischen uns mit etwas anderem geladen."
 sbs_orgy.2400.fm.desc: "Die Hände meines Rivalen sind rau, als sie mich endlich berühren. Derselbe Zorn, der mich einst brechen wollte, will mich nun offen. Ich spüre ihn hart an meinem Schenkel, während der alte Hass zu Hitze wird."
 sbs_orgy.2400.mf.desc: "Der Leib meiner Rivalin ist straff, als ich sie endlich berühre. Derselbe Zorn, der mich einst brechen wollte, öffnet sich unter meinen Fingern. Sie ist nass, noch bevor ich sie küsse."
 sbs_orgy.2400.mm.desc: "Der Griff meines Rivalen ist hart, als sich unsere Hände endlich treffen. Derselbe Zorn verdickt sich gegen meine Handfläche. Wir streicheln einander mit der Intensität des alten Kampfs."
 sbs_orgy.2400.ff.desc: "Der Atem meiner Rivalin ist scharf, als sich unsere Hände endlich treffen. Derselbe Zorn wird nass unter meinen Fingern. Wir berühren uns mit der Intensität des alten Kampfs."
 sbs_orgy.2400.a: "Beendet es so."
 sbs_orgy.2400.a.tt: "Ich nehme die Feindschaft in meinen Leib. Wenn es vorbei ist, mag der Hass nicht überleben."
 sbs_orgy.2400.b: "Nachgeben."
 sbs_orgy.2400.b.tt: "Ich gebe nach. Die Unterwerfung soll beenden, was der Streit nie vermochte."
 sbs_orgy.2400.c: "Nicht mit dir."
 sbs_orgy.2400.c.tt: "Ich lasse den alten Hass stehen. Manche Waffenstillstände sind die Haut nicht wert, die sie kosten würden."

 sbs_orgy.2500.t: "Keine Titel heute Nacht"
 sbs_orgy.2500.desc: "Ein Vasall ist da. Rang besteht noch, aber die Kleider sind fort und die Nacht ist lang. Macht kann beiseitegelegt oder anders gebraucht werden."
 sbs_orgy.2500.fm.desc: "Mein Vasall kniet oder steht, wie ich will. Derselbe Mund, der einst Treue schwor, öffnet sich nun für mich. Ich spüre die Hitze seines Schwanzes an der Handfläche, während ich entscheide, wie weit der Dienst geht."
 sbs_orgy.2500.mf.desc: "Meine Vasallin wartet mit der Stille dessen, der seinen Platz kennt. Meine Finger finden die weiche Hitze zwischen ihren Beinen; sie sieht nicht weg. Rang wird etwas Nasses und Unmittelbares."
 sbs_orgy.2500.mm.desc: "Mein Vasall wartet mit der Stille dessen, der seinen Platz kennt. Ich schließe die Hand um ihn und spüre, wie Treue zu Hitze wird. Er streichelt mich mit sorgfältiger, geübter Bewegung zurück."
 sbs_orgy.2500.ff.desc: "Meine Vasallin wartet mit der Stille dessen, der seinen Platz kennt. Meine Finger gleiten zwischen ihre Schenkel und finden sie bereit. Sie spiegelt die Berührung; Rang löst sich in gemeinsame nasse Hitze."
 sbs_orgy.2500.a: "Nicht ohne Vorsicht."
 sbs_orgy.2500.a.tt: "Der Rang kann warten. Eine Vorsicht, dann nehme ich, was ein Vasall bieten kann."
 sbs_orgy.2500.b: "Auf die Knie."
 sbs_orgy.2500.b.tt: "Ich schicke sie auf die Knie und brauche Mund und Hände, bis die Last der Herrschaft nachlässt."
 sbs_orgy.2500.c: "Nennt euren Preis."
 sbs_orgy.2500.c.tt: "Ich biete Münze für das, was der Rang nicht befehlen sollte. Die Nacht geht zu erkauftem Preis weiter."
 sbs_orgy.2500.d: "Reden, während wir uns berühren."
 sbs_orgy.2500.d.tt: "Amt und Nähe in einem Atem. Die Hände wandern. Mehr ist nicht nötig."

 sbs_orgy.2600.t: "Ein vertrautes Versprechen"
 sbs_orgy.2600.desc: "Mein Gatte ist hier. Der vertraute Leib, die bekannte Berührung. Trost und Begierde zu gleichen Teilen."
 sbs_orgy.2600.fm.desc: "Der Leib meines Mannes ist mir so bekannt wie mein eigener. Er fügt sich in meine Hand wie immer. Heute Nacht macht die Vertrautheit die Hitze nur tiefer."
 sbs_orgy.2600.mf.desc: "Der Leib meiner Frau ist mir so bekannt wie mein eigener. Die weichen Falten zwischen ihren Beinen öffnen sich meinen Fingern wie immer. Heute Nacht macht die Vertrautheit die Hitze nur tiefer."
 sbs_orgy.2600.mm.desc: "Der Leib meines Mannes ist mir so bekannt wie mein eigener. Wir streicheln einander mit der Leichtigkeit langer Übung, die Hitze nach all den Jahren noch scharf."
 sbs_orgy.2600.ff.desc: "Der Leib meiner Frau ist mir so bekannt wie mein eigener. Hände und Münder bewegen sich zwischen unseren Schenkeln mit der Leichtigkeit langer Übung, die Hitze nach all den Jahren noch scharf."
 sbs_orgy.2600.a: "Wie immer."
 sbs_orgy.2600.a.tt: "Ich nehme meinen Gemahl ganz und lasse das vertraute Vergnügen seinen Lauf."
 sbs_orgy.2600.b: "Findet jemand anderen."
 sbs_orgy.2600.b.tt: "Ich wende mich vom bekannten Leib und suche stattdessen die Hitze eines Fremden."

 sbs_orgy.2700.t: "Geschäft vor Vergnügen"
 sbs_orgy.2700.desc: "[sbs_orgy_guest.GetFirstName] findet mich, während das Fest um uns weitergeht. Irgendwie beginnt eine Ratssitzung, ohne dass einer von uns sie einberufen hätte."
 sbs_orgy.2700.a: "Zuerst das Reich."
 sbs_orgy.2700.a.tt: "Wir sprechen von Ämtern und unerledigter Arbeit, während das Gelage um uns weitergeht."
 sbs_orgy.2700.b: "Was würde die Liebe verlangen?"
 sbs_orgy.2700.b.tt: "Der Rat kann warten. Ich frage, was die Liebe aus zweien machen würde, die sonst vom Reich sprechen."
 sbs_orgy.2700.c: "Sprecht von Begierde."
 sbs_orgy.2700.c.tt: "Wir nennen, was wir wollen, in klaren Worten. Die Hände bleiben still. Das Gespräch genügt, die Nacht zu erleichtern."

 sbs_orgy.2800.t: "Der Haushalt eines Vasallen"
 sbs_orgy.2800.desc: "[sbs_orgy_guest.GetFirstName] gehört zum Haushalt von [sbs_orgy_vassal_spouse_owner.GetFirstName], einem meiner eigenen Vasallen. Die Tatsache ist schwer zu vergessen, obwohl keiner geht."
 sbs_orgy.2800.fm.desc: "Der Gatte meines Vasallen steht nah. Das Haushaltsband, das ihn schützen sollte, fühlt sich dünn an. Er härtet in meiner Hand, während der Name des Gatten ungesprochen zwischen uns hängt."
 sbs_orgy.2800.mf.desc: "Der Gatte meines Vasallen steht nah. Das Haushaltsband fühlt sich dünn an. Meine Finger finden sie schon nass, während der Name des Gatten ungesprochen zwischen uns hängt."
 sbs_orgy.2800.mm.desc: "Der Ehemann meines Vasallen steht nah. Das Haushaltsband fühlt sich dünn an. Wir streicheln einander, während der Name des Gatten ungesprochen zwischen uns hängt."
 sbs_orgy.2800.ff.desc: "Die Ehefrau meines Vasallen steht nah. Das Haushaltsband fühlt sich dünn an. Unsere Hände bewegen sich zwischen den Schenkeln, während der Name des Gatten ungesprochen zwischen uns hängt."
 sbs_orgy.2800.a: "Ein behutsames Geheimnis."
 sbs_orgy.2800.a.tt: "Eine Vorsicht, dann nehme ich den Gemahl meines Vasallen und halte die Nacht geheim."
 sbs_orgy.2800.b: "Nichts zwischen uns."
 sbs_orgy.2800.b.tt: "Ich nehme sie ganz. Das Band des Haushalts bleibt vor der Tür."
 sbs_orgy.2800.c: "Lasst die Tür offen."
 sbs_orgy.2800.c.tt: "Ich nehme sie behutsam und lasse die Tür offen. Das muss nicht enden, wenn die Lampen ausgehen."
 sbs_orgy.2800.d: "Ruft [sbs_orgy_vassal_spouse_owner.GetFirstName] her."
 sbs_orgy.2800.d.tt: "Ich rufe [sbs_orgy_vassal_spouse_owner.GetFirstName] herbei und setze die beiden zusammen. Sie führen es für mich aus. Beide gehen zufrieden mit meiner Handhabung. Zusehen und ordnen kostet mich mehr als sie."
 sbs_orgy.2800.e: "Das Gespräch genügt."
 sbs_orgy.2800.e.tt: "Fürs Erste ist das Gespräch Skandal genug. Die Hände bleiben still."

 sbs_orgy.2900.t: "Über dem Rang"
 sbs_orgy.2900.desc: "Fern vom förmlichen Saal ist [sbs_orgy_guest.GetFirstName] noch mein Lehnsherr, obwohl Rang in einem Raum wie diesem weniger gewiss wirkt."
 sbs_orgy.2900.fm.desc: "Mein Lehnsherr steht nah genug, dass Rang noch zählen sollte. Tut er nicht. Seine Hand findet die weiche Hitze zwischen meinen Beinen; ich schließe die Finger um die harte Länge von ihm."
 sbs_orgy.2900.mf.desc: "Mein Lehnsherr steht nah genug, dass Rang noch zählen sollte. Tut er nicht. Meine Finger finden die weiche Hitze zwischen ihren Beinen; sie schließt die Hand um mich zur Antwort."
 sbs_orgy.2900.mm.desc: "Mein Lehnsherr steht nah genug, dass Rang noch zählen sollte. Tut er nicht. Wir schließen die Hände zugleich umeinander; die Rangordnung löst sich in schlichte Hitze."
 sbs_orgy.2900.ff.desc: "Mein Lehnsherr steht nah genug, dass Rang noch zählen sollte. Tut er nicht. Unsere Hände gleiten zwischen die Schenkel der anderen und finden dieselbe nasse Bereitschaft."
 sbs_orgy.2900.a: "Setzt den Rang beiseite."
 sbs_orgy.2900.a.tt: "Ich nehme meinen Lehnsherrn mit einer Vorsicht und lasse die Nacht nur Leiber sein."
 sbs_orgy.2900.b: "Meine Gesellschaft hat einen Preis."
 sbs_orgy.2900.b.tt: "Ich biete mich mit Worten und Geschick an und verlange einen Preis für das Vorrecht."
 sbs_orgy.2900.b.success: "Meine Bedingungen werden angenommen. Die Nacht geht nach meinem Willen weiter."
 sbs_orgy.2900.b.failure: "Mein Lehnsherr lässt sich nicht überzeugen. Der Rang kehrt zurück."
 sbs_orgy.2900.c: "Nur Worte, mein Lehnsherr."
 sbs_orgy.2900.c.tt: "Einmal sprechen wir nur. Die Hände bleiben still. Die Rangordnung bleibt unberührt."

 sbs_orgy.2920.t: "Ein gebundener Gast"
 sbs_orgy.2920.desc: "[sbs_orgy_guest.GetFirstName] wartet mit der geübten Stille dessen, der gewohnt ist, befohlen zu werden. Heute Nacht bietet mehrere Wege, diesem Gehorsam zu antworten."
 sbs_orgy.2920.fm.desc: "Der Sklave wartet. Auf mein Wort kniet er. Sein Mund öffnet sich für mich; meine Hand schließt sich um die harte Länge von ihm. Das Halsband, oder das Mal, oder die bloße Tatsache des Besitzes macht jede Berührung schwerer."
 sbs_orgy.2920.mf.desc: "Die Sklavin wartet. Auf mein Wort kniet sie oder öffnet sich. Meine Finger finden die weiche Hitze zwischen ihren Beinen; sie sieht nicht weg. Das Halsband, oder das Mal, oder die bloße Tatsache des Besitzes macht jede Berührung schwerer."
 sbs_orgy.2920.mm.desc: "Der Sklave wartet. Auf mein Wort kniet er. Wir streicheln einander mit der Klarheit von Befehl und Gehorsam. Das Halsband, oder das Mal, oder die bloße Tatsache des Besitzes macht jede Berührung schwerer."
 sbs_orgy.2920.ff.desc: "Die Sklavin wartet. Auf mein Wort kniet sie oder öffnet sich. Unsere Hände bewegen sich zwischen den Schenkeln mit der Klarheit von Befehl und Gehorsam. Das Halsband, oder das Mal, oder die bloße Tatsache des Besitzes macht jede Berührung schwerer."
 sbs_orgy.2920.a: "Dient mit dem Mund."
 sbs_orgy.2920.a.tt: "Ich schicke sie auf die Knie. Mund und Hände arbeiten, bis die Last des Befehls nachlässt."
 sbs_orgy.2920.b: "Ein fremder Befehl."
 sbs_orgy.2920.b.tt: "Ich gebe einen Befehl, der mit gewöhnlichem Dienst nichts zu tun hat, und sehe zu, wie sie gehorchen."
 sbs_orgy.2920.c: "Komm her."
 sbs_orgy.2920.c.tt: "Keine weitere Zeremonie. Eine Vorsicht, dann nehme ich sie wie jeden anderen in dieser Nacht."
 sbs_orgy.2920.d: "Nicht heute Nacht."
 sbs_orgy.2920.d.tt: "Ich heiße sie sitzen und atmen. Mitleid statt Befehl. Der Kragen kann warten."


# Contest localization

# 3100 - Contest of Mouths
 sbs_orgy.3100.t: "Ein Wettstreit der Münder"
 sbs_orgy.3100.desc: "Jemand fordert einen Wettstreit der Kunst. Einer nach dem anderen treten die Willigen vor, einen Schwanz in den Mund zu nehmen. Wer ihn am tiefsten nimmt und am längsten hält, ohne wegzuziehen, erhält den Beutel."
 sbs_orgy.3100.male.desc: "Wenn ich dran bin, knie ich und nehme den angebotenen Schwanz. Zuerst langsam, dann tiefer, bis der Raum sieht, wie jeder Zoll verschwindet, die Kehle voll und die Augen feucht."
 sbs_orgy.3100.female.desc: "Wenn ich dran bin, knie ich und nehme den angebotenen Schwanz. Zuerst langsam, dann tiefer, mit Zunge und Kehle, bis der Raum sieht, wie weit ich gehen will."
 sbs_orgy.3100.a: "Nehmt die Herausforderung an."
 sbs_orgy.3100.a.tt: "Ich werde ihnen zeigen, was mein Mund vermag."
 sbs_orgy.3100.a.success: "Ich nehme tiefer und halte länger als jeder andere. Der Beutel wird unter leisem Beifall in meine Hände gelegt."
 sbs_orgy.3100.a.failure: "Ein anderer erweist sich als geschickter. Ich trete mit weniger Würde zurück, als ich gehofft hatte."
 sbs_orgy.3100.b: "Nur zusehen."
 sbs_orgy.3100.b.tt: "Ich bleibe unter den Zuschauern und lasse einen anderen Mund den Beutel holen."

# 3200 - Who Lasts the Longest
 sbs_orgy.3200.t: "Wer am längsten hält"
 sbs_orgy.3200.desc: "Ein neuer Wettstreit wird ausgerufen. Willige Paare bilden sich und die Aufgabe ist einfach: so lange wie möglich weiterzumachen, ohne zu kommen. Der Raum schaut und zählt die Minuten."
 sbs_orgy.3200.male.desc: "Ich nehme einen willigen Partner unter mich. Die Regel ist klar: den Takt halten, weiterstoßen und nicht kommen, bis jedes andere Paar schon gebrochen hat. Der Raum zählt jede Minute laut."
 sbs_orgy.3200.female.desc: "Ich nehme einen willigen Partner in mich. Die Regel ist klar: in Bewegung bleiben, den Takt halten und nicht fertigwerden, bis jedes andere Paar schon gebrochen hat. Der Raum zählt jede Minute laut."
 sbs_orgy.3200.a: "Nehmt die Herausforderung an."
 sbs_orgy.3200.a.tt: "Ich nehme meinen Gefährten. Der Saal soll sehen, wie lange ich durchhalte."
 sbs_orgy.3200.a.success: "Ich halte länger durch als jedes andere Paar. Beutel und leiser Neid des Saals gehören mir."
 sbs_orgy.3200.a.failure: "Ich breche vor den anderen. Der Saal merkt es sogleich."
 sbs_orgy.3200.b: "Nur zusehen."
 sbs_orgy.3200.b.tt: "Ich bleibe unter den Zuschauern und lasse andere Paare gegen die Minuten laufen."

# 3300 - The Most Rounds
 sbs_orgy.3300.t: "Die meisten Runden"
 sbs_orgy.3300.desc: "Jemand erhöht den Einsatz. Die Herausforderung ist nun Ausdauer: wer die meisten Partner nehmen kann, bevor er aufhören muss. Die Zahl wird laut geführt, damit niemand betrügt."
 sbs_orgy.3300.male.desc: "Ich gehe von einem willigen Partner zum nächsten. Jedes Mal, wenn ich komme, erhole ich mich nur lange genug, um neu zu beginnen. Der Raum ruft die Zahl nach jeder Runde."
 sbs_orgy.3300.female.desc: "Ich nehme einen willigen Partner nach dem anderen. Jedes Mal, wenn einer in mir oder auf mir fertig wird, wartet der nächste schon. Der Raum ruft die Zahl nach jeder Runde."
 sbs_orgy.3300.a: "Nehmt die Herausforderung an."
 sbs_orgy.3300.a.tt: "Lasst sie zählen, wie viele ich nehmen kann."
 sbs_orgy.3300.a.success: "Ich nehme mehr Gefährten als jeder andere, ehe ich aufhöre. Der Beutel ist mein."
 sbs_orgy.3300.a.failure: "Ein anderer erweist sich als unerbittlicher. Ich habe nicht die höchste Zahl."
 sbs_orgy.3300.b: "Nur zusehen."
 sbs_orgy.3300.b.tt: "Ich zähle mit dem Saal und überlasse die Runden einem Hungrigeren."

# 3400 - Who Breaks First
 sbs_orgy.3400.t: "Wer zuerst bricht"
 sbs_orgy.3400.desc: "Ein stillerer Wettstreit wird vorgeschlagen. Willige legen sich zurück, während geübte Hände und Münder an ihnen arbeiten. Die Regel ist einfach: nicht fertigwerden. Wer zuerst bricht, verliert."
 sbs_orgy.3400.male.desc: "Ich lege mich zurück und lasse geübte Hände und Münder an mir arbeiten. Jeder Atem, jedes Zucken wird beobachtet. Wer zuerst kommt, verliert den Beutel."
 sbs_orgy.3400.female.desc: "Ich lege mich zurück und lasse geübte Hände und Münder zwischen meinen Beinen arbeiten. Jeder Atem, jedes Beben wird beobachtet. Wer zuerst fertig wird, verliert den Beutel."
 sbs_orgy.3400.a: "Nehmt die Herausforderung an."
 sbs_orgy.3400.a.tt: "Lasst sie versuchen, mich zu brechen."
 sbs_orgy.3400.a.success: "Ich halte länger durch als jeder andere. Beutel und leiser Respekt des Saals gehören mir."
 sbs_orgy.3400.a.failure: "Ich breche zuerst. Der Saal sieht es deutlich."
 sbs_orgy.3400.b: "Ich werde stattdessen berühren."
 sbs_orgy.3400.b.tt: "Ich arbeite mit Händen und Mund an einem anderen und überlasse ihnen den Wettstreit der Ausdauer."

# 3500 - Contest of Tongues
 sbs_orgy.3500.t: "Ein Wettstreit der Zungen"
 sbs_orgy.3500.desc: "Jemand fordert eine andere Herausforderung. Einer nach dem anderen senken die Willigen den Mund zwischen angebotene Schenkel. Wer am längsten bleibt und dem Partner am meisten entlockt, erhält den Beutel."
 sbs_orgy.3500.male.desc: "Wenn ich dran bin, senke ich den Mund zwischen die angebotenen Schenkel und arbeite mit stetiger Aufmerksamkeit. Zunge und Lippen bewegen sich, bis der Raum hört, wie gut ich bin und wie lange ich bleiben will."
 sbs_orgy.3500.female.desc: "Wenn ich dran bin, senke ich den Mund zwischen die angebotenen Schenkel und arbeite mit stetiger Aufmerksamkeit. Zunge und Lippen bewegen sich, bis der Raum hört, wie gut ich bin und wie lange ich bleiben will."
 sbs_orgy.3500.a: "Nehmt die Herausforderung an."
 sbs_orgy.3500.a.tt: "Ich werde ihnen zeigen, was mein Mund vermag."
 sbs_orgy.3500.a.success: "Ich halte länger durch und locke mehr Laute aus meinem Gefährten als jeder andere. Der Beutel kommt in meine Hände."
 sbs_orgy.3500.a.failure: "Ein anderer erweist sich als geschickter. Ich trete mit weniger Würde zurück, als ich gehofft hatte."
 sbs_orgy.3500.b: "Nur zusehen."
 sbs_orgy.3500.b.tt: "Ich bleibe unter den Zuschauern und lasse eine andere Zunge den Beutel holen."

# Heavy / extreme localization

# 6100 - Female alone with animal
 sbs_orgy.6100.t: "Ein anderer Gast"
 sbs_orgy.6100.desc: "Die Türen öffnen sich weiter als sonst. Etwas Großes und Warmes wird an einem dicken Seil in den Raum geführt. Die anderen Gäste verstummen und treten zurück."
 sbs_orgy.6100.horse.desc: "Ein kräftiges Pferd wird vorgeführt, schon hart und schwer zwischen den Beinen. Ich werde auf Hände und Knie darunter geführt. Wenn das Tier aufsteigt, presst die bloße Größe ein langes, gebrochenes Stöhnen aus meiner Kehle. Jeder tiefe Stoß dehnt mich, bis ich nur noch den Boden klammern und aufschreien kann."
 sbs_orgy.6100.dog.desc: "Ein großer Hund wird vorgeführt, keuchend und schon tropfend. Er steigt ohne Zögern von hinten auf, Hüften in schnellen, scharfen Stößen. Das nasse Geräusch und die gierigen Knurrlaute füllen den Raum, während ich hilflos unter dem Gewicht stöhne."
 sbs_orgy.6100.pig.desc: "Ein schwerer Eber wird hereingeführt, grunzend und schon schlüpfrig. Wenn er aufsteigt, zwängt sich die dicke, stumpfe Form mit stetigem Druck hinein. Jeder tiefe Stoß zieht einen rohen, tierischen Laut aus meiner Kehle, der sich mit seinem Grunzen mischt, bis der Raum von beiden widerhallt."
 sbs_orgy.6100.a: "Nimm es ganz."
 sbs_orgy.6100.a.tt: "Ich kann die Laute nicht halten. Die Dehnung und die Hitze sind zu viel — ich stöhne und schiebe mich dagegen, bis das Tier tief in mir fertig wird."
 sbs_orgy.6100.b: "Stoß es weg."
 sbs_orgy.6100.b.tt: "Es ist einfach zu groß. Ich stoße das Tier weg, ehe es tiefer geht, keuchend und zitternd auf dem Boden."

# 6200 - Guest leads female root like an animal
 sbs_orgy.6200.t: "Geführt wie ein Tier"
 sbs_orgy.6200.desc: "[sbs_orgy_guest.GetFirstName] nimmt eine Lederleine vom Tisch und klemmt sie an das mitgebrachte Halsband. Der Raum sieht schweigend zu, wie ich auf alle Viere befohlen und zum Kriechen gebracht werde."
 sbs_orgy.6200.horse.desc: "Nachdem man mich gezwungen hat, auf Befehl zu bellen und den Boden wie ein Hund zu nässen, führt [sbs_orgy_guest.GetFirstName] das Pferd vor. Ich werde darunter gesetzt. Die ungeheure Last legt sich auf meinen Rücken und die dicke Länge dringt ein, die Leine kurz gehalten."
 sbs_orgy.6200.dog.desc: "Nachdem man mich gezwungen hat zu bellen und den Boden zu nässen, bringt [sbs_orgy_guest.GetFirstName] einen großen Hund. Das Tier steigt sogleich auf, stößt hart und schnell. Der Gast hält die Leine straff, während nasse Laute und Knurren die Luft füllen."
 sbs_orgy.6200.pig.desc: "Nachdem man mich gezwungen hat zu bellen und den Boden zu nässen, bringt [sbs_orgy_guest.GetFirstName] einen schweren Eber. Die stumpfe, dicke Form zwängt sich mit stetigem Druck hinein, während der Gast die Leine kurz hält und zusieht, wie jeder Zoll verschwindet."
 sbs_orgy.6200.a: "Gehorcht und nehmt es."
 sbs_orgy.6200.a.tt: "Ich bleibe auf allen vieren und nehme das Tier genau wie befohlen, stöhnend unter der Dehnung, bis es in mir fertig wird."
 sbs_orgy.6200.b: "Den Gast stattdessen anflehen."
 sbs_orgy.6200.b.tt: "Ich drehe mich und knie vor [sbs_orgy_guest.GetFirstName] und flehe, ihnen zu dienen statt dem Tier."
 sbs_orgy.6200.c: "Verweigern."
 sbs_orgy.6200.c.tt: "Ich reiße die Leine los und stehe auf. Das ist weit über jedes Spiel hinaus, das ich noch mitspielen will."

# 6300 - Female root leads a female guest like an animal
 sbs_orgy.6300.t: "Mein eigenes Haustier"
 sbs_orgy.6300.desc: "Ich nehme die Lederleine und klemme sie an [sbs_orgy_guest.GetFirstName]. Der Raum sieht zu, wie ich sie kriechen, auf Befehl bellen und den Boden nässen lasse wie ein dressiertes Tier."
 sbs_orgy.6300.horse.desc: "Wenn sie genug geleistet hat, führe ich das Pferd vor und setze sie darunter. Das schwere Tier steigt auf, während ich die Leine kurz halte und zusehe, wie jeder tiefe Stoß einen gebrochenen Laut aus ihrer Kehle presst."
 sbs_orgy.6300.dog.desc: "Wenn sie genug geleistet hat, bringe ich einen großen Hund. Er steigt eifrig auf, Hüften in schnellen Stößen, während ich die Leine kurz halte und sie zwinge, still für ihn zu bleiben."
 sbs_orgy.6300.pig.desc: "Wenn sie genug geleistet hat, bringe ich einen schweren Eber. Die dicke, stumpfe Form zwängt sich in sie, während ich die Leine halte und den rohen Lauten lausche, die sie nicht halten kann."
 sbs_orgy.6300.a: "Zwingt sie darauf."
 sbs_orgy.6300.a.tt: "Ich halte sie fest, bis das Tier tief in ihr fertig wird, und lasse sie mich dann für das Vorrecht danken."
 sbs_orgy.6300.b: "Mit den eigenen Händen belohnen."
 sbs_orgy.6300.b.tt: "Ich halte das Tier auf und brauche stattdessen eigene Hände und den Mund, um den Gehorsam zu belohnen."

# 3600 - Vaginal beer contest
 sbs_orgy.3600.t: "Ein anderer Trunk"
 sbs_orgy.3600.desc: "Die anwesenden Frauen werden vorgerufen. Becher starken Biers stehen auf dem Boden. Die Herausforderung wird klar gesprochen: den Becher halten, ohne Hände oder Mund zu gebrauchen. Wer am längsten hält, gewinnt den Beutel. Der Rest des Raums wartet, wer zuerst bricht."
 sbs_orgy.3600.a: "Nehmt die Herausforderung an."
 sbs_orgy.3600.a.tt: "Ich setze mich über den Becher, entschlossen, länger durchzuhalten als jede andere Frau."
 sbs_orgy.3600.a.success: "Ich halte länger durch als jede andere. Der Beutel kommt in meine Hände, während der Saal den Sieg beklatscht."
 sbs_orgy.3600.a.failure: "Ich halte nicht. Das Bier läuft aus und der Saal bestimmt die Buße ohne Schonung: jeder anwesende Mann nimmt sich an uns beiden, ehe die Nacht enden darf."
 sbs_orgy.3600.b: "Verweigern."
 sbs_orgy.3600.b.tt: "Manche Spiele sind den Preis einer Niederlage nicht wert."

# 1300-1400 indoor / 5100-5400 outdoor
 sbs_orgy.1300.t: "Der hohe Sitz"
 sbs_orgy.1300.desc: "Der Thron des Gastgebers steht nicht länger leer. Zwei Leiber haben ihn genommen, und der Saal sieht genau, wozu der Sitz gebraucht wird."
 sbs_orgy.1300.fm.desc: "Ich sitze rittlings auf ihm im geschnitzten Sitz, die Lehnen hart an meinen Schenkeln. Jedes Mal, wenn ich mich senke, knarrt das Holz. Seine Hände halten meine Hüften; der Saal unten ist sehr still geworden."
 sbs_orgy.1300.mf.desc: "Ich halte sie auf meinem Schoß auf dem hohen Sitz, eine Hand unter ihrem Schenkel, die andere am geschnitzten Arm. Sie bewegt sich gegen mich vor dem ganzen Saal. Der Thron war nicht dafür gemacht — und genau das ist der Sinn."
 sbs_orgy.1300.mm.desc: "Er sitzt in meinem Schoß auf dem Thron des Gastgebers, der Rücken an meiner Brust, das geschnitzte Holz beißt uns beide. Wir verbergen die Bewegung nicht. Wer diesen Sitz besitzt, wird es später riechen."
 sbs_orgy.1300.ff.desc: "Ich habe sie mit mir auf dem Thron, ein Schenkel über der Lehne, mein Mund an ihrer Kehle, während die Hand zwischen ihren Beinen arbeitet. Der Sitz war zum Richten da. Heute Nacht hält er etwas Nässeres."
 sbs_orgy.1300.a: "Den Sitz behutsam nehmen."
 sbs_orgy.1300.a.tt: "Ich behalte eine Vorsicht und ende auf dem Thron. Der Saal wird sich an die Höflichkeit ebenso erinnern wie an die Hitze."
 sbs_orgy.1300.b: "Findet einen anderen Ort."
 sbs_orgy.1300.b.tt: "Der hohe Sitz ist kein Bett. Ich schicke sie vom Thron, einen stilleren Winkel zu suchen."
 sbs_orgy.1400.t: "Ein weicheres Zimmer"
 sbs_orgy.1400.desc: "Das Werk ist schon begonnen. [sbs_orgy_guest.GetFirstName] liegt noch an mir, als der Vorschlag kommt: die öffentlichen Räume verlassen und dies in einem rechten Bett vollenden."
 sbs_orgy.1400.fm.desc: "Er ist noch in dem langsamen Takt, den wir im Gang begonnen haben. Sein Mund ist an meinem Ohr. Die Kammer, sagt er, wäre gütiger zu meinem Rücken als Stein. Er hört nicht auf sich zu bewegen, während er fragt."
 sbs_orgy.1400.mf.desc: "Sie hat ein Knie auf der Bank und den Atem an meiner Kehle. Das Bett ist nur eine Tür entfernt. Sie will die Laken, den Riegel, die Zeit. Ihre Hand lässt mich nicht, während sie auf die Antwort wartet."
 sbs_orgy.1400.mm.desc: "Wir sind gegen die Wand schon halb fertig. Er nickt zur Kammer und nimmt die Hand nicht von mir. Ein Bett ließe uns länger dauern. Der Saal müsste es nicht hören."
 sbs_orgy.1400.ff.desc: "Ihr Schenkel ist noch über meinem eingehakt. Sie will das Bett: die Tür zu, die Kissen, einen Ort bis zum Morgen. Ihre Finger bleiben, wo sie sind, bis ich wähle."
 sbs_orgy.1400.a: "Nehmt das Bett."
 sbs_orgy.1400.a.tt: "Ich lasse mich hineinführen und wir enden ohne Eile. Die geschlossene Tür wirbt mehr Wärme, als der Saal je gäbe."
 sbs_orgy.1400.b: "Warum nicht der Thron?"
 sbs_orgy.1400.b.tt: "Ich ziehe sie zum hohen Sitz. Der Saal darf zusehen. Die Kühnheit erleichtert mich; sie sind belustigt genug, den Umweg zu verzeihen."
 sbs_orgy.1400.c: "Bleibt, wie wir sind."
 sbs_orgy.1400.c.tt: "Kein anderes Zimmer. Ich behalte den Takt, den wir schon haben, und ende hier."
 sbs_orgy.5100.t: "Ein Dorfzug"
 sbs_orgy.5100.desc: "Die Orgie bleibt nicht auf dem Feld. Gegen Vormittag ist sie in ein armes Dorf gelaufen, eine nackte Säule zwischen den Häusern, die Sonne noch hoch.\n\nEin Mann pißt gegen einen Türpfosten, ohne den Schritt zu brechen. Ein anderer hockt in der Gosse und sieht nicht auf. Jemand hat die Bäckersfrau am Brunnen, die Röcke schon weg, der Protest schon dünner als die Hitze. Kinder werden hereingezogen. Hunde bellen. Der Priester, wenn es einen gibt, hat einen Laden gefunden, den er schließen kann.\n\nNiemand führt. Die Säule nimmt einfach die Gasse, lachend, beschmiert, hält überall, wo eine Wand oder ein Karren einen Leib trägt. Die Gewalt über diesen Ort wird dünner mit jeder Tür, die geschlossen bleibt."
 sbs_orgy.5100.a: "Lasst die Säule weitergehen."
 sbs_orgy.5100.a.tt: "Der Zug behält die Gasse, bis das Dorf genug gesehen hat. Was hier an Gewalt bleibt, wird langsamer antworten."
 sbs_orgy.5200.t: "Zwischen den Steinen"
 sbs_orgy.5200.desc: "[sbs_orgy_guest_a.GetFirstName] und [sbs_orgy_guest_b.GetFirstName] haben schon eine Platte gewählt. Die Namen im Stein sind älter als wir. Das Gras zwischen den Gräbern liegt flach, wo andere Paare vorbeigegangen sind."
 sbs_orgy.5200.female.desc: "Ich liege auf dem Rücken über einer abgewetzten Inschrift, einer zwischen meinen Knien, der andere kniend, wo ich ihn in den Mund nehmen kann. Der Stein ist kalt unter den Schultern. Jeder Stoß schlägt Staub aus den Buchstaben. Wenn ich den Kopf drehe, kann ich ein Datum lesen. Sie halten deswegen nicht inne."
 sbs_orgy.5200.male.desc: "Ich habe einen über einen schiefen Stein gebeugt, den anderen auf dem Grab an meiner Hüfte, damit ich beide erreiche. Die Meißelspuren fassen die Haut. Ein Kranz von einem älteren Begräbnis liegt unter einem Knie zerdrückt. Der Ort riecht nach Erde und Sex in einem Atem."
 sbs_orgy.5200.a: "Das ist eine Schändung."
 sbs_orgy.5200.a.tt: "Ich ziehe uns vom Stein, ehe es weitergeht. Den Toten ist das geschuldet, auch wenn die Nacht es nicht ist."
 sbs_orgy.5200.b: "Die Toten werden sich nicht scheren."
 sbs_orgy.5200.b.tt: "Ich behalte beide auf dem Grab und ende dort. Das Unrechte daran ist die Hitze."
 sbs_orgy.5300.t: "Nach dem langen Tag"
 sbs_orgy.5300.desc: "Das Lager war seit der Dämmerung eine einzige lange Umarmung. Niemand hat Kleider wieder angelegt. Die Feuer sind niedrig. Was an Speise bleibt, liegt ein Stück abseits, hinter Lagern, die von der letzten Paarung noch nass sind."
 sbs_orgy.5300.body.desc: "Ich versuche aufzustehen und die Schenkel wollen sich nicht schließen. Die Muskeln waren zu lange offengehalten; schon der Versuch zieht einen rohen Schmerz durch die Scham. Was vergossen wurde, läuft noch langsam aus mir — aus dem Gesäß, zwischen den Beinen — und kühlt an der Innenseite des Schenkels, ehe es das Knie erreicht.\n\n[sbs_orgy_guest.GetFirstName] sieht den Gang, den ich nicht gehen kann. Das Angebot ist einfach. Er bringt das Essen. Ich komme auf allen vieren, und ich belle, wenn er es sagt."
 sbs_orgy.5300.a: "Essen, was ich schon habe."
 sbs_orgy.5300.a.tt: "Ich sammle auf zwei Finger, was noch aus mir läuft, und führe es zum Mund. Es ist Salz und Hitze. Es ist keine Mahlzeit. Es reicht, nicht kriechen zu müssen."
 sbs_orgy.5300.b: "Knie und belle."
 sbs_orgy.5300.b.tt: "Ich gehe nieder, wo ich stehe, und gebe ihm den Laut, den er wollte. Das Essen kommt. Die Würde nicht."
 sbs_orgy.5300.c: "Kriech zum Essen."
 sbs_orgy.5300.c.tt: "Ich mache mich auf allen vieren zum Topf, die Schenkel noch offen, die Spur hinter mir bis zum Essen."
 sbs_orgy.5400.t: "Das nächste Feuer"
 sbs_orgy.5400.desc: "Das Tageslicht hat das Lager nicht geleert. Die Lagerstätten liegen, wo man sie stieß. Frauen gehen zwischen den Feuern, ohne sich wieder anzukleiden; die Arbeit des Morgens steht noch auf ihnen — ein Glanz innen am Schenkel, ein Mal an der Kehle, ein Gang, der noch nicht weiß, wie man gewöhnlich geht."
 sbs_orgy.5400.body.desc: "[sbs_orgy_guest.GetFirstName] ist nicht aufgestanden. Sie liegt auf einem ausgebreiteten Mantel, die Knie nach beiden Seiten gefallen, zu verbraucht, sie zu schließen; das Letzte, was vergossen wurde, findet noch den Stoff unter ihr. Als ich nahekomme, bedeckt sie sich nicht. Sie fragt nur, ob ich hole, was im Topf blieb."
 sbs_orgy.5400.a: "Bringt den Topf."
 sbs_orgy.5400.a.tt: "Ich hole, was blieb, und setze es hin, wo sie es erreicht. Sie merkt sich die Höflichkeit."
 sbs_orgy.5400.b: "Nicht, ehe ich dich wiederhabe."
 sbs_orgy.5400.b.tt: "Der Topf kann warten. Ich nehme sie, wo sie liegt. Sie lässt es zu. Sie dankt mir nicht dafür."
 sbs_orgy.5400.c: "Speise sie mit dem, was sie schon hält."
 sbs_orgy.5400.c.tt: "Ich führe zwei Finger in sie, sammle, was andere Männer ließen, und setze es auf ihre Zunge. Sie schluckt, weil sie wenig anderes tun kann. Sie wird nicht vergessen, wer sie dazu brachte."

# 6400 extreme paddock
 sbs_orgy.6400.t: "Der Paddock"
 sbs_orgy.6400.desc: "Der Paddock liegt in voller Sonne. Kein Zelt, keine Nacht. Die Pferde sind auf denselben zertretenen Boden gebracht wie das Lager, und die Frauen sind zu ihnen gestellt worden."
 sbs_orgy.6400.body.desc: "[sbs_orgy_horse_girl.GetFirstName] hat sich das nicht zweimal sagen lassen. Sie kniet im Staub, ein Hengst bereits bis zum Ansatz in ihr. Der Schaft ist dick genug, dass sich ihr Bauch mit ihm hebt und senkt — ein harter Grat wandert unter der Haut, sooft das Tier einen Schritt in sie tut.\n\nDie anderen Frauen werden denselben Weg geführt. Die Männer stehen am Geländer und sehen zu. Jemand lacht. Das Pferd nicht."
 sbs_orgy.6400.a: "Nimm eines."
 sbs_orgy.6400.a.tt: "Ich gehe in der Sonne neben ihr nieder und lasse den nächsten Hengst mich nehmen. Die Größe bleibt im Leib, lange nachdem der Paddock still ist."
 sbs_orgy.6400.b: "Dien den Männern stattdessen."
 sbs_orgy.6400.b.tt: "Ich überlasse die Pferde denen, die sie wollen, und nehme jeden Mann am Geländer, einen nach dem anderen, mit Vorsicht. [sbs_orgy_horse_girl.GetFirstName] liegt noch unter dem Hengst, als ich fertig bin."

