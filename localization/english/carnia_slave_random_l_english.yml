l_english:
  carnia_slave_random.0001.t: " Forced Labor"
  carnia_slave_random.0001.desc: "I was chained to my legs and had to go to the fields to harvest. My weak body had gradually gotten used to working, from a flabby body that was only for sexual purposes, now my body had muscles. Maybe this labor was not so bad compared to being a sex slave."
  carnia_slave_random.0001.a: "Continue to work"
  carnia_slave_random.0001.a.tt: "Accept to work and serve the master"
  carnia_slave_random.0001.b: "Preparation"
  carnia_slave_random.0001.b.tt: "I need to prepare for something, an escape"

  carnia_slave_random.0002.t: "Humiliation "
  carnia_slave_random.0002.desc: "The female slaves were forced to strip and work naked. We had to walk along the streets under the lustful gaze of men, some soldiers constantly touching me down."
  carnia_slave_random.0002.a: "Continue to endure"
  carnia_slave_random.0002.a.tt: "This was nothing compared to being raped by dozens of men"
  carnia_slave_random.0002.b: "Self-pleasure"
  carnia_slave_random.0002.b.tt: "I spread my legs wide open so everyone could see everything inside my hole"

  carnia_slave_random.0003.t: "Prostitution"
  carnia_slave_random.0003.desc: "The female slaves were forced to work naked, the male slaves kept trying to touch our lower bodies and breasts. Suddenly [slave2.GetFirstName] made a request to me:\n\"Do you want us to have fun right here, the guards are gone, I know you're horny\""
  carnia_slave_random.0003.a: "Lie down with your legs spread"
  carnia_slave_random.0003.a.tt: "I've been waiting for this for a long time"
  carnia_slave_random.0003.b: "You have to pay"
  carnia_slave_random.0003.b.tt: "Nothing is free, I need some money"
  carnia_slave_random.0003.c: "Disgusting"
  carnia_slave_random.0003.c.tt: "Not only the soldiers but also many other slaves are looking at us"
