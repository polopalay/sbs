 sbs_orgy.0002.t: "空宅"
 sbs_orgy.0002.desc: "房舍已备好，却不见预期的宾客。灯为无人而燃。"
 sbs_orgy.0002.a: "把灯熄了。"

 sbs_orgy.1100.t: "私密的默契"
 sbs_orgy.1100.desc: "[sbs_orgy_guest.GetFirstName]站得极近，皮肤的热度已经传到我身上。"
 # Female root + Male guest
 sbs_orgy.1100.fm.1.desc: "他的手停在我腰上，再顺着胯线滑。我凑近时，他的嘴碰上我的。隔着薄布，我已能感到他在掌心发硬。"
 sbs_orgy.1100.fm.2.desc: "我贴近到再无空隙。他的呼吸热在喉间。一只手按在他胸口；另一只碰到那处热，却尚未更进一步。"
 sbs_orgy.1100.fm.3.desc: "他把我拉到墙上。嘴热在颈侧，再落到唇上。手隔着布托住胸，停在那里等候。"
 sbs_orgy.1100.fm.4.desc: "我把他的手带到胯上，再往下一点，刚好让他感到我的热。他咽了口唾沫。谁都还没决定下一步。"
 sbs_orgy.1100.fm.5.desc: "他把我按在墙上。一只手托着胸。另一只停在大腿高处，近得让我感到每一次细微移动。"
 sbs_orgy.1100.fm.6.desc: "我凑近，慢慢吻他。退开时，手仍在他腰带上。他的手指留在我发间，既不推也不拉。"
 sbs_orgy.1100.fm.7.desc: "他的拇指沿大腿内侧滑。我伸手隔着布握住他，掌心跳着脉搏。我们停在那里一会儿。"
 sbs_orgy.1100.fm.8.desc: "我们倒在矮榻上，嘴张开，手游走。他的身体贴着我发热。下一步仍是选择。"
 # Male root + Female guest
 sbs_orgy.1100.mf.1.desc: "我的手落到她胯上，再感到大腿的温热。她呼吸已经加快。当她隔着布握住我，谁也不再假装这只是谈话。"
 sbs_orgy.1100.mf.2.desc: "我低头到她喉间，再到她的嘴。皮肤的气味清而锐。手停在大腿高处。"
 sbs_orgy.1100.mf.3.desc: "她沿我胸口往下吻，停在再进一步之前。一只手在大腿上；另一只顺着腰带的线。"
 sbs_orgy.1100.mf.4.desc: "手指停在她腿间，感到她已经准备好。空着的那只手隔着布，用同样不慌的节奏抚着我。"
 sbs_orgy.1100.mf.5.desc: "她把我推倒在榻上，跨坐过来。嘴碰上我的。近得让下一步的选择一目了然。"
 sbs_orgy.1100.mf.6.desc: "我把她拉近到胯贴着胯。她温热、愿意。我等着决定这要走到哪一步。"
 sbs_orgy.1100.mf.7.desc: "她的手裹住我，我的手停在她腿间。我们停在那里很久，摸彼此的节奏，却还不更进一步。"
 sbs_orgy.1100.mf.8.desc: "她在我面前跪下，抬眼看。双手放在我大腿上。邀请很清楚。决定仍在我这边。"
 # Male + Male
 sbs_orgy.1100.mm.1.desc: "他的手落到我胯上，再隔着布感到那热。我回以同样的触。嘴张开，不慌地碰上。"
 sbs_orgy.1100.mm.2.desc: "我上前到胸贴着胸。手落到他身上时，他的呼吸一滞。谁都还没走得更远。"
 sbs_orgy.1100.mm.3.desc: "他凑近，重重吻我。手停在腰带上。我的手指留在他发间，既不推也不拉。"
 sbs_orgy.1100.mm.4.desc: "我们站得很近。两双手同时隔着布动作。中间那点空隙已经太烫。"
 sbs_orgy.1100.mm.5.desc: "我把他转过去，贴上他的背。一只手绕过去。我们停在那里喘气，再决定要不要更多。"
 sbs_orgy.1100.mm.6.desc: "他把嘴落到喉间，再往下，然后停住。我把手放在他后颈。下一步仍是选择。"
 sbs_orgy.1100.mm.7.desc: "双手一起在布与皮肤上动。他倚过来。谁都还没把什么做完。"
 sbs_orgy.1100.mm.8.desc: "他把额抵上我的。手停在原处。夜仍敞开。"
 # Female + Female
 sbs_orgy.1100.ff.1.desc: "手停在她胯上，再落到大腿温热的皮肤。她同样回过来。我们停在那里，摸彼此的节奏。"
 sbs_orgy.1100.ff.2.desc: "我把嘴落到她喉间，再到唇上。她的手停在我后颈，领着却不强迫。"
 sbs_orgy.1100.ff.3.desc: "她把我推倒在榻上，跨坐过来。嘴碰上。她俯身时大腿收紧。"
 sbs_orgy.1100.ff.4.desc: "手指停在她腿间，感到已经温热。她同样回过来。屋里满是低低的呼吸。"
 sbs_orgy.1100.ff.5.desc: "我们侧躺贴紧，嘴停在彼此喉间。节奏很慢。谁也不赶。"
 sbs_orgy.1100.ff.6.desc: "再吻她时她发颤。我们停在那里一会儿，敞开着等候，再决定要不要更多。"
 sbs_orgy.1100.ff.7.desc: "她的手停在我腿间，我的嘴留在她喉上。我们都已发热。其余仍是选择。"
 sbs_orgy.1100.ff.8.desc: "我们吻到发颤。手停在胯与大腿。再往下的事还没定。"
 # Options - more detailed
 sbs_orgy.1100.a: "我们之间什么也不隔。"
 sbs_orgy.1100.a.tt: "我把你拉近，彻底接纳。肌肤相贴，毫不保留，直到谁也无法再假装这只是一次触碰。"
 sbs_orgy.1100.b: "不能不留余地。"
 sbs_orgy.1100.b.tt: "先留一分谨慎。然后我慢慢对待每一处让你发颤的地方。"
 sbs_orgy.1100.c: "今夜之后还要留我。"
 sbs_orgy.1100.c.tt: "我谨慎地接纳你，再说起下一个夜晚。我想再认识你的身体。"
 sbs_orgy.1100.e: "爱会向我们要求什么？"
 sbs_orgy.1100.e.tt: "我们先按住手，谈一谈爱——哪怕答案危险。"

 # Dirty talk (khẩu dâm) - gender variants
 sbs_orgy.1100.d_fm: "告诉我，要怎样。"
 sbs_orgy.1100.d_fm.tt: "告诉我你究竟要怎样用我。手还在我腿间时，把话说清楚。"
 sbs_orgy.1100.d_mf: "告诉我，你要什么。"
 sbs_orgy.1100.d_mf.tt: "告诉我你要我对你做什么。手指还在你体内时，我要听清每一句。"
 sbs_orgy.1100.d_mm: "告诉我，要多重。"
 sbs_orgy.1100.d_mm.tt: "告诉我你要多重。我还握着你时，说清嘴和手该做什么。"
 sbs_orgy.1100.d_ff: "告诉我，要哪里。"
 sbs_orgy.1100.d_ff.tt: "告诉我嘴和手指该落在何处。我触着你时，要亲耳听见。"

 # Mutual fondling / mutual masturbation
 sbs_orgy.1100.f_fm: "只用我们的手。"
 sbs_orgy.1100.f_fm.tt: "我抚着你，你的手指在我腿间动作，直到两人都释放。"
 sbs_orgy.1100.f_mf: "只用我们的手。"
 sbs_orgy.1100.f_mf.tt: "手指留在你体内，你慢慢抚我，直到谁都再忍不住。"
 sbs_orgy.1100.f_mm: "只用我们的手。"
 sbs_orgy.1100.f_mm.tt: "我们以同样的节奏互相抚慰，盯着彼此的反应，直到都释放。"
 sbs_orgy.1100.f_ff: "只用手和嘴。"
 sbs_orgy.1100.f_ff.tt: "我们彼此抚弄，直到都湿、都颤，却不再往下。"





 sbs_orgy.1200.t: "第三人的位置"
 sbs_orgy.1200.desc: "[sbs_orgy_guest_a.GetFirstName]与[sbs_orgy_guest_b.GetFirstName]到更静的角落来找我。三人之间的空气已经发热。"
 sbs_orgy.1200.male.desc: "两具身体从两侧贴来。手擦过手臂、腰、衣沿。嘴落到喉与唇。我们停在发热而未完之处，看谁会被选中。"
 sbs_orgy.1200.female.desc: "两具身体从两侧贴来。手擦过手臂、腰、衣沿。嘴落到喉与唇。我们停在发热而未完之处，看谁会被选中。"
 sbs_orgy.1200.a: "只要[sbs_orgy_guest_a.GetFirstName]。"
 sbs_orgy.1200.a.tt: "我把[sbs_orgy_guest_a.GetFirstName]拉近。今夜只要一具身体贴着我。"
 sbs_orgy.1200.b: "只要[sbs_orgy_guest_b.GetFirstName]。"
 sbs_orgy.1200.b.tt: "我把[sbs_orgy_guest_b.GetFirstName]拉近。今夜只要一具身体贴着我。"
 sbs_orgy.1200.c: "我们三个。"
 sbs_orgy.1200.c.tt: "谁也不落下。手和嘴随意游走，直到分不清快感属于谁。"
 sbs_orgy.1200.d: "谈谈欲望。"
 sbs_orgy.1200.d.tt: "我们把各自想要的说清楚，手却仍在游走。"
 sbs_orgy.1200.e: "让他们彼此靠近。"
 sbs_orgy.1200.e.tt: "我让他们彼此靠近，自己站得够近好观看。交缠的是他们的身体，不必有我。"

 sbs_orgy.4100.t: "裸冠"
 sbs_orgy.4100.desc: "[sbs_orgy_nudity_guest.GetFirstName]客气地问：若君主时常不着衣现身，民还能以同样的敬意去看吗？"
 sbs_orgy.4100.male.desc: "我在灯下全裸站着。肩向后，那物先软，再在众目下变沉。我不动手去遮。让他们看清每一道肌理和两腿之间的分量。"
 sbs_orgy.4100.female.desc: "我在灯下全裸站着。肩向后，胸与腿间柔软的三角对每一道目光敞开。我不动手去遮。让他们看清每一道曲线，和已经聚起的湿意。"
 sbs_orgy.4100.a: "让他们看。"
 sbs_orgy.4100.a.tt: "配得上被看的形体不需要帷幕。我慢慢转身，让每个角度都被看见。"
 sbs_orgy.4100.b: "敬那份无辜。"
 sbs_orgy.4100.b.tt: "亚当与夏娃在伊甸不知羞耻。我以张开的手、敞开的身体敬那份无辜。"
 sbs_orgy.4100.c: "让灯光来裁断。"
 sbs_orgy.4100.c.tt: "衣裳该抬高美，而不只是遮住它。"
 sbs_orgy.4100.d: "让这问题歇着。"
 sbs_orgy.4100.d.tt: "我并不解这道谜。我只是这样站着，直到满室习惯这光景。"

 sbs_orgy.4200.t: "最美之形"
 sbs_orgy.4200.desc: "一句不小心的恭维变成比赛。至少五人站在灯下，由在场之人决定谁的仪态最配得上大声的赞。"
 sbs_orgy.4200.male.desc: "我站在其余人中间，全裸。肌理在灯下起伏，那物袒露。轮到我时慢慢转身，让每只眼睛量我的线条和两腿之间的分量。"
 sbs_orgy.4200.female.desc: "我站在其余人中间，全裸。胸、胯、腿间柔软的褶对评判敞开。轮到我时慢慢转身，让每只眼睛量曲线和已可见的湿意。"
 sbs_orgy.4200.a: "示以力量。"
 sbs_orgy.4200.a.tt: "我把姿势稳住，直到满室安静。"
 sbs_orgy.4200.b: "以风姿取胜。"
 sbs_orgy.4200.b.tt: "我含笑转身，让满室自己断定：值得看的是我。"
 sbs_orgy.4200.c: "一个巧妙的姿态。"
 sbs_orgy.4200.c.tt: "我只稍稍挪动，好把所有目光都引过来。"
 sbs_orgy.4200.d: "让这场较量派上用场。"
 sbs_orgy.4200.d.tt: "我把最近的身体拉过来，给这场较量换个更好的用法。"

 sbs_orgy.2100.t: "熟稔的不安"
 sbs_orgy.2100.desc: "尽管满室放纵，[sbs_orgy_guest.GetFirstName]与我仍迟疑。血让有些沉默比别的更重。"
 sbs_orgy.2100.fm.desc: "成年的孩子赤裸站在面前。曾使此事不可想的同一份血，如今只把热磨得更利。他的手落到我胯上；我的手握住他发硬的长度。"
 sbs_orgy.2100.mf.desc: "成年的孩子赤裸站在面前。同一份血只把热磨得更利。手探到腿间柔软的褶；她已经湿了。"
 sbs_orgy.2100.mm.desc: "成年的儿子赤裸站在面前。同一份血只把热磨得更利。双手同时握住彼此。"
 sbs_orgy.2100.ff.desc: "成年的女儿赤裸站在面前。同一份血只把热磨得更利。手滑进彼此腿间，找到同样湿润的准备。"
 sbs_orgy.2100.a: "我们之间什么也不隔。"
 sbs_orgy.2100.a.tt: "我彻底接纳你。肌对肌，血对血，直到谁也无法再假装这只是亲近。"
 sbs_orgy.2100.b: "不能不留余地。"
 sbs_orgy.2100.b.tt: "先留一分谨慎。夜仍亲密，却不轻率。"
 sbs_orgy.2100.c: "让它活过黎明。"
 sbs_orgy.2100.c.tt: "缚住我们的是神圣，不是羞耻。我让这一夜可以活过黎明。"
 sbs_orgy.2100.d: "只用手和嘴。"
 sbs_orgy.2100.d.tt: "我们停在手和嘴。近到能品尝，却还不至于忘掉那条界。"
 sbs_orgy.2100.e: "到此为止，不再往前。"
 sbs_orgy.2100.e.tt: "我在热意替我们做主之前退开。今夜，血缘仍是一条界。"

 sbs_orgy.2200.t: "因婚姻"
 sbs_orgy.2200.desc: "[sbs_orgy_guest.GetFirstName]因[sbs_orgy_child.GetFirstName]进了我家。今夜这熟悉的纽带不像白日那样简单。"
 sbs_orgy.2200.fm.desc: "孩子的配偶站得很近。把他绑在我家的婚姻今夜显得薄。手在腰上；我已感到他准备好了。"
 sbs_orgy.2200.mf.desc: "孩子的配偶站得很近。婚姻今夜显得薄。手指探到腿间柔软的热；她不退开。"
 sbs_orgy.2200.mm.desc: "孩子的丈夫站得很近。婚姻显得薄。不再多话，双手握住彼此。"
 sbs_orgy.2200.ff.desc: "孩子的妻子站得很近。婚姻显得薄。手滑进彼此腿间，找到同样湿热。"
 sbs_orgy.2200.a: "我们之间什么也不隔。"
 sbs_orgy.2200.a.tt: "我取走白日会称作属于他们的东西。彼此之间，只剩这一刻的热。"
 sbs_orgy.2200.b: "不能不留余地。"
 sbs_orgy.2200.b.tt: "一分谨慎。这仍是一夜，不是长久的契。"
 sbs_orgy.2200.c: "靠近就好。别再往下。"
 sbs_orgy.2200.c.tt: "我们停在温度和游走的手上。那桩婚事既不提起，也不跨越。"
 sbs_orgy.2200.d: "谈谈这桩婚事。"
 sbs_orgy.2200.d.tt: "我把那条纽带说出口。我们谈起[sbs_orgy_child.GetFirstName]，直到热意另有去处。"

 sbs_orgy.2300.t: "友谊之证"
 sbs_orgy.2300.desc: "一位朋友，或最亲近的朋友，站在近处。旧日的信任像另一具身体坐在我们中间。今夜它可能变成别的。"
 sbs_orgy.2300.fm.desc: "友人近得让我感到皮肤的热。多年信任让第一下触碰轻易。我抚他时，他在掌心发硬；手指已找到我湿了。"
 sbs_orgy.2300.mf.desc: "友人近得让我感到皮肤的热。多年信任让第一下触碰轻易。手指滑进腿间感到她湿了；她回手握住我。"
 sbs_orgy.2300.mm.desc: "友人近得让我感到皮肤的热。多年信任让第一下触碰轻易。我们用同一慢节奏互相抚，盯着每一次反应。"
 sbs_orgy.2300.ff.desc: "友人近得让我感到皮肤的热。多年信任让第一下触碰轻易。手与嘴在腿间往来，直到两人都发颤。"
 sbs_orgy.2300.a: "就这样证明。"
 sbs_orgy.2300.a.tt: "我毫无阻隔地接纳你，让多年的信任变成更烫的东西。"
 sbs_orgy.2300.b: "不能不留余地。"
 sbs_orgy.2300.b.tt: "一分谨慎。多年信任化作热意，却不变成长久的索求。"
 sbs_orgy.2300.c: "不止是朋友。"
 sbs_orgy.2300.c.tt: "我谨慎地接纳你，让旧日的信任变成情人的纽带。"
 sbs_orgy.2300.d: "想想我们是怎么开始的。"
 sbs_orgy.2300.d.tt: "我们谈更早的夜、更轻松的日子。手不动。友谊就够了。"

 sbs_orgy.2400.t: "私下的休战"
 sbs_orgy.2400.desc: "对手站在窄处对面。仇恨一向也是一种亲密。今夜我们之间的空气带着别的东西。"
 sbs_orgy.2400.fm.desc: "对手的手终于碰上时很粗。曾经想弄垮我的怒，如今要我敞开。他硬抵着大腿，旧恨化成热。"
 sbs_orgy.2400.mf.desc: "对手的身体在我终于碰上时紧绷。同样的怒在指下敞开。还没吻，她已经湿了。"
 sbs_orgy.2400.mm.desc: "对手的抓握在双手终于相遇时很狠。同样的怒在掌心变沉。我们用旧日争斗的力度互相抚。"
 sbs_orgy.2400.ff.desc: "对手的呼吸在双手终于相遇时发尖。同样的怒在指下变湿。我们用旧日争斗的力度互触。"
 sbs_orgy.2400.a: "就这样了结。"
 sbs_orgy.2400.a.tt: "我把敌意纳入身体。事了之后，恨意未必还能活着。"
 sbs_orgy.2400.b: "让步。"
 sbs_orgy.2400.b.tt: "我让开。让投降去结束打斗从未结束的事。"
 sbs_orgy.2400.c: "不跟你。"
 sbs_orgy.2400.c.tt: "旧恨留在原处。有些休战，不值得拿皮肉去换。"

 sbs_orgy.2500.t: "今夜不论爵位"
 sbs_orgy.2500.desc: "有封臣在场。位分还在，衣裳已去，夜很长。权柄可以放下，也可以换一种用。"
 sbs_orgy.2500.fm.desc: "封臣跪或立，由我定。曾宣誓效忠的同一张嘴如今为我张开。掌心感到那热，我同时决定侍奉走到哪一步。"
 sbs_orgy.2500.mf.desc: "封臣以知分寸者的安静等候。手指探到腿间柔软的热；她不避开目光。位分成了潮湿而当下的东西。"
 sbs_orgy.2500.mm.desc: "封臣以知分寸者的安静等候。我握住他，感到忠诚变成热。他以熟练而小心的动作回抚。"
 sbs_orgy.2500.ff.desc: "封臣以知分寸者的安静等候。手指滑进腿间，感到她已准备好。她回以同样的触，位分溶进彼此的湿热。"
 sbs_orgy.2500.a: "不能不留余地。"
 sbs_orgy.2500.a.tt: "位分可以再等。一分谨慎之后，我取封臣所能给的。"
 sbs_orgy.2500.b: "跪下。"
 sbs_orgy.2500.b.tt: "我让他们跪下，用嘴和手，直到治国的重量松一些。"
 sbs_orgy.2500.c: "报你的价。"
 sbs_orgy.2500.c.tt: "我拿钱换位分不该下令的事。夜按买下的条件继续。"
 sbs_orgy.2500.d: "边碰边谈。"
 sbs_orgy.2500.d.tt: "公事与亲近同一口气说完。手在游走。不必再多。"

 sbs_orgy.2600.t: "熟稔的承诺"
 sbs_orgy.2600.desc: "配偶在此。熟悉的身体，认得的触。安慰与欲望各半。"
 sbs_orgy.2600.fm.desc: "丈夫的身体我如自己一般熟悉。它照旧合在手里。今夜这份熟只把热推得更深。"
 sbs_orgy.2600.mf.desc: "妻子的身体我如自己一般熟悉。腿间柔软的褶照旧向手指敞开。今夜这份熟只把热推得更深。"
 sbs_orgy.2600.mm.desc: "丈夫的身体我如自己一般熟悉。我们以多年熟练的轻松互相抚，热过了这些年仍利。"
 sbs_orgy.2600.ff.desc: "妻子的身体我如自己一般熟悉。手与嘴以多年熟练的轻松在腿间往来，热过了这些年仍利。"
 sbs_orgy.2600.a: "一如往常。"
 sbs_orgy.2600.a.tt: "我彻底接纳配偶，让熟悉的欢愉自行走完。"
 sbs_orgy.2600.b: "另寻他人。"
 sbs_orgy.2600.b.tt: "我离开熟悉的身体，去找一个陌生人的热。"

 sbs_orgy.2700.t: "先公事，后欢愉"
 sbs_orgy.2700.desc: "宴席仍在四周继续，[sbs_orgy_guest.GetFirstName]找到我。一场议事不召自来。"
 sbs_orgy.2700.a: "先谈江山。"
 sbs_orgy.2700.a.tt: "欢宴仍在四周进行，我们谈职守和未完的公务。"
 sbs_orgy.2700.b: "爱会向我们要求什么？"
 sbs_orgy.2700.b.tt: "政务可以再等。我问：爱会把两个惯谈江山的人变成什么。"
 sbs_orgy.2700.c: "谈谈欲望。"
 sbs_orgy.2700.c.tt: "我们把想要的用直白话说出。手不动。谈话已够减轻这一夜。"

 sbs_orgy.2800.t: "封臣的家室"
 sbs_orgy.2800.desc: "[sbs_orgy_guest.GetFirstName]属于我自己的封臣[sbs_orgy_vassal_spouse_owner.GetFirstName]的家室。这事实很难忘掉，尽管谁也没走。"
 sbs_orgy.2800.fm.desc: "封臣的配偶站得很近。本该护住他们的家室之绊显得薄。他在我手里发硬，配偶的名字悬在我们之间不说出口。"
 sbs_orgy.2800.mf.desc: "封臣的配偶站得很近。家室之绊显得薄。手指已感到她湿了，配偶的名字悬着不说出口。"
 sbs_orgy.2800.mm.desc: "封臣的丈夫站得很近。家室之绊显得薄。我们互相抚，配偶的名字悬着不说出口。"
 sbs_orgy.2800.ff.desc: "封臣的妻子站得很近。家室之绊显得薄。手在腿间往来，配偶的名字悬着不说出口。"
 sbs_orgy.2800.a: "一件谨慎的隐事。"
 sbs_orgy.2800.a.tt: "一分谨慎之后，我接纳封臣的配偶，把这一夜藏住。"
 sbs_orgy.2800.b: "我们之间什么也不隔。"
 sbs_orgy.2800.b.tt: "我彻底接纳他们。那条家室的纽带留在门外。"
 sbs_orgy.2800.c: "把门留着。"
 sbs_orgy.2800.c.tt: "我谨慎地接纳他们，把门留着。灯灭之后，不必就此结束。"
 sbs_orgy.2800.d: "把[sbs_orgy_vassal_spouse_owner.GetFirstName]叫过来。"
 sbs_orgy.2800.d.tt: "我把[sbs_orgy_vassal_spouse_owner.GetFirstName]召来，让两人在一起。他们为我演完。双方都满意我的处置。旁观与安排，耗的是我多于他们。"
 sbs_orgy.2800.e: "谈话就够了。"
 sbs_orgy.2800.e.tt: "眼下，开口已够成丑闻。手不动。"

 sbs_orgy.2900.t: "位分之上"
 sbs_orgy.2900.desc: "离开正厅，[sbs_orgy_guest.GetFirstName]仍是我的主君，但在这样的房间里位分不那么确定。"
 sbs_orgy.2900.fm.desc: "主君近得本该让位分仍要紧。已经不要紧。他的手探到我腿间柔软的热；我握住他发硬的长度。"
 sbs_orgy.2900.mf.desc: "主君近得本该让位分仍要紧。已经不要紧。手指探到腿间柔软的热；她回手握住我。"
 sbs_orgy.2900.mm.desc: "主君近得本该让位分仍要紧。已经不要紧。双手同时握住彼此，尊卑溶成单纯的热。"
 sbs_orgy.2900.ff.desc: "主君近得本该让位分仍要紧。已经不要紧。手滑进彼此腿间，找到同样湿润的准备。"
 sbs_orgy.2900.a: "把位分放下。"
 sbs_orgy.2900.a.tt: "我谨慎地接纳我的主君，让这一夜只剩下身体。"
 sbs_orgy.2900.b: "我的陪伴是有价的。"
 sbs_orgy.2900.b.tt: "我以言辞和本事自荐，并为这份荣幸要一个价。"
 sbs_orgy.2900.b.success: "条件被接受了。夜按我的规矩继续。"
 sbs_orgy.2900.b.failure: "主君没有被说动。位分重新压了回来。"
 sbs_orgy.2900.c: "只说话，主上。"
 sbs_orgy.2900.c.tt: "这一回我们只谈话。手不动。尊卑仍在。"

 sbs_orgy.2920.t: "被缚的宾客"
 sbs_orgy.2920.desc: "[sbs_orgy_guest.GetFirstName]以惯于受命者练就的安静等候。今夜有几种方式回应这服从。"
 sbs_orgy.2920.fm.desc: "奴隶等候。我一声令下，他跪下。嘴为我张开；手握住他发硬的长度。项圈、印记，或仅仅占有这一事实，让每一触更重。"
 sbs_orgy.2920.mf.desc: "奴隶等候。我一声令下，她跪下或敞开。手指探到腿间柔软的热；她不避开目光。项圈、印记，或仅仅占有，让每一触更重。"
 sbs_orgy.2920.mm.desc: "奴隶等候。我一声令下，他跪下。我们以命令与服从的清楚互相抚。项圈、印记，或仅仅占有，让每一触更重。"
 sbs_orgy.2920.ff.desc: "奴隶等候。我一声令下，她跪下或敞开。手以命令与服从的清楚在腿间往来。项圈、印记，或仅仅占有，让每一触更重。"
 sbs_orgy.2920.a: "用嘴侍奉。"
 sbs_orgy.2920.a.tt: "我让他们跪下。嘴和手做工，直到发令的重量松一些。"
 sbs_orgy.2920.b: "一道陌生的令。"
 sbs_orgy.2920.b.tt: "我下一道与寻常侍奉无关的令，看他们照做。"
 sbs_orgy.2920.c: "过来。"
 sbs_orgy.2920.c.tt: "不必再讲礼数。一分谨慎之后，我像对待今夜任何人一样接纳他们。"
 sbs_orgy.2920.d: "今夜不必。"
 sbs_orgy.2920.d.tt: "我让他们坐下、喘气。慈悲，而不是号令。项圈可以再等。"


# Contest localization

# 3100 - Contest of Mouths
 sbs_orgy.3100.t: "唇舌之赛"
 sbs_orgy.3100.desc: "有人要比技巧。自愿者一个接一个上前，把那物含进嘴里。含得最深、撑得最久不退的人拿走钱袋。"
 sbs_orgy.3100.male.desc: "轮到我时跪下，含住递来的那物。先慢，再深，直到满室看见每一寸没入，喉满、眼湿。"
 sbs_orgy.3100.female.desc: "轮到我时跪下，含住递来的那物。先慢，再用舌与喉更深，直到满室看见我愿意走到哪。"
 sbs_orgy.3100.a: "接受挑战。"
 sbs_orgy.3100.a.tt: "我要让他们看见这张嘴能做什么。"
 sbs_orgy.3100.a.success: "我吞得更深、撑得更久。钱袋在轻声喝彩里放进我手里。"
 sbs_orgy.3100.a.failure: "别人更熟练。我退开时，体面比预想的少。"
 sbs_orgy.3100.b: "只看。"
 sbs_orgy.3100.b.tt: "我留在看客里，让另一张嘴去领钱袋。"

# 3200 - Who Lasts the Longest
 sbs_orgy.3200.t: "谁能最久"
 sbs_orgy.3200.desc: "又一场比赛被喊起。成双成对，规则简单：尽量长久，不要结束。满室看着，数着分钟。"
 sbs_orgy.3200.male.desc: "我把自愿的搭档压在身下。规则清楚：保持节奏，继续顶，别泻，直到其余每一对都先垮。满室大声数每一分钟。"
 sbs_orgy.3200.female.desc: "我把自愿的搭档纳入体内。规则清楚：继续动，保持节奏，别结束，直到其余每一对都先垮。满室大声数每一分钟。"
 sbs_orgy.3200.a: "接受挑战。"
 sbs_orgy.3200.a.tt: "我接过搭档。让满室看见我能撑多久。"
 sbs_orgy.3200.a.success: "我比每一对都撑得久。钱袋和满室暗羡都归我。"
 sbs_orgy.3200.a.failure: "我比别人先垮。满室立刻看见。"
 sbs_orgy.3200.b: "只看。"
 sbs_orgy.3200.b.tt: "我留在看客里，让别的一对去跟时间赛跑。"

# 3300 - The Most Rounds
 sbs_orgy.3300.t: "最多回合"
 sbs_orgy.3300.desc: "有人加码。眼下比的是耐力：谁能在不得不停之前接最多的人。当众报数，免得有人作弊。"
 sbs_orgy.3300.male.desc: "我从一个自愿的搭档转到下一个。每次结束后只歇到能再开始。满室每回合后喊出数目。"
 sbs_orgy.3300.female.desc: "我一个接一个接纳自愿的搭档。每有人在我体内或身上结束，下一个已经在等。满室每回合后喊出数目。"
 sbs_orgy.3300.a: "接受挑战。"
 sbs_orgy.3300.a.tt: "让他们数我能接多少。"
 sbs_orgy.3300.a.success: "停下来之前，我接过的人比谁都多。钱袋是我的。"
 sbs_orgy.3300.a.failure: "别人更不肯停。最高的计数不是我。"
 sbs_orgy.3300.b: "只看。"
 sbs_orgy.3300.b.tt: "我跟满室一起计数，把轮次留给更饿的人。"

# 3400 - Who Breaks First
 sbs_orgy.3400.t: "谁先垮"
 sbs_orgy.3400.desc: "有人提议一场更静的比赛。自愿者躺下，熟练的手与嘴在他们身上动作。规则简单：不要结束。先垮的人输。"
 sbs_orgy.3400.male.desc: "我躺下，任熟练的手与嘴在我身上动作。每一次呼吸、每一次颤都被盯着。先泻的人丢掉钱袋。"
 sbs_orgy.3400.female.desc: "我躺下，任熟练的手与嘴在腿间动作。每一次呼吸、每一次颤都被盯着。先结束的人丢掉钱袋。"
 sbs_orgy.3400.a: "接受挑战。"
 sbs_orgy.3400.a.tt: "让他们试着弄垮我。"
 sbs_orgy.3400.a.success: "我比谁都撑得久。钱袋和满室暗敬都归我。"
 sbs_orgy.3400.a.failure: "我最先垮。满室看得清楚。"
 sbs_orgy.3400.b: "我改去动手。"
 sbs_orgy.3400.b.tt: "我用手和嘴对付另一个人，把耐力赛留给他们。"

# 3500 - Contest of Tongues
 sbs_orgy.3500.t: "舌尖之赛"
 sbs_orgy.3500.desc: "有人要另一场比试。自愿者一个接一个把嘴低下到送上的腿间。停得最久、从搭档身上逼出最多的人拿走钱袋。"
 sbs_orgy.3500.male.desc: "轮到我时把嘴低下到送上的腿间，稳住心神做。舌与唇动作，直到满室听见我做得怎样、愿意停多久。"
 sbs_orgy.3500.female.desc: "轮到我时把嘴低下到送上的腿间，稳住心神做。舌与唇动作，直到满室听见我做得怎样、愿意停多久。"
 sbs_orgy.3500.a: "接受挑战。"
 sbs_orgy.3500.a.tt: "我要让他们看见这张嘴能做什么。"
 sbs_orgy.3500.a.success: "我留得更久，从搭档身上逼出的声音也更多。钱袋放进我手里。"
 sbs_orgy.3500.a.failure: "别人更熟练。我退开时，体面比预想的少。"
 sbs_orgy.3500.b: "只看。"
 sbs_orgy.3500.b.tt: "我留在看客里，让另一条舌去领钱袋。"

# Heavy / extreme localization

# 6100 - Female alone with animal
 sbs_orgy.6100.t: "另一种宾客"
 sbs_orgy.6100.desc: "门开得比寻常更宽。一样又大又热的东西被粗绳牵进房。其余宾客噤声后退。"
 sbs_orgy.6100.horse.desc: "一匹壮马拉上前来，两腿之间已硬已沉。我被引到它身下趴好。牲口跨上时，单是尺寸就逼出一长声破碎的哼。每一次深顶把我撑开，直到只能扒住地面叫出声。"
 sbs_orgy.6100.dog.desc: "一条大猎犬被带上，喘着，已经滴着。它毫不迟疑从后面跨上，胯又快又利地顶。湿响与低吼灌满房间，我在那重量下无助地哼。"
 sbs_orgy.6100.pig.desc: "一头沉重的公猪被牵入，哼着，已经滑腻。它跨上时，那粗钝的形状以稳稳的力挤进来。每一次深顶从喉里逼出粗哑的畜声，和它自己的哼混在一起，直到满室回响。"
 sbs_orgy.6100.a: "彻底承受。"
 sbs_orgy.6100.a.tt: "声音压不住。撑开与热意太过——我呻吟着迎上去，直到畜生在最深处结束。"
 sbs_orgy.6100.b: "推开它。"
 sbs_orgy.6100.b.tt: "实在太大。我在它再往里之前推开，趴在地上喘气发颤。"

# 6200 - Guest leads female root like an animal
 sbs_orgy.6200.t: "被牵如畜"
 sbs_orgy.6200.desc: "[sbs_orgy_guest.GetFirstName]从桌上拿起皮牵绳，扣上带来的项圈。满室静看我被喝令趴下爬行。"
 sbs_orgy.6200.horse.desc: "逼我按令吠、像狗一样尿湿地面之后，[sbs_orgy_guest.GetFirstName]把马拉上。我被摆在它身下。巨大重量压上背，粗长挤入，牵绳勒得很短。"
 sbs_orgy.6200.dog.desc: "逼我吠、尿湿地面之后，[sbs_orgy_guest.GetFirstName]牵来大猎犬。畜生立刻跨上，又狠又快地顶。宾客把牵绳勒紧，湿响与低吼灌满空气。"
 sbs_orgy.6200.pig.desc: "逼我吠、尿湿地面之后，[sbs_orgy_guest.GetFirstName]牵来沉重的公猪。粗钝的形状以稳稳的力挤入，宾客把牵绳勒短，看着每一寸没入。"
 sbs_orgy.6200.a: "服从，承受。"
 sbs_orgy.6200.a.tt: "我趴着按令承受，在撑开里呻吟，直到它在体内结束。"
 sbs_orgy.6200.b: "转而求那客人。"
 sbs_orgy.6200.b.tt: "我转向[sbs_orgy_guest.GetFirstName]跪下，求侍奉他们，而不是那畜生。"
 sbs_orgy.6200.c: "拒绝。"
 sbs_orgy.6200.c.tt: "我扯断牵绳站起。这已远超出我愿意玩的任何把戏。"

# 6300 - Female root leads a female guest like an animal
 sbs_orgy.6300.t: "我自己的畜宠"
 sbs_orgy.6300.desc: "我拿起皮牵绳，扣上[sbs_orgy_guest.GetFirstName]。满室看着我让她爬、按令吠、像受训的畜一样尿湿地面。"
 sbs_orgy.6300.horse.desc: "等她演够了，我把马拉上，让她趴在身下。沉重的牲口跨上去，我把牵绳勒短，看每一次深顶从她喉里逼出破碎的声音。"
 sbs_orgy.6300.dog.desc: "等她演够了，我牵来大猎犬。它急切跨上，胯飞快地顶，我把牵绳勒短，逼她为它不动。"
 sbs_orgy.6300.pig.desc: "等她演够了，我牵来沉重的公猪。粗钝的形状挤进她体内，我握着牵绳，听她止不住的粗哑畜声。"
 sbs_orgy.6300.a: "逼她承受。"
 sbs_orgy.6300.a.tt: "我按住她直到畜生在最深处结束，再让她为这份荣幸向我道谢。"
 sbs_orgy.6300.b: "用手奖赏。"
 sbs_orgy.6300.b.tt: "我止住畜生，改用自己的手和嘴，奖她的服从。"

# 3600 - Vaginal beer contest
 sbs_orgy.3600.t: "另一种敬酒"
 sbs_orgy.3600.desc: "在场的女人被唤上前。地上摆着烈啤酒杯。挑战说得很清楚：不用手也不用嘴夹住杯子。撑最久的人赢钱袋。其余人等着看谁先垮。"
 sbs_orgy.3600.a: "接受挑战。"
 sbs_orgy.3600.a.tt: "我在杯上坐下，决心比别的女人撑得更久。"
 sbs_orgy.3600.a.success: "我比谁都撑得久。钱袋在满室喝彩里放进我手里。"
 sbs_orgy.3600.a.failure: "我撑不住。酒洒了，满室毫不留情地定罚：夜被允许结束之前，在场每个男人都轮到我们两个。"
 sbs_orgy.3600.b: "拒绝。"
 sbs_orgy.3600.b.tt: "有些把戏，不值得拿输掉的代价去换。"

# 1300-1400 indoor / 5100-5400 outdoor
 sbs_orgy.1300.t: "高座"
 sbs_orgy.1300.desc: "主人的宝座不再空着。两具身体占了上去，厅里看得清楚这座位眼下作何用。"
 sbs_orgy.1300.fm.desc: "我跨坐在雕花座上，扶手抵着大腿。每往下一沉，木头便响一声。他的手按住我的腰；厅下已经很静。"
 sbs_orgy.1300.mf.desc: "我把她留在高座的膝上，一手托着大腿，一手按着雕花扶手。她当着满厅动。这座位不是为此造的——正因如此。"
 sbs_orgy.1300.mm.desc: "他坐在我膝上、在主人的座上，背抵着胸，雕花木硌着两个人。我们不遮动作。这座位的主人稍后会闻出来。"
 sbs_orgy.1300.ff.desc: "我和她同在座上，一条腿搭着扶手，嘴在她喉上，手在腿间。这座位本为裁断。今夜它盛着更湿的东西。"
 sbs_orgy.1300.a: "谨慎地占用这座位。"
 sbs_orgy.1300.a.tt: "我留着一分谨慎，在座上结束。厅里会同时记住这份礼数和这份热。"
 sbs_orgy.1300.b: "另找地方。"
 sbs_orgy.1300.b.tt: "高座不是床。我把他们赶下宝座，去找更安静的角落。"
 sbs_orgy.1400.t: "更软的一间屋"
 sbs_orgy.1400.desc: "事已经起了头。[sbs_orgy_guest.GetFirstName]还贴着我，便提议：离开外厅，到一张正经床上结束。"
 sbs_orgy.1400.fm.desc: "他还停在过道里开始的那点慢节奏。嘴在我耳边。他说寝房比石头更体谅脊背。开口时，动作并未停。"
 sbs_orgy.1400.mf.desc: "她一膝跪在凳上，呼吸贴着我的喉。床只隔一道门。她要被褥、要门闩、要时间。等答案时，手没有离开。"
 sbs_orgy.1400.mm.desc: "我们靠着墙已经做到一半。他朝寝房点头，手不拿开。有床就能更久。厅里也不必听见。"
 sbs_orgy.1400.ff.desc: "她的腿还钩着我的。她要床：门关死、有枕头、能待到天亮。手指停在原处，等我选。"
 sbs_orgy.1400.a: "去床上。"
 sbs_orgy.1400.a.tt: "我随他们进去，不慌不忙地结束。关着的门换来的热，厅里给不出。"
 sbs_orgy.1400.b: "为何不上宝座？"
 sbs_orgy.1400.b.tt: "我把他们拽向高座。厅里可以看。这份胆子让我松一口气；他们被逗够了，也就原谅这绕路。"
 sbs_orgy.1400.c: "就这样。"
 sbs_orgy.1400.c.tt: "不再换屋。我维持现有的节奏，就在这里结束。"
 sbs_orgy.5100.t: "一村游行"
 sbs_orgy.5100.desc: "这场欢宴没有留在田里。午前它已涌进一座穷村：一列赤身在屋宇间走，日头还高。\n\n有人边走边对着门框撒尿。有人蹲在沟里，头也不抬。有人把面包匠的妻子按在井边，裙子已经没了，抗拒比热更薄。孩子被拉进屋。狗在叫。若有神父，他也找到了可关的窗板。\n\n没有人领队。队伍只是占了街，笑着、脏着，墙或车能撑住一具身体的地方便停。每多一扇关死的门，这块地方的控制便薄一分。"
 sbs_orgy.5100.a: "让队伍继续。"
 sbs_orgy.5100.a.tt: "游行占着街，直到村子看够。这里剩下的权柄，一时会迟钝些。"
 sbs_orgy.5200.t: "在石碑之间"
 sbs_orgy.5200.desc: "[sbs_orgy_guest_a.GetFirstName]和[sbs_orgy_guest_b.GetFirstName]已经选好一块石板。刻上去的名字比谁都老。坟间的草被先走过的一对对压平了。"
 sbs_orgy.5200.female.desc: "我仰躺在磨平的铭文上，一人在膝间，一人跪在我能含住的位置。石在肩下发冷。每顶一下，字上掉一点土。侧过头能读到一个年份。他们并不因此停下。"
 sbs_orgy.5200.male.desc: "我把一人按在歪斜的石上，另一人坐在髋边的坟头，好同时够到两人。凿痕刮着皮肤。更早一场丧礼的花环被膝盖压扁。这地方同一口气里有土，也有交合。"
 sbs_orgy.5200.a: "这是亵渎。"
 sbs_orgy.5200.a.tt: "我在更往下之前把人从石上拉开。死人配得上这个，哪怕这一夜并不。"
 sbs_orgy.5200.b: "死人不会在意。"
 sbs_orgy.5200.b.tt: "我把两人留在坟上，就在那里结束。不对劲的地方，正是热。"
 sbs_orgy.5300.t: "长日之后"
 sbs_orgy.5300.desc: "自黎明起，营地只是一场拉长的交缠。没人把衣服穿回去。火堆很矮。剩下的食物在稍远处，隔着上一对留下的、还湿着的铺盖。"
 sbs_orgy.5300.body.desc: "我想站起来去取，腿却合不拢。肌肉张开太久；稍一试，腹股沟便是生疼。灌进去的东西还在往外走——从后边，从腿间——流到膝前便在大腿内侧凉了。\n\n[sbs_orgy_guest.GetFirstName]看着我走不成的那几步。条件很简单。他去取食。我手脚着地过去，叫我叫便叫。"
 sbs_orgy.5300.a: "吃我已有的。"
 sbs_orgy.5300.a.tt: "我用两指刮起还在往外走的东西送进嘴里。是盐，是热。算不得一餐。够我不必去爬。"
 sbs_orgy.5300.b: "跪下，叫。"
 sbs_orgy.5300.b.tt: "我就地跪下，把那声给他。食物来了。体面没有。"
 sbs_orgy.5300.c: "爬去取食。"
 sbs_orgy.5300.c.tt: "我手脚着地朝锅爬去，腿仍开着，痕迹一直拖到食物跟前。"
 sbs_orgy.5400.t: "下一堆火"
 sbs_orgy.5400.desc: "日光并没有把营地清空。铺盖还在被踢开的地方。女人们不穿回衣服，在火堆间走；早晨的事还写在身上——腿内侧一层亮、喉上一块印、步子还没想起怎么走得平常。"
 sbs_orgy.5400.body.desc: "[sbs_orgy_guest.GetFirstName]没有起来。她躺在摊开的斗篷上，膝向两边落下，合拢的力气已经用尽；最后留下的东西还在往身下的布里走。我走近，她也不遮。只问我会不会把锅里剩下的取来。"
 sbs_orgy.5400.a: "把锅端来。"
 sbs_orgy.5400.a.tt: "我把剩下的取来，放在她够得着的地方。她会记住这点礼数。"
 sbs_orgy.5400.b: "先再要你一次。"
 sbs_orgy.5400.b.tt: "锅可以再等。我就在她躺着的地方要她。她由着。并不道谢。"
 sbs_orgy.5400.c: "用她体内已有的去喂。"
 sbs_orgy.5400.c.tt: "我伸进两指，刮起别的男人留下的，送到她舌上。她咽下去，因为此外几乎无事可做。她不会忘是谁逼她如此。"

# 6400 extreme paddock
 sbs_orgy.6400.t: "马场"
 sbs_orgy.6400.desc: "马场正在大太阳底下。没有帐篷，也没有夜。马被牵到和营地同一片踩实的土上，女人也被按到它们跟前。"
 sbs_orgy.6400.body.desc: "[sbs_orgy_horse_girl.GetFirstName]没有等第二遍吩咐。她跪在土里，一匹种马已经没到根。那根够粗，小腹跟着一起起落——马每往里迈一步，皮肤底下就滚过一条硬棱。\n\n其余女人也被往同一条路上赶。男人站在栏边看。有人笑。马不笑。"
 sbs_orgy.6400.a: "接一匹。"
 sbs_orgy.6400.a.tt: "我在日头下跪到她旁边，让下一匹种马进来。那尺寸在马场静下来以后，还留在身上。"
 sbs_orgy.6400.b: "改去伺候男人。"
 sbs_orgy.6400.b.tt: "马留给愿意的人。我把栏边的男人一个个谨慎地接下来。等我完事，[sbs_orgy_horse_girl.GetFirstName]还在种马下面。"

