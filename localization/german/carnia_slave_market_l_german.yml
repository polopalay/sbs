l_german:
 carnia_buy_from_slave_market: "Auf dem Sklavenmarkt kaufen"
 carnia_buy_from_slave_market_desc: "Einen diskreten Markt aufsuchen und die feilgebotenen Personen mustern."
 carnia_buy_from_slave_market_tooltip: "Ein zufälliges Angebot des Sklavenmarkts wird vorgestellt."
 carnia_buy_from_slave_market_effect: "Ein zufälliges Angebot wird vorgelegt. Ein Kauf kostet eine geringe Summe [gold|E] Gold und bringt [lowborn|E] Sklaven in euren Haushalt."
 carnia_buy_from_slave_market_confirm: "Den Markt aufsuchen"

 carnia_slave_market.0002.t: "Vier Lose"
 carnia_slave_market.0002.desc: "Der Händler hat vier Lose an einem Seil. [carnia_slave_man.GetFirstName] und [carnia_slave_woman.GetFirstName] sind jung. [carnia_slave_child.GetFirstName] ist noch klein. [carnia_slave_old.GetFirstName] hat schon ein Leben hinter sich."
 carnia_slave_market.0002.a: "Ich nehme [carnia_slave_man.GetFirstName]."
 carnia_slave_market.0002.b: "Ich nehme [carnia_slave_woman.GetFirstName]."
 carnia_slave_market.0002.c: "Ich nehme [carnia_slave_child.GetFirstName]."
 carnia_slave_market.0002.d: "Ich nehme [carnia_slave_old.GetFirstName]."
 carnia_slave_market.0002.e: "Ich kaufe keines."
 carnia_slave_market.0003.t: "Ein gefallenes Haus"
 carnia_slave_market.0003.desc: "[carnia_slave_noble.GetFirstName] trägt noch einen Namen. Der Glaube steht euch feindlich, kein Lehnsherr antwortet, kein Verwandter hält einen Thron."
 carnia_slave_market.0003.a: "Ein Name lässt sich noch kaufen."
 carnia_slave_market.0003.b: "Ein anderer Käufer soll sie finden."
 carnia_slave_market.0004.t: "Ein ferner Pilger"
 carnia_slave_market.0004.desc: "[carnia_slave_pilgrim.GetFirstName] kommt aus keinem Hof, mit dem ihr verkehrt. Die Straße brachte sie her."
 carnia_slave_market.0004.a: "Die Straße endet in meinem Haus."
 carnia_slave_market.0004.b: "Ein Pilger geht mich nichts an."
 carnia_slave_market.0005.t: "Zwei Verträge"
 carnia_slave_market.0005.desc: "Der Händler legt zwei Verträge zusammen vor. [carnia_slave_a.GetFirstName] und [carnia_slave_b.GetFirstName] stehen nahe beieinander."
 carnia_slave_market.0005.a: "Ich nehme beide."
 carnia_slave_market.0005.b: "Nur [carnia_slave_a.GetFirstName]."
 carnia_slave_market.0005.c: "Nur [carnia_slave_b.GetFirstName]."
 carnia_slave_market.0005.d: "Sucht ein anderes Haus."
 carnia_slave_market.0006.t: "Eine gebundene Familie"
 carnia_slave_market.0006.desc: "Der Händler bringt [carnia_slave_mother.GetFirstName] mit ihrem Kind [carnia_slave_child.GetFirstName]. Sie bitten nur, nicht getrennt zu werden."
 carnia_slave_market.0006.a: "Behaltet sie unter meinem Dach."
 carnia_slave_market.0006.b: "Nur die Mutter."
 carnia_slave_market.0006.c: "Nur das Kind."
 carnia_slave_market.0006.d: "Ihr Los liegt anderswo."
 carnia_slave_market.0007.t: "Zwei Herzen, ein Preis"
 carnia_slave_market.0007.desc: "[carnia_slave_lover_a.GetFirstName] und [carnia_slave_lover_b.GetFirstName] stehen so nah, dass sich die Schultern berühren."
 carnia_slave_market.0007.a: "Sie bleiben zusammen."
 carnia_slave_market.0007.b: "Nur [carnia_slave_lover_a.GetFirstName]."
 carnia_slave_market.0007.c: "Nur [carnia_slave_lover_b.GetFirstName]."
 carnia_slave_market.0007.d: "Ihr Versprechen kaufe ich nicht."
 carnia_slave_market.0008.t: "Ein seltenes Angebot"
 carnia_slave_market.0008.desc: "Ein letzter Vertrag wird mit ungewöhnlicher Sicherheit angeboten. [carnia_slave_good.GetFirstName] ist gesund und wohlgestalt."
 carnia_slave_market.0008.a: "Ein seltener Diener ist das Gold wert."
 carnia_slave_market.0008.b: "Seltenheit verpflichtet mich nicht."
