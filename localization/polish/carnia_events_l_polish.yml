l_polish:
 carn_slave.0001.t: "Zniewolony"
 carn_slave.0001.desc: "Zostaję wyprowadzony na dziedziniec, gdzie zdejmują mi buty i zakładają kajdanki na nadgarstki. Pogodziłem się ze swoim straszliwym losem, podczas gdy szyderczo uśmiechający się [actor.GetShortUIName] ogłasza mnie niewolnikiem"
 carn_slave.0001.a: "Od dziś jestem niewiele więcej niż własnością"
