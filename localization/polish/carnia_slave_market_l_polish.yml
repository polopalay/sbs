l_polish:
 carnia_buy_from_slave_market: "Kup na targu niewolników"
 carnia_buy_from_slave_market_desc: "Odwiedź dyskretny targ i obejrzyj wystawionych na sprzedaż."
 carnia_buy_from_slave_market_tooltip: "Zostanie przedstawiona losowa oferta z targu niewolników."
 carnia_buy_from_slave_market_effect: "Przedstawiona zostaje losowa oferta. Dokończenie zakupu kosztuje niewielką sumę [gold|E] złota i dodaje [lowborn|E] niewolników do twojego dworu."
 carnia_buy_from_slave_market_confirm: "Odwiedź targ"

 carnia_slave_market.0002.t: "Cztery losy"
 carnia_slave_market.0002.desc: "Pośrednik ma cztery losy na jednym sznurze. [carnia_slave_man.GetFirstName] i [carnia_slave_woman.GetFirstName] są młodzi. [carnia_slave_child.GetFirstName] jest jeszcze mały. [carnia_slave_old.GetFirstName] już przeżył swoje."
 carnia_slave_market.0002.a: "Wezmę [carnia_slave_man.GetFirstName]."
 carnia_slave_market.0002.b: "Wezmę [carnia_slave_woman.GetFirstName]."
 carnia_slave_market.0002.c: "Wezmę [carnia_slave_child.GetFirstName]."
 carnia_slave_market.0002.d: "Wezmę [carnia_slave_old.GetFirstName]."
 carnia_slave_market.0002.e: "Nie kupię nikogo."
 carnia_slave_market.0003.t: "Upadły ród"
 carnia_slave_market.0003.desc: "[carnia_slave_noble.GetFirstName] wciąż nosi imię. Wiara stoi wrogo wobec waszej, żaden senior nie odpowiada, żaden krewny nie trzyma tronu."
 carnia_slave_market.0003.a: "Imię wciąż można kupić."
 carnia_slave_market.0003.b: "Niech znajdzie ich inny kupiec."
 carnia_slave_market.0004.t: "Daleki pielgrzym"
 carnia_slave_market.0004.desc: "[carnia_slave_pilgrim.GetFirstName] nie przyszedł z żadnego dworu, z którym utrzymujecie stosunki. Droga przywiodła go tutaj."
 carnia_slave_market.0004.a: "Droga kończy się w moim domu."
 carnia_slave_market.0004.b: "Pielgrzym mnie nie dotyczy."
 carnia_slave_market.0005.t: "Dwa kontrakty"
 carnia_slave_market.0005.desc: "Pośrednik przedstawia dwa kontrakty razem. [carnia_slave_a.GetFirstName] i [carnia_slave_b.GetFirstName] stoją blisko."
 carnia_slave_market.0005.a: "Wezmę oboje."
 carnia_slave_market.0005.b: "Tylko [carnia_slave_a.GetFirstName]."
 carnia_slave_market.0005.c: "Tylko [carnia_slave_b.GetFirstName]."
 carnia_slave_market.0005.d: "Szukajcie innego domu."
 carnia_slave_market.0006.t: "Związana rodzina"
 carnia_slave_market.0006.desc: "Pośrednik przyprowadza [carnia_slave_mother.GetFirstName] z dzieckiem, [carnia_slave_child.GetFirstName]. Proszą tylko, by ich nie rozdzielać."
 carnia_slave_market.0006.a: "Zostawcie ich razem pod moim dachem."
 carnia_slave_market.0006.b: "Tylko matka."
 carnia_slave_market.0006.c: "Tylko dziecko."
 carnia_slave_market.0006.d: "Ich los jest gdzie indziej."
 carnia_slave_market.0007.t: "Dwa serca, jedna cena"
 carnia_slave_market.0007.desc: "[carnia_slave_lover_a.GetFirstName] i [carnia_slave_lover_b.GetFirstName] stoją tak blisko, że stykają się ramionami."
 carnia_slave_market.0007.a: "Zostaną razem."
 carnia_slave_market.0007.b: "Tylko [carnia_slave_lover_a.GetFirstName]."
 carnia_slave_market.0007.c: "Tylko [carnia_slave_lover_b.GetFirstName]."
 carnia_slave_market.0007.d: "Nie kupię ich obietnicy."
 carnia_slave_market.0008.t: "Rzadka oferta"
 carnia_slave_market.0008.desc: "Ostatni kontrakt oferowany jest z niezwykłą pewnością. [carnia_slave_good.GetFirstName] jest zdrowy i dobrze zbudowany."
 carnia_slave_market.0008.a: "Rzadki sługa wart jest złota."
 carnia_slave_market.0008.b: "Rzadkość mnie nie zmusza."
