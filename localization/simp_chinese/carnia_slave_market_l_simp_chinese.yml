l_simp_chinese:
 carnia_buy_from_slave_market: "从奴隶市场购买"
 carnia_buy_from_slave_market_desc: "造访一处隐秘市集，检视待售之人。"
 carnia_buy_from_slave_market_tooltip: "将出示奴隶市场上的一宗随机货品。"
 carnia_buy_from_slave_market_effect: "将出示一份随机货色。成交需花费一笔少量[gold|E]金币，并为本府添上[lowborn|E]奴隶。"
 carnia_buy_from_slave_market_confirm: "前往市集"

 carnia_slave_market.0002.t: "四份货"
 carnia_slave_market.0002.desc: "牙人把四人拴在同一根绳上。[carnia_slave_man.GetFirstName]与[carnia_slave_woman.GetFirstName]正当年。[carnia_slave_child.GetFirstName]还小。[carnia_slave_old.GetFirstName]已活过一世。"
 carnia_slave_market.0002.a: "只要[carnia_slave_man.GetFirstName]。"
 carnia_slave_market.0002.b: "只要[carnia_slave_woman.GetFirstName]。"
 carnia_slave_market.0002.c: "只要[carnia_slave_child.GetFirstName]。"
 carnia_slave_market.0002.d: "只要[carnia_slave_old.GetFirstName]。"
 carnia_slave_market.0002.e: "一个也不买。"
 carnia_slave_market.0003.t: "落难门第"
 carnia_slave_market.0003.desc: "[carnia_slave_noble.GetFirstName]仍有姓氏。其信仰与你敌对，无主君，亦无至亲在位。"
 carnia_slave_market.0003.a: "姓氏也能买。"
 carnia_slave_market.0003.b: "让别人买去。"
 carnia_slave_market.0004.t: "远来香客"
 carnia_slave_market.0004.desc: "[carnia_slave_pilgrim.GetFirstName]并非与你往来的朝廷中人。路把他们带到此处。"
 carnia_slave_market.0004.a: "这条路止于我府。"
 carnia_slave_market.0004.b: "香客与我无关。"
 carnia_slave_market.0005.t: "两份契"
 carnia_slave_market.0005.desc: "牙人把两份契一并呈上。[carnia_slave_a.GetFirstName]与[carnia_slave_b.GetFirstName]挨着站。"
 carnia_slave_market.0005.a: "两个都要。"
 carnia_slave_market.0005.b: "只要[carnia_slave_a.GetFirstName]。"
 carnia_slave_market.0005.c: "只要[carnia_slave_b.GetFirstName]。"
 carnia_slave_market.0005.d: "另寻人家。"
 carnia_slave_market.0006.t: "一对骨肉"
 carnia_slave_market.0006.desc: "牙人把[carnia_slave_mother.GetFirstName]连同孩子[carnia_slave_child.GetFirstName]带来。他们只求不要拆散。"
 carnia_slave_market.0006.a: "留在同一屋檐下。"
 carnia_slave_market.0006.b: "只要母亲。"
 carnia_slave_market.0006.c: "只要孩子。"
 carnia_slave_market.0006.d: "他们的去处不在此。"
 carnia_slave_market.0007.t: "两心一价"
 carnia_slave_market.0007.desc: "[carnia_slave_lover_a.GetFirstName]与[carnia_slave_lover_b.GetFirstName]站得肩碰肩。"
 carnia_slave_market.0007.a: "让他们在一起。"
 carnia_slave_market.0007.b: "只要[carnia_slave_lover_a.GetFirstName]。"
 carnia_slave_market.0007.c: "只要[carnia_slave_lover_b.GetFirstName]。"
 carnia_slave_market.0007.d: "他们的誓不买。"
 carnia_slave_market.0008.t: "稀货"
 carnia_slave_market.0008.desc: "最后一份契开得格外有底气。[carnia_slave_good.GetFirstName]体健貌端。"
 carnia_slave_market.0008.a: "稀仆值得这笔金。"
 carnia_slave_market.0008.b: "稀并不逼我买。"
